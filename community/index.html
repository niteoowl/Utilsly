<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilsly Community</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .community-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Premium Navigator */
        .channel-nav-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 8px 4px 20px 4px;
            margin-bottom: 24px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .channel-nav-container::-webkit-scrollbar {
            display: none;
        }

        .channel-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            min-width: 100px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .channel-nav-item:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
        }

        .channel-nav-item.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }

        .channel-nav-item.active .material-symbols-rounded {
            color: var(--bg-primary);
        }

        .channel-nav-item .material-symbols-rounded {
            font-size: 28px;
            color: var(--text-secondary);
        }

        .channel-nav-item .name {
            font-size: 13px;
            font-weight: 600;
        }

        /* Post List Filter Header */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-wrapper {
            position: relative;
            max-width: 300px;
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            font-size: 14px;
        }

        .search-wrapper .material-symbols-rounded {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-tertiary);
        }

        /* Premium Post List */
        .post-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.15s;
            display: block;
        }

        .post-card:hover {
            border-color: var(--text-primary);
            background: var(--bg-hover);
            transform: translateX(4px);
        }

        .post-card .post-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .post-card .post-title {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
            flex: 1;
            margin-right: 12px;
        }

        .post-card .comment-count {
            color: #ff5252;
            font-size: 13px;
            font-weight: 600;
            margin-left: 4px;
        }

        .post-card .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .post-card .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-card .author-badge {
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            padding: 80px 20px;
            text-align: center;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 768px) {
            .list-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .search-wrapper {
                max-width: 100%;
            }

            .post-card {
                padding: 16px;
            }

            .post-card .post-title {
                font-size: 15px;
            }
        }

        .write-fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--text-primary);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            z-index: 100;
            cursor: pointer;
            transition: all 0.2s;
        }

        .write-fab:hover {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">커뮤니티</span>
                </div>
            </header>

            <div class="content-area">
                <div class="community-container">
                    <div class="page-header">
                        <div class="header-icon-wrapper">
                            <span class="material-symbols-rounded">forum</span>
                        </div>
                        <h1>커뮤니티</h1>
                        <p class="description">관심 있는 채널에서 자유롭게 소통하세요.</p>
                    </div>

                    <!-- Visual Channel Navigator -->
                    <div class="channel-nav-container" id="channel-nav">
                        <!-- Populated by JS -->
                    </div>

                    <!-- Post List Section -->
                    <div id="post-list-section">
                        <div class="list-header">
                            <h2 class="list-title" id="current-channel-title">전체 글 보기</h2>
                            <div class="search-wrapper">
                                <span class="material-symbols-rounded">search</span>
                                <input type="text" id="post-search" placeholder="키워드로 검색...">
                            </div>
                        </div>

                        <div id="post-list-container">
                            <div class="empty-state">
                                <span class="material-symbols-rounded"
                                    style="font-size: 48px; margin-bottom: 16px;">pending</span>
                                <div>채널을 선택하여 게시글을 확인하세요.</div>
                            </div>
                        </div>
                    </div>
                </div>

                <a href="/community/write.html" class="write-fab" id="write-btn">
                    <span class="material-symbols-rounded" style="font-size: 32px;">add</span>
                </a>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const CHANNELS = [
            { id: 'all', name: '전체', icon: 'grid_view' },
            { id: 'free', name: '자유', icon: 'chat_bubble' },
            { id: 'stock', name: '주식/코인', icon: 'candlestick_chart' },
            { id: 'dev', name: '개발', icon: 'terminal' },
            { id: 'humor', name: '유머', icon: 'mood' },
            { id: 'suggestion', name: '건의사항', icon: 'lightbulb' },
            { id: 'notice', name: '공지사항', icon: 'campaign' }
        ];

        let currentPosts = [];
        let activeChannel = new URLSearchParams(window.location.search).get('channel') || 'all';

        function init() {
            renderChannelNav();
            switchChannel(activeChannel);
            bindEvents();
        }

        function renderChannelNav() {
            const nav = document.getElementById('channel-nav');
            nav.innerHTML = CHANNELS.map(ch => `
                <div class="channel-nav-item ${activeChannel === ch.id ? 'active' : ''}" data-id="${ch.id}">
                    <span class="material-symbols-rounded">${ch.icon}</span>
                    <span class="name">${ch.name}</span>
                </div>
            `).join('');

            nav.querySelectorAll('.channel-nav-item').forEach(item => {
                item.addEventListener('click', () => switchChannel(item.dataset.id));
            });
        }

        function switchChannel(id) {
            activeChannel = id;
            document.querySelectorAll('.channel-nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === id);
            });

            const channel = CHANNELS.find(c => c.id === id);
            document.getElementById('current-channel-title').textContent = `${channel.name} 채널`;

            // Update write button
            const writeBtn = document.getElementById('write-btn');
            writeBtn.href = `/community/write.html?channel=${id === 'all' ? 'free' : id}`;

            // Update URL
            const url = new URL(window.location);
            url.searchParams.set('channel', id);
            window.history.pushState({}, '', url);

            loadPosts(id);
        }

        async function loadPosts(channelId) {
            const container = document.getElementById('post-list-container');
            container.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-rounded spin" style="font-size: 32px; margin-bottom: 12px;">refresh</span>
                    <div>불러오는 중...</div>
                </div>`;

            try {
                const postsRef = collection(db, "posts");
                let q;
                if (channelId === 'all') {
                    q = query(postsRef, orderBy("createdAt", "desc"), limit(40));
                } else {
                    q = query(postsRef, where("category", "==", channelId), orderBy("createdAt", "desc"), limit(40));
                }

                const querySnapshot = await getDocs(q);
                currentPosts = [];
                querySnapshot.forEach(doc => {
                    currentPosts.push({ id: doc.id, ...doc.data() });
                });

                renderPosts(currentPosts);
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="empty-state">데이터를 가져오는데 실패했습니다.</div>`;
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('post-list-container');
            if (posts.length === 0) {
                container.innerHTML = `<div class="empty-state">게시글이 없습니다. 첫 글을 작성해보세요!</div>`;
                return;
            }

            container.innerHTML = posts.map(post => {
                const date = formatDate(post.createdAt);
                return `
                    <a href="/community/view.html?id=${post.id}" class="post-card">
                        <div class="post-title-row">
                            <div class="post-title">
                                ${escapeHtml(post.title)}
                                ${post.commentCount ? `<span class="comment-count">[${post.commentCount}]</span>` : ''}
                            </div>
                            ${post.thumbnail ? `<img src="${post.thumbnail}" style="width:50px; height:50px; border-radius:4px; object-fit:cover;">` : ''}
                        </div>
                        <div class="post-meta">
                            <span class="author-badge">${escapeHtml(post.nickname)}</span>
                            <span class="meta-item">
                                <span class="material-symbols-rounded" style="font-size:16px;">schedule</span>
                                ${date}
                            </span>
                            <span class="meta-item">
                                <span class="material-symbols-rounded" style="font-size:16px;">visibility</span>
                                ${post.views || 0}
                            </span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function formatDate(ts) {
            if (!ts) return '-';
            const date = ts.toDate();
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '방금 전';
            if (diff < 3600) return Math.floor(diff / 60) + '분 전';
            if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
            return date.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function bindEvents() {
            const searchInput = document.getElementById('post-search');
            searchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                const filtered = currentPosts.filter(p =>
                    p.title?.toLowerCase().includes(keyword) ||
                    p.nickname?.toLowerCase().includes(keyword)
                );
                renderPosts(filtered);
            });
        }

        init();
    </script>
</body>

</html>
