<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 - Utilsly</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <style>
        .community-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Channel Card Design */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .channel-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .channel-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            background: var(--bg-hover);
        }

        .channel-card .icon-circle {
            width: 56px;
            height: 56px;
            background: var(--bg-primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .channel-card .name {
            font-size: 16px;
            font-weight: 700;
        }

        /* List Design */
        .list-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            text-decoration: none;
            color: var(--text-primary);
            transition: background 0.1s;
        }

        .list-item:hover {
            background: var(--bg-hover);
        }

        .post-title {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 20px;
        }

        .post-meta {
            display: flex;
            gap: 16px;
            color: var(--text-tertiary);
            font-size: 13px;
            flex-shrink: 0;
        }

        .search-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .search-box .material-symbols-rounded {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
        }

        .write-btn {
            background: var(--accent-blue);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .write-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">커뮤니티</span>
                </div>
            </header>

            <div class="content-area">
                <div class="community-container">
                    <!-- Home View -->
                    <div id="home-view">
                        <div class="page-header">
                            <div class="header-icon-wrapper"><span class="material-symbols-rounded">groups</span></div>
                            <h1>채널 목록</h1>
                            <p class="description">관심 있는 주제의 채널을 선택하세요.</p>
                        </div>
                        <div class="channel-grid">
                            <a href="?channel=free" class="channel-card">
                                <div class="icon-circle"><span class="material-symbols-rounded">chat_bubble</span></div>
                                <span class="name">자유 채널</span>
                            </a>
                            <a href="?channel=stock" class="channel-card">
                                <div class="icon-circle"><span class="material-symbols-rounded">candlestick_chart</span>
                                </div>
                                <span class="name">주식/투자</span>
                            </a>
                            <a href="?channel=dev" class="channel-card">
                                <div class="icon-circle"><span class="material-symbols-rounded">terminal</span></div>
                                <span class="name">개발/코딩</span>
                            </a>
                            <a href="?channel=humor" class="channel-card">
                                <div class="icon-circle"><span class="material-symbols-rounded">mood</span></div>
                                <span class="name">유머/잡담</span>
                            </a>
                        </div>
                    </div>

                    <!-- Post List View -->
                    <div id="list-view" style="display:none;">
                        <div class="page-header">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <button onclick="location.href='/community/index.html'" class="btn-icon-sm">
                                    <span class="material-symbols-rounded">arrow_back</span>
                                </button>
                                <h1 id="channel-title">채널</h1>
                            </div>
                        </div>

                        <div class="search-wrapper">
                            <div class="search-box">
                                <span class="material-symbols-rounded">search</span>
                                <input type="text" id="searchInput" placeholder="검색어를 입력하세요...">
                            </div>
                            <a href="/community/write.html" id="writeBtn" class="write-btn">
                                <span class="material-symbols-rounded" style="font-size:18px;">edit</span> 글쓰기
                            </a>
                        </div>

                        <div class="list-container" id="postList">
                            <div style="text-align:center; padding:50px; color:var(--text-tertiary);">불러오는 중...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const currentChannel = params.get('channel');

        const channels = {
            free: "자유 채널",
            stock: "주식/투자",
            dev: "개발/코딩",
            humor: "유머/잡담"
        };

        if (currentChannel && channels[currentChannel]) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('channel-title').textContent = channels[currentChannel];
            document.getElementById('writeBtn').href = `/community/write.html?channel=${currentChannel}`;
            loadPosts(currentChannel);
        }

        async function loadPosts(channel) {
            const list = document.getElementById('postList');
            try {
                const q = query(collection(db, "posts"), where("category", "==", channel), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);

                if (snap.empty) {
                    list.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-tertiary);">글이 없습니다.</div>';
                    return;
                }

                list.innerHTML = snap.docs.map(doc => {
                    const data = doc.data();
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleDateString() : '-';
                    return `
                        <a href="/community/view.html?id=${doc.id}" class="list-item">
                            <span class="post-title">${data.title}</span>
                            <div class="post-meta">
                                <span>${data.nickname}</span>
                                <span>${date}</span>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                list.innerHTML = '<div style="text-align:center; padding:50px; color:var(--text-tertiary);">로드 실패</div>';
            }
        }
    </script>
</body>

</html>
