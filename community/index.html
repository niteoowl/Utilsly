<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilsly - 유틸리티 커뮤니티</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #9ca3af;
            --text-secondary: #6b7280;
            --border-light: #f3f4f6;
            --accent-blue: #2563eb;
            --bg-muted: #f8faff;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --text-secondary: #9ca3af;
            --border-light: #1f2937;
            --accent-blue: #3b82f6;
            --bg-muted: #1e293b;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        /* Utility */
        .container {
            max-width: 672px;
            margin: 0 auto;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            z-index: 100;
        }

        .header-top {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: var(--accent-blue);
        }

        .header-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .profile-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* Nav Tab */
        .nav-tabs {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 24px;
        }

        .nav-item {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            position: relative;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--accent-blue);
        }

        /* Banner */
        .banner {
            padding: 16px;
            background-color: var(--bg-muted);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .banner-text h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .banner-text p {
            font-size: 11px;
            color: var(--accent-blue);
            opacity: 0.8;
        }

        .btn-create {
            background-color: var(--accent-blue);
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 9999px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            display: inline-block;
        }

        /* Hot Channels */
        .section-hot {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .section-title {
            padding: 0 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .channel-scroll {
            display: flex;
            overflow-x: auto;
            padding: 0 16px;
            gap: 12px;
        }

        .channel-card {
            flex-shrink: 0;
            width: 120px;
            padding: 16px 12px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            text-align: center;
            background-color: var(--bg-color);
            transition: all 0.2s;
        }

        .channel-card:hover {
            border-color: var(--accent-blue);
            background-color: var(--bg-muted);
        }

        .channel-emoji {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
        }

        .channel-name {
            font-size: 13px;
            font-weight: 700;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-main);
        }

        /* Feed List */
        .post-list {
            padding-bottom: 100px;
        }

        .post-item {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.2s;
            display: block;
        }

        .post-item:hover {
            background-color: var(--border-light);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tag {
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-blue);
        }

        .meta-info {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .post-excerpt {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-stats {
            display: flex;
            gap: 16px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Floating Button */
        .fab-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 672px;
            padding: 0 16px;
            pointer-events: none;
            display: flex;
            justify-content: center;
        }

        .fab {
            pointer-events: auto;
            background-color: var(--text-main);
            color: var(--bg-color);
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .fab:hover {
            transform: scale(1.05);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-color);
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            padding: 32px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--bg-muted);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        .btn-secondary {
            background: var(--border-light);
            color: var(--text-main);
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        /* Icons */
        svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-top">
                <h1 class="logo">Utilsly</h1>
                <div class="header-icons">
                    <button class="icon-btn">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                    <div class="profile-circle">나</div>
                </div>
            </div>
            <nav class="nav-tabs no-scrollbar" id="nav-tabs">
                <span class="nav-item active" data-tab="all">피드</span>
                <span class="nav-item" data-tab="discover">발견</span>
                <span class="nav-item" data-tab="popular">인기</span>
                <span class="nav-item" data-tab="my">내 채널</span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Banner -->
        <div class="banner" id="create-channel-banner">
            <div class="banner-text">
                <h3>원하는 주제가 없나요?</h3>
                <p>지금 바로 당신만의 채널을 개설해보세요.</p>
            </div>
            <span class="btn-create">채널 만들기</span>
        </div>

        <!-- Hot Channels -->
        <div class="section-hot">
            <h4 class="section-title">북적거리는 채널</h4>
            <div class="channel-scroll no-scrollbar" id="hot-channels">
                <!-- Populated via JS -->
            </div>
        </div>

        <!-- Feed List -->
        <div class="post-list" id="post-list">
            <!-- Populated via JS -->
        </div>
    </main>

    <!-- FAB -->
    <div class="fab-container">
        <a href="write.html" class="fab">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            새 글 쓰기
        </a>
    </div>

    <!-- Create Channel Modal -->
    <div class="modal" id="create-modal">
        <div class="modal-content">
            <h2 class="modal-title">새 채널 만들기</h2>
            <div class="input-group">
                <label>채널 이름</label>
                <input type="text" id="new-channel-name" placeholder="예: 맛집탐방, 개발블로그">
            </div>
            <div class="input-group">
                <label>대표 아이콘</label>
                <select id="new-channel-icon">
                    <option value="forum">💬 채팅</option>
                    <option value="star">⭐ 스타</option>
                    <option value="local_fire_department">🔥 핫</option>
                    <option value="terminal">💻 개발</option>
                    <option value="palette">🎨 디자인</option>
                    <option value="restaurant">🍴 맛집</option>
                    <option value="directions_run">🏃 운동</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modal-close">취소</button>
                <button class="btn-primary" id="modal-submit">개설하기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        let channels = [];

        async function init() {
            await loadChannels();
            await loadPosts();
            setupEvents();
        }

        async function loadChannels() {
            const snap = await getDocs(collection(db, "channels"));
            channels = [];
            snap.forEach(doc => channels.push({ id: doc.id, ...doc.data() }));
            renderChannels();
        }

        function renderChannels() {
            const container = document.getElementById('hot-channels');
            const defaultChannels = [
                { id: 'free', name: '자유', emoji: '💬' },
                { id: 'stock', name: '주식/코인', emoji: '📈' },
                { id: 'dev', name: '개발', emoji: '💻' }
            ];

            const iconMap = {
                'forum': '💬', 'star': '⭐', 'local_fire_department': '🔥',
                'terminal': '💻', 'palette': '🎨', 'restaurant': '🍴', 'directions_run': '🏃'
            };

            const allChannels = [...defaultChannels, ...channels.map(c => ({
                id: c.id, name: c.name, emoji: iconMap[c.icon] || '✨'
            }))];

            container.innerHTML = allChannels.map(ch => `
                <a href="?channel=${ch.id}" class="channel-card">
                    <span class="channel-emoji">${ch.emoji}</span>
                    <span class="channel-name">${ch.name}</span>
                </a>
            `).join('');
        }

        async function loadPosts() {
            const container = document.getElementById('post-list');
            container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted);">불러오는 중...</div>';

            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(20));
                const snap = await getDocs(q);
                let html = '';

                if (snap.empty) {
                    html = '<div style="padding:40px; text-align:center; color:var(--text-muted);">게시글이 없습니다.</div>';
                } else {
                    snap.forEach(doc => {
                        const post = doc.data();
                        const time = formatTime(post.createdAt);
                        const cleanContent = post.content.replace(/<[^>]*>/g, '');
                        html += `
                            <a href="/community/view.html?id=${doc.id}" class="post-item">
                                <div class="post-meta">
                                    <span class="tag">${post.category || '자유'}</span>
                                    <span class="meta-info">${escapeHtml(post.nickname)} • ${time}</span>
                                </div>
                                <h2 class="post-title">${escapeHtml(post.title)}</h2>
                                <p class="post-excerpt">${escapeHtml(cleanContent)}</p>
                                <div class="post-stats">
                                    <div class="stat-item">
                                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                        <span>${post.commentCount || 0}</span>
                                    </div>
                                    <div class="stat-item">
                                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                        <span>${post.recommendCount || 0}</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    });
                }
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted);">데이터 로드 실패</div>';
            }
        }

        function setupEvents() {
            document.getElementById('nav-tabs').onclick = (e) => {
                const item = e.target.closest('.nav-item');
                if (item) {
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                }
            };

            const modal = document.getElementById('create-modal');
            document.getElementById('create-channel-banner').onclick = () => modal.style.display = 'flex';
            document.getElementById('modal-close').onclick = () => modal.style.display = 'none';

            document.getElementById('modal-submit').onclick = async () => {
                const name = document.getElementById('new-channel-name').value.trim();
                const icon = document.getElementById('new-channel-icon').value;
                if (!name) return alert('채널 이름을 입력해주세요.');

                try {
                    await addDoc(collection(db, "channels"), {
                        name, icon, createdAt: serverTimestamp()
                    });
                    modal.style.display = 'none';
                    loadChannels();
                } catch (err) { alert('채널 생성 실패'); }
            };
        }

        function formatTime(ts) {
            if (!ts) return '';
            const date = ts.toDate();
            const diff = (new Date() - date) / 1000;
            if (diff < 60) return '방금 전';
            if (diff < 3600) return Math.floor(diff / 60) + '분 전';
            if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
            return date.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(t) {
            return t?.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) || '';
        }

        init();
    </script>
</body>

</html>
