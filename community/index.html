<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilsly Community</title>
    <meta name="description" content="Utilsly 커뮤니티 - 버그 제보, 기능 건의, 해결된 문제">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/common.js"></script>
    <style>
        .community-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .board-title h2 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .category-tab:hover {
            background: var(--bg-hover);
        }

        .category-tab.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .category-tab[data-cat="notice"] {
            border-color: #ff5252;
            color: #ff5252;
        }

        .category-tab[data-cat="notice"].active {
            background: #ff5252;
            color: white;
        }

        /* Modern List Layout */
        .post-list-container {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .list-header {
            display: grid;
            grid-template-columns: 60px 80px 1fr 120px 100px 80px;
            padding: 16px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }

        .list-item {
            display: grid;
            grid-template-columns: 60px 80px 1fr 120px 100px 80px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            text-align: center;
            font-size: 14px;
            transition: background 0.1s;
            text-decoration: none;
            color: var(--text-primary);
        }

        .list-item:hover {
            background: var(--bg-hover);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        /* Column Specifics */
        .col-title {
            text-align: left;
            padding: 0 16px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .list-item.notice {
            background: rgba(255, 82, 82, 0.03);
            font-weight: 600;
        }

        .list-item.notice .col-title {
            color: #d32f2f;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: var(--bg-active);
            color: var(--text-secondary);
        }

        .badge.notice {
            color: #d32f2f;
            background: rgba(255, 82, 82, 0.1);
        }

        .badge.bug {
            color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .badge.suggestion {
            color: #2196f3;
            background: rgba(33, 150, 243, 0.1);
        }

        .badge.resolved {
            color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
        }

        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            transition: all 0.2s;
        }

        .page-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .page-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .write-btn-wrapper {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: none;
            /* Mobile Only? No, maybe useful */
        }

        /* Search Bar */
        .board-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .search-box {
            display: flex;
            gap: 8px;
            max-width: 300px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .list-header {
                display: none;
            }

            .list-item {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                padding: 16px;
                gap: 8px;
                text-align: left;
            }

            .col-id,
            .col-views {
                display: none;
            }

            /* Hide ID and Views on Mobile if needed, or rearrange */

            .col-cat {
                order: 1;
                margin-bottom: 4px;
            }

            .col-title {
                order: 2;
                padding: 0;
                font-size: 16px;
                font-weight: 600;
                white-space: normal;
                line-height: 1.4;
                width: 100%;
            }

            .mobile-meta {
                order: 3;
                display: flex;
                gap: 12px;
                font-size: 12px;
                color: var(--text-tertiary);
                margin-top: 4px;
                width: 100%;
            }

            .mobile-meta span {
                display: flex;
                align-items: center;
                gap: 4px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">커뮤니티</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page" id="category-name">전체</span>
                </div>
            </div>

            <div class="content-area">
                <div class="community-container">
                    <div class="board-header">
                        <div class="board-title">
                            <h2><span class="material-symbols-rounded">forum</span> 커뮤니티</h2>
                        </div>
                        <a href="/community/write.html" class="btn btn-primary"
                            style="text-decoration: none; padding: 10px 24px;">
                            <span class="material-symbols-rounded"
                                style="font-size: 20px; margin-right: 6px;">edit_square</span>
                            글쓰기
                        </a>
                    </div>

                    <div class="category-tabs">
                        <a href="/community/index.html?category=all" class="category-tab active" data-cat="all">전체</a>
                        <a href="/community/index.html?category=notice" class="category-tab" data-cat="notice">공지사항</a>
                        <a href="/community/index.html?category=bug" class="category-tab" data-cat="bug">버그 제보</a>
                        <a href="/community/index.html?category=suggestion" class="category-tab"
                            data-cat="suggestion">기능 건의</a>
                        <a href="/community/index.html?category=free" class="category-tab" data-cat="free">자유게시판</a>
                        <a href="/community/index.html?category=resolved" class="category-tab"
                            data-cat="resolved">해결됨</a>
                    </div>

                    <div class="post-list-container">
                        <div class="list-header">
                            <div>번호</div>
                            <div>분류</div>
                            <div style="text-align: left; padding-left: 16px;">제목</div>
                            <div>글쓴이</div>
                            <div>날짜</div>
                            <div>조회</div>
                        </div>
                        <div id="post-list-body">
                            <!-- Posts -->
                            <div style="padding: 60px; text-align: center; color: var(--text-tertiary);">
                                <span class="material-symbols-rounded"
                                    style="font-size: 32px; animation: spin 1s linear infinite;">refresh</span>
                                <div style="margin-top: 12px;">게시글을 불러오는 중...</div>
                            </div>
                        </div>
                    </div>

                    <div class="pagination" id="pagination">
                        <!-- Pagination rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get Category from URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category') || 'all';

        // UI Setup
        function setupUI() {
            // Highlight Tab
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.dataset.cat === currentCategory) {
                    tab.classList.add('active');
                }
            });

            const catMap = {
                'all': '전체',
                'notice': '공지사항',
                'bug': '버그 제보',
                'suggestion': '기능 건의',
                'free': '자유게시판',
                'resolved': '해결됨'
            };
            document.getElementById('category-name').textContent = catMap[currentCategory] || '전체';

            // Pass category to write page
            const writeBtn = document.querySelector('.btn-primary');
            writeBtn.href = `/community/write.html?category=${currentCategory === 'all' || currentCategory === 'notice' || currentCategory === 'resolved' ? 'free' : currentCategory}`;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate();
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();

            if (isToday) {
                return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
            } else {
                return date.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' });
            }
        }

        async function loadPosts() {
            const listBody = document.getElementById('post-list-body');
            const postsRef = collection(db, "posts");

            try {
                let notices = [];
                let posts = [];
                const isNoticeTab = currentCategory === 'notice';

                if (!isNoticeTab) {
                    const noticeQuery = query(postsRef, where("isNotice", "==", true));
                    const noticeSnapshot = await getDocs(noticeQuery);
                    noticeSnapshot.forEach(doc => notices.push({ id: doc.id, ...doc.data() }));
                    notices.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                }

                let q;
                let needsClientSort = false;

                if (currentCategory === 'all') {
                    q = query(postsRef, orderBy("createdAt", "desc"), limit(20));
                } else if (currentCategory === 'notice') {
                    q = query(postsRef, where("isNotice", "==", true));
                    needsClientSort = true;
                } else {
                    q = query(postsRef, where("category", "==", currentCategory), limit(50));
                    needsClientSort = true;
                }

                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    if (!notices.find(n => n.id === doc.id)) {
                        posts.push({ id: doc.id, ...doc.data() });
                    }
                });

                if (needsClientSort) {
                    posts.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                }

                if (notices.length === 0 && posts.length === 0) {
                    listBody.innerHTML = `<div style="padding: 60px; text-align: center; color: var(--text-secondary);">아직 게시글이 없습니다.</div>`;
                    return;
                }

                let html = '';
                const catMap = { 'free': '자유', 'bug': '버그', 'suggestion': '건의', 'notice': '공지', 'resolved': '해결' };

                // Render Notices
                if (!isNoticeTab) {
                    notices.forEach(post => {
                        html += createRow(post, true, catMap);
                    });
                }

                // Render Posts
                posts.forEach(post => {
                    html += createRow(post, false, catMap);
                });

                listBody.innerHTML = html;

            } catch (error) {
                console.error("Error:", error);
                listBody.innerHTML = `<div style="padding: 40px; text-align: center; color: #d32f2f;">게시글을 불러오는데 실패했습니다.</div>`;
            }
        }

        function createRow(post, isPinned, catMap) {
            const date = formatDate(post.createdAt);
            const isNotice = post.isNotice || isPinned;
            const badgeClass = post.category || 'free';
            const commentCount = post.commentCount ? `<span style="color: #ff5252; font-weight: 700; margin-left: 4px; font-size: 13px;">[${post.commentCount}]</span>` : '';
            const isAdmin = post.isAdmin;
            const adminIcon = isAdmin ? `<span class="material-symbols-rounded" style="font-size:14px; color:#2196F3; vertical-align:middle; margin-left:2px;">verified</span>` : '';

            // Layout adjusted for mobile via CSS Media Query
            return `
                <a href="/community/view.html?id=${post.id}" class="list-item ${isNotice ? 'notice' : ''}">
                    <div class="col-id">${isNotice ? '<span class="material-symbols-rounded" style="color:#d32f2f; font-size:18px;">campaign</span>' : post.id.substring(0, 4)}</div>
                    <div class="col-cat"><span class="badge ${badgeClass}">${catMap[post.category] || '일반'}</span></div>
                    <div class="col-title">
                        ${post.title}
                        ${commentCount}
                    </div>
                    <div style="display:none;" class="mobile-meta">
                        <!-- Visible only on mobile -->
                         <span>${post.nickname}</span>
                         <span>•</span>
                         <span>${date}</span>
                         <span>•</span>
                         <span>조회 ${post.views || 0}</span>
                    </div>
                    <div class="col-author" style="display:flex; justify-content:center; align-items:center;">${post.nickname}${adminIcon}</div>
                    <div class="col-date">${date}</div>
                    <div class="col-views">${post.views || 0}</div>
                </a>
            `;
        }

        // Add mobile style helper script
        // We need to move the author/date/views into mobile-meta div using JS if simple CSS display rules aren't enough for structural change?
        // Actually CSS Grid/Flex can handle showing/hiding, but moving content into a new div is cleaner in HTML generation.
        // I added .mobile-meta div in createRow.
        // Now styling ensures desktop hides .mobile-meta, mobile shows it and hides cols.

        setupUI();
        loadPosts();
    </script>
</body>

</html>
