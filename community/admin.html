<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Utilsly</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/common.js"></script>
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--text-primary);
        }

        .dashboard-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-list {
            width: 100%;
            border-collapse: collapse;
        }

        .post-list tr {
            border-bottom: 1px solid var(--border-color);
        }

        .post-list tr:hover {
            background: var(--bg-hover);
        }

        .post-list td {
            padding: 12px 8px;
        }

        .notice-form {
            display: grid;
            gap: 16px;
        }

        .reply-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .reply-modal.active {
            display: flex;
        }

        .reply-box {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Community</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">Admin</span>
                </div>
            </div>

            <div class="content-area">
                <div class="admin-container" id="admin-content" style="display:none;">
                    <div class="admin-header">
                        <h2><span class="material-symbols-rounded" style="color: #2196F3;">admin_panel_settings</span>
                            관리자 대시보드</h2>
                        <button class="btn" onclick="logout()">로그아웃</button>
                    </div>

                    <!-- Notice Write Section -->
                    <div class="dashboard-section">
                        <div class="section-title">
                            <span class="material-symbols-rounded">campaign</span> 공지사항 작성
                        </div>
                        <div class="notice-form">
                            <input type="text" id="notice-title" placeholder="공지 제목">
                            <textarea id="notice-content" placeholder="공지 내용" style="height: 100px;"></textarea>
                            <div style="text-align: right;">
                                <button class="btn btn-primary" onclick="postNotice()">공지 등록</button>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Posts Section -->
                    <div class="dashboard-section">
                        <div class="section-title">
                            <span class="material-symbols-rounded">list</span> 최근 게시글 관리
                        </div>
                        <table class="post-list">
                            <tbody id="admin-post-list">
                                <tr>
                                    <td class="loading-spinner">불러오는 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Login Overlay -->
                <div id="login-overlay" style="text-align:center; padding: 100px;">
                    <h3>관리자 인증 필요</h3>
                    <input type="password" id="admin-pw" placeholder="비밀번호"
                        style="max-width: 200px; margin: 16px auto; display:block;">
                    <button class="btn btn-primary" onclick="checkAuth()">접속</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div class="reply-modal" id="reply-modal">
        <div class="reply-box">
            <h3>관리자 답변 작성</h3>
            <p id="reply-target-title" style="color: var(--text-secondary); margin-bottom: 16px; font-size: 14px;"></p>
            <textarea id="reply-content" style="height: 120px; margin-bottom: 16px;" placeholder="답변 내용..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn" onclick="closeReplyModal()">취소</button>
                <button class="btn btn-primary" onclick="submitAdminReply()">등록</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, updateDoc, doc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Simple Client-side Auth (User Verification)
        const ADMIN_PW = "admin1234"; // Simple password

        window.checkAuth = () => {
            const pw = document.getElementById('admin-pw').value;
            if (pw === ADMIN_PW) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadAdminPosts();
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        };

        window.logout = () => {
            window.location.reload();
        };

        // Post Notice
        window.postNotice = async () => {
            const title = document.getElementById('notice-title').value;
            const content = document.getElementById('notice-content').value;

            if (!title || !content) return alert('제목과 내용을 입력하세요.');

            if (!confirm('공지사항을 등록하시겠습니까?')) return;

            try {
                await addDoc(collection(db, "posts"), {
                    category: 'notice',
                    title: title,
                    content: content,
                    nickname: '관리자',
                    password: ADMIN_PW,
                    views: 0,
                    commentCount: 0,
                    createdAt: serverTimestamp(),
                    isNotice: true,
                    isAdmin: true
                });
                alert('공지사항이 등록되었습니다.');
                document.getElementById('notice-title').value = '';
                document.getElementById('notice-content').value = '';
                loadAdminPosts();
            } catch (e) {
                console.error(e);
                alert('등록 실패');
            }
        };

        // Load Posts
        async function loadAdminPosts() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(20));
            const snapshot = await getDocs(q);
            const list = document.getElementById('admin-post-list');

            let html = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                const isNotice = p.isNotice ? '<span style="color:red">[공지]</span> ' : '';
                html += `
                    <tr>
                        <td>
                            <div style="font-weight:600;">${isNotice}${p.title}</div>
                            <div style="font-size:12px; color:var(--text-secondary);">${p.nickname} | ${p.createdAt ? p.createdAt.toDate().toLocaleString() : '-'}</div>
                        </td>
                        <td style="text-align:right;">
                            <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="openReplyModal('${doc.id}', '${p.title.replace(/'/g, "\\'")}')">답변</button>
                            <a href="/community/view.html?id=${doc.id}" target="_blank" class="btn" style="padding: 4px 8px; font-size: 12px;">보기</a>
                        </td>
                    </tr>
                `;
            });
            list.innerHTML = html;
        }

        // Reply Logic
        let currentReplyId = null;

        window.openReplyModal = (id, title) => {
            currentReplyId = id;
            document.getElementById('reply-target-title').textContent = `Re: ${title}`;
            document.getElementById('reply-modal').classList.add('active');
        };

        window.closeReplyModal = () => {
            currentReplyId = null;
            document.getElementById('reply-modal').classList.remove('active');
            document.getElementById('reply-content').value = '';
        };

        window.submitAdminReply = async () => {
            const content = document.getElementById('reply-content').value;
            if (!content) return alert('내용을 입력하세요.');

            try {
                // Add Comment
                await addDoc(collection(db, `posts/${currentReplyId}/comments`), {
                    nickname: '관리자',
                    password: ADMIN_PW,
                    content: content,
                    createdAt: serverTimestamp(),
                    isAdmin: true // Mark as admin comment
                });

                // Update Post
                await updateDoc(doc(db, "posts", currentReplyId), {
                    commentCount: increment(1)
                });

                alert('답변이 등록되었습니다.');
                closeReplyModal();
            } catch (e) {
                console.error(e);
                alert('답변 등록 실패');
            }
        };

    </script>
</body>

</html>
