<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Utilsly</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/common.js"></script>
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--text-primary);
        }

        .dashboard-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-list {
            width: 100%;
            border-collapse: collapse;
        }

        .post-list tr {
            border-bottom: 1px solid var(--border-color);
        }

        .post-list tr:hover {
            background: var(--bg-hover);
        }

        .post-list td {
            padding: 12px 8px;
        }

        .notice-form {
            display: grid;
            gap: 16px;
        }

        .reply-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .reply-modal.active {
            display: flex;
        }

        .reply-box {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Community</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">Admin</span>
                </div>
            </div>

            <div class="content-area">
                <div class="admin-container" id="admin-content" style="display:none;">
                    <div class="admin-header">
                        <h2><span class="material-symbols-rounded" style="color: #2196F3;">admin_panel_settings</span>
                            관리자 대시보드</h2>
                        <button class="btn" onclick="logout()">로그아웃</button>
                    </div>

                    <!-- Notice Write Section -->
                    <div class="dashboard-section">
                        <div class="section-title">
                            <span class="material-symbols-rounded">edit_square</span> 관리자 글쓰기
                        </div>
                        <div class="notice-form">
                            <div style="display:flex; gap:8px;">
                                <select id="post-category"
                                    style="padding: 8px; border-radius: 4px; border: 1px solid var(--border-color);">
                                    <option value="notice">공지사항</option>
                                    <option value="resolved">해결됨</option>
                                </select>
                                <input type="password" id="post-pw" placeholder="게시글 비밀번호 (미입력시 기본값)" style="flex:1;"
                                    autocomplete="new-password">
                            </div>
                            <input type="text" id="notice-title" placeholder="제목">

                            <!-- Admin Rich Text Editor -->
                            <div class="toolbar"
                                style="border: 1px solid var(--border-color); border-bottom: none; padding: 8px; background: var(--bg-hover); border-radius: 4px 4px 0 0; display:flex; gap: 4px;">
                                <button type="button" class="tool-btn" data-cmd="bold"
                                    style="font-weight:bold;">B</button>
                                <button type="button" class="tool-btn" data-cmd="italic"
                                    style="font-style:italic;">I</button>
                                <button type="button" class="tool-btn" data-cmd="underline"
                                    style="text-decoration:underline;">U</button>
                                <div style="width:1px; background:var(--border-color); margin:0 4px;"></div>
                                <button type="button" class="tool-btn" data-cmd="justifyLeft"><span
                                        class="material-symbols-rounded"
                                        style="font-size:16px;">format_align_left</span></button>
                                <button type="button" class="tool-btn" data-cmd="justifyCenter"><span
                                        class="material-symbols-rounded"
                                        style="font-size:16px;">format_align_center</span></button>
                            </div>
                            <div id="admin-editor" contenteditable="true"
                                style="min-height: 200px; padding: 16px; border: 1px solid var(--border-color); border-radius: 0 0 4px 4px; background: var(--bg-primary); line-height: 1.6; outline: none; overflow-y: auto;">
                            </div>

                            <div style="text-align: right;">
                                <button class="btn btn-primary" onclick="postNotice()">등록</button>
                            </div>
                        </div>
                        <style>
                            .tool-btn {
                                width: 32px;
                                height: 32px;
                                border: 1px solid transparent;
                                background: transparent;
                                border-radius: 4px;
                                cursor: pointer;
                                color: var(--text-primary);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                            }

                            .tool-btn:hover {
                                background: rgba(0, 0, 0, 0.05);
                            }
                        </style>
                    </div>

                    <!-- Recent Posts Section -->
                    <div class="dashboard-section">
                        <div class="section-title">
                            <span class="material-symbols-rounded">list</span> 최근 게시글 관리
                        </div>
                        <table class="post-list">
                            <tbody id="admin-post-list">
                                <tr>
                                    <td class="loading-spinner">불러오는 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Login Overlay -->
                <div id="login-overlay" style="text-align:center; padding: 100px;">
                    <h3>관리자 인증 필요</h3>
                    <input type="password" id="admin-pw" placeholder="비밀번호"
                        style="max-width: 200px; margin: 16px auto; display:block;" autocomplete="new-password">
                    <button class="btn btn-primary" onclick="checkAuth()">접속</button>
                    <p style="margin-top:20px; color:var(--text-tertiary); font-size:12px;">보안을 위해 복잡한 비밀번호를 사용하세요.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div class="reply-modal" id="reply-modal">
        <div class="reply-box">
            <h3>관리자 답변 작성</h3>
            <p id="reply-target-title" style="color: var(--text-secondary); margin-bottom: 16px; font-size: 14px;"></p>
            <textarea id="reply-content" style="height: 120px; margin-bottom: 16px;" placeholder="답변 내용..."></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn" onclick="closeReplyModal()">취소</button>
                <button class="btn btn-primary" onclick="submitAdminReply()">등록</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, updateDoc, doc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // More complex password to avoid browser warnings (User should change this in real deploy)
        const ADMIN_PW = "UtilslyAdminSecretKey2024!";

        window.checkAuth = () => {
            const pw = document.getElementById('admin-pw').value;
            if (pw === ADMIN_PW) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                localStorage.setItem('utilsly_admin_auth', 'true'); // Persist for view.html
                loadAdminPosts();
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        };

        window.logout = () => {
            localStorage.removeItem('utilsly_admin_auth');
            window.location.reload();
        };

        // Initialize Editor
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const cmd = btn.dataset.cmd;
                document.execCommand(cmd, false, null);
                document.getElementById('admin-editor').focus();
            });
        });

        // Post Notice or Admin Post
        window.postNotice = async () => {
            const title = document.getElementById('notice-title').value;
            const content = document.getElementById('admin-editor').innerHTML; // Use HTML
            const category = document.getElementById('post-category').value;
            const customPw = document.getElementById('post-pw').value || ADMIN_PW;

            if (!title || !document.getElementById('admin-editor').textContent.trim() && !content.includes('<img')) {
                return alert('제목과 내용을 입력하세요.');
            }

            if (!confirm('게시글을 등록하시겠습니까?')) return;

            try {
                // Determine flags based on category
                const isNotice = category === 'notice';

                await addDoc(collection(db, "posts"), {
                    category: category,
                    title: title,
                    content: content,
                    nickname: 'Utilsly',
                    password: customPw,
                    views: 0,
                    commentCount: 0,
                    createdAt: serverTimestamp(),
                    isNotice: isNotice,
                    isAdmin: true
                });
                alert('등록되었습니다.');
                document.getElementById('notice-title').value = '';
                document.getElementById('admin-editor').innerHTML = ''; // Clear Editor
                document.getElementById('post-pw').value = '';
                loadAdminPosts();
            } catch (e) {
                console.error(e);
                alert('등록 실패');
            }
        };

        // Load Posts
        async function loadAdminPosts() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(20));
            const snapshot = await getDocs(q);
            const list = document.getElementById('admin-post-list');

            let html = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                const isNotice = p.isNotice ? '<span style="color:red">[공지]</span> ' : '';
                html += `
                    <tr>
                        <td>
                            <div style="font-weight:600;">${isNotice}${p.title}</div>
                            <div style="font-size:12px; color:var(--text-secondary);">${p.nickname} | ${p.createdAt ? p.createdAt.toDate().toLocaleString() : '-'}</div>
                        </td>
                        <td style="text-align:right;">
                            <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick="openReplyModal('${doc.id}', '${p.title.replace(/'/g, "\\'")}')">답변</button>
                            <a href="/community/view.html?id=${doc.id}" target="_blank" class="btn" style="padding: 4px 8px; font-size: 12px;">보기</a>
                        </td>
                    </tr>
                `;
            });
            list.innerHTML = html;
        }

        // Reply Logic
        let currentReplyId = null;

        window.openReplyModal = (id, title) => {
            currentReplyId = id;
            document.getElementById('reply-target-title').textContent = `Re: ${title}`;
            document.getElementById('reply-modal').classList.add('active');
        };

        window.closeReplyModal = () => {
            currentReplyId = null;
            document.getElementById('reply-modal').classList.remove('active');
            document.getElementById('reply-content').value = '';
        };

        window.submitAdminReply = async () => {
            const content = document.getElementById('reply-content').value;
            if (!content) return alert('내용을 입력하세요.');

            try {
                // Add Comment
                await addDoc(collection(db, `posts/${currentReplyId}/comments`), {
                    nickname: 'Utilsly',
                    password: ADMIN_PW,
                    content: content,
                    createdAt: serverTimestamp(),
                    isAdmin: true // Mark as admin comment
                });

                // Update Post
                await updateDoc(doc(db, "posts", currentReplyId), {
                    commentCount: increment(1)
                });

                alert('답변이 등록되었습니다.');
                closeReplyModal();
            } catch (e) {
                console.error(e);
                alert('답변 등록 실패');
            }
        };

    </script>
</body>

</html>
