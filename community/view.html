<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 상세보기 - Utilsly</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #9ca3af;
            --text-secondary: #374151;
            --border-light: #f3f4f6;
            --accent-blue: #2563eb;
            --bg-muted: #f9fafb;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --text-secondary: #d1d5db;
            --border-light: #1f2937;
            --accent-blue: #3b82f6;
            --bg-muted: #1e293b;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .container {
            max-width: 672px;
            margin: 0 auto;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(var(--bg-color-rgb, 255, 255, 255), 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            z-index: 100;
            height: 56px;
        }

        .header-content {
            height: 100%;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
        }

        .icon-group {
            display: flex;
            gap: 16px;
        }

        /* Main Content */
        main {
            padding-bottom: 120px;
        }

        article {
            padding: 24px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        /* Profile Area */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
        }

        .profile-info h4 {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 10px;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--accent-blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
        }

        .meta-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Post Content */
        .post-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -0.025em;
            line-height: 1.3;
        }

        .post-body {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            word-break: break-word;
        }

        .post-body p {
            margin-bottom: 16px;
        }

        .post-body img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }

        /* Reaction Buttons */
        .reaction-bar {
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }

        .reaction-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .reaction-btn:hover {
            background-color: var(--bg-muted);
        }

        .reaction-btn.active {
            border-color: var(--accent-blue);
            background-color: rgba(37, 99, 235, 0.05);
            color: var(--accent-blue);
        }

        .divider {
            width: 1px;
            height: 16px;
            background-color: var(--border-light);
            align-self: center;
        }

        /* Comments */
        .comments-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-count {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-btn {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .comment-item {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .comment-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .comment-author {
            font-size: 12px;
            font-weight: 800;
        }

        .comment-text {
            font-size: 14.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .comment-actions {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            cursor: pointer;
        }

        .action-btn.primary {
            color: var(--accent-blue);
        }

        /* Fixed Footer Input */
        .footer-input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-light);
            padding: 12px 16px;
            z-index: 100;
        }

        .input-wrapper {
            max-width: 672px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-box {
            flex: 1;
            background-color: var(--bg-muted);
            border-radius: 9999px;
            padding: 10px 16px;
            border: 1px solid var(--border-light);
        }

        .input-box input {
            background: none;
            border: none;
            width: 100%;
            font-size: 14px;
            outline: none;
            color: var(--text-main);
        }

        .submit-btn {
            color: var(--accent-blue);
            font-weight: 900;
            font-size: 14px;
            padding: 0 8px;
        }

        /* SVG Icons Styling */
        svg {
            width: 22px;
            height: 22px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-content">
            <button onclick="history.back()" class="icon-btn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 class="header-title" id="header-channel-name">채널</h1>
            <div class="icon-group">
                <button class="icon-btn" id="delete-post-btn"><svg fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg></button>
            </div>
        </div>
    </header>

    <main class="container" id="post-container">
        <!-- Loaded via JS -->
    </main>

    <div class="footer-input-area">
        <form class="container input-wrapper" id="comment-form">
            <div class="input-box">
                <input type="text" id="c-content" placeholder="댓글을 남겨보세요..." required autocomplete="off">
            </div>
            <button type="submit" class="submit-btn" id="c-submit">등록</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) location.href = '/community/index.html';

        async function init() {
            await loadPost();
            await loadComments();
        }

        async function loadPost() {
            const docRef = doc(db, "posts", postId);
            await updateDoc(docRef, { views: increment(1) });
            const snap = await getDoc(docRef);

            if (!snap.exists()) {
                alert('삭제된 글입니다.');
                location.href = '/community/index.html';
                return;
            }

            const post = snap.data();
            document.getElementById('header-channel-name').textContent = post.category ? `${post.category} 채널` : '자유 채널';
            renderPost(post);
        }

        function renderPost(post) {
            const main = document.getElementById('post-container');
            const date = post.createdAt ? post.createdAt.toDate().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

            main.innerHTML = `
                <article>
                    <div class="profile-section">
                        <div class="avatar">${post.nickname?.[0] || '익'}</div>
                        <div class="profile-info">
                            <h4>${escapeHtml(post.nickname)} <span class="badge">작성자</span></h4>
                            <p class="meta-text">${post.category || '자유'} • ${date} • 조회 ${post.views || 0}</p>
                        </div>
                    </div>

                    <h2 class="post-title">${escapeHtml(post.title)}</h2>

                    <div class="post-body">
                        ${post.content}
                    </div>

                    <div class="reaction-bar">
                        <button class="reaction-btn" id="recommend-btn">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                            좋아요 <span id="recommend-count">${post.recommendCount || 0}</span>
                        </button>
                        <button class="reaction-btn" onclick="document.getElementById('c-content').focus()">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            댓글 <span id="comment-count-meta">${post.commentCount || 0}</span>
                        </button>
                    </div>
                </article>

                <section>
                    <div class="comments-header">
                        <span class="comment-count">댓글 <span id="comment-count-header">${post.commentCount || 0}</span></span>
                        <button class="filter-btn">최신순</button>
                    </div>
                    <div id="comment-list"></div>
                </section>
            `;

            document.getElementById('recommend-btn').onclick = handleRecommend;
            document.getElementById('comment-form').onsubmit = handleCommentSubmit;
            document.getElementById('delete-post-btn').onclick = () => {
                const pass = prompt('비밀번호를 입력하세요:');
                if (pass === post.password) {
                    if (confirm('게시글을 삭제하시겠습니까?')) {
                        deleteDoc(doc(db, "posts", postId)).then(() => location.href = '/community/index.html');
                    }
                } else if (pass) alert('틀린 비밀번호입니다.');
            };
        }

        async function loadComments() {
            const q = query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc"));
            const snap = await getDocs(q);
            const list = document.getElementById('comment-list');

            const count = snap.size;
            if (document.getElementById('comment-count-header')) document.getElementById('comment-count-header').textContent = count;
            if (document.getElementById('comment-count-meta')) document.getElementById('comment-count-meta').textContent = count;

            list.innerHTML = snap.docs.map(docSnap => {
                const c = docSnap.data();
                const d = c.createdAt ? formatTime(c.createdAt) : '';
                return `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-author">${escapeHtml(c.nickname)}</span>
                            <span class="meta-text">• ${d}</span>
                        </div>
                        <p class="comment-text">${escapeHtml(c.content)}</p>
                        <div class="comment-actions">
                            <span class="action-btn primary">답글달기</span>
                            <span class="action-btn" onclick="deleteComment('${docSnap.id}', '${c.password}')">삭제</span>
                        </div>
                    </div>
                `;
            }).join('') || '<div style="padding:40px; text-align:center; color:var(--text-muted); font-size:14px;">첫 댓글을 남겨보세요.</div>';
        }

        window.deleteComment = async (cid, correctPass) => {
            const pass = prompt('댓글 비밀번호를 입력하세요:');
            if (pass === correctPass) {
                await deleteDoc(doc(db, `posts/${postId}/comments`, cid));
                await updateDoc(doc(db, "posts", postId), { commentCount: increment(-1) });
                loadComments();
            } else if (pass) alert('틀린 비밀번호입니다.');
        };

        async function handleCommentSubmit(e) {
            e.preventDefault();
            const content = document.getElementById('c-content').value.trim();
            if (!content) return;

            const submitBtn = document.getElementById('c-submit');
            submitBtn.disabled = true;

            try {
                await addDoc(collection(db, `posts/${postId}/comments`), {
                    nickname: '익명', content, createdAt: serverTimestamp(), password: 'guest'
                });
                await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
                document.getElementById('c-content').value = '';
                await loadComments();
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function handleRecommend() {
            const btn = document.getElementById('recommend-btn');
            if (btn.classList.contains('active')) return;

            try {
                await updateDoc(doc(db, "posts", postId), { recommendCount: increment(1) });
                btn.classList.add('active');
                const countSpan = document.getElementById('recommend-count');
                countSpan.textContent = parseInt(countSpan.textContent) + 1;
            } catch (e) { }
        }

        function formatTime(ts) {
            const date = ts.toDate();
            const diff = (new Date() - date) / 1000;
            if (diff < 60) return '방금 전';
            if (diff < 3600) return Math.floor(diff / 60) + '분 전';
            if (diff < 86400) return Math.floor(diff / 3600) + '시간 전';
            return date.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(t) {
            return t?.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) || '';
        }

        init();
    </script>
</body>

</html>
