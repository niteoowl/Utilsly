<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 보기 - CHANNELS</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --point-blue: #2563eb;
        }

        .main-content {
            background: var(--bg-primary);
            padding: 0;
        }

        /* Minimal Header */
        .view-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(var(--bg-primary-rgb, 255, 255, 255), 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        [data-theme="dark"] .view-header {
            background: rgba(25, 25, 25, 0.8);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Post Content Container */
        .view-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 20px 100px 20px;
        }

        .post-header {
            margin-bottom: 32px;
        }

        .post-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--point-blue);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .post-title {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .meta-author {
            color: var(--text-primary);
            font-weight: 700;
        }

        .post-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            min-height: 200px;
            margin-bottom: 48px;
            word-break: break-word;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 24px 0;
        }

        /* Recommend/Action Button */
        .post-actions {
            display: flex;
            justify-content: center;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .recommend-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: none;
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 50px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .recommend-btn.active {
            background: rgba(37, 99, 235, 0.05);
            border-color: var(--point-blue);
            color: var(--point-blue);
        }

        .recommend-btn .material-symbols-rounded {
            font-size: 24px;
        }

        .recommend-btn .count {
            font-size: 14px;
            font-weight: 700;
        }

        /* Comments Section */
        .comments-section {
            padding-top: 24px;
        }

        .comments-header {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .comment-author {
            font-weight: 700;
            color: var(--text-primary);
        }

        .comment-date {
            color: var(--text-tertiary);
        }

        .comment-content {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        /* Comment Form */
        .comment-form-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            z-index: 1000;
        }

        .comment-form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .comment-form textarea {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            max-height: 100px;
        }

        .comment-form button {
            background: var(--point-blue);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .post-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" style="display:none;"></aside>

        <main class="main-content">
            <header class="view-header">
                <button class="back-btn" onclick="location.href='/community/index.html'">
                    <span class="material-symbols-rounded">arrow_back</span>
                </button>
                <div class="header-title" id="header-post-title">조회 중...</div>
                <div class="header-actions">
                    <span class="material-symbols-rounded" id="more-actions-btn"
                        style="cursor:pointer;">more_vert</span>
                </div>
            </header>

            <div class="view-container" id="post-view">
                <!-- Loaded via JS -->
            </div>

            <div class="comment-form-container">
                <form class="comment-form" id="comment-form">
                    <textarea id="c-content" placeholder="댓글을 입력하세요..." required rows="1"></textarea>
                    <button type="submit">
                        <span class="material-symbols-rounded">send</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) location.href = '/community/index.html';

        async function init() {
            await loadPost();
            await loadComments();
            setupAutoResize();
        }

        async function loadPost() {
            const docRef = doc(db, "posts", postId);
            await updateDoc(docRef, { views: increment(1) });
            const snap = await getDoc(docRef);

            if (!snap.exists()) {
                alert('삭제된 글입니다.');
                location.href = '/community/index.html';
                return;
            }

            const post = snap.data();
            document.getElementById('header-post-title').textContent = post.title;
            renderPost(post);
        }

        function renderPost(post) {
            const container = document.getElementById('post-view');
            const date = post.createdAt ? post.createdAt.toDate().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';

            container.innerHTML = `
                <article class="post-main">
                    <header class="post-header">
                        <span class="post-tag">${post.category || '자유'}</span>
                        <h1 class="post-title">${escapeHtml(post.title)}</h1>
                        <div class="post-meta">
                            <span class="meta-author">${escapeHtml(post.nickname)}</span>
                            <span>${date}</span>
                            <span>조회 ${post.views || 0}</span>
                        </div>
                    </header>
                    <div class="post-content">${post.content}</div>
                    
                    <div class="post-actions">
                        <button class="recommend-btn" id="recommend-btn">
                            <span class="material-symbols-rounded">thumb_up</span>
                            <span class="count">${post.recommendCount || 0}</span>
                        </button>
                    </div>

                    <section class="comments-section">
                        <h2 class="comments-header">댓글 <span id="comment-count-display">${post.commentCount || 0}</span></h2>
                        <div id="comment-list"></div>
                    </section>
                </article>
            `;

            document.getElementById('recommend-btn').onclick = handleRecommend;
            document.getElementById('comment-form').onsubmit = handleCommentSubmit;

            document.getElementById('more-actions-btn').onclick = () => {
                const pass = prompt('비밀번호를 입력하면 삭제할 수 있습니다.');
                if (pass === post.password) {
                    if (confirm('정말 삭제하시겠습니까?')) {
                        deleteDoc(doc(db, "posts", postId)).then(() => location.href = '/community/index.html');
                    }
                } else if (pass) alert('비밀번호가 틀렸습니다.');
            };
        }

        async function loadComments() {
            const q = query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc"));
            const snap = await getDocs(q);
            const list = document.getElementById('comment-list');

            document.getElementById('comment-count-display').textContent = snap.size;

            list.innerHTML = snap.docs.map(docSnap => {
                const c = docSnap.data();
                const d = c.createdAt ? formatCommentTime(c.createdAt) : '';
                return `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-author">${escapeHtml(c.nickname)}</span>
                            <span class="comment-date">${d}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            }).join('') || '<div style="padding:40px; text-align:center; color:var(--text-tertiary); font-size:14px;">첫 댓글을 남겨보세요.</div>';
        }

        async function handleCommentSubmit(e) {
            e.preventDefault();
            const content = document.getElementById('c-content').value.trim();
            if (!content) return;

            try {
                await addDoc(collection(db, `posts/${postId}/comments`), {
                    nickname: '익명', content, createdAt: serverTimestamp(), password: 'guest'
                });
                await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
                document.getElementById('c-content').value = '';
                document.getElementById('c-content').rows = 1;
                loadComments();
            } catch (err) { alert('댓글 등록 실패'); }
        }

        async function handleRecommend() {
            const btn = document.getElementById('recommend-btn');
            if (btn.classList.contains('active')) return;

            try {
                await updateDoc(doc(db, "posts", postId), { recommendCount: increment(1) });
                btn.classList.add('active');
                const countSpan = btn.querySelector('.count');
                countSpan.textContent = parseInt(countSpan.textContent) + 1;
            } catch (e) { }
        }

        function formatCommentTime(ts) {
            const date = ts.toDate();
            return date.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function setupAutoResize() {
            const textarea = document.getElementById('c-content');
            textarea.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }

        function escapeHtml(t) {
            return t?.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) || '';
        }

        init();
    </script>
</body>

</html>
