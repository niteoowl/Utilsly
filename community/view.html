<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilsly Community</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <style>
        :root {
            --blind-bg: #f6f7f9;
            --blind-border: #eeeeee;
            --blind-text-main: #222222;
            --blind-text-sub: #94969b;
            --blind-accent: #37acc3;
        }

        .view-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
        }

        .post-header {
            border-bottom: 1px solid var(--blind-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .post-category {
            font-size: 13px;
            color: var(--blind-accent);
            font-weight: 700;
            margin-bottom: 10px;
            display: inline-block;
        }

        .post-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--blind-text-main);
            line-height: 1.4;
            letter-spacing: -0.5px;
        }

        .post-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--blind-text-sub);
        }

        .post-info .author {
            font-weight: 600;
            color: #444;
        }

        .post-info .dot {
            width: 2px;
            height: 2px;
            background: var(--blind-text-sub);
            border-radius: 50%;
        }

        .post-content {
            min-height: 300px;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 50px;
            color: var(--blind-text-main);
        }

        /* 추천 버튼 섹션 */
        .post-recommend-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-top: 1px solid var(--blind-border);
        }

        .recommend-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border: 1px solid var(--blind-border);
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--blind-text-sub);
        }

        .recommend-btn:hover {
            border-color: var(--blind-accent);
            color: var(--blind-accent);
            background: rgba(55, 172, 195, 0.05);
        }

        .recommend-btn.active {
            background: var(--blind-accent);
            border-color: var(--blind-accent);
            color: #fff;
        }

        .recommend-count {
            margin-top: 10px;
            font-weight: 700;
            font-size: 15px;
            color: var(--blind-text-main);
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--blind-border);
            margin-bottom: 30px;
        }

        .action-left,
        .action-right {
            display: flex;
            gap: 10px;
        }

        /* Comments */
        .comments-section {
            background: #fff;
        }

        .comments-header {
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 17px;
            color: var(--blind-text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .comment-list {
            margin-bottom: 30px;
        }

        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--blind-border);
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .comment-writer {
            font-weight: 700;
            color: var(--blind-text-main);
        }

        .comment-date {
            color: var(--blind-text-sub);
        }

        .comment-content {
            font-size: 14px;
            color: var(--blind-text-main);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--blind-bg);
            padding: 16px;
            border-radius: 8px;
        }

        .comment-inputs {
            display: flex;
            gap: 10px;
        }

        .comment-inputs input {
            background: #fff;
            border: 1px solid var(--blind-border);
            font-size: 13px;
            height: 36px;
        }

        .logged-in-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }

        .user-avatar-sm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ddd;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
        }

        textarea#c-content {
            background: #fff;
            border: 1px solid var(--blind-border);
            border-radius: 4px;
            font-size: 14px;
            min-height: 80px;
        }

        .btn-primary {
            background: var(--blind-accent) !important;
            border: none !important;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .view-container {
                padding: 15px;
            }

            .post-title {
                font-size: 20px;
            }

            .comment-inputs {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">커뮤니티</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">게시글</span>
                </div>
            </div>

            <div class="content-area">
                <div class="view-container" id="post-container">
                    <div style="text-align: center; padding: 100px 0;">
                        <span class="material-symbols-rounded"
                            style="animation: spin 1s linear infinite; color: var(--blind-accent);">refresh</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, getDocs, serverTimestamp, deleteDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            alert('잘못된 접근입니다.');
            window.location.href = '/community/index.html';
        }

        let currentUser = null;
        function checkAuth() {
            if (window.UtilslyAuth && window.UtilslyAuth.currentUser) {
                currentUser = window.UtilslyAuth.currentUser;
            }
        }

        window.addEventListener('authStateChanged', (e) => {
            if (e.detail.user) {
                currentUser = e.detail.user;
                updateCommentForm();
            }
        });

        setTimeout(checkAuth, 500);

        async function loadPost() {
            const docRef = doc(db, "posts", postId);

            try {
                await updateDoc(docRef, { views: increment(1) });
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const post = docSnap.data();
                    renderPost(post);
                    loadComments();
                } else {
                    alert('삭제되었거나 존재하지 않는 게시글입니다.');
                    window.location.href = '/community/index.html';
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('post-container').innerHTML = '오류가 발생했습니다.';
            }
        }

        function renderPost(post) {
            const date = post.createdAt ? post.createdAt.toDate().toLocaleDateString() : '-';
            const catMap = { 'free': '자유', 'bug': '버그', 'suggestion': '건의', 'notice': '공지', 'resolved': '해결' };
            const recommendCount = post.recommendCount || 0;

            const html = `
                <div class="post-header">
                    <div class="post-category">${catMap[post.category] || '자유'}</div>
                    <div class="post-title">${post.title}</div>
                    <div class="post-info">
                        <span class="author">${post.nickname}</span>
                        <div class="dot"></div>
                        <span>${date}</span>
                        <div class="dot"></div>
                        <span>조회 ${post.views}</span>
                    </div>
                </div>

                <div class="post-content">${post.content}</div>

                <div class="post-recommend-section">
                    <button class="recommend-btn" id="recommendBtn" onclick="handleRecommend()">
                        <span class="material-symbols-rounded">thumb_up</span>
                    </button>
                    <div class="recommend-count">추천 <span id="recommend-count-num">${recommendCount}</span></div>
                </div>

                <div class="post-actions">
                    <div class="action-left">
                        <button class="btn" onclick="window.location.href='/community/index.html?category=${post.category}'">목록</button>
                    </div>
                    <div class="action-right">
                        <button class="btn" onclick="deletePost('${post.password}', '${post.userId || ''}')" style="color: #999; font-size:13px; border:none; background:none;">삭제</button>
                    </div>
                </div>

                <div class="comments-section">
                    <div class="comments-header">댓글 <span id="comment-count" style="color:var(--blind-accent);">${post.commentCount || 0}</span></div>
                    <div class="comment-list" id="comment-list"></div>
                    
                    <form class="comment-form" id="comment-form">
                        <div id="guestCommentInputs" class="comment-inputs">
                            <input type="text" id="c-nickname" placeholder="닉네임" required>
                            <input type="password" id="c-password" placeholder="비밀번호" required>
                        </div>
                        <div id="loggedInCommentInfo" class="logged-in-info" style="display: none;">
                            <div class="user-avatar-sm" id="commentUserAvatar">U</div>
                            <span id="commentUserName" style="font-weight: 700; font-size:13px;"></span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:8px;">
                            <textarea id="c-content" placeholder="댓글 내용을 입력하세요" required></textarea>
                            <div style="display:flex; justify-content:flex-end;">
                                <button type="submit" class="btn btn-primary" style="padding: 8px 24px;">등록</button>
                            </div>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('post-container').innerHTML = html;

            updateCommentForm();

            // 추천 기능 핸들러
            window.handleRecommend = async () => {
                const btn = document.getElementById('recommendBtn');
                if (btn.disabled) return;
                btn.disabled = true;

                try {
                    const postRef = doc(db, "posts", postId);
                    await runTransaction(db, async (transaction) => {
                        const pDoc = await transaction.get(postRef);
                        if (!pDoc.exists()) throw "Post does not exist";

                        const newCount = (pDoc.data().recommendCount || 0) + 1;
                        transaction.update(postRef, { recommendCount: newCount });
                        document.getElementById('recommend-count-num').textContent = newCount;
                    });
                    btn.classList.add('active');
                } catch (e) {
                    console.error(e);
                    alert('추천 처리 중 오류가 발생했습니다.');
                    btn.disabled = false;
                }
            };

            window.deletePost = async (correctPassword, postUserId) => {
                const isOwner = currentUser && postUserId && currentUser.uid === postUserId;
                const isAdmin = localStorage.getItem('utilsly_admin_auth') === 'true';

                if (isOwner || isAdmin) {
                    if (confirm(isAdmin ? '[관리자] 게시글을 삭제하시겠습니까?' : '게시글을 삭제하시겠습니까?')) {
                        await deleteDoc(doc(db, "posts", postId));
                        alert('삭제되었습니다.');
                        window.location.href = '/community/index.html';
                    }
                } else {
                    const input = prompt("게시글 비밀번호를 입력하세요:");
                    if (input === correctPassword) {
                        if (confirm('정말 삭제하시겠습니까?')) {
                            await deleteDoc(doc(db, "posts", postId));
                            alert('삭제되었습니다.');
                            window.location.href = '/community/index.html';
                        }
                    } else if (input !== null) {
                        alert('비밀번호가 일치하지 않습니다.');
                    }
                }
            };

            document.getElementById('comment-form').addEventListener('submit', handleCommentSubmit);
        }

        function updateCommentForm() {
            const guestInputs = document.getElementById('guestCommentInputs');
            const loggedInInfo = document.getElementById('loggedInCommentInfo');
            if (!guestInputs || !loggedInInfo) return;

            if (currentUser) {
                const nickname = currentUser.displayName || currentUser.email.split('@')[0];
                guestInputs.style.display = 'none';
                loggedInInfo.style.display = 'flex';
                document.getElementById('commentUserName').textContent = nickname;
                document.getElementById('commentUserAvatar').textContent = nickname[0].toUpperCase();
            } else {
                guestInputs.style.display = 'flex';
                loggedInInfo.style.display = 'none';
            }
        }

        async function loadComments() {
            const q = query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc"));
            const snapshot = await getDocs(q);
            const list = document.getElementById('comment-list');
            const count = document.getElementById('comment-count');
            count.textContent = snapshot.size;

            let html = '';
            snapshot.forEach(doc => {
                const c = doc.data();
                const d = c.createdAt ? c.createdAt.toDate().toLocaleString('ko-KR', { fontSize: '11px' }) : '';
                html += `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-writer">${c.nickname}</span>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <span class="comment-date">${d}</span>
                                <button onclick="deleteComment('${doc.id}', '${c.password}', '${c.userId || ''}')" style="background:none; border:none; cursor:pointer; color:#ccc;">
                                    <span class="material-symbols-rounded" style="font-size:14px;">close</span>
                                </button>
                            </div>
                        </div>
                        <div class="comment-content">${c.content}</div>
                    </div>
                `;
            });
            list.innerHTML = html || '<div style="color:#bbb; font-size:13px; text-align:center; padding:20px;">첫 댓글을 남겨보세요.</div>';

            window.deleteComment = async (commentId, correctPassword, commentUserId) => {
                const isOwner = currentUser && commentUserId && currentUser.uid === commentUserId;
                const isAdmin = localStorage.getItem('utilsly_admin_auth') === 'true';

                if (isOwner || isAdmin) {
                    if (!confirm('댓글을 삭제하시겠습니까?')) return;
                } else {
                    const input = prompt("비밀번호 입력:");
                    if (input !== correctPassword) return alert('비밀번호 불일치');
                }

                try {
                    await deleteDoc(doc(db, `posts/${postId}/comments`, commentId));
                    await updateDoc(doc(db, "posts", postId), { commentCount: increment(-1) });
                    loadComments();
                } catch (e) { alert('삭제 실패'); }
            };
        }

        async function handleCommentSubmit(e) {
            e.preventDefault();
            let nick, pass;
            if (currentUser) {
                nick = currentUser.displayName || currentUser.email.split('@')[0];
                pass = 'user_' + currentUser.uid.substring(0, 8);
            } else {
                nick = document.getElementById('c-nickname').value;
                pass = document.getElementById('c-password').value;
            }

            const content = document.getElementById('c-content').value;
            try {
                await addDoc(collection(db, `posts/${postId}/comments`), {
                    nickname: nick,
                    password: pass,
                    content: content,
                    userId: currentUser ? currentUser.uid : null,
                    createdAt: serverTimestamp()
                });
                await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
                document.getElementById('c-content').value = '';
                loadComments();
            } catch (err) { alert('등록 실패'); }
        }

        loadPost();
    </script>
</body>

</html>
