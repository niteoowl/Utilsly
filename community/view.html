<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세보기 - Utilsly</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <style>
        .view-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }

        .post-header {
            margin-bottom: 30px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .post-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .post-meta {
            display: flex;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .post-content {
            font-size: 16px;
            line-height: 1.8;
            min-height: 200px;
        }

        .post-actions {
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .comment-section {
            margin-top: 40px;
        }

        .comment-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">게시글</span>
                </div>
            </header>

            <div class="content-area">
                <div class="view-container" id="viewContainer">
                    <div style="text-align:center; padding:100px;">불러오는 중...</div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');

        if (postId) {
            loadPost(postId);
        }

        async function loadPost(id) {
            const container = document.getElementById('viewContainer');
            try {
                const docSnap = await getDoc(doc(db, "posts", id));
                if (!docSnap.exists()) {
                    container.innerHTML = "존재하지 않는 게시글입니다.";
                    return;
                }
                const post = docSnap.data();
                container.innerHTML = `
                    <div class="post-header">
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">
                            <span>${post.nickname}</span>
                            <span>${post.createdAt ? post.createdAt.toDate().toLocaleString() : '-'}</span>
                            <span>조회수 ${post.views || 0}</span>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-actions">
                        <button class="btn" onclick="history.back()">목록으로</button>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = "오류 발생";
            }
        }
    </script>
</body>

</html>
