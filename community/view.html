<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilsly Community</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .view-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .post-main {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .post-header {
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .post-category-tag {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: block;
        }

        .post-title {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .post-meta .author-badge {
            background: var(--bg-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .post-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            min-height: 200px;
            margin-bottom: 40px;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
        }

        /* Recommend Button */
        .recommend-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
        }

        .recommend-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .recommend-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
            transform: scale(1.1);
        }

        .recommend-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }

        .recommend-count {
            margin-top: 12px;
            font-weight: 700;
            font-size: 15px;
        }

        /* Comments Section */
        .comments-section {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }

        .comments-header {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comment-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-author {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
        }

        .comment-date {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .comment-content {
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .comment-form {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 32px;
        }

        .comment-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comment-form textarea {
            min-height: 100px;
            margin-bottom: 12px;
            resize: none;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
            gap: 12px;
        }

        .btn-ghost {
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
        }

        @media (max-width: 768px) {

            .post-main,
            .comments-section {
                padding: 20px;
            }

            .post-title {
                font-size: 24px;
            }

            .comment-inputs {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item"><a href="/community/index.html">커뮤니티</a></span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">게시글 보기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="view-container" id="post-view">
                    <!-- Loaded via JS -->
                    <div style="padding: 100px 0; text-align: center;">
                        <span class="material-symbols-rounded spin"
                            style="font-size: 48px; color: var(--text-tertiary);">refresh</span>
                    </div>
                </div>

                <div class="action-row" style="max-width: 800px; margin: 0 auto;">
                    <button class="btn" onclick="location.href='/community/index.html'">
                        <span class="material-symbols-rounded" style="font-size: 18px; margin-right: 4px;">list</span>
                        목록으로
                    </button>
                    <button class="btn" id="delete-btn" style="color: #ff5252; border-color: #ff525222;">
                        <span class="material-symbols-rounded" style="font-size: 18px; margin-right: 4px;">delete</span>
                        삭제하기
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, getDocs, serverTimestamp, deleteDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let currentUser = null;

        if (!postId) location.href = '/community/index.html';

        async function init() {
            await loadPost();
            loadComments();
        }

        async function loadPost() {
            const docRef = doc(db, "posts", postId);
            await updateDoc(docRef, { views: increment(1) });
            const snap = await getDoc(docRef);

            if (!snap.exists()) {
                alert('삭제되었거나 존재하지 않는 글입니다.');
                location.href = '/community/index.html';
                return;
            }

            const post = snap.data();
            renderPost(post);
        }

        function renderPost(post) {
            const container = document.getElementById('post-view');
            const date = post.createdAt ? post.createdAt.toDate().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) : '-';

            const catNames = {
                'free': '자유', 'stock': '주식/코인', 'dev': '개발',
                'humor': '유머', 'suggestion': '건의사항', 'notice': '공지사항'
            };

            container.innerHTML = `
                <div class="post-main">
                    <div class="post-header">
                        <span class="post-category-tag">${catNames[post.category] || '자유'} CHANNEL</span>
                        <h1 class="post-title">${escapeHtml(post.title)}</h1>
                        <div class="post-meta">
                            <span class="author-badge">${escapeHtml(post.nickname)}</span>
                            <span>${date}</span>
                            <span style="display:flex; align-items:center; gap:4px;">
                                <span class="material-symbols-rounded" style="font-size:16px;">visibility</span>
                                ${post.views || 0}
                            </span>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    
                    <div class="recommend-action">
                        <button class="recommend-btn" id="recommend-btn">
                            <span class="material-symbols-rounded" style="font-size: 32px;">thumb_up</span>
                        </button>
                        <div class="recommend-count">추천 <span id="recommend-num">${post.recommendCount || 0}</span></div>
                    </div>
                </div>

                <div class="comments-section">
                    <div class="comments-header">
                        <span class="material-symbols-rounded">comment</span>
                        댓글 <span style="color:var(--text-primary); margin-left:4px;" id="comment-count-display">${post.commentCount || 0}</span>
                    </div>
                    <div id="comment-list"></div>
                    
                    <form class="comment-form" id="comment-form">
                        <div class="comment-inputs">
                            <input type="text" id="c-nickname" placeholder="닉네임" required>
                            <input type="password" id="c-password" placeholder="비밀번호" required>
                        </div>
                        <textarea id="c-content" placeholder="건강한 커뮤니티를 위해 배려하는 마음을 담아 댓글을 작성해주세요." required></textarea>
                        <div style="display:flex; justify-content:flex-end;">
                            <button type="submit" class="btn btn-primary">댓글 등록</button>
                        </div>
                    </form>
                </div>
            `;

            document.getElementById('recommend-btn').onclick = handleRecommend;
            document.getElementById('comment-form').onsubmit = handleCommentSubmit;
            document.getElementById('delete-btn').onclick = () => deletePost(post.password, post.userId);
        }

        async function loadComments() {
            const q = query(collection(db, `posts/${postId}/comments`), orderBy("createdAt", "asc"));
            const snap = await getDocs(q);
            const list = document.getElementById('comment-list');

            document.getElementById('comment-count-display').textContent = snap.size;

            list.innerHTML = snap.docs.map(docSnap => {
                const c = docSnap.data();
                const d = c.createdAt ? c.createdAt.toDate().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                return `
                    <div class="comment-item">
                        <div class="comment-meta">
                            <span class="comment-author">${escapeHtml(c.nickname)}</span>
                            <div style="display:flex; align-items:center; gap:12px;">
                                <span class="comment-date">${d}</span>
                                <button class="btn-ghost" onclick="deleteComment('${docSnap.id}', '${c.password}', '${c.userId}')">
                                    <span class="material-symbols-rounded" style="font-size:14px;">close</span>
                                </button>
                            </div>
                        </div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            }).join('') || `<div style="text-align:center; padding:40px; color:var(--text-tertiary); font-size:14px;">첫 댓글을 남겨주세요.</div>`;
        }

        window.deleteComment = async (cid, correctPass, cuid) => {
            const pass = prompt('댓글 비밀번호를 입력해주세요:');
            if (pass === correctPass) {
                if (confirm('정말 삭제하시겠습니까?')) {
                    await deleteDoc(doc(db, `posts/${postId}/comments`, cid));
                    await updateDoc(doc(db, "posts", postId), { commentCount: increment(-1) });
                    loadComments();
                }
            } else if (pass !== null) alert('비밀번호가 틀렸습니다.');
        };

        async function handleCommentSubmit(e) {
            e.preventDefault();
            const nick = document.getElementById('c-nickname').value;
            const pass = document.getElementById('c-password').value;
            const content = document.getElementById('c-content').value;

            try {
                await addDoc(collection(db, `posts/${postId}/comments`), {
                    nickname: nick, password: pass, content: content, createdAt: serverTimestamp()
                });
                await updateDoc(doc(db, "posts", postId), { commentCount: increment(1) });
                document.getElementById('c-content').value = '';
                loadComments();
            } catch (err) { alert('등록 실패'); }
        }

        async function handleRecommend() {
            const btn = document.getElementById('recommend-btn');
            if (btn.classList.contains('active')) return;

            try {
                await updateDoc(doc(db, "posts", postId), { recommendCount: increment(1) });
                btn.classList.add('active');
                const num = document.getElementById('recommend-num');
                num.textContent = parseInt(num.textContent) + 1;
            } catch (e) { console.error(e); }
        }

        async function deletePost(correctPass, uid) {
            const pass = prompt('게시글 비밀번호를 입력해주세요:');
            if (pass === correctPass) {
                if (confirm('게시글을 영구적으로 삭제하시겠습니까?')) {
                    await deleteDoc(doc(db, "posts", postId));
                    alert('삭제되었습니다.');
                    location.href = '/community/index.html';
                }
            } else if (pass !== null) alert('비밀번호가 틀렸습니다.');
        }

        function escapeHtml(t) {
            return t?.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])) || '';
        }

        init();
    </script>
</body>

</html>
