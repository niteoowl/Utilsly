<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Utilsly</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #9ca3af;
            --text-secondary: #6b7280;
            --border-light: #f3f4f6;
            --accent-blue: #2563eb;
            --bg-muted: #f8faff;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --text-secondary: #9ca3af;
            --border-light: #1f2937;
            --accent-blue: #3b82f6;
            --bg-muted: #1e293b;
        }

        body {
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .container {
            max-width: 672px;
            margin: 0 auto;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            z-index: 100;
            height: 56px;
        }

        .header-content {
            height: 100%;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .publish-btn {
            color: var(--accent-blue);
            font-weight: 900;
            font-size: 14px;
        }

        /* Main Content */
        .write-container {
            padding: 24px 16px 100px 16px;
        }

        .title-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 24px;
            outline: none;
            letter-spacing: -0.02em;
        }

        .title-input::placeholder {
            color: var(--text-muted);
        }

        .form-section {
            border-top: 1px solid var(--border-light);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-item label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-item select,
        .form-item input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--bg-muted);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        /* Editor */
        .editor-container {
            border-top: 1px solid var(--border-light);
            padding-top: 24px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-muted);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .editor-surface {
            min-height: 400px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
            outline: none;
            word-break: break-all;
        }

        .editor-surface img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }

        /* Icons */
        svg {
            width: 22px;
            height: 22px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-content">
            <button class="back-btn" onclick="history.back()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <span class="header-title">글쓰기</span>
            <button class="publish-btn" id="publish-btn">등록</button>
        </div>
    </header>

    <main class="container write-container">
        <input type="text" id="post-title" class="title-input" placeholder="제목을 입력하세요" maxlength="100">

        <div class="form-section">
            <div class="form-item">
                <label>채널</label>
                <select id="post-category">
                    <option value="free">자유</option>
                    <option value="stock">주식/코인</option>
                    <option value="dev">개발</option>
                    <option value="humor">유머</option>
                    <option value="suggestion">건의사항</option>
                    <option value="notice">공지사항</option>
                </select>
            </div>
            <div class="form-item">
                <label>닉네임</label>
                <input type="text" id="post-nickname" placeholder="닉네임을 입력하세요">
            </div>
            <div class="form-item">
                <label>비밀번호</label>
                <input type="password" id="post-password" placeholder="비밀번호">
            </div>
        </div>

        <div class="editor-container">
            <div class="toolbar">
                <button type="button" class="tool-btn" data-cmd="bold" title="굵게"><svg fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 12h8a4 4 0 100-8H6v8zm0 0h10a4 4 0 110 8H6v-8z" />
                    </svg></button>
                <button type="button" class="tool-btn" data-cmd="italic" title="기울임"><svg fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 20l4-16m-4 0h4m-4 16h4" />
                    </svg></button>
                <button type="button" class="tool-btn" id="btn-img" title="이미지"><svg fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg></button>
                <button type="button" class="tool-btn" data-cmd="insertUnorderedList" title="리스트"><svg fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg></button>
            </div>
            <div id="post-editor" class="editor-surface" contenteditable="true">
                <p><br></p>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const editor = document.getElementById('post-editor');
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('channel');

        if (channelId) {
            const select = document.getElementById('post-category');
            if (![...select.options].some(o => o.value === channelId)) {
                const opt = document.createElement('option');
                opt.value = channelId;
                opt.textContent = channelId;
                select.appendChild(opt);
            }
            select.value = channelId;
        }

        document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.execCommand(btn.dataset.cmd, false, null);
                editor.focus();
            });
        });

        const fileInput = document.getElementById('file-input');
        document.getElementById('btn-img').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = `<img src="${ev.target.result}" style="max-width:100%; border-radius:12px;"><p><br></p>`;
                    editor.focus();
                    document.execCommand('insertHTML', false, img);
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('publish-btn').onclick = async () => {
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value;
            const content = editor.innerHTML;
            const nickname = document.getElementById('post-nickname').value.trim() || '익명';
            const password = document.getElementById('post-password').value.trim() || 'guest';

            if (!title) return alert('제목을 입력해주세요.');
            if (!editor.textContent.trim() && !content.includes('<img')) return alert('내용을 입력해주세요.');

            const btn = document.getElementById('publish-btn');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                await addDoc(collection(db, "posts"), {
                    title, category, nickname, password, content,
                    views: 0, commentCount: 0, recommendCount: 0,
                    createdAt: serverTimestamp()
                });
                location.href = `/community/index.html?channel=${category}`;
            } catch (err) {
                alert('등록 실패');
                btn.disabled = false;
                btn.textContent = '등록';
            }
        };
    </script>
</body>

</html>
