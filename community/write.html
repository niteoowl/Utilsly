<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Utilsly Community</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <style>
        .write-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .write-header {
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 4px;
        }

        textarea {
            min-height: 400px;
            resize: vertical;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .user-info-display {
            padding: 16px;
            background: var(--bg-sidebar);
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">커뮤니티</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">글쓰기</span>
                </div>
            </div>

            <div class="content-area">
                <div class="write-container">
                    <div class="write-header">
                        <h2>글쓰기</h2>
                    </div>

                    <!-- User info shown when logged in -->
                    <div class="user-info-display" id="userInfoDisplay" style="display: none;">
                        <div class="user-avatar-mini" id="userAvatarMini">U</div>
                        <div>
                            <div style="font-weight: 600;" id="userNickname">닉네임</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">로그인됨</div>
                        </div>
                    </div>

                    <form id="write-form">
                        <div class="form-group">
                            <label>분류</label>
                            <select id="category" required>
                                <option value="free">자유게시판</option>
                                <option value="bug">버그 제보</option>
                                <option value="suggestion">기능 건의</option>
                            </select>
                        </div>

                        <!-- Only shown when NOT logged in -->
                        <div class="form-row" id="guestInputs">
                            <div class="form-group">
                                <label>닉네임</label>
                                <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="20"
                                    autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label>비밀번호</label>
                                <input type="password" id="password" placeholder="삭제 시 필요" maxlength="20"
                                    autocomplete="new-password">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>제목</label>
                            <input type="text" id="title" required placeholder="제목을 입력해 주세요" maxlength="100">
                        </div>

                        <div class="form-group">
                            <label>내용</label>
                            <!-- Rich Text Toolbar -->
                            <div class="toolbar"
                                style="border: 1px solid var(--border-color); border-bottom: none; padding: 8px; background: var(--bg-hover); border-radius: 4px 4px 0 0; display:flex; gap: 4px;">
                                <button type="button" class="tool-btn" data-cmd="bold"
                                    style="font-weight:bold;">B</button>
                                <button type="button" class="tool-btn" data-cmd="italic"
                                    style="font-style:italic;">I</button>
                                <button type="button" class="tool-btn" data-cmd="underline"
                                    style="text-decoration:underline;">U</button>
                                <div style="width:1px; background:var(--border-color); margin:0 4px;"></div>
                                <button type="button" class="tool-btn" data-cmd="justifyLeft"><span
                                        class="material-symbols-rounded"
                                        style="font-size:16px;">format_align_left</span></button>
                                <button type="button" class="tool-btn" data-cmd="justifyCenter"><span
                                        class="material-symbols-rounded"
                                        style="font-size:16px;">format_align_center</span></button>
                            </div>
                            <!-- Content Editable Div -->
                            <div id="editor" contenteditable="true"
                                style="min-height: 400px; padding: 16px; border: 1px solid var(--border-color); border-radius: 0 0 4px 4px; background: var(--bg-primary); line-height: 1.6; outline: none; overflow-y: auto;">
                            </div>
                            <textarea id="content" style="display:none;"></textarea>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn" onclick="history.back()">취소</button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default category from URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlCat = urlParams.get('category');
        if (urlCat && urlCat !== 'all' && urlCat !== 'notice' && urlCat !== 'resolved') {
            document.getElementById('category').value = urlCat;
        }

        // Check login status
        let currentUser = null;
        function checkAuth() {
            if (window.UtilslyAuth && window.UtilslyAuth.currentUser) {
                currentUser = window.UtilslyAuth.currentUser;
                showLoggedInUI(currentUser);
            }
        }

        function showLoggedInUI(user) {
            const nickname = user.displayName || user.email.split('@')[0];
            document.getElementById('guestInputs').style.display = 'none';
            document.getElementById('userInfoDisplay').style.display = 'flex';
            document.getElementById('userNickname').textContent = nickname;
            document.getElementById('userAvatarMini').textContent = nickname[0].toUpperCase();
        }

        window.addEventListener('authStateChanged', (e) => {
            if (e.detail.user) {
                currentUser = e.detail.user;
                showLoggedInUI(currentUser);
            }
        });

        // Check on load
        setTimeout(checkAuth, 500);

        // Initialize Editor
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const cmd = btn.dataset.cmd;
                document.execCommand(cmd, false, null);
                document.getElementById('editor').focus();
            });
        });

        document.getElementById('write-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Sync Editor Content to Textarea
            const editorContent = document.getElementById('editor').innerHTML;
            document.getElementById('content').value = editorContent;

            if (!document.getElementById('editor').textContent.trim() && !editorContent.includes('<img')) {
                return alert('내용을 입력해주세요.');
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';

            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const content = editorContent;

            // Get nickname and password
            let nickname, password;
            if (currentUser) {
                nickname = currentUser.displayName || currentUser.email.split('@')[0];
                password = 'user_' + currentUser.uid.substring(0, 8); // Auto-generated
            } else {
                nickname = document.getElementById('nickname').value;
                password = document.getElementById('password').value;

                if (!nickname || !password) {
                    alert('닉네임과 비밀번호를 입력해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '등록';
                    return;
                }
            }

            try {
                await addDoc(collection(db, "posts"), {
                    category,
                    nickname,
                    password,
                    title,
                    content,
                    views: 0,
                    commentCount: 0,
                    userId: currentUser ? currentUser.uid : null,
                    createdAt: serverTimestamp()
                });

                window.location.href = `/community/index.html?category=${category}`;
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("글 등록 중 오류가 발생했습니다.");
                submitBtn.disabled = false;
                submitBtn.textContent = '등록';
            }
        });
    </script>
</body>

</html>
