<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Utilsly Community</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .write-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .write-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }

        .write-title-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding: 0;
            outline: none;
            letter-spacing: -0.02em;
        }

        .write-title-input::placeholder {
            color: var(--text-placeholder);
        }

        .form-section {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-item label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-tertiary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px 12px 0 0;
            border-bottom: none;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            border: 1px solid transparent;
            background: transparent;
        }

        .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .tool-btn.active {
            background: var(--bg-active);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .editor-surface {
            min-height: 500px;
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 0 0 12px 12px;
            outline: none;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        .editor-surface img {
            max-width: 100%;
            border-radius: 12px;
        }

        .publish-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 768px) {
            .form-section {
                grid-template-columns: 1fr;
            }

            .write-card {
                padding: 20px;
            }

            .write-title-input {
                font-size: 24px;
            }
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item"><a href="/community/index.html">커뮤니티</a></span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">글쓰기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="write-container">
                    <div class="write-card">
                        <div id="logged-in-chip" style="display:none;">
                            <div class="user-chip">
                                <span class="material-symbols-rounded" style="font-size:18px;">account_circle</span>
                                <span id="user-name-display">사용자</span>
                                <span style="opacity:0.5; font-weight:400;">로그인됨</span>
                            </div>
                        </div>

                        <input type="text" id="post-title" class="write-title-input" placeholder="제목을 입력하세요"
                            maxlength="100">

                        <div class="form-section">
                            <div class="form-item">
                                <label>채널 선택</label>
                                <select id="post-category">
                                    <option value="free">자유</option>
                                    <option value="stock">주식/코인</option>
                                    <option value="dev">개발</option>
                                    <option value="humor">유머</option>
                                    <option value="suggestion">건의사항</option>
                                    <option value="notice">공지사항</option>
                                </select>
                            </div>
                            <div class="form-item guest-field">
                                <label>닉네임</label>
                                <input type="text" id="post-nickname" placeholder="닉네임">
                            </div>
                            <div class="form-item guest-field">
                                <label>비밀번호</label>
                                <input type="password" id="post-password" placeholder="비밀번호">
                            </div>
                        </div>

                        <div class="editor-area">
                            <div class="toolbar">
                                <button type="button" class="tool-btn" data-cmd="bold" title="굵게">
                                    <span class="material-symbols-rounded" style="font-size:20px;">format_bold</span>
                                </button>
                                <button type="button" class="tool-btn" data-cmd="italic" title="기울임">
                                    <span class="material-symbols-rounded" style="font-size:20px;">format_italic</span>
                                </button>
                                <button type="button" class="tool-btn" data-cmd="underline" title="밑줄">
                                    <span class="material-symbols-rounded"
                                        style="font-size:20px;">format_underlined</span>
                                </button>
                                <div style="width:1px; height:20px; background:var(--border-color); margin:0 4px;">
                                </div>
                                <button type="button" class="tool-btn" id="btn-img" title="이미지">
                                    <span class="material-symbols-rounded" style="font-size:20px;">image</span>
                                </button>
                                <button type="button" class="tool-btn" id="btn-link" title="링크">
                                    <span class="material-symbols-rounded" style="font-size:20px;">link</span>
                                </button>
                                <button type="button" class="tool-btn" data-cmd="justifyLeft">
                                    <span class="material-symbols-rounded"
                                        style="font-size: 20px;">format_align_left</span>
                                </button>
                                <button type="button" class="tool-btn" data-cmd="justifyCenter">
                                    <span class="material-symbols-rounded"
                                        style="font-size: 20px;">format_align_center</span>
                                </button>
                                <button type="button" class="tool-btn" data-cmd="insertUnorderedList">
                                    <span class="material-symbols-rounded"
                                        style="font-size: 20px;">format_list_bulleted</span>
                                </button>
                                <input type="file" id="file-input" accept="image/*" style="display:none;">
                            </div>
                            <div id="post-editor" class="editor-surface" contenteditable="true">
                                <p><br></p>
                            </div>
                        </div>

                        <div class="publish-footer">
                            <button class="btn" onclick="history.back()">취소</button>
                            <button class="btn btn-primary" id="publish-btn">게시글 등록</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const editor = document.getElementById('post-editor');
        const urlParams = new URLSearchParams(window.location.search);
        const channel = urlParams.get('channel');
        if (channel) document.getElementById('post-category').value = channel;

        let currentUser = null;
        function checkAuth() {
            if (window.UtilslyAuth && window.UtilslyAuth.currentUser) {
                currentUser = window.UtilslyAuth.currentUser;
                const nickname = currentUser.displayName || currentUser.email.split('@')[0];
                document.querySelectorAll('.guest-field').forEach(f => f.style.display = 'none');
                document.getElementById('logged-in-chip').style.display = 'block';
                document.getElementById('user-name-display').textContent = nickname;
            }
        }
        setTimeout(checkAuth, 500);

        // Editor interactions
        document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.execCommand(btn.dataset.cmd, false, null);
                editor.focus();
            });
        });

        document.getElementById('btn-link').onclick = () => {
            const url = prompt('URL을 입력하세요:');
            if (url) document.execCommand('createLink', false, url);
        };

        const fileInput = document.getElementById('file-input');
        document.getElementById('btn-img').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = `<img src="${ev.target.result}" style="max-width:100%; border-radius:12px;"><p><br></p>`;
                    editor.focus();
                    document.execCommand('insertHTML', false, img);
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('publish-btn').onclick = async () => {
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value;
            const content = editor.innerHTML;

            if (!title) return alert('제목을 입력해주세요.');
            if (!editor.textContent.trim() && !content.includes('<img')) return alert('내용을 입력해주세요.');

            let nickname, password;
            if (currentUser) {
                nickname = currentUser.displayName || currentUser.email.split('@')[0];
                password = 'user_' + currentUser.uid.substring(0, 8);
            } else {
                nickname = document.getElementById('post-nickname').value.trim();
                password = document.getElementById('post-password').value.trim();
                if (!nickname || !password) return alert('닉네임과 비밀번호를 입력해주세요.');
            }

            const btn = document.getElementById('publish-btn');
            btn.disabled = true;
            btn.textContent = '등록 중...';

            try {
                await addDoc(collection(db, "posts"), {
                    title, category, nickname, password, content,
                    views: 0, commentCount: 0, recommendCount: 0,
                    userId: currentUser ? currentUser.uid : null,
                    createdAt: serverTimestamp()
                });
                location.href = `/community/index.html?channel=${category}`;
            } catch (err) {
                alert('등록 실패');
                btn.disabled = false;
                btn.textContent = '게시글 등록';
            }
        };
    </script>
</body>

</html>
