<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - CHANNELS</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --point-blue: #2563eb;
        }

        .main-content {
            background: var(--bg-primary);
            padding: 0;
        }

        /* Minimal Header */
        .write-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(var(--bg-primary-rgb, 255, 255, 255), 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="dark"] .write-header {
            background: rgba(25, 25, 25, 0.8);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .cancel-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px;
        }

        /* Write Container */
        .write-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 20px 100px 20px;
        }

        .write-title-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 24px;
            padding: 0;
            outline: none;
            letter-spacing: -0.01em;
        }

        .write-title-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-section {
            border-top: 1px solid var(--border-color);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-item label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .form-item select,
        .form-item input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        /* Toolbar & Editor */
        .editor-container {
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--point-blue);
            color: var(--point-blue);
        }

        .tool-btn.active {
            background: rgba(37, 99, 235, 0.05);
            border-color: var(--point-blue);
            color: var(--point-blue);
        }

        .editor-surface {
            min-height: 400px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            outline: none;
            word-break: break-all;
        }

        .editor-surface img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .write-title-input {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" style="display:none;"></aside>

        <main class="main-content">
            <header class="write-header">
                <div class="header-left">
                    <button class="cancel-btn" onclick="history.back()">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                    <span class="header-title">글쓰기</span>
                </div>
                <button class="btn btn-primary" id="publish-btn" style="padding: 6px 20px;">등록</button>
            </header>

            <div class="write-container">
                <input type="text" id="post-title" class="write-title-input" placeholder="제목을 입력하세요" maxlength="100">

                <div class="form-section">
                    <div class="form-item">
                        <label>채널</label>
                        <select id="post-category">
                            <option value="free">자유</option>
                            <option value="stock">주식/코인</option>
                            <option value="dev">개발</option>
                            <option value="humor">유머</option>
                            <option value="suggestion">건의사항</option>
                            <option value="notice">공지사항</option>
                        </select>
                    </div>
                    <div id="guest-fields" style="display:contents;">
                        <div class="form-item">
                            <label>닉네임</label>
                            <input type="text" id="post-nickname" placeholder="닉네임을 입력하세요">
                        </div>
                        <div class="form-item">
                            <label>비밀번호</label>
                            <input type="password" id="post-password" placeholder="비밀번호">
                        </div>
                    </div>
                </div>

                <div class="editor-container">
                    <div class="toolbar">
                        <button type="button" class="tool-btn" data-cmd="bold" title="굵게">
                            <span class="material-symbols-rounded">format_bold</span>
                        </button>
                        <button type="button" class="tool-btn" data-cmd="italic" title="기울임">
                            <span class="material-symbols-rounded">format_italic</span>
                        </button>
                        <button type="button" class="tool-btn" id="btn-img" title="이미지">
                            <span class="material-symbols-rounded">image</span>
                        </button>
                        <button type="button" class="tool-btn" id="btn-link" title="링크">
                            <span class="material-symbols-rounded">link</span>
                        </button>
                        <button type="button" class="tool-btn" data-cmd="insertUnorderedList" title="리스트">
                            <span class="material-symbols-rounded">format_list_bulleted</span>
                        </button>
                    </div>
                    <div id="post-editor" class="editor-surface" contenteditable="true">
                        <p><br></p>
                    </div>
                    <input type="file" id="file-input" accept="image/*" style="display:none;">
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        });
        const db = getFirestore(app);

        const editor = document.getElementById('post-editor');
        const urlParams = new URLSearchParams(window.location.search);
        const channelId = urlParams.get('channel');

        if (channelId) {
            const select = document.getElementById('post-category');
            // Add custom channel option if not present
            if (![...select.options].some(o => o.value === channelId)) {
                const opt = document.createElement('option');
                opt.value = channelId;
                opt.textContent = channelId; // Or fetch name from DB if needed
                select.appendChild(opt);
            }
            select.value = channelId;
        }

        // Editor Actions
        document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.execCommand(btn.dataset.cmd, false, null);
                editor.focus();
            });
        });

        document.getElementById('btn-link').onclick = () => {
            const url = prompt('URL을 입력하세요:');
            if (url) document.execCommand('createLink', false, url);
        };

        const fileInput = document.getElementById('file-input');
        document.getElementById('btn-img').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = `<img src="${ev.target.result}" style="max-width:100%; border-radius:12px;"><p><br></p>`;
                    editor.focus();
                    document.execCommand('insertHTML', false, img);
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('publish-btn').onclick = async () => {
            const title = document.getElementById('post-title').value.trim();
            const category = document.getElementById('post-category').value;
            const content = editor.innerHTML;
            const nickname = document.getElementById('post-nickname').value.trim() || '익명';
            const password = document.getElementById('post-password').value.trim() || 'guest';

            if (!title) return alert('제목을 입력해주세요.');
            if (!editor.textContent.trim() && !content.includes('<img')) return alert('내용을 입력해주세요.');

            const btn = document.getElementById('publish-btn');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                await addDoc(collection(db, "posts"), {
                    title, category, nickname, password, content,
                    views: 0, commentCount: 0, recommendCount: 0,
                    createdAt: serverTimestamp()
                });
                location.href = `/community/index.html?channel=${category}`;
            } catch (err) {
                alert('등록 실패');
                btn.disabled = false;
                btn.textContent = '등록';
            }
        };
    </script>
</body>

</html>
