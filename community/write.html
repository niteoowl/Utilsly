<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - Utilsly Community</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/common.js"></script>
    <style>
        .write-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .write-header {
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 4px;
        }

        textarea {
            min-height: 400px;
            resize: vertical;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .user-info-display {
            padding: 16px;
            background: var(--bg-sidebar);
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">커뮤니티</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">글쓰기</span>
                </div>
            </div>

            <div class="content-area">
                <div class="write-container">
                    <div class="write-header">
                        <h2>글쓰기</h2>
                    </div>

                    <!-- User info shown when logged in -->
                    <div class="user-info-display" id="userInfoDisplay" style="display: none;">
                        <div class="user-avatar-mini" id="userAvatarMini">U</div>
                        <div>
                            <div style="font-weight: 600;" id="userNickname">닉네임</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">로그인됨</div>
                        </div>
                    </div>

                    <form id="write-form">
                        <div class="form-group">
                            <label>분류</label>
                            <select id="category" required>
                                <option value="free">자유게시판</option>
                                <option value="bug">버그 제보</option>
                                <option value="suggestion">기능 건의</option>
                            </select>
                        </div>

                        <!-- Only shown when NOT logged in -->
                        <div class="form-row" id="guestInputs">
                            <div class="form-group">
                                <label>닉네임</label>
                                <input type="text" id="nickname" placeholder="닉네임 입력" maxlength="20"
                                    autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label>비밀번호</label>
                                <input type="password" id="password" placeholder="삭제 시 필요" maxlength="20"
                                    autocomplete="new-password">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>제목</label>
                            <input type="text" id="title" required placeholder="제목을 입력해 주세요" maxlength="100">
                        </div>

                        <div class="form-group">
                            <label>내용</label>
                            <!-- Rich Text Toolbar -->
                            <div class="toolbar"
                                style="border: 1px solid var(--border-color); border-bottom: none; padding: 8px; background: var(--bg-hover); border-radius: 4px 4px 0 0; display:flex; flex-wrap: wrap; gap: 4px; align-items: center;">

                                <!-- Text Style -->
                                <button type="button" class="tool-btn" data-cmd="bold" title="굵게"><b>B</b></button>
                                <button type="button" class="tool-btn" data-cmd="italic" title="기울임"><i>I</i></button>
                                <button type="button" class="tool-btn" data-cmd="underline" title="밑줄"><u>U</u></button>
                                <button type="button" class="tool-btn" data-cmd="strikeThrough"
                                    title="취소선"><s>S</s></button>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Font Size -->
                                <select id="fontSizeSelect"
                                    style="width:auto; padding: 4px; height: 32px; font-size: 13px;">
                                    <option value="3">기본 크기</option>
                                    <option value="1">작게</option>
                                    <option value="5">크게</option>
                                    <option value="7">아주 크게</option>
                                </select>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Colors -->
                                <div style="position:relative;">
                                    <button type="button" class="tool-btn" id="textColorBtn" title="글자 색상"><span
                                            style="color:var(--accent-blue); font-weight:bold;">A</span></button>
                                    <input type="color" id="foreColorInput"
                                        style="position:absolute; opacity:0; width:1px; height:1px; bottom:0; left:0;">
                                </div>
                                <div style="position:relative;">
                                    <button type="button" class="tool-btn" id="bgColorBtn" title="배경 색상"><span
                                            style="background:var(--accent-blue); color:white; padding:0 4px; font-size:12px;">A</span></button>
                                    <input type="color" id="hiliteColorInput"
                                        style="position:absolute; opacity:0; width:1px; height:1px; bottom:0; left:0;">
                                </div>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Alignment -->
                                <button type="button" class="tool-btn" data-cmd="justifyLeft" title="왼쪽 정렬"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">format_align_left</span></button>
                                <button type="button" class="tool-btn" data-cmd="justifyCenter" title="가운데 정렬"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">format_align_center</span></button>
                                <button type="button" class="tool-btn" data-cmd="justifyRight" title="오른쪽 정렬"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">format_align_right</span></button>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Lists -->
                                <button type="button" class="tool-btn" data-cmd="insertUnorderedList"
                                    title="글머리 기호"><span class="material-symbols-rounded"
                                        style="font-size:18px;">format_list_bulleted</span></button>
                                <button type="button" class="tool-btn" data-cmd="insertOrderedList" title="번호 매기기"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">format_list_numbered</span></button>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Insert -->
                                <button type="button" class="tool-btn" data-cmd="createLink" title="링크"><span
                                        class="material-symbols-rounded" style="font-size:18px;">link</span></button>
                                <button type="button" class="tool-btn" id="insertImageBtn" title="이미지 (압축 첨부)"><span
                                        class="material-symbols-rounded" style="font-size:18px;">image</span></button>
                                <button type="button" class="tool-btn" id="insertVideoBtn" title="유튜브 영상"><span
                                        class="material-symbols-rounded" style="font-size:18px;">movie</span></button>

                                <div style="width:1px; height: 20px; background:var(--border-color); margin:0 4px;">
                                </div>

                                <!-- Advanced -->
                                <button type="button" class="tool-btn" id="insertTableBtn" title="표 삽입 (3x3)"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">table_chart</span></button>
                                <button type="button" class="tool-btn" id="insertQuoteBtn" title="인용구"><span
                                        class="material-symbols-rounded"
                                        style="font-size:18px;">format_quote</span></button>
                                <button type="button" class="tool-btn" id="insertCodeBtn" title="코드 블록"><span
                                        class="material-symbols-rounded" style="font-size:18px;">code</span></button>

                                <input type="file" id="imageUploadInput" accept="image/*" style="display:none;">
                            </div>
                            <!-- Content Editable Div -->
                            <div id="editor" contenteditable="true"
                                style="min-height: 400px; padding: 16px; border: 1px solid var(--border-color); border-radius: 0 0 4px 4px; background: var(--bg-primary); line-height: 1.6; outline: none; overflow-y: auto;">
                                <p><br></p>
                            </div>
                            <textarea id="content" style="display:none;"></textarea>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn" onclick="history.back()">취소</button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">등록</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default category from URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlCat = urlParams.get('category');
        if (urlCat && urlCat !== 'all' && urlCat !== 'notice' && urlCat !== 'resolved') {
            document.getElementById('category').value = urlCat;
        }

        // Check login status
        let currentUser = null;
        function checkAuth() {
            if (window.UtilslyAuth && window.UtilslyAuth.currentUser) {
                currentUser = window.UtilslyAuth.currentUser;
                showLoggedInUI(currentUser);
            }
        }

        function showLoggedInUI(user) {
            const nickname = user.displayName || user.email.split('@')[0];
            document.getElementById('guestInputs').style.display = 'none';
            document.getElementById('userInfoDisplay').style.display = 'flex';
            document.getElementById('userNickname').textContent = nickname;
            document.getElementById('userAvatarMini').textContent = nickname[0].toUpperCase();
        }

        window.addEventListener('authStateChanged', (e) => {
            if (e.detail.user) {
                currentUser = e.detail.user;
                showLoggedInUI(currentUser);
            }
        });

        // Check on load
        setTimeout(checkAuth, 500);

        // Initialize Editor
        const editor = document.getElementById('editor');

        // --- PASTE HANDLER (Strip Styles) ---
        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            let text = (e.originalEvent || e).clipboardData.getData('text/plain');

            // Basic HTML cleanup / insertion as plain text
            // If we want to support basic formatting from word etc, we need a sanitizer.
            // But user requested "like original format" was bad. They likely want Clean Text or Clean HTML.
            // "붙여넣으면 그 원본 서식대로 붙여넣어져..." (It pastes with original format... [implied complaint])
            // So we force plain text.
            document.execCommand('insertText', false, text);
        });

        // Toolbar Buttons (execCommand)
        document.querySelectorAll('.tool-btn[data-cmd]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const cmd = btn.dataset.cmd;
                if (cmd === 'createLink') {
                    const url = prompt('링크 주소를 입력하세요:');
                    if (url) document.execCommand(cmd, false, url);
                } else {
                    document.execCommand(cmd, false, null);
                }
                editor.focus();
            });
        });

        // Font Size
        document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
            document.execCommand('fontSize', false, e.target.value);
            editor.focus();
        });

        // Colors
        const textColorBtn = document.getElementById('textColorBtn');
        const foreColorInput = document.getElementById('foreColorInput');
        textColorBtn.addEventListener('click', () => foreColorInput.click());
        foreColorInput.addEventListener('change', (e) => {
            document.execCommand('foreColor', false, e.target.value);
            editor.focus();
        });

        const bgColorBtn = document.getElementById('bgColorBtn');
        const hiliteColorInput = document.getElementById('hiliteColorInput');
        bgColorBtn.addEventListener('click', () => hiliteColorInput.click());
        hiliteColorInput.addEventListener('change', (e) => {
            document.execCommand('hiliteColor', false, e.target.value);
            editor.focus();
        });

        // --- NEW FEATURES Handlers ---

        // 1. YouTube Video
        document.getElementById('insertVideoBtn').addEventListener('click', () => {
            const url = prompt('YouTube 동영상 주소(URL)를 입력하세요:');
            if (url) {
                // Extract Video ID
                let videoId = null;
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                if (match && match[2].length === 11) {
                    videoId = match[2];
                }

                if (videoId) {
                    const iframeHtml = `<div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin: 16px 0;"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div><p><br></p>`;
                    // Insert HTML
                    editor.focus();
                    document.execCommand('insertHTML', false, iframeHtml);
                } else {
                    alert('유효하지 않은 YouTube URL입니다.');
                }
            }
        });

        // 2. Table (3x3 default)
        document.getElementById('insertTableBtn').addEventListener('click', () => {
            const tableHtml = `
                <table style="width: 100%; border-collapse: collapse; margin: 16px 0; border: 1px solid var(--border-color);">
                    <tbody>
                        <tr><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td></tr>
                        <tr><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td></tr>
                        <tr><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td><td style="border: 1px solid var(--border-color); padding: 8px;">내용</td></tr>
                    </tbody>
                </table>
                <p><br></p>
            `;
            editor.focus();
            document.execCommand('insertHTML', false, tableHtml);
        });

        // 3. Quote
        document.getElementById('insertQuoteBtn').addEventListener('click', () => {
            const quoteHtml = `<blockquote style="border-left: 4px solid var(--accent-blue); padding-left: 16px; color: var(--text-secondary); margin: 16px 0;">인용구를 입력하세요</blockquote><p><br></p>`;
            editor.focus();
            document.execCommand('insertHTML', false, quoteHtml);
        });

        // 4. Code Block
        document.getElementById('insertCodeBtn').addEventListener('click', () => {
            const codeHtml = `<pre style="background: #282c34; color: #abb2bf; padding: 16px; border-radius: 4px; overflow-x: auto; font-family: monospace; margin: 16px 0;"><code>코드를 입력하세요...</code></pre><p><br></p>`;
            editor.focus();
            document.execCommand('insertHTML', false, codeHtml);
        });


        // Image Handling
        const insertImageBtn = document.getElementById('insertImageBtn');
        const imageUploadInput = document.getElementById('imageUploadInput');

        insertImageBtn.addEventListener('click', () => imageUploadInput.click());

        imageUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            handleImageUpload(file);
            imageUploadInput.value = '';
        });

        document.getElementById('write-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Sync Editor Content to Textarea
            const editorContent = document.getElementById('editor').innerHTML;
            document.getElementById('content').value = editorContent;

            if (!document.getElementById('editor').textContent.trim() && !editorContent.includes('<img')) {
                return alert('내용을 입력해주세요.');
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';

            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const content = editorContent;

            // Get nickname and password
            let nickname, password;
            if (currentUser) {
                nickname = currentUser.displayName || currentUser.email.split('@')[0];
                password = 'user_' + currentUser.uid.substring(0, 8); // Auto-generated
            } else {
                nickname = document.getElementById('nickname').value;
                password = document.getElementById('password').value;

                if (!nickname || !password) {
                    alert('닉네임과 비밀번호를 입력해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '등록';
                    return;
                }
            }

            try {
                await addDoc(collection(db, "posts"), {
                    category,
                    nickname,
                    password,
                    title,
                    content,
                    views: 0,
                    commentCount: 0,
                    userId: currentUser ? currentUser.uid : null,
                    createdAt: serverTimestamp()
                });

                window.location.href = `/community/index.html?category=${category}`;
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("글 등록 중 오류가 발생했습니다.");
                submitBtn.disabled = false;
                submitBtn.textContent = '등록';
            }
        });
    </script>
</body>

</html>
