<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Utilsly - 웹 도구 모음</title>
    <meta name="description" content="모두를 위한 유용한 웹툴! Utilsly입니다.">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hero-section {
            text-align: center;
            padding: 80px 40px;
            background: linear-gradient(180deg, var(--bg-sidebar) 0%, var(--bg-primary) 100%);
            border-radius: 24px;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(0, 0, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0, 0, 0, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        [data-theme="dark"] .hero-section::before {
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.01) 0%, transparent 50%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .hero-badge .material-symbols-rounded {
            font-size: 16px;
            color: var(--accent-blue);
        }

        .hero-title {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 32px auto;
            line-height: 1.6;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px 16px 52px;
            font-size: 16px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 22px;
            pointer-events: none;
        }

        .category-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 8px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .category-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .material-symbols-rounded {
            font-size: 22px;
        }

        .tools-section {
            margin-bottom: 48px;
        }

        .stats-row {
            display: flex;
            gap: 24px;
            margin-top: 32px;
            justify-content: center;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Search Results View */
        #searchResultsView {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results .material-symbols-rounded {
            font-size: 48px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .hero-section {
                padding: 40px 20px;
                margin: -24px -16px 24px -16px;
                border-radius: 0;
            }

            .hero-badge {
                font-size: 11px;
                padding: 6px 12px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 14px;
                margin-bottom: 24px;
            }

            .search-input {
                padding: 14px 20px 14px 48px;
                font-size: 15px;
            }

            .search-icon {
                left: 16px;
                font-size: 20px;
            }

            .stats-row {
                gap: 12px;
                margin-top: 24px;
            }

            .stat-number {
                font-size: 22px;
            }

            .stat-label {
                font-size: 11px;
            }

            .category-nav {
                margin-bottom: 20px;
                gap: 6px;
            }

            .category-btn {
                padding: 8px 14px;
                font-size: 13px;
            }

            .section-title {
                font-size: 16px;
            }

            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }

            .tool-card {
                padding: 16px !important;
            }

            .card-icon {
                width: 40px !important;
                height: 40px !important;
            }

            .card-icon .material-symbols-rounded {
                font-size: 20px !important;
            }

            .card-title {
                font-size: 13px !important;
            }

            .card-desc {
                font-size: 11px !important;
                display: none;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 28px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr 1fr !important;
            }
        }
    </style>
</head>

<body>

            <div class="content-area">

                        <div class="search-container">

                                <div class="stat-label">개의 도구</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-number">100%</div>
                                <div class="stat-label">무료</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-number">0</div>

                    </div>
                </div>

                <!-- Default Home View -->
                <div id="homeDefaultView">
                    <div class="category-nav" id="categoryNav">
                        <button class="category-btn active" data-category="random">🎲 랜덤</button>
                        <button class="category-btn" data-category="image">🖼️ 이미지</button>
                        <button class="category-btn" data-category="video">🎬 비디오</button>
                        <button class="category-btn" data-category="pdf">📄 PDF</button>
                        <button class="category-btn" data-category="text">✏️ 텍스트</button>
                        <button class="category-btn" data-category="dev">💻 개발</button>
                        <button class="category-btn" data-category="math">🔢 계산</button>
                        <button class="category-btn" data-category="date">⏰ 시간</button>
                        <button class="category-btn" data-category="health">💪 건강</button>
                    </div>

                    <div class="tools-section" id="toolsSection">
                        <div class="section-header">
                            <h2 class="section-title">
                                <span class="material-symbols-rounded">apps</span>
                                <span id="currentCategoryTitle">전체 도구</span>
                            </h2>
                        </div>
                        <div class="dashboard-grid" id="toolsGrid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Search Results View -->
                <div id="searchResultsView">
                    <div class="section-header">
                        <h2 class="section-title">
                            <span class="material-symbols-rounded">search</span>
                            검색 결과
                        </h2>
                    </div>
                    <div class="dashboard-grid" id="searchResults">
                        <!-- Populated by JS -->
                    </div>
                    <div id="noResults" class="no-results" style="display: none;">
                        <span class="material-symbols-rounded">search_off</span>
                        <div>검색 결과가 없습니다.</div>
                    </div>
                </div>

            </div>
        </main>
    </div>

        // Update tool count
        document.getElementById('toolCount').textContent = allTools.length + '+';

        let currentCategory = 'all';

        function renderCards(containerId, tools) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (tools.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-tertiary);">해당 카테고리에 도구가 없습니다.</div>';
                return;
            }

            container.innerHTML = tools.map(tool => `
                <a href="${tool.path}" class="tool-card">
                    <div class="card-icon">
                        <span class="material-symbols-rounded">${tool.icon}</span>
                    </div>
                    <div class="card-title">${tool.name}</div>
                    <div class="card-desc">${tool.desc}</div>
                </a>
            `).join('');
        }

        function filterByCategory(category) {
            currentCategory = category;

            // Update active button
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });

            // Update title
            const titles = {
                'all': '전체 도구',
                'random': '🎲 랜덤 도구',
                'image': '🖼️ 이미지 도구',
                'video': '🎬 비디오 도구',
                'pdf': '📄 PDF 도구',
                'text': '✏️ 텍스트 도구',
                'dev': '💻 개발 도구',
                'math': '🔢 계산 도구',
                'date': '⏰ 시간 도구',
                'health': '💪 건강 도구'
            };
            document.getElementById('currentCategoryTitle').textContent = titles[category] || '전체 도구';

            // Filter and render
            const filtered = category === 'all'
                ? allTools
                : allTools.filter(t => t.category === category);
            renderCards('toolsGrid', filtered);
        }

        // Category nav click handler
        document.getElementById('categoryNav').addEventListener('click', (e) => {
            const btn = e.target.closest('.category-btn');
            if (btn) {
                filterByCategory(btn.dataset.category);
            }
        });

        // Initial render - show Random category
        filterByCategory('random');

        // Search
        const mainSearch = document.getElementById('mainSearch');
        const homeDefaultView = document.getElementById('homeDefaultView');
        const searchResultsView = document.getElementById('searchResultsView');
        const searchResults = document.getElementById('searchResults');
        const noResults = document.getElementById('noResults');

        mainSearch.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();

            if (query.length > 0) {
                homeDefaultView.style.display = 'none';
                searchResultsView.style.display = 'block';

                const filtered = allTools.filter(tool =>
                    tool.name.toLowerCase().includes(query) ||
                    tool.desc.toLowerCase().includes(query)
                );

                if (filtered.length > 0) {
                    renderCards('searchResults', filtered);
                    searchResults.style.display = 'grid';
                    noResults.style.display = 'none';
                } else {
                    searchResults.style.display = 'none';
                    noResults.style.display = 'block';
                }
            } else {
                homeDefaultView.style.display = 'block';
                searchResultsView.style.display = 'none';
            }
        });
    </script>
</body>

</html>
