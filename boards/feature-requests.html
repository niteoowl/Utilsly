<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>기능 추가 요청 - Utilsly</title>
    <meta name="description" content="Utilsly에 필요한 기능을 제안하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../css/style.css" as="style">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">기능 추가 요청</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">lightbulb</span></div>
                    <h1>💡 기능 추가 요청</h1>
                    <p class="description">필요한 도구를 제안하고 다른 사용자의 요청에 투표하세요</p>
                </div>

                <div class="tool-container">
                    <!-- New Request Form -->
                    <div
                        style="background: var(--bg-sidebar); padding: 24px; border-radius: 12px; margin-bottom: 32px;">
                        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">새 요청 작성</h3>
                        <input type="text" id="requestTitle" placeholder="제목 (예: 이미지 배경 제거 도구)"
                            style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; font-size: 16px;">
                        <textarea id="requestContent" placeholder="상세 설명을 입력하세요..."
                            style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; min-height: 100px; font-family: inherit; resize: vertical; margin-bottom: 12px;"></textarea>
                        <button class="btn btn-primary" onclick="submitRequest()" style="width: 100%;">제출하기</button>
                    </div>

                    <!-- Requests List -->
                    <div>
                        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">요청 목록</h3>
                        <div id="requestsList"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitRequest = async function () {
            const title = document.getElementById('requestTitle').value.trim();
            const content = document.getElementById('requestContent').value.trim();

            if (!title || !content) {
                alert('제목과 내용을 모두 입력해주세요.');
                return;
            }

            try {
                await addDoc(collection(db, 'feature-requests'), {
                    title: title,
                    content: content,
                    votes: 0,
                    createdAt: serverTimestamp(),
                    status: 'pending'
                });

                document.getElementById('requestTitle').value = '';
                document.getElementById('requestContent').value = '';
                alert('✅ 요청이 등록되었습니다!');
                loadRequests();
            } catch (error) {
                console.error('Error:', error);
                alert('오류가 발생했습니다. 다시 시도해주세요.');
            }
        };

        async function loadRequests() {
            try {
                const q = query(collection(db, 'feature-requests'), orderBy('votes', 'desc'));
                const querySnapshot = await getDocs(q);
                const list = document.getElementById('requestsList');

                if (querySnapshot.empty) {
                    list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">아직 요청이 없습니다.</div>';
                    return;
                }

                list.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const item = document.createElement('div');
                    item.style.cssText = 'background: var(--bg-sidebar); padding: 20px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color);';
                    item.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: start; gap: 16px;">
                            <div style="flex: 1;">
                                <h4 style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">${data.title}</h4>
                                <p style="color: var(--text-secondary); margin-bottom: 8px;">${data.content}</p>
                                <div style="font-size: 12px; color: var(--text-tertiary);">${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('ko-KR') : '방금'}</div>
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
                                <button class="btn" onclick="voteRequest('${docSnap.id}')" style="padding: 8px 12px; display: flex; align-items: center; gap: 4px;">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">thumb_up</span>
                                    <span>${data.votes || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        window.voteRequest = async function (id) {
            try {
                const docRef = doc(db, 'feature-requests', id);
                const querySnapshot = await getDocs(collection(db, 'feature-requests'));
                const docSnap = querySnapshot.docs.find(d => d.id === id);
                if (docSnap) {
                    await updateDoc(docRef, {
                        votes: (docSnap.data().votes || 0) + 1
                    });
                    loadRequests();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        };

        loadRequests();
    </script>
</body>

</html>
