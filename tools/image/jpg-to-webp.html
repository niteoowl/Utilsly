<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JPG WEBP 변환 - Utilsly</title>
    <meta name="description" content="JPG 이미지를 WEBP로 변환하여 웹사이트 로딩 속도를 개선하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">image</span>
                    </div>
                    <h1>JPG WEBP 변환</h1>
                    <p class="description">JPG/JPEG 이미지를 차세대 포맷인 WEBP로 변환하세요. 화질은 유지하면서 용량을 줄일 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="jpg-to-webp">
                    <div class="upload-area" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                        <p class="upload-text">JPG 이미지를 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">JPG, JPEG 파일 지원</p>
                        <input type="file" id="fileInput" accept="image/jpeg, image/jpg" style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <img id="preview" class="preview-image" alt="Preview">

                        <div class="controls">
                            <div class="control-group">
                                <label>품질 (0.1 ~ 1.0)</label>
                                <input type="range" id="qualityInput" min="0.1" max="1.0" step="0.1" value="0.9">
                                <div
                                    style="text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                    값: <span id="qualityValue">0.9</span>
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                WEBP로 다운로드
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                다른 이미지
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('jpg-to-webp', {
            elements: {},
            originalImage: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    preview: document.getElementById('preview'),
                    previewContainer: document.getElementById('previewContainer'),
                    qualityInput: document.getElementById('qualityInput'),
                    qualityValue: document.getElementById('qualityValue'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn')
                };
                this.bindEvents();
                console.log('JPG to WEBP Converter initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFile(e.dataTransfer.files[0]);
                    });
                });

                this.elements.qualityInput.addEventListener('input', (e) => {
                    this.elements.qualityValue.textContent = e.target.value;
                });

                this.elements.downloadBtn.addEventListener('click', () => this.convertAndDownload());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            handleFile(file) {
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.originalImage = new Image();
                    this.originalImage.onload = () => {
                        this.elements.preview.src = this.originalImage.src;
                        this.elements.previewContainer.style.display = 'block';
                        this.elements.dropZone.style.display = 'none';
                    };
                    this.originalImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            convertAndDownload() {
                if (!this.originalImage) return;

                const canvas = document.createElement('canvas');
                canvas.width = this.originalImage.width;
                canvas.height = this.originalImage.height;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(this.originalImage, 0, 0);

                const quality = parseFloat(this.elements.qualityInput.value);
                const dataUrl = canvas.toDataURL('image/webp', quality);

                const link = document.createElement('a');
                link.download = `converted-image.webp`;
                link.href = dataUrl;
                link.click();
            },

            reset() {
                this.originalImage = null;
                this.elements.preview.src = '';
                this.elements.fileInput.value = '';
                this.elements.previewContainer.style.display = 'none';
                this.elements.dropZone.style.display = 'block';
            }
        });
    </script>
</body>

</html>
