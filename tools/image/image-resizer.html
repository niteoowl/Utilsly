<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 리사이저 - Utilsly</title>
    <meta name="description" content="서버 전송 없이 브라우저에서 바로 이미지를 리사이징하세요. 빠르고 안전합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .drop-zone {
            border: 2px dashed var(--accent-blue);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(1.01);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 리사이저</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">aspect_ratio</span>
                    </div>
                    <h1>이미지 리사이저</h1>
                    <p class="description">이미지 크기를 조절하고 포맷을 변경하여 저장하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="image-resizer">
                    <div class="drop-zone" id="dropZone">
                        <div style="font-size: 48px; margin-bottom: 16px;">📁</div>
                        <h3 style="margin-bottom: 8px;">이미지를 드래그하거나 클릭하여 업로드</h3>
                        <p style="color: var(--text-secondary);">JPG, PNG, WEBP 지원 (서버로 전송되지 않습니다)</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <img id="preview" class="preview-image">

                        <div class="controls">
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">너비 (px)</label>
                                <input type="number" id="widthInput">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">높이 (px)</label>
                                <input type="number" id="heightInput">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">품질 (0.1 ~
                                    1.0)</label>
                                <input type="number" id="qualityInput" value="0.9" step="0.1" max="1" min="0.1">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">형식</label>
                                <select id="formatInput">
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/png">PNG</option>
                                    <option value="image/webp">WEBP</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top: 24px;">
                            <button class="btn btn-primary btn-large" id="downloadBtn">이미지 다운로드</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('image-resizer', {
            elements: {},
            originalImage: null,
            aspectRatio: 0,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    preview: document.getElementById('preview'),
                    previewContainer: document.getElementById('previewContainer'),
                    widthInput: document.getElementById('widthInput'),
                    heightInput: document.getElementById('heightInput'),
                    qualityInput: document.getElementById('qualityInput'),
                    formatInput: document.getElementById('formatInput'),
                    downloadBtn: document.getElementById('downloadBtn')
                };

                this.handleClick = () => this.elements.fileInput.click();
                this.handleChange = (e) => this.handleFileSelect(e);
                this.handleWidth = () => this.updateDimensions('width');
                this.handleHeight = () => this.updateDimensions('height');
                this.handleDownload = () => this.downloadImage();

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleChange);
                this.elements.widthInput.addEventListener('change', this.handleWidth);
                this.elements.heightInput.addEventListener('change', this.handleHeight);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);

                console.log('Image Resizer initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleChange);
                    this.elements.widthInput.removeEventListener('change', this.handleWidth);
                    this.elements.heightInput.removeEventListener('change', this.handleHeight);
                    this.elements.downloadBtn.removeEventListener('click', this.handleDownload);
                }
                this.elements = {};
                this.originalImage = null;
                console.log('Image Resizer cleanup done');
            },

            handleFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    this.originalImage = new Image();
                    this.originalImage.onload = () => {
                        this.aspectRatio = this.originalImage.width / this.originalImage.height;
                        this.elements.widthInput.value = this.originalImage.width;
                        this.elements.heightInput.value = this.originalImage.height;
                        this.elements.preview.src = this.originalImage.src;
                        this.elements.previewContainer.style.display = 'block';
                    };
                    this.originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            },

            updateDimensions(source) {
                if (!this.originalImage) return;

                if (source === 'width') {
                    this.elements.heightInput.value = Math.round(this.elements.widthInput.value / this.aspectRatio);
                } else {
                    this.elements.widthInput.value = Math.round(this.elements.heightInput.value * this.aspectRatio);
                }
            },

            downloadImage() {
                if (!this.originalImage) return;

                const canvas = document.createElement('canvas');
                canvas.width = parseInt(this.elements.widthInput.value);
                canvas.height = parseInt(this.elements.heightInput.value);

                const ctx = canvas.getContext('2d');
                ctx.drawImage(this.originalImage, 0, 0, canvas.width, canvas.height);

                const format = this.elements.formatInput.value;
                const quality = parseFloat(this.elements.qualityInput.value);

                const dataUrl = canvas.toDataURL(format, quality);

                const link = document.createElement('a');
                link.download = `resized-image.${format.split('/')[1]}`;
                link.href = dataUrl;
                link.click();
            }
        });
    </script>
</body>

</html>
