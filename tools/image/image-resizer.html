<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 리사이저 - Utilsly</title>
    <meta name="description" content="서버 전송 없이 브라우저에서 바로 이미지를 리사이징하세요. 빠르고 안전합니다."><script>
        !function(){const e=localStorage.getItem("theme"),t=window.matchMedia("(prefers-color-scheme: dark)").matches;"dark"!==e&&(e||!t)||document.documentElement.setAttribute("data-theme","dark")}();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .drop-zone {
            border: 2px dashed var(--accent-blue);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone:hover {
            background: rgba(0, 0, 0, 0.05);
            transform: scale(1.01);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 리사이저</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">aspect_ratio</span>
                    </div>
                    <h1>이미지 리사이저</h1>
                    <p class="description">이미지 크기를 조절하고 포맷을 변경하여 저장하세요.</p>
                </div>

                <div class="tool-container">
                    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                        <div style="font-size: 48px; margin-bottom: 16px;">📁</div>
                        <h3 style="margin-bottom: 8px;">이미지를 드래그하거나 클릭하여 업로드</h3>
                        <p style="color: var(--text-secondary);">JPG, PNG, WEBP 지원 (서버로 전송되지 않습니다)</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <img id="preview" class="preview-image">

                        <div class="controls">
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">너비 (px)</label>
                                <input type="number" id="widthInput" onchange="updateDimensions('width')">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">높이 (px)</label>
                                <input type="number" id="heightInput" onchange="updateDimensions('height')">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">품질 (0.1 ~
                                    1.0)</label>
                                <input type="number" id="qualityInput" value="0.9" step="0.1" max="1" min="0.1">
                            </div>
                            <div>
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">형식</label>
                                <select id="formatInput">
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/png">PNG</option>
                                    <option value="image/webp">WEBP</option>
                                </select>
                            </div>
                        </div>

                        <div style="margin-top: 24px;">
                            <button class="btn btn-primary btn-large" onclick="downloadImage()">이미지 다운로드</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('previewContainer');
        const widthInput = document.getElementById('widthInput');
        const heightInput = document.getElementById('heightInput');

        let originalImage = null;
        let aspectRatio = 0;

        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                originalImage = new Image();
                originalImage.onload = () => {
                    aspectRatio = originalImage.width / originalImage.height;
                    widthInput.value = originalImage.width;
                    heightInput.value = originalImage.height;
                    preview.src = originalImage.src;
                    previewContainer.style.display = 'block';
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateDimensions(source) {
            if (!originalImage) return;

            if (source === 'width') {
                heightInput.value = Math.round(widthInput.value / aspectRatio);
            } else {
                widthInput.value = Math.round(heightInput.value * aspectRatio);
            }
        }

        function downloadImage() {
            if (!originalImage) return;

            const canvas = document.createElement('canvas');
            canvas.width = parseInt(widthInput.value);
            canvas.height = parseInt(heightInput.value);

            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

            const format = document.getElementById('formatInput').value;
            const quality = parseFloat(document.getElementById('qualityInput').value);

            const dataUrl = canvas.toDataURL(format, quality);

            const link = document.createElement('a');
            link.download = `resized-image.${format.split('/')[1]}`;
            link.href = dataUrl;
            link.click();
        }
    </script>
</body>

</html>
