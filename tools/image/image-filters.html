<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 필터 - Utilsly</title>
    <meta name="description" content="이미지에 다양한 필터를 적용하고 보정하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .canvas-container {
            max-width: 100%;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: none;
        }

        canvas {
            max-width: 100%;
            display: block;
        }

        .filter-controls {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .control-group {
            background: var(--bg-sidebar);
            padding: 12px;
            border-radius: 8px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 필터</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">photo_filter</span>
                    </div>
                    <h1>이미지 필터</h1>
                    <p class="description">밝기, 대비, 채도 등을 조절하여 이미지를 보정하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="image-filters">
                    <div class="drop-zone" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">이미지를 업로드하세요</p>
                        <p class="upload-hint">클릭하거나 파일을 드래그하세요</p>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    </div>

                    <div class="canvas-container" id="canvasContainer">
                        <canvas id="canvas"></canvas>
                    </div>

                    <div class="filter-controls" id="filterControls">
                        <div class="control-group">
                            <label>밝기 <span id="brightnessVal">100%</span></label>
                            <input type="range" id="brightness" min="0" max="200" value="100">
                        </div>
                        <div class="control-group">
                            <label>대비 <span id="contrastVal">100%</span></label>
                            <input type="range" id="contrast" min="0" max="200" value="100">
                        </div>
                        <div class="control-group">
                            <label>채도 <span id="saturateVal">100%</span></label>
                            <input type="range" id="saturate" min="0" max="200" value="100">
                        </div>
                        <div class="control-group">
                            <label>흑백 <span id="grayscaleVal">0%</span></label>
                            <input type="range" id="grayscale" min="0" max="100" value="0">
                        </div>
                        <div class="control-group">
                            <label>블러 <span id="blurVal">0px</span></label>
                            <input type="range" id="blur" min="0" max="10" value="0" step="0.5">
                        </div>
                        <div class="control-group">
                            <label>색조 회전 <span id="hueVal">0deg</span></label>
                            <input type="range" id="hue-rotate" min="0" max="360" value="0">
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px;">
                        <button class="btn" id="resetBtn" style="display: none;">초기화</button>
                        <button class="btn btn-primary" id="downloadBtn" style="display: none; flex: 1;">이미지 저장</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('image-filters', {
            elements: {},
            originalImage: null,
            ctx: null,
            filters: {
                brightness: 100,
                contrast: 100,
                saturate: 100,
                grayscale: 0,
                blur: 0,
                'hue-rotate': 0
            },

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    canvas: document.getElementById('canvas'),
                    filterControls: document.getElementById('filterControls'),
                    canvasContainer: document.getElementById('canvasContainer'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    inputs: {
                        brightness: document.getElementById('brightness'),
                        contrast: document.getElementById('contrast'),
                        saturate: document.getElementById('saturate'),
                        grayscale: document.getElementById('grayscale'),
                        blur: document.getElementById('blur'),
                        'hue-rotate': document.getElementById('hue-rotate')
                    }
                };

                this.ctx = this.elements.canvas.getContext('2d');
                this.originalImage = new Image();

                this.handleClick = () => this.elements.fileInput.click();
                this.handleChange = (e) => this.handleFile(e);
                this.handleReset = () => this.resetFilters();
                this.handleDownload = () => this.downloadImage();

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleChange);
                this.elements.resetBtn.addEventListener('click', this.handleReset);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);

                // Bind inputs
                this.inputHandlers = {};
                Object.entries(this.elements.inputs).forEach(([key, input]) => {
                    const suffix = key === 'blur' ? 'px' : (key === 'hue-rotate' ? 'deg' : '%');
                    const handler = (e) => this.updateFilter(key, e.target.value, suffix);
                    this.inputHandlers[key] = handler;
                    input.addEventListener('input', handler);
                });

                console.log('Image Filters initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleChange);
                    this.elements.resetBtn.removeEventListener('click', this.handleReset);
                    this.elements.downloadBtn.removeEventListener('click', this.handleDownload);

                    Object.entries(this.elements.inputs).forEach(([key, input]) => {
                        if (this.inputHandlers[key]) {
                            input.removeEventListener('input', this.inputHandlers[key]);
                        }
                    });
                }
                this.elements = {};
                this.originalImage = null;
                console.log('Image Filters cleanup done');
            },

            handleFile(e) {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        this.originalImage.src = evt.target.result;
                        this.originalImage.onload = () => {
                            this.elements.canvas.width = this.originalImage.width;
                            this.elements.canvas.height = this.originalImage.height;
                            this.elements.dropZone.style.display = 'none';
                            this.elements.canvasContainer.style.display = 'block';
                            this.elements.filterControls.style.display = 'grid';
                            this.elements.downloadBtn.style.display = 'inline-flex';
                            this.elements.resetBtn.style.display = 'inline-flex';
                            this.applyFilters();
                        };
                    };
                    reader.readAsDataURL(file);
                }
            },

            updateFilter(name, value, unit) {
                this.filters[name] = value;
                document.getElementById(name + 'Val').textContent = value + unit;
                this.applyFilters();
            },

            applyFilters() {
                this.ctx.filter = `
                    brightness(${this.filters.brightness}%)
                    contrast(${this.filters.contrast}%)
                    saturate(${this.filters.saturate}%)
                    grayscale(${this.filters.grayscale}%)
                    blur(${this.filters.blur}px)
                    hue-rotate(${this.filters['hue-rotate']}deg)
                `;
                this.ctx.drawImage(this.originalImage, 0, 0, this.elements.canvas.width, this.elements.canvas.height);
            },

            resetFilters() {
                this.elements.inputs.brightness.value = 100;
                this.elements.inputs.contrast.value = 100;
                this.elements.inputs.saturate.value = 100;
                this.elements.inputs.grayscale.value = 0;
                this.elements.inputs.blur.value = 0;
                this.elements.inputs['hue-rotate'].value = 0;

                this.updateFilter('brightness', 100, '%');
                this.updateFilter('contrast', 100, '%');
                this.updateFilter('saturate', 100, '%');
                this.updateFilter('grayscale', 0, '%');
                this.updateFilter('blur', 0, 'px');
                this.updateFilter('hue-rotate', 0, 'deg');
            },

            downloadImage() {
                const link = document.createElement('a');
                link.download = 'filtered-image.png';
                link.href = this.elements.canvas.toDataURL();
                link.click();
            }
        });
    </script>
</body>

</html>
