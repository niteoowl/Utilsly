<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 자르기 - Utilsly</title>
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        .cropper-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        @media (max-width: 1000px) {
            .cropper-layout {
                grid-template-columns: 1fr;
            }
        }

        .viewport {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #image {
            max-width: 100%;
            display: block;
        }

        .sidebar-controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .control-group {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .group-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ratio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tool-btn {
            padding: 10px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .tool-btn:hover {
            background: var(--bg-hover);
        }

        .tool-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .action-footer {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">이미지 자르기</span></div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">crop</span>
                    </div>
                    <h1>이미지 자르기</h1>
                    <p class="description">원하는 비율로 이미지를 정교하게 자르고 회전하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="image-cropper">
                    <!-- Upload -->
                    <div class="drop-zone" id="drop-zone">
                        <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                        <p class="upload-text">편집할 이미지를 업로드하세요</p>
                        <p class="upload-hint">JPG, PNG, WEBP 지원</p>
                        <input type="file" id="file-input" accept="image/*" style="display: none;">
                    </div>

                    <!-- Editor -->
                    <div class="cropper-layout" id="editor-view" style="display: none;">
                        <div class="viewport">
                            <img id="image">
                        </div>

                        <div class="sidebar-controls">
                            <!-- Aspect Ratio -->
                            <div class="control-group">
                                <div class="group-title">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">aspect_ratio</span>
                                    비율 설정
                                </div>
                                <div class="ratio-grid">
                                    <button class="tool-btn active" data-ratio="NaN">자유형</button>
                                    <button class="tool-btn" data-ratio="1">1:1 (Square)</button>
                                    <button class="tool-btn" data-ratio="1.3333333333">4:3</button>
                                    <button class="tool-btn" data-ratio="1.7777777778">16:9</button>
                                </div>
                            </div>

                            <!-- Transforms -->
                            <div class="control-group">
                                <div class="group-title">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">transform</span>
                                    변형
                                </div>
                                <div class="ratio-grid">
                                    <button class="tool-btn" id="rotate-left" title="왼쪽 90도"><span
                                            class="material-symbols-rounded">rotate_left</span></button>
                                    <button class="tool-btn" id="rotate-right" title="오른쪽 90도"><span
                                            class="material-symbols-rounded">rotate_right</span></button>
                                    <button class="tool-btn" id="flip-h" title="좌우 반전"><span
                                            class="material-symbols-rounded">swap_horiz</span></button>
                                    <button class="tool-btn" id="flip-v" title="상하 반전"><span
                                            class="material-symbols-rounded">swap_vert</span></button>
                                </div>
                            </div>

                            <div class="action-footer">
                                <button class="btn btn-primary" id="btn-download" style="height: 48px;">
                                    <span class="material-symbols-rounded" style="margin-right: 8px;">download</span>
                                    자르기 및 저장
                                </button>
                                <button class="btn" onclick="location.reload()">
                                    다시 하기
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        Utilsly.registerTool('image-cropper', {
            cropper: null,
            init() {
                this.elements = {
                    dropZone: document.getElementById('drop-zone'),
                    fileInput: document.getElementById('file-input'),
                    editorView: document.getElementById('editor-view'),
                    image: document.getElementById('image'),
                    btnDownload: document.getElementById('btn-download')
                };

                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.process(e.target.files[0]));
                this.elements.dropZone.addEventListener('drop', (e) => { e.preventDefault(); this.process(e.dataTransfer.files[0]); });
                this.elements.dropZone.addEventListener('dragover', (e) => e.preventDefault());

                document.querySelectorAll('[data-ratio]').forEach(btn => {
                    btn.onclick = () => {
                        document.querySelectorAll('[data-ratio]').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.cropper.setAspectRatio(parseFloat(btn.dataset.ratio));
                    };
                });

                document.getElementById('rotate-left').onclick = () => this.cropper.rotate(-90);
                document.getElementById('rotate-right').onclick = () => this.cropper.rotate(90);
                let scaleX = 1, scaleY = 1;
                document.getElementById('flip-h').onclick = () => this.cropper.scaleX(scaleX *= -1);
                document.getElementById('flip-v').onclick = () => this.cropper.scaleY(scaleY *= -1);

                this.elements.btnDownload.onclick = () => {
                    const canvas = this.cropper.getCroppedCanvas();
                    const link = document.createElement('a');
                    link.download = 'cropped-image.png';
                    link.href = canvas.toDataURL();
                    link.click();
                };
            },

            process(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.elements.dropZone.style.display = 'none';
                    this.elements.editorView.style.display = 'grid';
                    this.elements.image.src = e.target.result;
                    this.cropper = new Cropper(this.elements.image, {
                        viewMode: 2,
                        dragMode: 'move',
                        autoCropArea: 0.8,
                        responsive: true
                    });
                };
                reader.readAsDataURL(file);
            },

            cleanup() {
                if (this.cropper) this.cropper.destroy();
            }
        });
    </script>
</body>

</html>
