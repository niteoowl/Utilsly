<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 자르기 - Utilsly</title>
    <meta name="description" content="이미지를 원하는 비율로 자유롭게 자르세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        .editor-container {
            display: none;
            margin-bottom: 24px;
            max-height: 500px;
        }

        .img-container {
            max-height: 500px;
            background: #f0f0f0;
        }

        img {
            max-width: 100%;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        /* Standard Upload Area */
        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 자르기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">crop</span>
                    </div>
                    <h1>이미지 자르기</h1>
                    <p class="description">이미지를 원하는 영역만큼 잘라내고 저장하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="image-cropper">
                    <button class="btn" id="btn43">4:3</button>
                    <button class="btn" id="btn11">1:1</button>
                    <button class="btn" id="btnFree">자유</button>
                    <button class="btn" id="btnRotate">
                        <span class="material-symbols-rounded">rotate_right</span>
                    </button>
                    <button class="btn" id="btnFlip">
                        <span class="material-symbols-rounded">flip</span>
                    </button>
                </div>
                <div class="img-container">
                    <img id="image" src="" alt="Picture">
                </div>
                <button class="btn btn-primary" id="cropBtn" style="width: 100%; margin-top: 16px;">자르기 및
                    다운로드</button>
            </div>
    </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        Utilsly.registerTool('image-cropper', {
            elements: {},
            cropper: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    editorContainer: document.getElementById('editorContainer'),
                    image: document.getElementById('image'),
                    btn169: document.getElementById('btn169'),
                    btn43: document.getElementById('btn43'),
                    btn11: document.getElementById('btn11'),
                    btnFree: document.getElementById('btnFree'),
                    btnRotate: document.getElementById('btnRotate'),
                    btnFlip: document.getElementById('btnFlip'),
                    cropBtn: document.getElementById('cropBtn')
                };

                this.handleClick = () => this.elements.fileInput.click();
                this.handleChange = (e) => this.handleFile(e);

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleChange);

                // Toolkit listeners
                this.handle169 = () => this.cropper?.setAspectRatio(16 / 9);
                this.handle43 = () => this.cropper?.setAspectRatio(4 / 3);
                this.handle11 = () => this.cropper?.setAspectRatio(1);
                this.handleFree = () => this.cropper?.setAspectRatio(NaN);
                this.handleRotate = () => this.cropper?.rotate(90);
                this.handleFlip = () => this.cropper?.scaleX(-1); // Toggle logic needed? Or just flip once? Original was scaleX(-1) which sets, not toggles.
                // Actually cropperjs scaleX(-1) sets the scale. To toggle we need state. 
                // But original code was `cropper.scaleX(-1)`. 
                // Wait, if scaleX is 1, -1 flips it. If it is -1, -1 does nothing change? 
                // Cropper.js scaleX param IS the scale factor.
                // Let's check if the user intended Toggle. The original code: `cropper.scaleX(-1)`.
                // If I click it twice, it stays flipped?
                // I will implement a simpler toggle if needed, but let's stick to original behavior which is setting -1.
                // Actually, let's make it toggle for better UX if I can, but standard is fine.

                this.handleCrop = () => this.cropImage();

                this.elements.btn169.addEventListener('click', this.handle169);
                this.elements.btn43.addEventListener('click', this.handle43);
                this.elements.btn11.addEventListener('click', this.handle11);
                this.elements.btnFree.addEventListener('click', this.handleFree);
                this.elements.btnRotate.addEventListener('click', this.handleRotate);

                this.isFlipped = false;
                this.handleFlipClick = () => {
                    this.isFlipped = !this.isFlipped;
                    this.cropper?.scaleX(this.isFlipped ? -1 : 1);
                };
                this.elements.btnFlip.addEventListener('click', this.handleFlipClick);

                this.elements.cropBtn.addEventListener('click', this.handleCrop);

                console.log('Image Cropper initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleChange);
                    this.elements.btn169.removeEventListener('click', this.handle169);
                    this.elements.btn43.removeEventListener('click', this.handle43);
                    this.elements.btn11.removeEventListener('click', this.handle11);
                    this.elements.btnFree.removeEventListener('click', this.handleFree);
                    this.elements.btnRotate.removeEventListener('click', this.handleRotate);
                    this.elements.btnFlip.removeEventListener('click', this.handleFlipClick);
                    this.elements.cropBtn.removeEventListener('click', this.handleCrop);
                }
                if (this.cropper) {
                    this.cropper.destroy();
                    this.cropper = null;
                }
                this.elements = {};
                console.log('Image Cropper cleanup done');
            },

            handleFile(e) {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        this.elements.image.src = evt.target.result;
                        this.elements.dropZone.style.display = 'none';
                        this.elements.editorContainer.style.display = 'block';

                        if (this.cropper) this.cropper.destroy();

                        if (typeof Cropper !== 'undefined') {
                            this.cropper = new Cropper(this.elements.image, {
                                viewMode: 1,
                                autoCropArea: 0.8,
                            });
                        } else {
                            console.error("CropperJS not loaded");
                        }
                    };
                    reader.readAsDataURL(file);
                }
            },

            cropImage() {
                if (!this.cropper) return;
                const canvas = this.cropper.getCroppedCanvas();
                const link = document.createElement('a');
                link.download = 'cropped-image.png';
                link.href = canvas.toDataURL();
                link.click();
            }
        });
    </script>
</body>

</html>
