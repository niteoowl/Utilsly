<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OCR 이미지 텍스트 추출 - Utilsly</title>
    <meta name="description" content="이미지에서 텍스트를 추출하세요. 한글, 영어 등 다양한 언어를 지원합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        .ocr-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .ocr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .ocr-panel {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-area.hidden {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
        }

        .preview-container.visible {
            display: block;
        }

        #previewImage {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .lang-select {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .extract-btn {
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .extract-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            text-align: center;
        }

        .progress-section.visible {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--text-primary);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-textarea {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.7;
            resize: vertical;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .ocr-grid {
                grid-template-columns: 1fr;
            }

            .result-textarea {
                min-height: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">OCR 텍스트 추출</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">find_in_page</span>
                    </div>
                    <h1>OCR 이미지 텍스트 추출</h1>
                    <p class="description">이미지 속의 글자를 텍스트로 변환하세요. Ctrl+V로 붙여넣기도 지원합니다.</p>
                </div>

                <div class="tool-container">
                    <div class="ocr-container">
                        <div class="controls-row">
                            <select class="lang-select" id="langSelect">
                                <option value="kor">🇰🇷 한국어</option>
                                <option value="eng">🇺🇸 영어</option>
                                <option value="kor+eng">🇰🇷+🇺🇸 한국어 + 영어</option>
                                <option value="jpn">🇯🇵 일본어</option>
                                <option value="chi_sim">🇨🇳 중국어 (간체)</option>
                            </select>
                            <button class="extract-btn" id="extractBtn">
                                <span class="material-symbols-rounded" style="font-size: 18px;">document_scanner</span>
                                텍스트 추출
                            </button>
                            <button class="btn" id="resetBtn" style="display: none;">
                                <span class="material-symbols-rounded" style="font-size: 16px;">refresh</span>
                                초기화
                            </button>
                        </div>

                        <div class="ocr-grid">
                            <div class="ocr-panel">
                                <div class="panel-title">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">image</span>
                                    이미지
                                </div>

                                <div class="upload-area" id="dropZone">
                                    <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                                    <div class="upload-text">이미지를 드래그하거나 클릭</div>
                                    <div class="upload-hint">JPG, PNG, WEBP • Ctrl+V 붙여넣기</div>
                                    <input type="file" id="fileInput" accept="image/*">
                                </div>

                                <div class="preview-container" id="previewContainer">
                                    <img id="previewImage" src="" alt="Preview">
                                </div>

                                <div class="progress-section" id="progressSection">
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="progressFill"></div>
                                    </div>
                                    <div class="progress-text" id="progressText">준비 중...</div>
                                </div>
                            </div>

                            <div class="ocr-panel">
                                <div class="panel-title">
                                    <span class="material-symbols-rounded" style="font-size: 18px;">article</span>
                                    추출 결과
                                </div>
                                <textarea class="result-textarea" id="resultText"
                                    placeholder="이미지를 업로드하고 '텍스트 추출' 버튼을 클릭하세요..."></textarea>
                                <div class="result-actions">
                                    <button class="btn btn-primary" id="copyBtn">
                                        <span class="material-symbols-rounded"
                                            style="font-size: 16px;">content_copy</span>
                                        복사
                                    </button>
                                    <button class="btn" id="downloadBtn">
                                        <span class="material-symbols-rounded" style="font-size: 16px;">download</span>
                                        저장
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        // Simple non-SPA initialization
        (function () {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const extractBtn = document.getElementById('extractBtn');
            const resetBtn = document.getElementById('resetBtn');
            const progressSection = document.getElementById('progressSection');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const resultText = document.getElementById('resultText');
            const langSelect = document.getElementById('langSelect');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');

            let currentFile = null;

            // File handling
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            // Paste support
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        if (file) handleFile(file);
                        break;
                    }
                }
            });

            function handleFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    alert('이미지 파일만 업로드 가능합니다.');
                    return;
                }
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewContainer.classList.add('visible');
                    dropZone.classList.add('hidden');
                    resetBtn.style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }

            // Reset
            resetBtn.addEventListener('click', () => {
                currentFile = null;
                previewImage.src = '';
                previewContainer.classList.remove('visible');
                dropZone.classList.remove('hidden');
                resetBtn.style.display = 'none';
                fileInput.value = '';
                resultText.value = '';
                progressSection.classList.remove('visible');
            });

            // Extract
            extractBtn.addEventListener('click', async () => {
                if (!currentFile) {
                    alert('이미지를 먼저 선택해주세요.');
                    return;
                }

                extractBtn.disabled = true;
                progressSection.classList.add('visible');
                progressFill.style.width = '0%';
                progressText.textContent = '엔진 로딩 중...';

                const lang = langSelect.value;

                try {
                    const worker = await Tesseract.createWorker({
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const pct = Math.round(m.progress * 100);
                                progressFill.style.width = pct + '%';
                                progressText.textContent = `텍스트 인식 중... ${pct}%`;
                            } else if (m.status === 'loading language traineddata') {
                                progressText.textContent = '언어 데이터 로딩 중...';
                            } else {
                                progressText.textContent = m.status;
                            }
                        }
                    });

                    await worker.loadLanguage(lang);
                    await worker.initialize(lang);
                    const { data: { text } } = await worker.recognize(currentFile);
                    await worker.terminate();

                    resultText.value = text;
                    progressSection.classList.remove('visible');
                } catch (error) {
                    console.error(error);
                    alert('텍스트 추출 중 오류가 발생했습니다.');
                    progressSection.classList.remove('visible');
                } finally {
                    extractBtn.disabled = false;
                }
            });

            // Copy & Download
            copyBtn.addEventListener('click', () => {
                if (!resultText.value) {
                    alert('복사할 텍스트가 없습니다.');
                    return;
                }
                navigator.clipboard.writeText(resultText.value).then(() => {
                    alert('클립보드에 복사되었습니다.');
                });
            });

            downloadBtn.addEventListener('click', () => {
                if (!resultText.value) {
                    alert('저장할 텍스트가 없습니다.');
                    return;
                }
                const blob = new Blob([resultText.value], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ocr-result.txt';
                a.click();
                URL.revokeObjectURL(url);
            });
        })();
    </script>
</body>

</html>
