<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OCR 이미지 텍스트 추출 - Utilsly</title>
    <meta name="description" content="이미지에서 텍스트를 추출하세요. 한글, 영어 등 다양한 언어를 지원합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <!-- Tesseract.js CDN -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        .ocr-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            min-height: 500px;
        }

        .ocr-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-area.has-image {
            padding: 16px;
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        #fileInput {
            display: none;
        }

        #previewImage {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            object-fit: contain;
        }

        .controls-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            padding: 16px;
            background: var(--bg-sidebar);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .lang-select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            min-width: 140px;
        }

        .action-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .action-btn:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
        }

        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-textarea {
            width: 100%;
            flex: 1;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.7;
            resize: none;
            min-height: 400px;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .progress-container {
            padding: 20px;
            background: var(--bg-sidebar);
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-ready {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
        }

        .status-processing {
            background: rgba(33, 150, 243, 0.1);
            color: #2196f3;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-tertiary);
            text-align: center;
            padding: 40px;
        }

        .empty-state .material-symbols-rounded {
            font-size: 48px;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .ocr-layout {
                grid-template-columns: 1fr;
            }

            .result-textarea {
                min-height: 250px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">OCR 텍스트 추출</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">find_in_page</span>
                    </div>
                    <h1>OCR 이미지 텍스트 추출</h1>
                    <p class="description">이미지 속의 글자를 텍스트로 변환하세요. 복사, 붙여넣기(Ctrl+V)도 지원합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="ocr">
                    <div class="controls-bar">
                        <select class="lang-select" id="langSelect">
                            <option value="kor">🇰🇷 한국어</option>
                            <option value="eng">🇺🇸 영어</option>
                            <option value="kor+eng">🇰🇷+🇺🇸 한국어 + 영어</option>
                            <option value="jpn">🇯🇵 일본어</option>
                            <option value="chi_sim">🇨🇳 중국어 (간체)</option>
                            <option value="chi_tra">🇹🇼 중국어 (번체)</option>
                            <option value="deu">🇩🇪 독일어</option>
                            <option value="fra">🇫🇷 프랑스어</option>
                            <option value="spa">🇪🇸 스페인어</option>
                        </select>
                        <button class="action-btn" id="extractBtn">
                            <span class="material-symbols-rounded">document_scanner</span>
                            텍스트 추출
                        </button>
                    </div>

                    <div class="ocr-layout">
                        <!-- Left: Image Upload -->
                        <div class="ocr-panel">
                            <div class="panel-header">
                                <span class="panel-title">
                                    <span class="material-symbols-rounded">image</span>
                                    이미지
                                </span>
                                <button class="btn" id="resetBtn" style="display: none;">
                                    <span class="material-symbols-rounded" style="font-size: 16px;">refresh</span>
                                    초기화
                                </button>
                            </div>

                            <div class="upload-area" id="dropZone">
                                <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                                <div class="upload-text">이미지를 드래그하거나 클릭</div>
                                <div class="upload-hint">JPG, PNG, WEBP • 붙여넣기(Ctrl+V) 지원</div>
                                <input type="file" id="fileInput" accept="image/*">
                            </div>

                            <img id="previewImage" src="" alt="Preview" style="display: none;">

                            <div class="progress-container" id="progressContainer">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                                <div class="progress-text" id="progressText">준비 중...</div>
                            </div>
                        </div>

                        <!-- Right: Result -->
                        <div class="ocr-panel result-panel">
                            <div class="panel-header">
                                <span class="panel-title">
                                    <span class="material-symbols-rounded">article</span>
                                    추출 결과
                                </span>
                                <span class="status-badge status-ready" id="statusBadge">
                                    <span class="material-symbols-rounded" style="font-size: 14px;">check_circle</span>
                                    대기중
                                </span>
                            </div>

                            <div class="empty-state" id="emptyState">
                                <span class="material-symbols-rounded">text_snippet</span>
                                <div>이미지를 업로드하고<br>"텍스트 추출" 버튼을 클릭하세요</div>
                            </div>

                            <textarea class="result-textarea" id="resultText" placeholder="추출된 텍스트가 여기에 표시됩니다..."
                                style="display: none;"></textarea>

                            <div class="result-actions" id="resultActions" style="display: none;">
                                <button class="btn btn-primary" id="copyBtn">
                                    <span class="material-symbols-rounded" style="font-size: 16px;">content_copy</span>
                                    복사
                                </button>
                                <button class="btn" id="downloadBtn">
                                    <span class="material-symbols-rounded" style="font-size: 16px;">download</span>
                                    TXT 저장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('ocr', {
            elements: {},
            currentFile: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewImage: document.getElementById('previewImage'),
                    extractBtn: document.getElementById('extractBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    progressContainer: document.getElementById('progressContainer'),
                    progressFill: document.getElementById('progressFill'),
                    progressText: document.getElementById('progressText'),
                    resultText: document.getElementById('resultText'),
                    resultActions: document.getElementById('resultActions'),
                    emptyState: document.getElementById('emptyState'),
                    statusBadge: document.getElementById('statusBadge'),
                    langSelect: document.getElementById('langSelect'),
                    copyBtn: document.getElementById('copyBtn'),
                    downloadBtn: document.getElementById('downloadBtn')
                };

                // Bind handlers
                this.handleClick = () => this.elements.fileInput.click();
                this.handleFileChange = (e) => this.handleFile(e.target.files[0]);
                this.handleDragOver = (e) => { e.preventDefault(); this.elements.dropZone.classList.add('dragover'); };
                this.handleDragLeave = () => this.elements.dropZone.classList.remove('dragover');
                this.handleDrop = (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                    if (e.dataTransfer.files.length) this.handleFile(e.dataTransfer.files[0]);
                };
                this.handlePaste = (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;
                    for (const item of items) {
                        if (item.type.startsWith('image/')) {
                            const file = item.getAsFile();
                            if (file) this.handleFile(file);
                            break;
                        }
                    }
                };
                this.handleExtract = () => this.extractText();
                this.handleReset = () => this.reset();
                this.handleCopy = () => this.copyResult();
                this.handleDownload = () => this.downloadResult();

                // Attach listeners
                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.dropZone.addEventListener('dragover', this.handleDragOver);
                this.elements.dropZone.addEventListener('dragleave', this.handleDragLeave);
                this.elements.dropZone.addEventListener('drop', this.handleDrop);
                this.elements.fileInput.addEventListener('change', this.handleFileChange);
                this.elements.extractBtn.addEventListener('click', this.handleExtract);
                this.elements.resetBtn.addEventListener('click', this.handleReset);
                this.elements.copyBtn.addEventListener('click', this.handleCopy);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);
                document.addEventListener('paste', this.handlePaste);

                console.log('OCR tool initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.dropZone.removeEventListener('dragover', this.handleDragOver);
                    this.elements.dropZone.removeEventListener('dragleave', this.handleDragLeave);
                    this.elements.dropZone.removeEventListener('drop', this.handleDrop);
                }
                this.elements.fileInput?.removeEventListener('change', this.handleFileChange);
                this.elements.extractBtn?.removeEventListener('click', this.handleExtract);
                this.elements.resetBtn?.removeEventListener('click', this.handleReset);
                this.elements.copyBtn?.removeEventListener('click', this.handleCopy);
                this.elements.downloadBtn?.removeEventListener('click', this.handleDownload);
                document.removeEventListener('paste', this.handlePaste);
                this.elements = {};
                this.currentFile = null;
                console.log('OCR tool cleanup done');
            },

            handleFile(file) {
                if (!file || !file.type.startsWith('image/')) {
                    Utilsly.showAlert('이미지 파일만 업로드 가능합니다.');
                    return;
                }

                this.currentFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.elements.previewImage.src = e.target.result;
                    this.elements.previewImage.style.display = 'block';
                    this.elements.dropZone.style.display = 'none';
                    this.elements.resetBtn.style.display = 'flex';
                };
                reader.readAsDataURL(file);
            },

            async extractText() {
                if (!this.currentFile) {
                    Utilsly.showAlert('이미지를 먼저 선택해주세요.');
                    return;
                }

                // UI setup
                this.elements.extractBtn.disabled = true;
                this.elements.progressContainer.style.display = 'block';
                this.elements.emptyState.style.display = 'none';
                this.elements.resultText.style.display = 'none';
                this.elements.resultActions.style.display = 'none';
                this.elements.progressFill.style.width = '0%';
                this.updateStatus('processing', '처리중');

                const lang = this.elements.langSelect.value;

                try {
                    const worker = await Tesseract.createWorker({
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const pct = Math.round(m.progress * 100);
                                this.elements.progressFill.style.width = pct + '%';
                                this.elements.progressText.textContent = `텍스트 인식 중... ${pct}%`;
                            } else {
                                this.elements.progressText.textContent = this.getStatusText(m.status);
                            }
                        }
                    });

                    await worker.loadLanguage(lang);
                    await worker.initialize(lang);

                    const { data: { text } } = await worker.recognize(this.currentFile);

                    await worker.terminate();

                    this.elements.resultText.value = text;
                    this.elements.resultText.style.display = 'block';
                    this.elements.resultActions.style.display = 'flex';
                    this.updateStatus('ready', '완료');

                } catch (error) {
                    console.error(error);
                    Utilsly.showAlert('텍스트 추출 중 오류가 발생했습니다.');
                    this.updateStatus('ready', '오류');
                } finally {
                    this.elements.extractBtn.disabled = false;
                    this.elements.progressContainer.style.display = 'none';
                }
            },

            getStatusText(status) {
                const map = {
                    'loading tesseract core': '엔진 로딩 중...',
                    'initializing tesseract': '초기화 중...',
                    'loading language traineddata': '언어 데이터 로딩 중...',
                    'initializing api': 'API 초기화 중...',
                    'recognizing text': '텍스트 인식 중...'
                };
                return map[status] || status;
            },

            updateStatus(type, text) {
                const badge = this.elements.statusBadge;
                badge.className = `status-badge status-${type}`;
                badge.innerHTML = `<span class="material-symbols-rounded" style="font-size: 14px;">${type === 'processing' ? 'pending' : 'check_circle'}</span> ${text}`;
            },

            reset() {
                this.currentFile = null;
                this.elements.previewImage.src = '';
                this.elements.previewImage.style.display = 'none';
                this.elements.dropZone.style.display = 'flex';
                this.elements.resetBtn.style.display = 'none';
                this.elements.fileInput.value = '';
                this.elements.resultText.style.display = 'none';
                this.elements.resultText.value = '';
                this.elements.resultActions.style.display = 'none';
                this.elements.emptyState.style.display = 'flex';
                this.updateStatus('ready', '대기중');
            },

            copyResult() {
                this.elements.resultText.select();
                document.execCommand('copy');
                Utilsly.showAlert('클립보드에 복사되었습니다.');
            },

            downloadResult() {
                const blob = new Blob([this.elements.resultText.value], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ocr-result.txt';
                a.click();
                URL.revokeObjectURL(url);
            }
        });
    </script>
</body>

</html>
