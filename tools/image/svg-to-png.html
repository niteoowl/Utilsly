<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SVG PNG 변환 - Utilsly</title>
    <meta name="description" content="SVG 벡터 이미지를 고화질 PNG 래스터 이미지로 변환하세요. 크기 조절이 가능합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .file-list {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .file-item {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            position: relative;
        }

        .file-preview {
            width: 100%;
            height: 100px;
            object-fit: contain;
            /* SVG usually contain */
            border-radius: 4px;
            margin-bottom: 8px;
            background: #fff;
            /* White bg for SVG preview visibility */
        }

        .file-name {
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            /* Added border for better SVG visibility */
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0ibm9uZSI+PHBhdGggZD0iTTAgMGgyMHYyMEgwVjB6IiBmaWxsPSIjZmZmIi8+PHBhdGggZD0iTTAgMGgxMHYxMEgwVjB6bTEwIDEwaDEwdjEwSDEwVjEweiIgZmlsbD0iI2VlZSIvPjwvc3ZnPg==');
            /* Checkerboard pattern */
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">image</span>
                    </div>
                    <h1>SVG PNG 변환</h1>
                    <p class="description">벡터 SVG 파일을 PNG 이미지로 변환하세요. 스케일(해상도)을 조절할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="svg-to-png">
                    <div class="upload-area" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                        <p class="upload-text">SVG 파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">SVG 파일 지원</p>
                        <input type="file" id="fileInput" accept=".svg,image/svg+xml" multiple style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <div class="file-list" id="fileList"></div>

                        <div class="controls">
                            <div class="control-group">
                                <label>스케일 (해상도 배율)</label>
                                <input type="number" id="scaleInput" value="1" min="0.1" max="10" step="0.1"
                                    class="form-input">
                                <p class="help-text"
                                    style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">지정된 배율로 이미지를
                                    확대/축소하여 저장합니다.</p>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                전체 다운로드 (ZIP)
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                초기화
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('svg-to-png', {
            elements: {},
            files: [],

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewContainer: document.getElementById('previewContainer'),
                    fileList: document.getElementById('fileList'),
                    scaleInput: document.getElementById('scaleInput'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn')
                };
                this.bindEvents();
                console.log('SVG to PNG Converter (Batch) initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFiles(Array.from(e.target.files)));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFiles(Array.from(e.dataTransfer.files));
                    });
                });

                this.elements.downloadBtn.addEventListener('click', () => this.batchConvertAndDownload());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            const link = document.createElement('a');
            link.download = `converted-svg.png`;
            link.href = dataUrl;
            link.click();
        },

            reset() {
            this.originalImage = null;
            this.elements.preview.src = '';
            this.elements.fileInput.value = '';
            this.elements.previewContainer.style.display = 'none';
            this.elements.dropZone.style.display = 'block';
            this.elements.scaleInput.value = 1;
            this.elements.scaleValue.textContent = '1';
        }
        });
    </script>
</body>

</html>
