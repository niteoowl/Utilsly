<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SVG PNG 변환 - Utilsly</title>
    <meta name="description" content="SVG 벡터 이미지를 고화질 PNG 래스터 이미지로 변환하세요. 크기 조절이 가능합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            /* Added border for better SVG visibility */
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0ibm9uZSI+PHBhdGggZD0iTTAgMGgyMHYyMEgwVjB6IiBmaWxsPSIjZmZmIi8+PHBhdGggZD0iTTAgMGgxMHYxMEgwVjB6bTEwIDEwaDEwdjEwSDEwVjEweiIgZmlsbD0iI2VlZSIvPjwvc3ZnPg==');
            /* Checkerboard pattern */
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">polyline</span>
                    </div>
                    <h1>SVG PNG 변환</h1>
                    <p class="description">SVG 벡터 파일을 원하는 해상도의 PNG로 변환하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="svg-to-png">
                    <div class="upload-area" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                        <p class="upload-text">SVG 파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">SVG 파일 지원</p>
                        <input type="file" id="fileInput" accept=".svg, image/svg+xml" style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <img id="preview" class="preview-image" alt="Preview">

                        <div class="controls">
                            <div class="control-group">
                                <label>스케일 (배율)</label>
                                <input type="number" id="scaleInput" min="0.1" max="10" step="0.1" value="1">
                                <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                    기본 크기의 <span id="scaleValue">1</span>배로 변환
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                PNG로 다운로드
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                다른 이미지
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('svg-to-png', {
            elements: {},
            originalImage: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    preview: document.getElementById('preview'),
                    previewContainer: document.getElementById('previewContainer'),
                    scaleInput: document.getElementById('scaleInput'),
                    scaleValue: document.getElementById('scaleValue'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn')
                };
                this.bindEvents();
                console.log('SVG to PNG Converter initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFile(e.dataTransfer.files[0]);
                    });
                });

                this.elements.scaleInput.addEventListener('input', (e) => {
                    this.elements.scaleValue.textContent = e.target.value;
                });

                this.elements.downloadBtn.addEventListener('click', () => this.convertAndDownload());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            handleFile(file) {
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.originalImage = new Image();
                    this.originalImage.onload = () => {
                        this.elements.preview.src = this.originalImage.src;
                        this.elements.previewContainer.style.display = 'block';
                        this.elements.dropZone.style.display = 'none';
                    };
                    this.originalImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            convertAndDownload() {
                if (!this.originalImage) return;

                const scale = parseFloat(this.elements.scaleInput.value);
                const canvas = document.createElement('canvas');

                // SVG dimensions might be unitless or intricate, but the Image object will try to guess or use viewBox.
                // We multiply by scale.

                let width = this.originalImage.width;
                let height = this.originalImage.height;

                // Fallback for SVG if width/height are 0 (sometimes happens with raw svgs without explicit size)
                if (width === 0 || height === 0) {
                    width = 300; height = 150; // Default fallback
                    // In real app we might parse SVG to find viewBox. 
                    // But usually browser layout engine handles img.src = svg well enough.
                }

                canvas.width = width * scale;
                canvas.height = height * scale;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(this.originalImage, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/png');

                const link = document.createElement('a');
                link.download = `converted-svg.png`;
                link.href = dataUrl;
                link.click();
            },

            reset() {
                this.originalImage = null;
                this.elements.preview.src = '';
                this.elements.fileInput.value = '';
                this.elements.previewContainer.style.display = 'none';
                this.elements.dropZone.style.display = 'block';
                this.elements.scaleInput.value = 1;
                this.elements.scaleValue.textContent = '1';
            }
        });
    </script>
</body>

</html>
