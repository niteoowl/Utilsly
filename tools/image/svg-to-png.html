<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SVG PNG 변환 - Utilsly</title>
    <meta name="description" content="SVG 벡터 이미지를 고화질 PNG 래스터 이미지로 변환하세요. 크기 조절이 가능합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .file-list {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .file-item {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            position: relative;
        }

        .file-preview {
            width: 100%;
            height: 100px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
            background: #fff;
        }

        .file-name {
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">image</span>
                    </div>
                    <h1>SVG PNG 변환</h1>
                    <p class="description">벡터 SVG 파일을 PNG 이미지로 변환하세요. 스케일(해상도)을 조절할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="svg-to-png">
                    <div class="drop-zone" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">SVG 파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">SVG 파일 지원 • Ctrl+V 붙여넣기</p>
                        <input type="file" id="fileInput" accept=".svg,image/svg+xml" multiple style="display: none;">
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <div class="file-list" id="fileList"></div>

                        <div class="controls">
                            <div class="control-group">
                                <label>스케일 (해상도 배율)</label>
                                <input type="number" id="scaleInput" value="1" min="0.1" max="10" step="0.1"
                                    class="form-input">
                                <p class="help-text"
                                    style="font-size: 12px; color: var(--text-tertiary); margin-top: 4px;">지정된 배율로 이미지를
                                    확대/축소하여 저장합니다.</p>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                전체 다운로드 (ZIP)
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                초기화
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('svg-to-png', {
            elements: {},
            files: [],
            pasteHandler: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewContainer: document.getElementById('previewContainer'),
                    fileList: document.getElementById('fileList'),
                    scaleInput: document.getElementById('scaleInput'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn')
                };
                this.bindEvents();
                console.log('SVG to PNG Converter (Batch) initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFiles(Array.from(e.target.files)));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFiles(Array.from(e.dataTransfer.files));
                    });
                });

                // Paste Handler
                this.pasteHandler = (e) => {
                    const items = e.clipboardData.items;
                    const files = [];
                    for (let i = 0; i < items.length; i++) {
                        // SVG might be text/plain or image/svg+xml. 
                        // But mostly user copies SVG text. Handling SVG text paste?
                        // If user copies 'image' from another place, browsers often give PNG representation.
                        // If we want to support pasting SVG code, we need to check text/plain and parse?
                        // For now, let's just support file-like operations if browser supports it.
                        if (items[i].type.indexOf('image') !== -1 || items[i].type === 'text/plain') {
                            const file = items[i].getAsFile();
                            if (file) files.push(file);
                        }
                    }
                    if (files.length > 0) {
                        // Filter for svg?
                        const svgs = files.filter(f => f.type === 'image/svg+xml' || f.name.endsWith('.svg'));
                        if (svgs.length > 0) {
                            e.preventDefault();
                            this.handleFiles(svgs);
                        }
                    }
                };
                document.addEventListener('paste', this.pasteHandler);

                this.elements.downloadBtn.addEventListener('click', () => this.batchConvertAndDownload());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            handleFiles(files) {
                if (!files || files.length === 0) return;
                this.files = files;
                this.renderFileList();
                this.elements.dropZone.style.display = 'none';
                this.elements.previewContainer.style.display = 'block';

                if (this.files.length > 1) {
                    this.elements.downloadBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px; margin-right: 8px;">download</span>전체 다운로드 (ZIP)`;
                } else {
                    this.elements.downloadBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px; margin-right: 8px;">download</span>PNG로 다운로드`;
                }
            },

            renderFileList() {
                this.elements.fileList.innerHTML = '';
                this.files.forEach((file, index) => {
                    const reader = new FileReader();
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `
                        <div class="file-img-wrapper" id="img-wrapper-${index}" style="height: 100px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 4px; margin-bottom: 8px;">
                            <span class="material-symbols-rounded" style="color:#aaa;">image</span>
                        </div>
                        <div class="file-name">${file.name}</div>
                    `;
                    this.elements.fileList.appendChild(div);
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'file-preview';
                        div.querySelector('.file-img-wrapper').replaceWith(img);
                    };
                    reader.readAsDataURL(file);
                });
            },

            async batchConvertAndDownload() {
                if (!this.files.length) return;

                const scale = parseFloat(this.elements.scaleInput.value) || 1;
                const btn = this.elements.downloadBtn;
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerText = "변환 중...";

                try {
                    if (this.files.length === 1) {
                        const blob = await this.convertFile(this.files[0], scale);
                        saveAs(blob, this.files[0].name.replace(/\.[^/.]+$/, "") + ".png");
                    } else {
                        const zip = new JSZip();
                        const promises = this.files.map(async (file) => {
                            const blob = await this.convertFile(file, scale);
                            zip.file(file.name.replace(/\.[^/.]+$/, "") + ".png", blob);
                        });
                        await Promise.all(promises);
                        const content = await zip.generateAsync({ type: "blob" });
                        saveAs(content, "converted_images.zip");
                    }
                } catch (e) {
                    console.error(e);
                    alert("변환 중 오류가 발생했습니다.");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            },

            convertFile(file, scale) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const url = URL.createObjectURL(file);

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        URL.revokeObjectURL(url);
                        canvas.toBlob((blob) => resolve(blob), 'image/png');
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error("Image load error"));
                    };
                    img.src = url;
                });
            },

            reset() {
                this.files = [];
                this.elements.fileList.innerHTML = '';
                this.elements.fileInput.value = '';
                this.elements.previewContainer.style.display = 'none';
                this.elements.dropZone.style.display = 'block';
                this.elements.scaleInput.value = 1;
            },

            cleanup() {
                if (this.pasteHandler) {
                    document.removeEventListener('paste', this.pasteHandler);
                    this.pasteHandler = null;
                }
            }
        });
    </script>
</body>

</html>
