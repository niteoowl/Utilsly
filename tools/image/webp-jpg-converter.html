<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WebP JPG 변환기 - Utilsly</title>
    <meta name="description" content="WebP를 JPG로 무료 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">WebP → JPG 변환</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">transform</span></div>
                    <h1>WebP → JPG 변환기</h1>
                    <p class="description">WebP 이미지를 JPG로 무료 변환하세요.</p>
                </div>
                <div class="tool-container">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                        <p style="margin-top: 16px;">WebP 이미지를 업로드하세요</p>
                        <input type="file" id="fileInput" accept="image/webp" style="display: none;">
                    </div>
                    <div id="previewArea" style="display: none; text-align: center; margin-bottom: 24px;">
                        <img id="preview" style="max-width: 100%; max-height: 400px; border-radius: 8px;">
                    </div>
                    <div id="controls" style="display: none;">
                        <div style="margin-bottom: 16px;">
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">JPG 품질 (<span
                                    id="qualityValue">90</span>%)</label>
                            <input type="range" id="quality" min="1" max="100" value="90" style="width: 100%;">
                        </div>
                        <button class="btn btn-primary" onclick="convert()" style="width: 100%;">JPG로 변환 및 다운로드</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const preview = document.getElementById('preview');
        const controls = document.getElementById('controls');
        const quality = document.getElementById('quality');
        const qualityValue = document.getElementById('qualityValue');

        let currentImage = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);
        quality.addEventListener('input', () => qualityValue.textContent = quality.value);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = new Image();
                currentImage.onload = () => {
                    preview.src = e.target.result;
                    dropZone.style.display = 'none';
                    previewArea.style.display = 'block';
                    controls.style.display = 'block';
                };
                currentImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convert() {
            if (!currentImage) return;

            const canvas = document.createElement('canvas');
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            const ctx = canvas.getContext('2d');

            // White background for JPG
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);

            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'converted.jpg';
                link.click();
                URL.revokeObjectURL(url);
            }, 'image/jpeg', quality.value / 100);
        }
    </script>
</body>

</html>
