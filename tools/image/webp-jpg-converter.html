<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>WebP JPG 변환기 - Utilsly</title>
    <meta name="description" content="WebP를 JPG로 무료 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">WebP → JPG 변환</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">transform</span></div>
                    <h1>WebP → JPG 변환기</h1>
                    <p class="description">WebP 이미지를 JPG로 무료 변환하세요.</p>
                </div>
                <div class="tool-container" data-tool-id="webp-jpg-converter">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                        <p style="margin-top: 16px;">WebP 이미지를 업로드하세요</p>
                        <input type="file" id="fileInput" accept="image/webp" style="display: none;">
                    </div>
                    <div id="previewArea" style="display: none; text-align: center; margin-bottom: 24px;">
                        <img id="preview" style="max-width: 100%; max-height: 400px; border-radius: 8px;">
                    </div>
                    <div id="controls" style="display: none;">
                        <div style="margin-bottom: 16px;">
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">JPG 품질 (<span
                                    id="qualityValue">90</span>%)</label>
                            <input type="range" id="quality" min="1" max="100" value="90" style="width: 100%;">
                        </div>
                        <button class="btn btn-primary" id="convertBtn" style="width: 100%;">JPG로 변환 및 다운로드</button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">움직이는 WebP도 변환되나요?</div>
                            <div class="faq-answer">현재 버전에서는 정지 이미지만 지원하며, 애니메이션 WebP의 경우 첫 번째 프레임만 JPG로 변환됩니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">변환 속도는 빠른가요?</div>
                            <div class="faq-answer">모든 과정이 서버 전송 없이 브라우저 내에서 즉시 처리되므로 매우 빠르고 보안상 안전합니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('webp-jpg-converter', {
            currentImage: null,
            elements: {},

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewArea: document.getElementById('previewArea'),
                    preview: document.getElementById('preview'),
                    controls: document.getElementById('controls'),
                    quality: document.getElementById('quality'),
                    qualityValue: document.getElementById('qualityValue'),
                    convertBtn: document.getElementById('convertBtn')
                };

                this.handleFile = this.handleFile.bind(this);
                this.handleDropZoneClick = () => this.elements.fileInput.click();
                this.handleQualityInput = () => this.elements.qualityValue.textContent = this.elements.quality.value;
                this.handleConvert = this.convert.bind(this);

                this.elements.dropZone.addEventListener('click', this.handleDropZoneClick);
                this.elements.fileInput.addEventListener('change', this.handleFile);
                this.elements.quality.addEventListener('input', this.handleQualityInput);
                this.elements.convertBtn.addEventListener('click', this.handleConvert);

                console.log('WebP Converter initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleDropZoneClick);
                    this.elements.fileInput.removeEventListener('change', this.handleFile);
                    this.elements.quality.removeEventListener('input', this.handleQualityInput);
                    this.elements.convertBtn.removeEventListener('click', this.handleConvert);
                }
                this.currentImage = null;
                this.elements = {};
                console.log('WebP Converter cleanup done');
            },

            handleFile(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    this.currentImage = new Image();
                    this.currentImage.onload = () => {
                        this.elements.preview.src = e.target.result;
                        this.elements.dropZone.style.display = 'none';
                        this.elements.previewArea.style.display = 'block';
                        this.elements.controls.style.display = 'block';
                    };
                    this.currentImage.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            convert() {
                if (!this.currentImage) return;

                const canvas = document.createElement('canvas');
                canvas.width = this.currentImage.width;
                canvas.height = this.currentImage.height;
                const ctx = canvas.getContext('2d');

                // White background for JPG
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(this.currentImage, 0, 0);

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'converted.jpg';
                    link.click();
                    URL.revokeObjectURL(url);
                }, 'image/jpeg', this.elements.quality.value / 100);
            }
        });
    </script>
</body>

</html>
