<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>파비콘 생성기 - Utilsly</title>
    <meta name="description" content="이미지를 업로드하여 웹사이트에 필요한 모든 사이즈의 파비콘(favicon.ico)을 한 번에 생성해 보세요.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            margin-bottom: 32px;
        }

        .drop-zone:hover {
            border-color: var(--accent-blue);
            background: rgba(var(--accent-rgb), 0.05);
        }

        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-end;
            margin-top: 32px;
        }

        .preview-item {
            text-align: center;
        }

        .preview-box {
            background: var(--bg-secondary);
            margin-bottom: 12px;
            margin-inline: auto;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">파비콘 생성기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">select_window</span>
                    </div>
                    <h1>파비콘 생성기</h1>
                    <p class="description">한 장의 이미지로 다양한 크기의 파비콘 세트(ICO, PNG)를 자동 생성합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="favicon-generator">
                    <div class="drop-zone" id="dropZone">
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary); margin-bottom: 16px;">add_photo_alternate</span>
                        <div
                            style="font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;">
                            파비콘으로 만들 이미지를 선택하세요</div>
                        <div style="font-size: 14px; color: var(--text-tertiary);">정사각형(1:1 비율) 설정의 이미지를 권장합니다.</div>
                    </div>

                    <p id="fileName"
                        style="font-weight: 600; color: var(--accent-blue); text-align: center; margin-top: -12px; margin-bottom: 32px;">
                    </p>

                    <div id="previewSection"
                        style="display: none; border-top: 1px solid var(--border-color); padding-top: 40px;">
                        <h3 style="font-size: 1.25rem; margin-bottom: 24px; font-weight: 700;">추출 사이즈 미리보기</h3>
                        <div class="preview-grid">
                            <div class="preview-item">
                                <div class="preview-box" style="width: 16px; height: 16px;">
                                    <img id="p16" style="width: 100%; height: 100%;">
                                </div>
                                <span style="font-size: 12px; color: var(--text-tertiary);">16x16</span>
                            </div>
                            <div class="preview-item">
                                <div class="preview-box" style="width: 32px; height: 32px;">
                                    <img id="p32" style="width: 100%; height: 100%;">
                                </div>
                                <span style="font-size: 12px; color: var(--text-tertiary);">32x32</span>
                            </div>
                            <div class="preview-item">
                                <div class="preview-box" style="width: 64px; height: 64px;">
                                    <img id="p64" style="width: 100%; height: 100%;">
                                </div>
                                <span style="font-size: 12px; color: var(--text-tertiary);">64x64</span>
                            </div>
                            <div class="preview-item">
                                <div class="preview-box" style="width: 120px; height: 120px;">
                                    <img id="p180" style="width: 100%; height: 100%;">
                                </div>
                                <span style="font-size: 12px; color: var(--text-tertiary);">Apple Touch (180x180)</span>
                            </div>
                        </div>

                        <button id="downloadBtn" class="btn btn-primary"
                            style="width: 100%; margin-top: 48px; padding: 16px; font-weight: 700; font-size: 1.125rem;">파비콘
                            패키지 다운로드 (.ZIP)</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        var FaviconGeneratorTool = {
            sizes: [16, 32, 48, 64, 128, 180, 192, 512],
            originalImage: null,

            init() {
                this.dropZone = document.getElementById('dropZone');
                this.fileInput = document.getElementById('fileInput');
                this.fileNameDisplay = document.getElementById('fileName');
                this.previewSection = document.getElementById('previewSection');
                this.downloadBtn = document.getElementById('downloadBtn');

                if (!this.dropZone) return;

                const newFileInput = this.fileInput.cloneNode(true);
                this.fileInput.parentNode.replaceChild(newFileInput, this.fileInput);
                this.fileInput = newFileInput;

                const newBtn = this.downloadBtn.cloneNode(true);
                this.downloadBtn.parentNode.replaceChild(newBtn, this.downloadBtn);
                this.downloadBtn = newBtn;

                this.dropZone.onclick = () => this.fileInput.click();
                this.fileInput.onchange = (e) => this.handleFile(e.target.files[0]);
                this.downloadBtn.onclick = () => this.generateZip();

                this.dropZone.ondragover = (e) => {
                    e.preventDefault();
                    this.dropZone.style.borderColor = 'var(--accent-color)';
                    this.dropZone.style.background = 'rgba(var(--accent-rgb), 0.05)';
                };

                this.dropZone.ondragleave = () => {
                    this.dropZone.style.borderColor = 'var(--border-color)';
                    this.dropZone.style.background = 'transparent';
                };

                this.dropZone.ondrop = (e) => {
                    e.preventDefault();
                    this.handleFile(e.dataTransfer.files[0]);
                };
            },

            async handleFile(file) {
                if (!file) return;
                this.originalImage = file;
                this.fileNameDisplay.textContent = file.name;

                const url = URL.createObjectURL(file);
                ['p16', 'p32', 'p64', 'p180'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.src = url;
                });

                this.previewSection.style.display = 'block';
            },

            async generateZip() {
                if (!this.originalImage) return;

                const zip = new JSZip();
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();

                img.onload = async () => {
                    for (const size of this.sizes) {
                        canvas.width = size;
                        canvas.height = size;
                        ctx.clearRect(0, 0, size, size);
                        // Center and crop to square
                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

                        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                        zip.file(`favicon-${size}x${size}.png`, blob);
                    }

                    // Create ico (simplified as the largest size renamed for this tool)
                    const icoBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    zip.file('favicon.ico', icoBlob);

                    const content = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(content);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'favicons_utilsly.zip';
                    link.click();

                    Utilsly.showAlert('파비콘 패키지가 생성되었습니다!');
                };

                img.src = URL.createObjectURL(this.originalImage);
            }
        };

        Utilsly.registerTool('favicon-generator', FaviconGeneratorTool);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (!window.FaviconGeneratorToolInitialized) {
                FaviconGeneratorTool.init();
                window.FaviconGeneratorToolInitialized = true;
            }
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                FaviconGeneratorTool.init();
                window.FaviconGeneratorToolInitialized = true;
            });
        }
    </script>
</body>

</html>
