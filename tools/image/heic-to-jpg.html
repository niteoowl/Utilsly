<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HEIC JPG 변환 - Utilsly</title>
    <meta name="description" content="HEIC 사진을 범용적인 JPG 포맷으로 변환하세요. 아이폰 사진 변환에 최적화되어 있습니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .file-list {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .file-item {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            position: relative;
        }

        .file-preview {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .file-name {
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">image</span>
                    </div>
                    <h1>HEIC JPG 변환</h1>
                    <p class="description">iPhone/iPad의 HEIC 이미지를 넓리 쓰이는 JPG로 변환하세요. 여러 파일을 한번에 처리할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="heic-to-jpg">
                    <div class="drop-zone" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">HEIC 이미지를 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">HEIC 파일 지원</p>
                        <input type="file" id="fileInput" accept=".heic,.HEIC" multiple style="display: none;">
                    </div>

                    <div id="loading" style="display: none; text-align: center; margin: 40px 0;">
                        <div class="spinner"></div>
                        <p>변환 준비 중...</p>
                    </div>

                    <div class="preview-container" id="previewContainer">
                        <div class="file-list" id="fileList"></div>

                        <div class="controls">
                            <div class="control-group">
                                <label>품질 (0.1 ~ 1.0)</label>
                                <input type="range" id="qualityInput" min="0.1" max="1.0" step="0.1" value="0.9">
                                <div
                                    style="text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                    값: <span id="qualityValue">0.9</span>
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                전체 다운로드 (ZIP)
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                초기화
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('heic-to-jpg', {
            elements: {},
            files: [],
            pasteHandler: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewContainer: document.getElementById('previewContainer'),
                    fileList: document.getElementById('fileList'),
                    qualityInput: document.getElementById('qualityInput'),
                    qualityValue: document.getElementById('qualityValue'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    loading: document.getElementById('loading')
                };
                this.bindEvents();
                console.log('HEIC to JPG Converter (Batch) initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFiles(Array.from(e.target.files)));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFiles(Array.from(e.dataTransfer.files));
                    });
                });

                // Robust Paste Handler (Only checks for images, user might try to paste HEIC? Browser paste usually gives PNG/JPG representation of clipboard. 
                // Handling actual HEIC binary from clipboard is rare. 
                // We'll stick to image/* check which usually works for what users copy.)
                this.pasteHandler = (e) => {
                    const items = e.clipboardData.items;
                    const files = [];
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.startsWith('image/')) {
                            const file = items[i].getAsFile();
                            if (file) files.push(file);
                        }
                    }
                    if (files.length > 0) {
                        e.preventDefault();
                        this.handleFiles(files);
                    }
                };
                document.addEventListener('paste', this.pasteHandler);

                this.elements.qualityInput.addEventListener('input', (e) => {
                    this.elements.qualityValue.textContent = e.target.value;
                });

                this.elements.downloadBtn.addEventListener('click', () => this.batchConvertAndDownload());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            async handleFiles(files) {
                if (!files || files.length === 0) return;
                this.files = files;
                this.elements.dropZone.style.display = 'none';
                this.elements.loading.style.display = 'block';
                this.renderFileListInitial(); // Show placeholders first

                // Show file list UI immediately
                this.elements.loading.style.display = 'none';
                this.elements.previewContainer.style.display = 'block';

                this.generatePreviews();

                if (this.files.length > 1) {
                    this.elements.downloadBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px; margin-right: 8px;">download</span>전체 다운로드 (ZIP)`;
                } else {
                    this.elements.downloadBtn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px; margin-right: 8px;">download</span>JPG로 다운로드`;
                }
            },

            renderFileListInitial() {
                this.elements.fileList.innerHTML = '';
                this.files.forEach((file, index) => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.id = `file-item-${index}`;
                    div.innerHTML = `
                        <div class="file-img-wrapper" style="height: 100px; display: flex; align-items: center; justify-content: center; background: #eee; border-radius: 4px; margin-bottom: 8px;">
                            <div class="spinner" style="width: 20px; height: 20px; border-width: 2px; margin: 0;"></div>
                        </div>
                        <div class="file-name">${file.name}</div>
                    `;
                    this.elements.fileList.appendChild(div);
                });
            },

            async generatePreviews() {
                for (let i = 0; i < this.files.length; i++) {
                    try {
                        const file = this.files[i];
                        // If pasted from clipboard (blob), it might not be HEIC but PNG. handleFiles checks? 
                        // Actually paste events give PNG usually. heic2any converts HEIC. 
                        // If file is not HEIC, we should just read it or skip heic2any.
                        // But tool is specifically HEIC->JPG. If user pastes PNG, we can convert it to JPG anyway.
                        // Let's rely on heic2any or just checking type.

                        let blob;
                        if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                            blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.1 }); // Low quality for preview
                        } else {
                            // Assuming it's already an image we can display (like pasted PNG)
                            blob = file;
                        }
                        const url = URL.createObjectURL(blob);

                        const item = document.getElementById(`file-item-${i}`);
                        if (item) {
                            const img = document.createElement('img');
                            img.src = url;
                            img.className = 'file-preview';
                            item.querySelector('.file-img-wrapper').replaceWith(img);
                        }
                    } catch (e) {
                        console.error("Preview generation failed", e);
                        const item = document.getElementById(`file-item-${i}`);
                        if (item) {
                            item.querySelector('.file-img-wrapper').innerHTML = `<span style="color:red; font-size: 10px;">Preview Error</span>`;
                        }
                    }
                }
            },

            async batchConvertAndDownload() {
                if (!this.files.length) return;

                const quality = parseFloat(this.elements.qualityInput.value);
                const btn = this.elements.downloadBtn;
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerText = "변환 중...";

                try {
                    if (this.files.length === 1) {
                        // Similar logic to previews, check if heic or supported
                        const file = this.files[0];
                        let blob;
                        if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                            blob = await heic2any({ blob: file, toType: "image/jpeg", quality: quality });
                        } else {
                            // Convert non-heic (e.g. pasted png) to jpg
                            blob = await this.convertImageFile(file, quality);
                        }
                        saveAs(blob, this.files[0].name.replace(/\.[^/.]+$/, "") + ".jpg");
                    } else {
                        const zip = new JSZip();

                        // Concurrent IS risky for HEIC. Let's do sequential.
                        for (const file of this.files) {
                            try {
                                let blob;
                                if (file.type === 'image/heic' || file.name.toLowerCase().endsWith('.heic')) {
                                    blob = await heic2any({ blob: file, toType: "image/jpeg", quality: quality });
                                } else {
                                    blob = await this.convertImageFile(file, quality);
                                }
                                zip.file(file.name.replace(/\.[^/.]+$/, "") + ".jpg", blob);
                            } catch (e) {
                                console.error(`Failed to convert ${file.name}`, e);
                            }
                        }

                        const content = await zip.generateAsync({ type: "blob" });
                        saveAs(content, "converted_images.zip");
                    }
                } catch (e) {
                    console.error(e);
                    alert("변환 중 오류가 발생했습니다.");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            },

            // Helper for converting regular images if pasted
            convertImageFile(file, quality) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#FFFFFF'; // JPG needs bg
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0);
                            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            },

            reset() {
                this.files = [];
                this.elements.fileList.innerHTML = '';
                this.elements.fileInput.value = '';
                this.elements.previewContainer.style.display = 'none';
                this.elements.dropZone.style.display = 'block';
                this.elements.loading.style.display = 'none';
                this.elements.qualityInput.value = 0.9;
                this.elements.qualityValue.textContent = '0.9';
            },

            cleanup() {
                if (this.pasteHandler) {
                    document.removeEventListener('paste', this.pasteHandler);
                    this.pasteHandler = null;
                }
            }
        });
    </script>
</body>

</html>
