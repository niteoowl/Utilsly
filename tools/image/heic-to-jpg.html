<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HEIC JPG 변환 - Utilsly</title>
    <meta name="description" content="HEIC 사진을 범용적인 JPG 포맷으로 변환하세요. 아이폰 사진 변환에 최적화되어 있습니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.3/heic2any.min.js"></script>
    <style>
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .upload-icon {
            font-size: 64px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--accent-blue);
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">phone_iphone</span>
                    </div>
                    <h1>HEIC JPG 변환</h1>
                    <p class="description">iPhone이나 iPad로 찍은 HEIC 사진을 JPG로 간편하게 변환하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="heic-to-jpg">
                    <div class="upload-area" id="dropZone">
                        <span class="material-symbols-rounded upload-icon">add_photo_alternate</span>
                        <p class="upload-text">HEIC 이미지를 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">HEIC 파일 지원</p>
                        <input type="file" id="fileInput" accept=".heic, .heif" style="display: none;">
                    </div>

                    <div class="spinner" id="spinner"></div>

                    <div class="preview-container" id="previewContainer">
                        <img id="preview" class="preview-image" alt="Preview">

                        <div class="controls">
                            <div class="control-group">
                                <label>품질 (0.1 ~ 1.0)</label>
                                <input type="range" id="qualityInput" min="0.1" max="1.0" step="0.1" value="0.9">
                                <div
                                    style="text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                                    값: <span id="qualityValue">0.9</span>
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="downloadBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">download</span>
                                JPG로 다운로드
                            </button>
                            <button class="btn" id="resetBtn">
                                <span class="material-symbols-rounded"
                                    style="font-size: 18px; margin-right: 8px;">refresh</span>
                                다른 이미지
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('heic-to-jpg', {
            elements: {},
            originalBlob: null,
            convertedBlob: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    preview: document.getElementById('preview'),
                    previewContainer: document.getElementById('previewContainer'),
                    spinner: document.getElementById('spinner'),
                    qualityInput: document.getElementById('qualityInput'),
                    qualityValue: document.getElementById('qualityValue'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    resetBtn: document.getElementById('resetBtn')
                };
                this.bindEvents();
                console.log('HEIC to JPG Converter initialized');
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.elements.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        if (eventName === 'dragover') this.elements.dropZone.classList.add('dragover');
                        else this.elements.dropZone.classList.remove('dragover');
                        if (eventName === 'drop' && e.dataTransfer.files.length) this.handleFile(e.dataTransfer.files[0]);
                    });
                });

                this.elements.qualityInput.addEventListener('input', (e) => {
                    this.elements.qualityValue.textContent = e.target.value;
                    // Re-conversion might be needed if they change quality, but heic conversion is slow.
                    // We will just apply quality setting on Download, re-running conversion then or 
                    // caching original blob and re-converting. Re-converting HEIC is expensive.
                    // Let's re-convert on download click? Or convert on file load with default quality?
                    // Strategy: Convert on file load to display preview (JPG). Then re-convert *from* that blob or original?
                    // Best: Convert original HEIC to Blob on load with quality.
                });

                this.elements.downloadBtn.addEventListener('click', () => this.download());
                this.elements.resetBtn.addEventListener('click', () => this.reset());
            },

            async handleFile(file) {
                if (!file) return;

                this.elements.dropZone.style.display = 'none';
                this.elements.spinner.style.display = 'block';

                try {
                    // heic2any conversion
                    const quality = parseFloat(this.elements.qualityInput.value);
                    const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: quality
                    });

                    this.convertedBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                    this.originalBlob = file; // Store original to re-convert if needed

                    this.elements.preview.src = URL.createObjectURL(this.convertedBlob);
                    this.elements.spinner.style.display = 'none';
                    this.elements.previewContainer.style.display = 'block';

                } catch (error) {
                    console.error('HEIC conversion failed:', error);
                    alert('HEIC 변환에 실패했습니다. 올바른 HEIC 파일인지 확인해주세요.');
                    this.reset();
                }
            },

            async download() {
                // Should we re-convert if quality changed since load? 
                // For simplicity now, let's just download the one we made.
                // Ideally, we'd check if quality input value != used quality, then re-convert.
                // But HEIC conversion is heavy. Let's assume user accepts current preview or re-uploads.
                // Wait, if we want quality control to actually work, we MUST re-convert if it changed.

                // Let's quickly re-convert for the download to respect the *current* slider value.
                // Since this might be slow, we show spinner? Or just download.
                // Let's assume the user might have adjusted it.

                const quality = parseFloat(this.elements.qualityInput.value);
                // We could re-convert here.

                try {
                    const finalBlob = await heic2any({
                        blob: this.originalBlob,
                        toType: "image/jpeg",
                        quality: quality
                    });

                    const blob = Array.isArray(finalBlob) ? finalBlob[0] : finalBlob;
                    const url = URL.createObjectURL(blob);

                    const link = document.createElement('a');
                    link.download = `converted-heic.jpg`;
                    link.href = url;
                    link.click();
                } catch (e) {
                    alert("Download failed");
                }
            },

            reset() {
                this.convertedBlob = null;
                this.originalBlob = null;
                this.elements.preview.src = '';
                this.elements.fileInput.value = '';
                this.elements.previewContainer.style.display = 'none';
                this.elements.spinner.style.display = 'none';
                this.elements.dropZone.style.display = 'block';
            }
        });
    </script>
</body>

</html>
