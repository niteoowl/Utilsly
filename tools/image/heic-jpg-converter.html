<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HEIC JPG 변환기 - Utilsly</title>
    <meta name="description" content="HEIC(iPhone 사진)를 JPG로 무료 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">HEIC → JPG 변환</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">transform</span></div>
                    <h1>HEIC → JPG 변환기</h1>
                    <p class="description">iPhone HEIC 사진을 JPG로 무료 변환하세요.</p>
                </div>
                <div class="tool-container" data-tool-id="heic-jpg-converter">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                        <p style="margin-top: 16px;">HEIC 파일을 업로드하세요 (여러 개 선택 가능)</p>
                        <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif" multiple
                            style="display: none;">
                    </div>
                    <div id="progress" style="display: none; margin-bottom: 24px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">변환 중... <span id="progressText">0/0</span>
                        </div>
                        <div style="background: var(--bg-sidebar); height: 8px; border-radius: 4px; overflow: hidden;">
                            <div id="progressBar"
                                style="background: var(--accent-blue); height: 100%; width: 0%; transition: width 0.3s;">
                            </div>
                        </div>
                    </div>
                    <div id="results" style="display: none;">
                        <div style="font-weight: 600; margin-bottom: 12px;">변환 완료!</div>
                        <div id="resultList"></div>
                        <button class="btn btn-primary" id="downloadAllBtn" style="width: 100%; margin-top: 16px;">모두
                            다운로드</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script>
        Utilsly.registerTool('heic-jpg-converter', {
            elements: {},
            convertedFiles: [],

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    progress: document.getElementById('progress'),
                    progressBar: document.getElementById('progressBar'),
                    progressText: document.getElementById('progressText'),
                    results: document.getElementById('results'),
                    resultList: document.getElementById('resultList'),
                    downloadAllBtn: document.getElementById('downloadAllBtn')
                };

                this.handleClick = () => this.elements.fileInput.click();
                this.handleFiles = (e) => this.processFiles(e);
                this.handleDownloadAll = () => this.downloadAll();

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleFiles);
                this.elements.downloadAllBtn.addEventListener('click', this.handleDownloadAll);

                console.log('HEIC to JPG Converter initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleFiles);
                    this.elements.downloadAllBtn.removeEventListener('click', this.handleDownloadAll);
                }
                this.elements = {};
                this.convertedFiles = [];
                console.log('HEIC to JPG Converter cleanup done');
            },

            async processFiles(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                this.elements.dropZone.style.display = 'none';
                this.elements.progress.style.display = 'block';
                this.elements.results.style.display = 'none';
                this.convertedFiles = [];

                if (typeof heic2any === 'undefined') {
                    console.error('heic2any library not loaded');
                    alert('라이브러리 로드 실패. 페이지를 새로고침하세요.');
                    return;
                }

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    this.elements.progressText.textContent = `${i + 1}/${files.length}`;
                    this.elements.progressBar.style.width = ((i + 1) / files.length * 100) + '%';

                    try {
                        const convertedBlob = await heic2any({
                            blob: file,
                            toType: 'image/jpeg',
                            quality: 0.9
                        });

                        const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                        const fileName = file.name.replace(/\.(heic|heif)$/i, '.jpg');
                        this.convertedFiles.push({ name: fileName, blob: blob });
                    } catch (error) {
                        console.error('변환 실패:', file.name, error);
                    }
                }

                this.showResults();
            },

            showResults() {
                this.elements.progress.style.display = 'none';
                this.elements.results.style.display = 'block';

                this.elements.resultList.innerHTML = '';
                this.convertedFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-sidebar); border-radius: 8px; margin-bottom: 8px;';
                    item.innerHTML = `
                        <span>${file.name}</span>
                        <button class="btn btn-primary" data-index="${index}" style="padding: 8px 16px;">
                            <span class="material-symbols-rounded" style="font-size: 18px;">download</span>
                        </button>
                    `;
                    // Add event listener for download button via closure wrapper or direct binding
                    item.querySelector('button').onclick = () => this.downloadFile(index);
                    this.elements.resultList.appendChild(item);
                });
            },

            downloadFile(index) {
                const file = this.convertedFiles[index];
                const url = URL.createObjectURL(file.blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = file.name;
                link.click();
                URL.revokeObjectURL(url);
            },

            downloadAll() {
                this.convertedFiles.forEach((file, index) => {
                    setTimeout(() => this.downloadFile(index), index * 100);
                });
            }
        });
    </script>
</body>

</html>
