<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 정렬 - Utilsly</title>
    <meta name="description" content="키보드로 빠르게 이미지를 분류하고 정리하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .sorter-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .preview-area {
            background: var(--bg-sidebar);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .category-btn {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .category-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 0, 0, 0.05);
        }

        .category-btn.active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: white;
        }

        .key-hint {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #eee;
            border-radius: 4px;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }

        .stats {
            display: flex;
            gap: 24px;
            justify-content: center;
            padding: 16px;
            background: var(--bg-sidebar);
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 정렬</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">photo_library</span>
                    </div>
                    <h1>이미지 정렬</h1>
                    <p class="description">키보드 숫자키(1-9)로 이미지를 빠르게 분류하세요.</p>
                </div>

                <div class="tool-container">
                    <div class="sorter-container">
                        <div class="drop-zone" id="dropZone"
                            style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer;">
                            <span class="material-symbols-rounded"
                                style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                            <p style="margin-top: 16px;">이미지 파일들을 업로드하세요 (여러 개 선택 가능)</p>
                            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                        </div>

                        <div id="sorterArea" style="display: none;">
                            <div class="stats">
                                <div class="stat-item">
                                    <div class="stat-value" id="currentIndex">0</div>
                                    <div class="stat-label">현재</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value" id="totalImages">0</div>
                                    <div class="stat-label">전체</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value" id="sortedCount">0</div>
                                    <div class="stat-label">분류됨</div>
                                </div>
                            </div>

                            <div class="preview-area">
                                <img id="previewImage" class="preview-image" src="" alt="Preview">
                            </div>

                            <div class="controls">
                                <button class="btn" onclick="previousImage()">
                                    <span class="material-symbols-rounded">arrow_back</span>
                                    이전 (←)
                                </button>
                                <button class="btn" onclick="nextImage()">
                                    다음 (→)
                                    <span class="material-symbols-rounded">arrow_forward</span>
                                </button>
                            </div>

                            <div style="margin-top: 24px;">
                                <label style="font-weight: 600; display: block; margin-bottom: 12px;">카테고리 (숫자키
                                    1-9)</label>
                                <div class="category-grid" id="categoryGrid"></div>
                            </div>

                            <button class="btn btn-primary" onclick="downloadSorted()"
                                style="width: 100%; margin-top: 24px;">
                                분류된 이미지 다운로드
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        let images = [];
        let currentIndex = 0;
        let categories = [
            { id: 1, name: '보관', images: [] },
            { id: 2, name: '편집', images: [] },
            { id: 3, name: '삭제', images: [] }
        ];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const sorterArea = document.getElementById('sorterArea');
        const previewImage = document.getElementById('previewImage');

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            images = files.map((file, index) => ({
                id: index,
                file: file,
                url: URL.createObjectURL(file),
                category: null
            }));

            if (images.length > 0) {
                dropZone.style.display = 'none';
                sorterArea.style.display = 'block';
                renderCategories();
                showImage(0);
                updateStats();
            }
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = categories.map(cat => `
                <button class="category-btn" onclick="assignCategory(${cat.id})">
                    <span class="key-hint">${cat.id}</span>
                    ${cat.name}
                </button>
            `).join('');
        }

        function showImage(index) {
            if (index < 0 || index >= images.length) return;
            currentIndex = index;
            previewImage.src = images[index].url;
            updateStats();
        }

        function previousImage() {
            if (currentIndex > 0) {
                showImage(currentIndex - 1);
            }
        }

        function nextImage() {
            if (currentIndex < images.length - 1) {
                showImage(currentIndex + 1);
            }
        }

        function assignCategory(categoryId) {
            images[currentIndex].category = categoryId;
            updateStats();
            nextImage();
        }

        function updateStats() {
            document.getElementById('currentIndex').textContent = currentIndex + 1;
            document.getElementById('totalImages').textContent = images.length;
            document.getElementById('sortedCount').textContent = images.filter(img => img.category !== null).length;
        }

        async function downloadSorted() {
            const JSZip = window.JSZip || await loadJSZip();
            const zip = new JSZip();

            categories.forEach(cat => {
                const folder = zip.folder(cat.name);
                images.filter(img => img.category === cat.id).forEach((img, index) => {
                    const blob = dataURLtoBlob(img.url);
                    folder.file(`${index + 1}_${img.file.name}`, blob);
                });
            });

            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = 'sorted-images.zip';
            link.click();
        }

        function dataURLtoBlob(dataURL) {
            const arr = dataURL.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], { type: mime });
        }

        async function loadJSZip() {
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            document.head.appendChild(script);
            return new Promise(resolve => {
                script.onload = () => resolve(window.JSZip);
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (images.length === 0) return;

            const key = parseInt(e.key);
            if (!isNaN(key) && key >= 1 && key <= 9) {
                const category = categories.find(c => c.id === key);
                if (category) assignCategory(key);
            } else if (e.key === 'ArrowLeft') {
                previousImage();
            } else if (e.key === 'ArrowRight') {
                nextImage();
            }
        });
    </script>
</body>

</html>
