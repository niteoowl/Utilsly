<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 정렬 - Utilsly</title>
    <meta name="description" content="키보드로 빠르게 이미지를 분류하고 정리하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .sorter-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .preview-area {
            background: var(--bg-sidebar);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .category-btn {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .category-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 0, 0, 0.05);
        }

        .category-btn.active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: white;
        }

        .key-hint {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #eee;
            border-radius: 4px;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }

        .stats {
            display: flex;
            gap: 24px;
            justify-content: center;
            padding: 16px;
            background: var(--bg-sidebar);
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지 정렬</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">photo_library</span>
                    </div>
                    <h1>이미지 정렬</h1>
                    <p class="description">키보드 숫자키(1-9)로 이미지를 빠르게 분류하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="image-sorter">
                    <div class="sorter-container">
                        <div class="drop-zone" id="dropZone"
                            style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer;">
                            <span class="material-symbols-rounded"
                                style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                            <p style="margin-top: 16px;">이미지 파일들을 업로드하세요 (여러 개 선택 가능)</p>
                            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                        </div>

                        <div id="sorterArea" style="display: none;">
                            <div class="stats">
                                <div class="stat-item">
                                    <div class="stat-value" id="currentIndex">0</div>
                                    <div class="stat-label">현재</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value" id="totalImages">0</div>
                                    <div class="stat-label">전체</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value" id="sortedCount">0</div>
                                    <div class="stat-label">분류됨</div>
                                </div>
                            </div>

                            <div class="preview-area">
                                <img id="previewImage" class="preview-image" src="" alt="Preview">
                            </div>

                            <div class="controls">
                                <button class="btn" id="btnPrev">
                                    <span class="material-symbols-rounded">arrow_back</span>
                                    이전 (←)
                                </button>
                                <button class="btn" id="btnNext">
                                    다음 (→)
                                    <span class="material-symbols-rounded">arrow_forward</span>
                                </button>
                            </div>

                            <div style="margin-top: 24px;">
                                <label style="font-weight: 600; display: block; margin-bottom: 12px;">카테고리 (숫자키
                                    1-9)</label>
                                <div class="category-grid" id="categoryGrid"></div>
                            </div>

                            <button class="btn btn-primary" id="downloadBtn" style="width: 100%; margin-top: 24px;">
                                분류된 이미지 다운로드
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('image-sorter', {
            elements: {},
            images: [],
            currentIndex: 0,
            categories: [
                { id: 1, name: '보관', images: [] },
                { id: 2, name: '편집', images: [] },
                { id: 3, name: '삭제', images: [] }
            ],

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    sorterArea: document.getElementById('sorterArea'),
                    previewImage: document.getElementById('previewImage'),
                    categoryGrid: document.getElementById('categoryGrid'),
                    currentIndex: document.getElementById('currentIndex'),
                    totalImages: document.getElementById('totalImages'),
                    sortedCount: document.getElementById('sortedCount'),
                    btnPrev: document.getElementById('btnPrev'),
                    btnNext: document.getElementById('btnNext'),
                    downloadBtn: document.getElementById('downloadBtn')
                };

                this.handleClick = () => this.elements.fileInput.click();
                this.handleFiles = (e) => this.processFiles(e);
                this.handlePrev = () => this.previousImage();
                this.handleNext = () => this.nextImage();
                this.handleDownload = () => this.downloadSorted();

                // Bind Key Handler
                this.handleKeydown = this.onKeydown.bind(this);

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleFiles);
                this.elements.btnPrev.addEventListener('click', this.handlePrev);
                this.elements.btnNext.addEventListener('click', this.handleNext);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);

                document.addEventListener('keydown', this.handleKeydown);

                console.log('Image Sorter initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleFiles);
                    this.elements.btnPrev.removeEventListener('click', this.handlePrev);
                    this.elements.btnNext.removeEventListener('click', this.handleNext);
                    this.elements.downloadBtn.removeEventListener('click', this.handleDownload);

                    document.removeEventListener('keydown', this.handleKeydown);
                }
                this.elements = {};
                this.images = [];
                console.log('Image Sorter cleanup done');
            },

            processFiles(e) {
                const files = Array.from(e.target.files);
                this.images = files.map((file, index) => ({
                    id: index,
                    file: file,
                    url: URL.createObjectURL(file), // Note: Need to revoke these if tool is unloaded? Ideally yes.
                    category: null
                }));

                if (this.images.length > 0) {
                    this.elements.dropZone.style.display = 'none';
                    this.elements.sorterArea.style.display = 'block';
                    this.renderCategories();
                    this.showImage(0);
                    this.updateStats();
                }
            },

            onKeydown(e) {
                if (this.images.length === 0) return;

                const key = parseInt(e.key);
                // Note: Check if key is 1-9
                if (!isNaN(key) && key >= 1 && key <= 9) {
                    const category = this.categories.find(c => c.id === key);
                    if (category) this.assignCategory(key);
                } else if (e.key === 'ArrowLeft') {
                    this.previousImage();
                } else if (e.key === 'ArrowRight') {
                    this.nextImage();
                }
            },

            renderCategories() {
                this.elements.categoryGrid.innerHTML = this.categories.map(cat => `
                    <button class="category-btn" data-id="${cat.id}">
                        <span class="key-hint">${cat.id}</span>
                        ${cat.name}
                    </button>
                `).join('');

                // Add click listeners to new buttons
                this.elements.categoryGrid.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.assignCategory(parseInt(btn.getAttribute('data-id')));
                    });
                });
            },

            showImage(index) {
                if (index < 0 || index >= this.images.length) return;
                this.currentIndex = index;
                this.elements.previewImage.src = this.images[index].url;
                this.updateStats();
            },

            previousImage() {
                if (this.currentIndex > 0) {
                    this.showImage(this.currentIndex - 1);
                }
            },

            nextImage() {
                if (this.currentIndex < this.images.length - 1) {
                    this.showImage(this.currentIndex + 1);
                }
            },

            assignCategory(categoryId) {
                this.images[this.currentIndex].category = categoryId;
                this.updateStats();
                this.nextImage();
            },

            updateStats() {
                this.elements.currentIndex.textContent = this.currentIndex + 1;
                this.elements.totalImages.textContent = this.images.length;
                this.elements.sortedCount.textContent = this.images.filter(img => img.category !== null).length;
            },

            async downloadSorted() {
                const JSZip = window.JSZip || await this.loadJSZip();
                const zip = new JSZip();

                this.categories.forEach(cat => {
                    const folder = zip.folder(cat.name);
                    this.images.filter(img => img.category === cat.id).forEach((img, index) => {
                        const blob = this.dataURLtoBlob(img.url);
                        folder.file(`${index + 1}_${img.file.name}`, blob); // Original file name needed? URL.createObjectURL doesn't fully preserve dataUrl for binary copy easily except fetch.
                        // Actually img.url is Blob URL.
                    });
                });

                // Fix: Fetch the blob from blobURL
                const promises = [];
                this.categories.forEach(cat => {
                    const catImages = this.images.filter(img => img.category === cat.id);
                    catImages.forEach((img, idx) => {
                        promises.push(
                            fetch(img.url).then(r => r.blob()).then(blob => {
                                zip.folder(cat.name).file(`${idx + 1}_${img.file.name}`, blob);
                            })
                        );
                    });
                });

                await Promise.all(promises);

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = 'sorted-images.zip';
                link.click();
            },

            // Deprecated dataURLtoBlob since we have blob URL
            dataURLtoBlob(dataURL) {
                return null;
            },

            async loadJSZip() {
                if (window.JSZip) return window.JSZip;

                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                document.head.appendChild(script);
                return new Promise(resolve => {
                    script.onload = () => resolve(window.JSZip);
                });
            }
        });
    </script>
</body>

</html>
