<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>플레이스홀더 생성기 - Utilsly</title>
    <meta name="description" content="커스텀 이미지 플레이스홀더를 생성하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">플레이스홀더 생성</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">image</span></div>
                    <h1>이미지 플레이스홀더 생성기</h1>
                    <p class="description">커스텀 크기와 색상의 플레이스홀더 이미지를 만드세요.</p>
                </div>
                <div class="tool-container" data-tool-id="placeholder-generator">
                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">너비 (px)</label>
                            <input type="number" id="width" value="400" min="1"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">높이 (px)</label>
                            <input type="number" id="height" value="300" min="1"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">배경색</label>
                            <input type="color" id="bgColor" value="#cccccc"
                                style="width: 100%; height: 42px; border: none; border-radius: 4px; cursor: pointer;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">텍스트 색상</label>
                            <input type="color" id="textColor" value="#666666"
                                style="width: 100%; height: 42px; border: none; border-radius: 4px; cursor: pointer;">
                        </div>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">텍스트 (선택사항)</label>
                        <input type="text" id="text" placeholder="400 x 300"
                            style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 16px;">
                    </div>
                    <button class="btn btn-primary" id="generateBtn"
                        style="width: 100%; margin-bottom: 24px;">생성</button>
                    <div
                        style="text-align: center; background: var(--bg-sidebar); padding: 24px; border-radius: 12px; margin-bottom: 16px;">
                        <canvas id="canvas" style="max-width: 100%; border: 1px solid var(--border-color);"></canvas>
                    </div>
                    <button class="btn btn-primary" id="downloadBtn" style="width: 100%;">다운로드</button>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('placeholder-generator', {
            elements: {},
            ctx: null,

            init() {
                this.elements = {
                    width: document.getElementById('width'),
                    height: document.getElementById('height'),
                    bgColor: document.getElementById('bgColor'),
                    textColor: document.getElementById('textColor'),
                    text: document.getElementById('text'),
                    canvas: document.getElementById('canvas'),
                    generateBtn: document.getElementById('generateBtn'),
                    downloadBtn: document.getElementById('downloadBtn')
                };

                this.ctx = this.elements.canvas.getContext('2d');

                this.handleInput = () => this.generate();
                this.handleDownload = () => this.download();

                this.elements.width.addEventListener('input', this.handleInput);
                this.elements.height.addEventListener('input', this.handleInput);
                this.elements.bgColor.addEventListener('input', this.handleInput);
                this.elements.textColor.addEventListener('input', this.handleInput);
                this.elements.text.addEventListener('input', this.handleInput);
                this.elements.generateBtn.addEventListener('click', this.handleInput);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);

                this.generate();
                console.log('Placeholder Generator initialized');
            },

            cleanup() {
                if (this.elements.width) {
                    this.elements.width.removeEventListener('input', this.handleInput);
                    this.elements.height.removeEventListener('input', this.handleInput);
                    this.elements.bgColor.removeEventListener('input', this.handleInput);
                    this.elements.textColor.removeEventListener('input', this.handleInput);
                    this.elements.text.removeEventListener('input', this.handleInput);
                    this.elements.generateBtn.removeEventListener('click', this.handleInput);
                    this.elements.downloadBtn.removeEventListener('click', this.handleDownload);
                }
                this.elements = {};
                this.ctx = null;
                console.log('Placeholder Generator cleanup done');
            },

            generate() {
                if (!this.elements.width) return;

                const width = parseInt(this.elements.width.value);
                const height = parseInt(this.elements.height.value);
                const bgColor = this.elements.bgColor.value;
                const textColor = this.elements.textColor.value;
                const text = this.elements.text.value || `${width} x ${height}`;

                this.elements.canvas.width = width;
                this.elements.canvas.height = height;

                this.ctx.fillStyle = bgColor;
                this.ctx.fillRect(0, 0, width, height);

                this.ctx.fillStyle = textColor;
                this.ctx.font = `${Math.min(width, height) / 10}px sans-serif`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(text, width / 2, height / 2);
            },

            download() {
                const link = document.createElement('a');
                link.download = 'placeholder.png';
                link.href = this.elements.canvas.toDataURL();
                link.click();
            }
        });
    </script>
</body>

</html>
