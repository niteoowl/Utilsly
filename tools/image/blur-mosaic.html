<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>이미지 모자이크/블러 - Utilsly</title>
    <meta name="description" content="이미지의 특정 영역을 선택하여 모자이크 또는 흐림(블러) 효과를 적용하고 저장하세요. 개인정보 보호에 유용합니다.">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: calc(100vh - 200px);
            min-height: 500px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: center;
            flex-wrap: wrap;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 4px;
        }

        .canvas-area {
            flex: 1;
            background: var(--bg-hover);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
        }

        canvas {
            box-shadow: var(--shadow-md);
            max-width: 100%;
            max-height: 100%;
            cursor: crosshair;
        }

        #hiddenFileInput {
            display: none;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 12px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .tool-btn.active {
            background: var(--bg-active);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .tool-btn span.material-symbols-rounded {
            font-size: 20px;
        }

        .placeholder-text {
            color: var(--text-tertiary);
            position: absolute;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Utilsly</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item">이미지</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">모자이크/블러</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">blur_on</span>
                    </div>
                    <h1>이미지 모자이크/블러</h1>
                    <p class="description">이미지의 민감한 정보를 가리거나 배경을 흐리게 만드세요.</p>
                </div>

                <div class="tool-container" data-tool-id="blur-mosaic">
                    <div class="editor-container">
                        <div class="toolbar">
                            <button class="tool-btn" id="btnUpload">
                                <span class="material-symbols-rounded">upload</span>
                                이미지 열기
                            </button>
                            <div class="divider"></div>

                            <div style="font-size: 13px; color: var(--text-secondary); margin-right: 8px;">강도:</div>
                            <input type="range" id="effectStrength" min="1" max="20" value="10" style="width: 100px;">

                            <div class="divider"></div>

                            <button class="tool-btn" id="btnBlur">
                                <span class="material-symbols-rounded">blur_circular</span>
                                블러 적용
                            </button>
                            <button class="tool-btn" id="btnMosaic">
                                <span class="material-symbols-rounded">grid_4x4</span>
                                모자이크 적용
                            </button>

                            <div class="divider"></div>

                            <button class="tool-btn" id="btnDownload">
                                <span class="material-symbols-rounded">download</span>
                                저장
                            </button>
                        </div>

                        <div class="canvas-area" id="dropZone">
                            <canvas id="editorCanvas"></canvas>
                            <div class="placeholder-text" id="placeholder">
                                <span class="material-symbols-rounded" style="font-size: 48px;">image</span>
                                <div>이미지를 드래그하거나 '열기'를 클릭하세요</div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="hiddenFileInput" accept="image/*">
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('blur-mosaic', {
            canvas: null,
            ctx: null,
            img: null,
            isDragging: false,
            startX: 0,
            startY: 0,
            rectX: 0,
            rectY: 0,
            rectW: 0,
            rectH: 0,
            strength: 10,
            history: [], // For undo if needed (optional)

            init() {
                this.canvas = document.getElementById('editorCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.fileInput = document.getElementById('hiddenFileInput');
                this.dropZone = document.getElementById('dropZone');
                this.placeholder = document.getElementById('placeholder');

                // Elements
                this.els = {
                    btnUpload: document.getElementById('btnUpload'),
                    btnBlur: document.getElementById('btnBlur'),
                    btnMosaic: document.getElementById('btnMosaic'),
                    btnDownload: document.getElementById('btnDownload'),
                    rangeStrength: document.getElementById('effectStrength')
                };

                // Listeners
                this.els.btnUpload.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                this.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); this.dropZone.style.background = 'var(--bg-active)'; });
                this.dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); this.dropZone.style.background = 'var(--bg-hover)'; });
                this.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.dropZone.style.background = 'var(--bg-hover)';
                    this.handleFile(e.dataTransfer.files[0]);
                });

                this.els.rangeStrength.addEventListener('input', (e) => {
                    this.strength = parseInt(e.target.value);
                });

                // Canvas Interaction
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                window.addEventListener('mousemove', (e) => this.onMouseMove(e));
                window.addEventListener('mouseup', (e) => this.onMouseUp(e));

                this.els.btnBlur.addEventListener('click', () => this.applyEffect('blur'));
                this.els.btnMosaic.addEventListener('click', () => this.applyEffect('mosaic'));
                this.els.btnDownload.addEventListener('click', () => this.download());

                // Auto resize canvas placeholder? No, handled by css max-width/height.
            },

            handleFile(file) {
                if (!file || !file.type.startsWith('image/')) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.img = img;
                        this.canvas.width = img.width;
                        this.canvas.height = img.height;
                        this.ctx.drawImage(img, 0, 0);
                        this.placeholder.style.display = 'none';
                        this.rectW = 0;
                        this.rectH = 0;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                // Map screen pixels to canvas pixels
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            },

            onMouseDown(e) {
                if (!this.img) return;
                this.isDragging = true;
                const pos = this.getMousePos(e);
                this.startX = pos.x;
                this.startY = pos.y;
                this.rectX = pos.x;
                this.rectY = pos.y;
                this.rectW = 0;
                this.rectH = 0;
                this.redraw();
            },

            onMouseMove(e) {
                if (!this.isDragging) return;
                const pos = this.getMousePos(e);
                this.rectW = pos.x - this.startX;
                this.rectH = pos.y - this.startY;
                this.redraw();
            },

            onMouseUp(e) {
                if (this.isDragging) {
                    this.isDragging = false;
                    // Normalize rect
                    if (this.rectW < 0) { this.rectX += this.rectW; this.rectW = -this.rectW; }
                    if (this.rectH < 0) { this.rectY += this.rectH; this.rectH = -this.rectH; }
                    this.redraw(); // Draw selection box
                }
            },

            redraw() {
                if (!this.img) return;
                // Draw Image data (accumulated edits usually) 
                // Wait, if I clearRect, I lose previous edits because I haven't saved them to `this.img`?
                // The canvas holds the current state.
                // But `drawImage(this.img)` will overwrite edits if `this.img` is the original.

                // Correction: Using `this.img` as base is wrong if we want cumulative edits.
                // We should assume canvas context *is* the image source.
                // But to draw the selection overlay, we DO need to clear and redraw, OR use an overlay canvas.
                // OR `putImageData`.
                // Efficient way: Save canvas state before drawing selection line?

                // Let's use `putImageData` approach.
                // But that is heavy for mouse move.

                // Better: 
                // 1. On MouseDown, save current canvas snapshot (ImageData).
                // 2. On MouseMove, putImageData(snapshot), then draw rect.
                // 3. On MouseUp, apply rect visually (or just the final state is shown).

                if (this.isDragging && !this.snapshot) {
                    this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                }

                if (this.snapshot) {
                    this.ctx.putImageData(this.snapshot, 0, 0);

                    // Draw selection rect
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.strokeRect(this.startX, this.startY, this.rectW, this.rectH);

                    this.ctx.strokeStyle = '#000';
                    this.ctx.setLineDash([5, 5]);
                    this.ctx.lineDashOffset = 5;
                    this.ctx.strokeRect(this.startX, this.startY, this.rectW, this.rectH);
                    this.ctx.setLineDash([]);
                }
            },

            applyEffect(type) {
                if (!this.img || this.rectW === 0 || this.rectH === 0) {
                    Utilsly.showAlert('이미지를 열고 영역을 드래그하여 선택해주세요.');
                    return;
                }

                // Restore clean image (remove selection dashes)
                this.ctx.putImageData(this.snapshot, 0, 0);
                this.snapshot = null; // Clear snapshot so next drag takes new one

                // Get ROI
                const imgData = this.ctx.getImageData(this.rectX, this.rectY, this.rectW, this.rectH);
                const data = imgData.data;
                const w = imgData.width;
                const h = imgData.height;
                const s = this.strength;

                if (type === 'mosaic') {
                    const blockSize = Math.max(4, s * 2);

                    for (let y = 0; y < h; y += blockSize) {
                        for (let x = 0; x < w; x += blockSize) {
                            // Calculate Average color of block
                            let r = 0, g = 0, b = 0, count = 0;

                            for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
                                for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
                                    const i = ((y + dy) * w + (x + dx)) * 4;
                                    r += data[i];
                                    g += data[i + 1];
                                    b += data[i + 2];
                                    count++;
                                }
                            }

                            r = Math.floor(r / count);
                            g = Math.floor(g / count);
                            b = Math.floor(b / count);

                            // Fill block
                            for (let dy = 0; dy < blockSize && y + dy < h; dy++) {
                                for (let dx = 0; dx < blockSize && x + dx < w; dx++) {
                                    const i = ((y + dy) * w + (x + dx)) * 4;
                                    data[i] = r;
                                    data[i + 1] = g;
                                    data[i + 2] = b;
                                }
                            }
                        }
                    }
                } else if (type === 'blur') {
                    // Simple Stack Blur approximation or Box Blur multiple passes
                    // Let's use simplified box blur
                    const radius = Math.max(2, s);

                    // Horizontal pass
                    // (Omitted essentially for brevity? No, user needs it working)
                    // Writing a fast blur in JS without library is verbose.
                    // Let's use a very simple pixel averaging for "blur-like" effect or heavy pixelation (mosaic) is safer?
                    // But user asked for Blur.

                    // Simple Box Blur (Horizontal + Vertical)
                    // Note: This is slow in JS for large areas. But manageable for ROI.

                    const copy = new Uint8ClampedArray(data);

                    const boxBlur = (iterations) => {
                        for (let i = 0; i < iterations; i++) {
                            // This is actually complex to write inline correctly and efficiently.
                            // Let's implement a random scatter blur? Easier.
                            // Or just force Mosaic if blur is too hard? No.
                            // Let's do a simple weighted average of neighbors.

                            // 1 pass of 3x3 kernel?
                        }
                    };

                    // Let's stick to Mosaic for now? 
                    // No, I will implement a rudimentary blur:
                    // Random sampling neighbors? 
                    // Actually, "CanvasRenderingContext2D.filter = 'blur(5px)'" exists!
                    // I can use that!

                    // 1. Create temporary canvas
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w;
                    tempCanvas.height = h;
                    const tCtx = tempCanvas.getContext('2d');

                    // 2. Put image data
                    tCtx.putImageData(imgData, 0, 0);

                    // 3. Draw it back with filter
                    // We need to draw the tempCanvas onto main canvas at position rectX, rectY with filter.

                    // Current context state:
                    this.ctx.save();
                    this.ctx.filter = `blur(${s}px)`; // blur strength
                    // Clip to rect
                    this.ctx.beginPath();
                    this.ctx.rect(this.rectX, this.rectY, this.rectW, this.rectH);
                    this.ctx.clip();
                    // Draw the image itself again at same position? 
                    // No, that blurs the whole image (or clipped part) but using source as ..
                    // If we draw generic image, it works.
                    // Actually, `ctx.filter` affects drawing commands.
                    // `drawImage` of the ROI onto itself?

                    this.ctx.drawImage(this.canvas, this.rectX, this.rectY, this.rectW, this.rectH, this.rectX, this.rectY, this.rectW, this.rectH);

                    this.ctx.restore();

                    // Reset rect
                    this.rectW = 0;
                    this.rectH = 0;
                    return; // Done
                }

                // If Mosaic (manual pixel manip), put back
                this.ctx.putImageData(imgData, this.rectX, this.rectY);
                this.rectW = 0;
                this.rectH = 0;
            },

            download() {
                if (!this.img) return;
                const link = document.createElement('a');
                link.download = 'edited-image.png';
                link.href = this.canvas.toDataURL();
                link.click();
            }
        });
    </script>
</body>

</html>
