<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 블러/모자이크 - Utilsly</title>
    <meta name="description" content="이미지의 특정 영역을 블러(흐림) 또는 모자이크 처리하세요.">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/common.js"></script>
    <style>
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .canvas-wrapper {
            position: relative;
            max-width: 100%;
            overflow: auto;
            border: 1px solid var(--border-color);
            background: #f0f0f0;
            /* Checkered background ideally */
            cursor: crosshair;
        }

        canvas {
            display: block;
            max-width: 100%;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            cursor: pointer;
            min-width: 80px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--bg-hover);
        }

        .tool-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .tool-btn.active .material-symbols-rounded {
            color: var(--bg-primary);
        }

        .tool-options {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-sidebar);
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            justify-content: center;
        }

        input[type="range"] {
            width: 150px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <div data-tool-id="blur-mosaic"></div>
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">이미지</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">블러/모자이크</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">blur_on</span>
                    </div>
                    <h1>이미지 블러/모자이크</h1>
                    <p class="description">이미지의 민감한 부분을 흐리게 하거나 모자이크 처리하여 개인정보를 보호하세요.</p>
                </div>

                <div class="tool-card tool-container">
                    <div class="editor-container">
                        <!-- Upload -->
                        <div id="uploadArea" class="upload-area"
                            style="width: 100%; text-align: center; padding: 40px; border: 2px dashed var(--border-color); border-radius: 12px; cursor: pointer;">
                            <span class="material-symbols-rounded"
                                style="font-size: 48px; color: var(--text-tertiary);">add_photo_alternate</span>
                            <div style="margin-top: 12px; font-weight: 500;">여기를 클릭하여 이미지 업로드</div>
                            <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">또는 파일을 드래그하여
                                놓으세요</div>
                            <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        </div>

                        <!-- Controls -->
                        <div id="editorControls" class="controls" style="display: none;">
                            <button class="tool-btn active" data-mode="blur" onclick="setMode('blur')">
                                <span class="material-symbols-rounded">blur_on</span>
                                <span>블러</span>
                            </button>
                            <button class="tool-btn" data-mode="mosaic" onclick="setMode('mosaic')">
                                <span class="material-symbols-rounded">grid_on</span>
                                <span>모자이크</span>
                            </button>
                            <div style="width: 1px; background: var(--border-color); margin: 0 8px;"></div>
                            <button class="tool-btn" onclick="undo()">
                                <span class="material-symbols-rounded">undo</span>
                                <span>실행취소</span>
                            </button>
                            <button class="tool-btn" onclick="resetImage()">
                                <span class="material-symbols-rounded">refresh</span>
                                <span>초기화</span>
                            </button>
                            <button class="tool-btn" onclick="downloadImage()">
                                <span class="material-symbols-rounded">download</span>
                                <span>저장</span>
                            </button>
                        </div>

                        <!-- Intensity Slider -->
                        <div id="intensityControl" class="tool-options" style="display: none;">
                            <span id="intensityLabel">블러 강도</span>
                            <input type="range" id="intensityRange" min="1" max="50" value="10">
                            <span id="intensityValue">10</span>
                        </div>

                        <!-- Canvas -->
                        <div id="canvasContainer" class="canvas-wrapper" style="display: none;">
                            <canvas id="canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Tool Logic
        let canvas, ctx;
        let originalImage = null;
        let history = []; // Canvas states
        let isDrawing = false;
        let startX, startY;
        let currentMode = 'blur'; // 'blur' or 'mosaic'

        Utilsly.registerTool('blur-mosaic', {
            init() {
                canvas = document.getElementById('canvas');
                ctx = canvas.getContext('2d', { willReadFrequently: true });

                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('fileInput');

                uploadArea.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', handleFile);

                // Drag & Drop
                uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    uploadArea.style.borderColor = 'var(--accent-blue)';
                    uploadArea.style.background = 'var(--bg-hover)';
                });
                uploadArea.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    uploadArea.style.borderColor = 'var(--border-color)';
                    uploadArea.style.background = 'transparent';
                });
                uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    uploadArea.style.borderColor = 'var(--border-color)';
                    uploadArea.style.background = 'transparent';
                    if (e.dataTransfer.files.length) handleFile({ target: { files: e.dataTransfer.files } });
                });

                // Canvas Events
                canvas.addEventListener('mousedown', startSelection);
                canvas.addEventListener('mousemove', drawSelection);
                canvas.addEventListener('mouseup', applyEffect);
                canvas.addEventListener('mouseout', () => isDrawing = false);

                // Range
                document.getElementById('intensityRange').addEventListener('input', (e) => {
                    document.getElementById('intensityValue').innerText = e.target.value;
                });
            },
            cleanup() {
                // Cleanup if needed
            }
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    initCanvas(img);
                    document.getElementById('uploadArea').style.display = 'none';
                    document.getElementById('editorControls').style.display = 'flex';
                    document.getElementById('intensityControl').style.display = 'flex';
                    document.getElementById('canvasContainer').style.display = 'block';
                    saveState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function initCanvas(img) {
            // Fit to screen if too large, but keep aspect ratio
            // For editing, full resolution is better, but display might need scaling.
            // Let's use simple full res for now, assuming wrapper handles scroll.
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

            const label = mode === 'blur' ? '블러 강도' : '모자이크 크기';
            document.getElementById('intensityLabel').innerText = label;
        }

        function startSelection(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            // Calculate scale if canvas is styled to shrink
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
        }

        function drawSelection(e) {
            if (!isDrawing) return;
            // Visual feedback could be drawn on a temp canvas or overlay div
            // For simplicity, we just wait for mouse up to apply.
            // Or we can redraw image + selection rectangle
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;

            // Restore last state to clear previous rect
            if (history.length > 0) {
                ctx.putImageData(history[history.length - 1], 0, 0);
            }

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
            ctx.strokeStyle = '#000';
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
            ctx.setLineDash([]);
        }

        function applyEffect(e) {
            if (!isDrawing) return;
            isDrawing = false;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const endX = (e.clientX - rect.left) * scaleX;
            const endY = (e.clientY - rect.top) * scaleY;

            const w = endX - startX;
            const h = endY - startY;

            if (Math.abs(w) < 5 || Math.abs(h) < 5) {
                // Too small, probably accidental click. Restore previous.
                if (history.length > 0) ctx.putImageData(history[history.length - 1], 0, 0);
                return;
            }

            // Restore clean image before rect
            if (history.length > 0) ctx.putImageData(history[history.length - 1], 0, 0);

            const intensity = parseInt(document.getElementById('intensityRange').value);

            // Ensure positive dimensions
            const x = w < 0 ? endX : startX;
            const y = h < 0 ? endY : startY;
            const width = Math.abs(w);
            const height = Math.abs(h);

            if (currentMode === 'blur') {
                processBlur(x, y, width, height, intensity);
            } else {
                processMosaic(x, y, width, height, intensity);
            }

            saveState();
        }

        function processBlur(x, y, width, height, radius) {
            // Simple box blur approximation or stack blur
            // Using canvas filter is easiest but context.filter applies to drawing

            // 1. Extract data
            const imageData = ctx.getImageData(x, y, width, height);
            // 2. We can use a makeshift blur by scaling down and up
            // Create temp canvas
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            // Scale down
            const scaleFactor = 1 / (radius / 2);
            // Limit scale factor to avoid becoming 0
            const safeScale = Math.max(0.05, Math.min(1, 1 / (radius / 2)));

            tempCanvas.width = width * safeScale;
            tempCanvas.height = height * safeScale;

            if (tempCanvas.width < 1) tempCanvas.width = 1;
            if (tempCanvas.height < 1) tempCanvas.height = 1;

            tempCtx.drawImage(canvas, x, y, width, height, 0, 0, tempCanvas.width, tempCanvas.height);

            // Draw back scaled up with smoothing
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, x, y, width, height);
        }

        function processMosaic(x, y, width, height, blockSize) {
            // blockSize is roughly pixel size
            const size = Math.max(5, blockSize * 2);

            for (let i = 0; i < width; i += size) {
                for (let j = 0; j < height; j += size) {
                    // Get color of center pixel of block
                    const sampleX = Math.min(x + i + size / 2, x + width - 1);
                    const sampleY = Math.min(y + j + size / 2, y + height - 1);
                    const p = ctx.getImageData(sampleX, sampleY, 1, 1).data;

                    ctx.fillStyle = `rgb(${p[0]},${p[1]},${p[2]})`;
                    ctx.fillRect(x + i, y + j, size, size);
                }
            }
        }

        function saveState() {
            if (history.length > 20) history.shift();
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undo() {
            if (history.length > 1) {
                history.pop(); // Remove current state
                const prevState = history[history.length - 1];
                ctx.putImageData(prevState, 0, 0);
            } else if (history.length === 1) {
                // Initial state
            }
        }

        function resetImage() {
            if (!originalImage) return;
            initCanvas(originalImage);
            history = [];
            saveState();
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'edited-image-utilsly.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>

</html>
