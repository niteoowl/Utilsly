<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PNG WebP 변환기 - Utilsly</title>
    <meta name="description" content="PNG를 WebP로, WebP를 PNG로 무료 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">PNG ↔ WebP 변환</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">transform</span></div>
                    <h1>PNG ↔ WebP 변환기</h1>
                    <p class="description">PNG를 WebP로, WebP를 PNG로 무료 변환하세요. SEO 최적화에 완벽!</p>
                </div>
                <div class="tool-container" data-tool-id="png-webp-converter">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">cloud_upload</span>
                        <p style="margin-top: 16px;">PNG 또는 WebP 이미지를 업로드하세요</p>
                        <input type="file" id="fileInput" accept="image/png,image/webp" style="display: none;">
                    </div>
                    <div id="previewArea" style="display: none; text-align: center; margin-bottom: 24px;">
                        <img id="preview" style="max-width: 100%; max-height: 400px; border-radius: 8px;">
                    </div>
                    <div id="controls" style="display: none;">
                        <div style="margin-bottom: 16px;">
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">변환 형식</label>
                            <select id="format"
                                style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                                <option value="webp">WebP</option>
                                <option value="png">PNG</option>
                            </select>
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">품질 (<span
                                    id="qualityValue">90</span>%)</label>
                            <input type="range" id="quality" min="1" max="100" value="90" style="width: 100%;">
                        </div>
                        <button class="btn btn-primary" id="convertBtn" style="width: 100%;">변환 및 다운로드</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('png-webp-converter', {
            elements: {},
            currentImage: null,

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    previewArea: document.getElementById('previewArea'),
                    preview: document.getElementById('preview'),
                    controls: document.getElementById('controls'),
                    format: document.getElementById('format'),
                    quality: document.getElementById('quality'),
                    qualityValue: document.getElementById('qualityValue'),
                    convertBtn: document.getElementById('convertBtn')
                };

                this.handleClick = () => this.elements.fileInput.click();
                this.handleFileChange = (e) => this.handleFile(e);
                this.handleQualityInput = () => {
                    this.elements.qualityValue.textContent = this.elements.quality.value;
                };
                this.handleConvert = () => this.convert();

                this.elements.dropZone.addEventListener('click', this.handleClick);
                this.elements.fileInput.addEventListener('change', this.handleFileChange);
                this.elements.quality.addEventListener('input', this.handleQualityInput);
                this.elements.convertBtn.addEventListener('click', this.handleConvert);

                console.log('PNG-WebP Converter initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClick);
                    this.elements.fileInput.removeEventListener('change', this.handleFileChange);
                    this.elements.quality.removeEventListener('input', this.handleQualityInput);
                    this.elements.convertBtn.removeEventListener('click', this.handleConvert);
                }
                this.elements = {};
                this.currentImage = null;
                console.log('PNG-WebP Converter cleanup done');
            },

            handleFile(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    this.currentImage = new Image();
                    this.currentImage.onload = () => {
                        this.elements.preview.src = evt.target.result;
                        this.elements.dropZone.style.display = 'none';
                        this.elements.previewArea.style.display = 'block';
                        this.elements.controls.style.display = 'block';

                        // Auto-select opposite format
                        this.elements.format.value = file.type === 'image/webp' ? 'png' : 'webp';
                    };
                    this.currentImage.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            },

            convert() {
                if (!this.currentImage) return;

                const canvas = document.createElement('canvas');
                canvas.width = this.currentImage.width;
                canvas.height = this.currentImage.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(this.currentImage, 0, 0);

                const mimeType = this.elements.format.value === 'webp' ? 'image/webp' : 'image/png';
                const qualityValue = this.elements.quality.value / 100;

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `converted.${this.elements.format.value}`;
                    link.click();
                    URL.revokeObjectURL(url);
                }, mimeType, qualityValue);
            }
        });
    </script>
</body>

</html>
