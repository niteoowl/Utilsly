<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ZIP 압축 - Utilsly</title>
    <meta name="description" content="여러 파일을 ZIP으로 압축하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">ZIP 압축</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">folder_zip</span></div>
                    <h1>ZIP 압축</h1>
                    <p class="description">여러 파일을 ZIP으로 압축하세요.</p>
                </div>
                <div class="tool-container" data-tool-id="zip-compress">
                    <div class="drop-zone" id="drop-zone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">여러 파일 선택 가능 • ZIP으로 압축됩니다</p>
                        <input type="file" id="file-input" multiple style="display: none;">
                    </div>
                    <div id="file-list" style="margin-bottom: 24px;"></div>
                    <div id="controls" style="display: none;">
                        <div style="margin-bottom: 16px;">
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">ZIP 파일명</label>
                            <input type="text" id="zip-name" value="archive">
                        </div>
                        <button class="btn btn-primary" id="btn-compress" style="width: 100%; padding: 12px;">ZIP으로 압축 및
                            다운로드</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        Utilsly.registerTool('zip-compress', {
            files: [],

            init() {
                this.elements = {
                    dropZone: document.getElementById('drop-zone'),
                    fileInput: document.getElementById('file-input'),
                    fileList: document.getElementById('file-list'),
                    controls: document.getElementById('controls'),
                    zipNameInput: document.getElementById('zip-name'),
                    btnCompress: document.getElementById('btn-compress')
                };

                this.bindEvents();
            },

            cleanup() { this.elements = {}; this.files = []; },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFiles(e.target.files));

                this.elements.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.add('dragover');
                });
                this.elements.dropZone.addEventListener('dragleave', () => {
                    this.elements.dropZone.classList.remove('dragover');
                });
                this.elements.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                    this.handleFiles(e.dataTransfer.files);
                });

                this.elements.btnCompress.addEventListener('click', () => this.compress());
            },

            handleFiles(fileList) {
                this.files = Array.from(fileList);
                if (this.files.length > 0) {
                    this.renderFileList();
                    this.elements.controls.style.display = 'block';
                }
            },

            renderFileList() {
                this.elements.fileList.innerHTML = '<div style="font-weight: 600; margin-bottom: 12px;">선택된 파일 (' + this.files.length + '개)</div>';
                this.files.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-sidebar); border-radius: 8px; margin-bottom: 8px;';
                    item.innerHTML = `
                        <span style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%;">${file.name} (${this.formatFileSize(file.size)})</span>
                        <button class="btn" onclick="Utilsly.tools['zip-compress'].removeFile(${index})" style="padding: 4px 8px; border:none; background:none;">
                            <span class="material-symbols-rounded" style="font-size: 18px;">close</span>
                        </button>
                    `;
                    this.elements.fileList.appendChild(item);
                });
            },

            removeFile(index) {
                this.files.splice(index, 1);
                if (this.files.length === 0) {
                    this.elements.fileList.innerHTML = '';
                    this.elements.controls.style.display = 'none';
                } else {
                    this.renderFileList();
                }
            },

            formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            },

            async compress() {
                if (this.files.length === 0) return;

                this.elements.btnCompress.disabled = true;
                this.elements.btnCompress.textContent = '압축 중...';

                try {
                    const zip = new JSZip();
                    for (const file of this.files) {
                        zip.file(file.name, file);
                    }

                    const content = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(content);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = (this.elements.zipNameInput.value || 'archive') + '.zip';
                    link.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    console.error(e);
                    Utilsly.showAlert('압축 중 오류가 발생했습니다.');
                } finally {
                    this.elements.btnCompress.disabled = false;
                    this.elements.btnCompress.textContent = 'ZIP으로 압축 및 다운로드';
                }
            }
        });
    </script>
</body>

</html>
