<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ZIP 압축 해제 - Utilsly</title>
    <meta name="description" content="ZIP 파일의 압축을 해제하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">ZIP 압축 해제</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">folder_open</span></div>
                    <h1>ZIP 압축 해제</h1>
                    <p class="description">ZIP 파일의 압축을 해제하고 파일을 다운로드하세요.</p>
                </div>
                <div class="tool-container" data-tool-id="zip-decompress">
                    <div class="drop-zone" id="drop-zone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">ZIP 파일을 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">압축을 해제할 파일을 선택하세요</p>
                        <input type="file" id="file-input" accept=".zip,application/zip" style="display: none;">
                    </div>
                    <div id="file-list" style="margin-bottom: 24px;"></div>
                    <div id="controls" style="display: none;">
                        <button class="btn btn-primary" id="btn-download-all"
                            style="width: 100%; margin-bottom: 12px; padding: 12px;">모든 파일 다운로드</button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li>업로드 영역을 클릭하거나 ZIP 파일을 드래그하여 업로드합니다.</li>
                            <li>파일 목록에서 압축 해제할 파일들을 확인합니다.</li>
                            <li>'모든 파일 다운로드' 버튼을 클릭하여 압축을 해제합니다.</li>
                        </ol>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        Utilsly.registerTool('zip-decompress', {
            extractedFiles: [],

            init() {
                this.elements = {
                    dropZone: document.getElementById('drop-zone'),
                    fileInput: document.getElementById('file-input'),
                    fileList: document.getElementById('file-list'),
                    controls: document.getElementById('controls'),
                    btnDownloadAll: document.getElementById('btn-download-all')
                };

                this.bindEvents();
            },

            cleanup() { this.elements = {}; this.extractedFiles = []; },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                this.elements.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.add('dragover');
                });
                this.elements.dropZone.addEventListener('dragleave', () => {
                    this.elements.dropZone.classList.remove('dragover');
                });
                this.elements.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                    this.handleFile(e.dataTransfer.files[0]);
                });

                this.elements.btnDownloadAll.addEventListener('click', () => this.downloadAll());
            },

            async handleFile(file) {
                if (!file) return;

                try {
                    const zip = new JSZip();
                    const contents = await zip.loadAsync(file);
                    this.extractedFiles = [];

                    for (const [filename, fileData] of Object.entries(contents.files)) {
                        if (!fileData.dir) {
                            const blob = await fileData.async('blob');
                            this.extractedFiles.push({ name: filename, blob: blob });
                        }
                    }

                    this.renderFileList();
                    this.elements.dropZone.style.display = 'none';
                    this.elements.controls.style.display = 'block';
                } catch (error) {
                    console.error(error);
                    Utilsly.showAlert('ZIP 파일을 읽는 중 오류가 발생했습니다.');
                }
            },

            renderFileList() {
                this.elements.fileList.innerHTML = '<div style="font-weight: 600; margin-bottom: 12px;">압축 해제된 파일 (' + this.extractedFiles.length + '개)</div>';
                this.extractedFiles.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-sidebar); border-radius: 8px; margin-bottom: 8px;';
                    item.innerHTML = `
                        <span style="font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">${file.name} (${this.formatFileSize(file.blob.size)})</span>
                        <button class="btn btn-primary" onclick="Utilsly.tools['zip-decompress'].downloadFile(${index})" style="padding: 8px 16px;">
                            <span class="material-symbols-rounded" style="font-size: 18px;">download</span>
                        </button>
                    `;
                    this.elements.fileList.appendChild(item);
                });
            },

            formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            },

            downloadFile(index) {
                const file = this.extractedFiles[index];
                const url = URL.createObjectURL(file.blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = file.name;
                link.click();
                URL.revokeObjectURL(url);
            },

            downloadAll() {
                this.extractedFiles.forEach((file, index) => {
                    setTimeout(() => this.downloadFile(index), index * 100);
                });
            }
        });
    </script>
</body>

</html>
