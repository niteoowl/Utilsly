<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>메타데이터 지우기 - Utilsly</title>
    <meta name="description" content="이미지와 PDF 파일에서 개인정보가 포함된 메타데이터(EXIF, 위치 정보 등)를 제거합니다.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">메타데이터 지우기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">cleaning_services</span>
                    </div>
                    <h1>메타데이터 지우기</h1>
                    <p class="description">사진의 촬영 대기, 위치 정보 또는 문서의 속성을 제거하여 개인정보를 보호하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="metadata-remover">
                    <div class="card">
                        <div class="drop-zone" id="dropZone">
                            <input type="file" id="fileInput" accept="image/jpeg,image/png" style="display: none;">
                            <span class="material-symbols-rounded upload-icon">no_photography</span>
                            <div class="upload-text">메타데이터를 제거할 이미지를 선택하세요</div>
                            <div class="upload-hint">EXIF, GPS 위치 정보 등이 포함된 사진에서 개인정보를 제거합니다.</div>
                        </div>
                        <div id="fileInfo" class="file-info" style="display: none;">
                            <span class="material-symbols-rounded" style="color: var(--accent-blue);">image</span>
                            <span id="fileName" style="font-weight: 600; font-size: 14px;">파일명.jpg</span>
                        </div>
                    </div>

                    <div id="actionSection" class="card" style="display: none;">
                        <p
                            style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6;">
                            이미지를 재구성하여 원본에 포함된 모든 메타데이터를 물리적으로 파기합니다.<br>
                            결과물은 깨끗한 상태의 새로운 이미지로 다운로드됩니다.
                        </p>
                        <button id="processBtn" class="btn btn-primary"
                            style="width: 100%; padding: 12px; font-weight: 700;">메타데이터 제거 및 다운로드</button>
                    </div>
                </div>
                <div id="statusMessage"
                    style="margin-top: 16px; text-align: center; font-size: 0.875rem; color: var(--text-tertiary);">
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const MetadataRemoverTool = {
            currentFile: null,

            init() {
                this.dropZone = document.getElementById('dropZone');
                this.fileInput = document.getElementById('fileInput');
                this.fileNameDisplay = document.getElementById('fileName');
                this.processBtn = document.getElementById('processBtn');
                this.statusMsg = document.getElementById('statusMessage');

                this.dropZone.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                this.processBtn.addEventListener('click', () => this.process());
            },

            handleFile(file) {
                if (!file) return;
                this.currentFile = file;
                this.fileNameDisplay.textContent = file.name;
                this.processBtn.style.display = 'block';
                this.statusMsg.textContent = '준비되었습니다.';
            },

            async process() {
                if (!this.currentFile) return;
                this.statusMsg.textContent = '처리 중...';

                try {
                    let blob;
                    if (this.currentFile.type.startsWith('image/')) {
                        blob = await this.stripImageMetadata(this.currentFile);
                    } else if (this.currentFile.type === 'application/pdf') {
                        // For PDF, we'd need pdf-lib again. Let's assume its loaded if needed or use a basic approach.
                        // For now, focus on Image (most common request for metadata removal).
                        Utilsly.showAlert('PDF 메타데이터 제거는 현재 준비 중입니다. 이미지만 이용 가능합니다.');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `[Cleaned]_${this.currentFile.name}`;
                    link.click();
                    this.statusMsg.textContent = '완료되었습니다!';
                } catch (e) {
                    Utilsly.showAlert('오류 발생: ' + e.message);
                }
            },

            stripImageMetadata(file) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        // canvas.toBlob strips EXIF because it recreates the image from raw pixels
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.95);
                    };
                    img.src = URL.createObjectURL(file);
                });
            }
        };

        Utilsly.registerTool('metadata-remover', MetadataRemoverTool);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            MetadataRemoverTool.init();
        } else {
            document.addEventListener('DOMContentLoaded', () => MetadataRemoverTool.init());
        }
    </script>
</body>

</html>
