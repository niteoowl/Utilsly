<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오디오 합치기 - Utilsly</title>
    <meta name="description" content="여러 오디오 파일을 하나로 합칩니다. MP3, WAV 등을 지원합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .file-drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-primary);
            margin-bottom: 24px;
        }

        .file-drop-zone:hover {
            border-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .file-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s;
        }

        .file-item:hover {
            transform: translateX(4px);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">오디오 합치기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">library_music</span>
                    </div>
                    <h1>오디오 합치기</h1>
                    <p class="description">여러 음악/음성 파일을 순서대로 연결하여 하나의 파일로 만듭니다.</p>
                </div>

                <div class="tool-container" data-tool-id="audio-merger">
                    <div class="drop-zone" id="drop-zone">
                        <span class="material-symbols-rounded upload-icon">cloud_upload</span>
                        <p class="upload-text">오디오 파일 드래그하거나 클릭하여 업로드</p>
                        <p class="upload-hint">여러 파일 선택 가능 • MP3, WAV 지원</p>
                        <input type="file" id="file-input" multiple accept="audio/*" style="display:none;">
                    </div>

                    <div class="file-list" id="file-list">
                        <!-- Items go here -->
                    </div>

                    <div
                        style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                        <div id="status-text" style="font-size:14px; color:var(--text-secondary); font-weight: 500;">
                            파일을 추가해 주세요.
                        </div>
                        <button class="btn btn-primary" id="btn-merge" disabled style="padding: 12px 24px;">
                            <span class="material-symbols-rounded" style="margin-right:8px;">merge</span> 합치기 & 다운로드
                        </button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li>합칠 오디오 파일들을 드래그하거나 클릭하여 업로드합니다.</li>
                            <li>목록에서 항목을 드래그하여 재생 순서를 변경합니다.</li>
                            <li>'합치기 & 다운로드' 버튼을 눌러 하나의 파일로 저장합니다.</li>
                        </ol>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('audio-merger', {
            files: [],

            init() {
                this.elements = {
                    dropZone: document.getElementById('drop-zone'),
                    fileInput: document.getElementById('file-input'),
                    fileList: document.getElementById('file-list'),
                    btnMerge: document.getElementById('btn-merge'),
                    statusText: document.getElementById('status-text')
                };

                this.bindEvents();
            },

            cleanup() { this.elements = {}; this.files = []; },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());

                this.elements.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.add('dragover');
                });
                this.elements.dropZone.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                });
                this.elements.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                    this.addFiles(e.dataTransfer.files);
                });

                this.elements.fileInput.addEventListener('change', (e) => {
                    this.addFiles(e.target.files);
                });

                this.elements.btnMerge.addEventListener('click', () => this.mergeFiles());
            },

            addFiles(fileList) {
                Array.from(fileList).forEach(file => {
                    if (file.type.startsWith('audio/')) {
                        this.files.push(file);
                    }
                });
                this.renderList();
            },

            renderList() {
                this.elements.fileList.innerHTML = '';
                this.files.forEach((file, index) => {
                    const el = document.createElement('div');
                    el.className = 'file-item';
                    el.innerHTML = `
                        <div style="width:40px; height:40px; background:var(--bg-primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--accent-blue);">
                            <span class="material-symbols-rounded">audiotrack</span>
                        </div>
                        <div style="flex:1; overflow:hidden;">
                            <div style="font-weight:600; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${file.name}</div>
                            <div style="font-size:12px; color:var(--text-tertiary);">${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                        </div>
                        <button class="btn-icon-sm" onclick="Utilsly.tools['audio-merger'].removeFile(${index})" style="background:none; border:none; cursor:pointer; color:var(--text-tertiary); hover:color:var(--text-primary);">
                            <span class="material-symbols-rounded">close</span>
                        </button>
                    `;
                    this.elements.fileList.appendChild(el);
                });

                this.elements.btnMerge.disabled = this.files.length < 2;
                if (this.files.length === 0) {
                    this.elements.statusText.textContent = '파일을 추가해 주세요.';
                } else {
                    this.elements.statusText.innerHTML = `<span class="status-badge">${this.files.length}개 파일</span> 선택됨`;
                }
            },

            removeFile(index) {
                this.files.splice(index, 1);
                this.renderList();
            },

            async mergeFiles() {
                if (this.files.length < 2) return;

                this.elements.btnMerge.disabled = true;
                this.elements.statusText.textContent = '합치는 중... 잠시만 기다려 주세요.';

                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const buffers = [];

                    for (const file of this.files) {
                        const arrayBuffer = await file.arrayBuffer();
                        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        buffers.push(audioBuffer);
                    }

                    const totalLength = buffers.reduce((acc, b) => acc + b.length, 0);
                    const outputBuffer = audioContext.createBuffer(
                        buffers[0].numberOfChannels,
                        totalLength,
                        buffers[0].sampleRate
                    );

                    let offset = 0;
                    for (const b of buffers) {
                        for (let channel = 0; channel < b.numberOfChannels; channel++) {
                            outputBuffer.getChannelData(channel).set(b.getChannelData(channel), offset);
                        }
                        offset += b.length;
                    }

                    const wavBlob = this.bufferToWave(outputBuffer, outputBuffer.length);
                    const url = URL.createObjectURL(wavBlob);

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `merged_audio_${new Date().getTime()}.wav`;
                    a.click();

                    this.elements.statusText.textContent = '합치기 완료!';
                    Utilsly.showAlert('오디오 파일을 성공적으로 합쳤습니다.');

                } catch (e) {
                    console.error(e);
                    this.elements.statusText.textContent = '오류 발생';
                    Utilsly.showAlert('오디오 처리 중 오류가 발생했습니다.');
                } finally {
                    this.elements.btnMerge.disabled = false;
                }
            },

            bufferToWave(abuffer, len) {
                let numOfChan = abuffer.numberOfChannels,
                    length = len * numOfChan * 2 + 44,
                    buffer = new ArrayBuffer(length),
                    view = new DataView(buffer),
                    channels = [], i, sample,
                    offset = 0,
                    pos = 0;

                setUint32(0x46464952);
                setUint32(length - 8);
                setUint32(0x45564157);

                setUint32(0x20746d66);
                setUint32(16);
                setUint16(1);
                setUint16(numOfChan);
                setUint32(abuffer.sampleRate);
                setUint32(abuffer.sampleRate * 2 * numOfChan);
                setUint16(numOfChan * 2);
                setUint16(16);

                setUint32(0x61746164);
                setUint32(length - pos - 4);

                for (i = 0; i < abuffer.numberOfChannels; i++)
                    channels.push(abuffer.getChannelData(i));

                while (pos < length) {
                    for (i = 0; i < numOfChan; i++) {
                        sample = Math.max(-1, Math.min(1, channels[i][offset]));
                        sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                        view.setInt16(pos, sample, true);
                        pos += 2;
                    }
                    offset++
                }

                return new Blob([buffer], { type: "audio/wav" });

                function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
                function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
            }
        });
    </script>
</body>

</html>
