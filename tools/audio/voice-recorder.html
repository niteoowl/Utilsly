<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>음성 녹음기 - Utilsly</title>
    <meta name="description" content="웹 브라우저에서 바로 음성을 녹음하고 파일로 저장하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .recorder-container {
            text-align: center;
            padding: 40px;
            background: var(--bg-sidebar);
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .timer {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FF4B4B;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 75, 75, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .record-btn:hover {
            transform: scale(1.05);
            background: #FF3333;
        }

        .record-btn.recording {
            background: var(--bg-primary);
            border: 2px solid #FF4B4B;
            animation: pulse 2s infinite;
        }

        .record-btn.recording span {
            color: #FF4B4B;
            font-size: 32px;
        }

        .record-btn span {
            color: white;
            font-size: 32px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 75, 75, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(255, 75, 75, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 75, 75, 0);
            }
        }

        .audio-list {
            margin-top: 32px;
        }

        .audio-item {
            display: flex;
            gap: 16px;
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        audio {
            flex: 1;
            height: 40px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">음성 녹음기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">mic</span>
                    </div>
                    <h1>음성 녹음기</h1>
                    <p class="description">마이크를 사용하여 음성을 녹음하고 다운로드하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="voice-recorder">
                    <div class="recorder-container">
                        <canvas id="visualizer" width="600" height="100"
                            style="width: 100%; height: 100px; margin-bottom: 24px; border-radius: 8px;"></canvas>
                        <div class="timer" id="timer">00:00</div>
                        <button class="record-btn" id="recordBtn">
                            <span class="material-symbols-rounded">mic</span>
                        </button>
                        <p style="margin-top: 16px; color: var(--text-secondary);" id="statusText">버튼을 눌러 녹음 시작</p>
                    </div>

                    <div class="audio-list" id="audioList">
                        <!-- Recordings will appear here -->
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">녹음 파일 형식은 무엇인가요?</div>
                            <div class="faq-answer">브라우저 표준인 WebM 형식을 사용합니다. 팟플레이어 등 대부분의 최신 플레이어에서 재생 가능합니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">녹음 시간 제약이 있나요?</div>
                            <div class="faq-answer">서버에 저장하지 않고 브라우저 메모리를 사용하므로, 기기 성능에 따라 수 시간 녹음 시 메모리 부족이 발생할 수 있습니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('voice-recorder', {
            elements: {},
            mediaRecorder: null,
            audioChunks: [],
            isRecording: false,
            startTime: null,
            timerInterval: null,
            audioContext: null,
            analyser: null,
            source: null,
            animationId: null,

            init() {
                this.elements = {
                    recordBtn: document.getElementById('recordBtn'),
                    timerDisplay: document.getElementById('timer'),
                    statusText: document.getElementById('statusText'),
                    audioList: document.getElementById('audioList'),
                    canvas: document.getElementById('visualizer')
                };

                if (this.elements.canvas) {
                    this.elements.canvasCtx = this.elements.canvas.getContext('2d');
                }

                this.handleToggle = () => this.toggleRecording();
                this.elements.recordBtn.addEventListener('click', this.handleToggle);

                console.log('Voice Recorder initialized');
            },

            cleanup() {
                if (this.elements.recordBtn) {
                    this.elements.recordBtn.removeEventListener('click', this.handleToggle);
                }
                this.stopRecording();
                this.elements = {};
                console.log('Voice Recorder cleanup done');
            },

            async toggleRecording() {
                if (!this.isRecording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.startRecording(stream);
                    } catch (err) {
                        alert('마이크 권한이 필요합니다.');
                        console.error(err);
                    }
                } else {
                    this.stopRecording();
                }
            },

            startRecording(stream) {
                // Audio Context Setup for Visualizer
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.analyser = this.audioContext.createAnalyser();
                this.source = this.audioContext.createMediaStreamSource(stream);
                this.source.connect(this.analyser);
                this.analyser.fftSize = 256;

                this.visualize();

                // MediaRecorder Setup
                this.mediaRecorder = new MediaRecorder(stream);
                this.audioChunks = [];

                this.mediaRecorder.ondataavailable = (event) => {
                    this.audioChunks.push(event.data);
                };

                this.mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    this.addAudioItem(audioUrl);
                };

                this.mediaRecorder.start();
                this.isRecording = true;
                this.elements.recordBtn.classList.add('recording');
                this.elements.recordBtn.innerHTML = '<span class="material-symbols-rounded">stop</span>';
                this.elements.statusText.textContent = '녹음 중...';

                this.startTime = Date.now();
                this.timerInterval = setInterval(() => this.updateTimer(), 1000);
            },

            stopRecording() {
                if (!this.isRecording) return;

                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    this.mediaRecorder.stop();
                    // Stop all tracks to release microphone
                    this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }

                this.isRecording = false;
                if (this.elements.recordBtn) {
                    this.elements.recordBtn.classList.remove('recording');
                    this.elements.recordBtn.innerHTML = '<span class="material-symbols-rounded">mic</span>';
                    this.elements.statusText.textContent = '버튼을 눌러 녹음 시작';
                }

                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                if (this.elements.timerDisplay) {
                    this.elements.timerDisplay.textContent = '00:00';
                }

                // Stop Visualizer
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }

                // Clear Canvas
                if (this.elements.canvasCtx) {
                    this.elements.canvasCtx.clearRect(0, 0, this.elements.canvas.width, this.elements.canvas.height);
                }
            },

            visualize() {
                const bufferLength = this.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const canvas = this.elements.canvas;
                const canvasCtx = this.elements.canvasCtx;

                const draw = () => {
                    this.animationId = requestAnimationFrame(draw);
                    this.analyser.getByteFrequencyData(dataArray);

                    // Clear with background color (transparent for now or white/dark)
                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height); // Safer for transparency

                    // Or fill with bg color
                    // const bgColor = getComputedStyle(document.querySelector('.recorder-container')).backgroundColor;
                    // canvasCtx.fillStyle = bgColor;
                    // canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                    const barWidth = (canvas.width / bufferLength) * 2.5;
                    let barHeight;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        barHeight = dataArray[i] / 2;

                        // Dynamic Color based on theme
                        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                        canvasCtx.fillStyle = isDark ? `rgb(${barHeight + 100}, 255, 100)` : `rgb(${barHeight + 100}, 50, 50)`;

                        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                        x += barWidth + 1;
                    }
                };

                draw();
            },

            updateTimer() {
                if (!this.elements.timerDisplay) return;
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                this.elements.timerDisplay.textContent = `${minutes}:${seconds}`;
            },

            addAudioItem(url) {
                const item = document.createElement('div');
                item.className = 'audio-item';
                const date = new Date().toLocaleString();

                item.innerHTML = `
                    <div style="font-weight: 500; min-width: 120px;">${date}</div>
                    <audio controls src="${url}"></audio>
                    <a href="${url}" download="recording-${Date.now()}.webm" class="btn btn-primary" style="padding: 8px 16px;">
                        <span class="material-symbols-rounded">download</span>
                    </a>
                `;

                this.elements.audioList.prepend(item);
            }
        });
    </script>
</body>

</html>
