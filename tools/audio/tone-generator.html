<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>주파수 생성기 - Utilsly</title>
    <meta name="description" content="특정 주파수(Hz)의 소리를 생성합니다. 스피커 테스트나 청력 테스트에 활용하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .generator-container {

            text-align: center;
        }

        .frequency-display {
            font-size: 64px;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 32px;
            font-variant-numeric: tabular-nums;
        }

        .slider-container {
            margin-bottom: 40px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .preset-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: none;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 12px rgba(49, 130, 246, 0.3);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .play-btn.playing {
            background: #FF4B4B;
            box-shadow: 0 4px 12px rgba(255, 75, 75, 0.3);
        }

        .play-btn span {
            font-size: 40px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">주파수 생성기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">graphic_eq</span>
                    </div>
                    <h1>주파수 생성기</h1>
                    <p class="description">원하는 주파수의 순수 톤(Sine Wave)을 생성합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="tone-generator">
                    <div class="generator-container">
                        <div class="frequency-display">
                            <span id="freqValue">440</span> <span
                                style="font-size: 24px; color: var(--text-secondary);">Hz</span>
                        </div>

                        <div class="slider-container">
                            <input type="range" id="freqSlider" min="20" max="20000" value="440" step="1">
                        </div>

                        <div class="preset-btns" id="presetBtns">
                            <button class="btn" data-freq="60">60Hz</button>
                            <button class="btn" data-freq="440">440Hz</button>
                            <button class="btn" data-freq="1000">1kHz</button>
                            <button class="btn" data-freq="10000">10kHz</button>
                        </div>

                        <div style="margin-bottom: 24px;">
                            <label style="margin-right: 12px;">파형 선택:</label>
                            <select id="waveType" class="form-select">
                                <option value="sine">Sine (사인파)</option>
                                <option value="square">Square (사각파)</option>
                                <option value="sawtooth">Sawtooth (톱니파)</option>
                                <option value="triangle">Triangle (삼각파)</option>
                            </select>
                        </div>

                        <button class="play-btn" id="playBtn">
                            <span class="material-symbols-rounded">play_arrow</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('tone-generator', {
            elements: {},
            audioCtx: null,
            oscillator: null,
            gainNode: null,
            isPlaying: false,

            init() {
                this.elements = {
                    freqSlider: document.getElementById('freqSlider'),
                    freqValue: document.getElementById('freqValue'),
                    playBtn: document.getElementById('playBtn'),
                    waveTypeSelect: document.getElementById('waveType'),
                    presetBtns: document.getElementById('presetBtns')
                };

                this.handleSlider = (e) => this.updateFreq(e.target.value);
                this.handleWave = (e) => this.setWaveType(e.target.value);
                this.handlePlay = () => this.togglePlay();
                this.handlePreset = (e) => {
                    if (e.target.tagName === 'BUTTON') {
                        this.setFreq(parseInt(e.target.getAttribute('data-freq')));
                    }
                };

                this.elements.freqSlider.addEventListener('input', this.handleSlider);
                this.elements.waveTypeSelect.addEventListener('change', this.handleWave);
                this.elements.playBtn.addEventListener('click', this.handlePlay);
                this.elements.presetBtns.addEventListener('click', this.handlePreset);

                console.log('Tone Generator initialized');
            },

            cleanup() {
                if (this.elements.freqSlider) {
                    this.elements.freqSlider.removeEventListener('input', this.handleSlider);
                    this.elements.waveTypeSelect.removeEventListener('change', this.handleWave);
                    this.elements.playBtn.removeEventListener('click', this.handlePlay);
                    this.elements.presetBtns.removeEventListener('click', this.handlePreset);
                }

                this.stopSound();
                if (this.audioCtx) {
                    this.audioCtx.close();
                    this.audioCtx = null;
                }

                this.elements = {};
                console.log('Tone Generator cleanup done');
            },

            updateFreq(val) {
                this.elements.freqValue.textContent = val;
                if (this.oscillator) {
                    this.oscillator.frequency.value = val;
                }
            },

            setFreq(val) {
                this.elements.freqSlider.value = val;
                this.updateFreq(val);
            },

            setWaveType(type) {
                if (this.oscillator) {
                    this.oscillator.type = type;
                }
            },

            togglePlay() {
                if (!this.isPlaying) {
                    this.playSound();
                } else {
                    this.stopSound();
                }
            },

            playSound() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }

                this.oscillator = this.audioCtx.createOscillator();
                this.gainNode = this.audioCtx.createGain();

                this.oscillator.type = this.elements.waveTypeSelect.value;
                this.oscillator.frequency.value = this.elements.freqSlider.value;

                this.oscillator.connect(this.gainNode);
                this.gainNode.connect(this.audioCtx.destination);

                this.oscillator.start();

                // Fade in
                this.gainNode.gain.setValueAtTime(0, this.audioCtx.currentTime);
                this.gainNode.gain.linearRampToValueAtTime(0.5, this.audioCtx.currentTime + 0.1);

                this.isPlaying = true;
                this.elements.playBtn.classList.add('playing');
                this.elements.playBtn.innerHTML = '<span class="material-symbols-rounded">stop</span>';
            },

            stopSound() {
                if (!this.isPlaying || !this.oscillator) return;

                // Fade out
                // Check if context is still running to avoid errors
                if (this.audioCtx && this.audioCtx.state === 'running') {
                    this.gainNode.gain.linearRampToValueAtTime(0, this.audioCtx.currentTime + 0.1);
                    setTimeout(() => {
                        if (this.oscillator) {
                            try {
                                this.oscillator.stop();
                                this.oscillator.disconnect();
                            } catch (e) { }
                        }
                        if (this.gainNode) {
                            try {
                                this.gainNode.disconnect();
                            } catch (e) { }
                        }
                    }, 100);
                }

                this.isPlaying = false;
                if (this.elements.playBtn) {
                    this.elements.playBtn.classList.remove('playing');
                    this.elements.playBtn.innerHTML = '<span class="material-symbols-rounded">play_arrow</span>';
                }
            }
        });
    </script>
</body>

</html>
