<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PDF 이미지 변환 - Utilsly</title>
    <meta name="description" content="PDF 페이지를 고화질 이미지(JPG, PNG)로 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .page-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 24px;
        }

        .page-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        canvas {
            max-width: 100%;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">PDF 이미지 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">image_search</span>
                    </div>
                    <h1>PDF 이미지 변환</h1>
                    <p class="description">PDF의 각 페이지를 이미지 파일로 변환하여 다운로드하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="pdf-to-image">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">upload_file</span>
                        <p style="margin-top: 16px;">PDF 파일을 업로드하세요</p>
                        <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
                    </div>

                    <div id="resultArea" style="display: none;">
                        <div class="page-list" id="pageList"></div>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li><strong>업로드:</strong> PDF 파일을 선택하여 불러오세요.</li>
                            <li><strong>미리보기:</strong> 각 페이지가 이미지로 변환되어 화면에 표시됩니다.</li>
                            <li><strong>저장:</strong> 원하는 페이지만 골라 저장하거나, 모든 페이지를 이미지 파일로 다운로드하세요.</li>
                        </ol>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        Utilsly.registerTool('pdf-to-image', {
            elements: {},

            init() {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    resultArea: document.getElementById('resultArea'),
                    pageList: document.getElementById('pageList')
                };

                this.handleClickDropZone = () => this.elements.fileInput.click();
                this.handleChangeFile = (e) => {
                    if (e.target.files.length > 0) this.convertPDF(e.target.files[0]);
                };

                this.elements.dropZone.addEventListener('click', this.handleClickDropZone);
                this.elements.fileInput.addEventListener('change', this.handleChangeFile);

                console.log('PDF to Image initialized');
            },

            cleanup() {
                if (this.elements.dropZone) this.elements.dropZone.removeEventListener('click', this.handleClickDropZone);
                if (this.elements.fileInput) this.elements.fileInput.removeEventListener('change', this.handleChangeFile);
                this.elements = {};
                console.log('PDF to Image cleanup done');
            },

            async convertPDF(file) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;

                this.elements.dropZone.style.display = 'none';
                this.elements.resultArea.style.display = 'block';
                this.elements.pageList.innerHTML = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });

                    const card = document.createElement('div');
                    card.className = 'page-card';

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    const btn = document.createElement('button');
                    btn.className = 'btn btn-primary';
                    btn.textContent = `Page ${i} 다운로드 (PNG)`;

                    // Helper to download image
                    const downloadImage = () => {
                        const link = document.createElement('a');
                        link.download = `page-${i}.png`;
                        link.href = canvas.toDataURL();
                        link.click();
                    };
                    btn.addEventListener('click', downloadImage);

                    card.appendChild(canvas);
                    card.appendChild(btn);
                    this.elements.pageList.appendChild(card);
                }
            }
        });
    </script>
</body>

</html>
