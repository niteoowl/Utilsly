<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PDF 암호 제거 - Utilsly</title>
    <meta name="description" content="암호가 걸린 PDF 파일의 보호를 해제하고 일반 PDF로 저장해 보세요. (기존 암호를 알고 있어야 합니다)">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">PDF 암호 제거</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">no_encryption</span>
                    </div>
                    <h1>PDF 암호 제거</h1>
                    <p class="description">비밀번호를 입력하여 PDF의 암호 잠금을 해제하고 보호되지 않은 파일로 저장합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="remove-password">
                    <div class="card">
                        <div class="drop-zone" id="dropZone">
                            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
                            <span class="material-symbols-rounded upload-icon">upload_file</span>
                            <div class="upload-text">암호를 제거할 PDF 파일을 선택하거나 드래그하세요</div>
                            <div class="upload-hint">업로드된 파일은 서버에 저장되지 않고 브라우저에서 즉시 처리됩니다.</div>
                        </div>
                        <div id="fileInfo" class="file-info" style="display: none;">
                            <span class="material-symbols-rounded" style="color: #ef4444;">picture_as_pdf</span>
                            <span id="fileName" style="font-weight: 600; font-size: 14px;">파일명.pdf</span>
                        </div>
                    </div>

                    <div id="passwordSection" class="card" style="display: none;">
                        <div class="input-group">
                            <label for="pdfPassword"
                                style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">PDF
                                비밀번호</label>
                            <input type="password" id="pdfPassword" class="input-field" style="width: 100%;"
                                placeholder="PDF의 비밀번호를 입력하세요">
                        </div>
                        <button id="processBtn" class="btn btn-primary"
                            style="width: 100%; margin-top: 20px; padding: 12px; font-weight: 700;">비밀번호 제거 및
                            다운로드</button>
                    </div>
                </div>
                <div id="statusMessage"
                    style="margin-top: 16px; text-align: center; font-size: 0.875rem; color: var(--text-tertiary);">
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const PdfPasswordTool = {
            currentFile: null,

            init() {
                this.dropZone = document.getElementById('dropZone');
                this.fileInput = document.getElementById('fileInput');
                this.fileNameDisplay = document.getElementById('fileName');
                this.passwordSection = document.getElementById('passwordSection');
                this.passwordInput = document.getElementById('pdfPassword');
                this.unlockBtn = document.getElementById('unlockBtn');
                this.statusMsg = document.getElementById('statusMessage');

                this.dropZone.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                this.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.dropZone.style.borderColor = 'var(--accent-color)';
                    this.dropZone.style.background = 'rgba(var(--accent-rgb), 0.05)';
                });

                this.dropZone.addEventListener('dragleave', () => {
                    this.dropZone.style.borderColor = 'var(--border-color)';
                    this.dropZone.style.background = 'transparent';
                });

                this.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.handleFile(e.dataTransfer.files[0]);
                });

                this.unlockBtn.addEventListener('click', () => this.processPdf());
            },

            handleFile(file) {
                if (!file || file.type !== 'application/pdf') {
                    Utilsly.showAlert('PDF 파일만 지원합니다.');
                    return;
                }
                this.currentFile = file;
                this.fileNameDisplay.textContent = file.name;
                this.passwordSection.style.display = 'block';
                this.statusMsg.textContent = '비밀번호를 입력하고 암호 제거 버튼을 클릭하세요.';
            },

            async processPdf() {
                const password = this.passwordInput.value;
                if (!this.currentFile) return;

                this.statusMsg.textContent = '처리 중...';
                this.unlockBtn.disabled = true;

                try {
                    const arrayBuffer = await this.currentFile.arrayBuffer();

                    // pdf-lib logic: loading with password
                    // If the PDF is not encrypted, it will load fine.
                    // If it is encrypted, we need to pass the password to the loader.
                    // Note: pdf-lib (v1) load doesn't strictly take a password param in the same way 
                    // some native tools do for "removal". It allows reading.
                    // Actually, password support in pdf-lib is for *applying* protection.
                    // Most browser-based "password removal" works by rendering page-by-page to a new PDF
                    // OR by using a lower-level library that handles the encryption streams.

                    // Let's try native loading via PDF-LIB. If it fails due to encryption,
                    // it usually throws an error.

                    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, {
                        password: password,
                        ignoreEncryption: false
                    });

                    // To "remove" password, we just save it. 
                    const pdfBytes = await pdfDoc.save();

                    // Trigger download
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `[Unlocked]_${this.currentFile.name}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    this.statusMsg.textContent = '암호가 성공적으로 제거되었습니다!';
                    Utilsly.showAlert('암호 제거가 완료되었습니다. 파일이 다운로드됩니다.');

                } catch (e) {
                    console.error(e);
                    if (e.message.includes('encrypted') || e.message.includes('Password')) {
                        Utilsly.showAlert('비밀번호가 틀렸거나 암호화 해제에 실패했습니다.');
                    } else {
                        Utilsly.showAlert('PDF 처리 중 오류가 발생했습니다: ' + e.message);
                    }
                    this.statusMsg.textContent = '오류 발생.';
                } finally {
                    this.unlockBtn.disabled = false;
                }
            },

            cleanup() { }
        };

        Utilsly.registerTool('pdf-password', PdfPasswordTool);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            PdfPasswordTool.init();
        } else {
            document.addEventListener('DOMContentLoaded', () => PdfPasswordTool.init());
        }
    </script>
</body>

</html>
