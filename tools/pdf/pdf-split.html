<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PDF 분할 - Utilsly</title>
    <meta name="description" content="PDF 파일을 페이지별로 분할하여 저장하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-item {
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            background: var(--bg-primary);
            transition: all 0.2s;
        }

        .page-item.selected {
            border-color: var(--accent-blue);
            background: rgba(35, 131, 226, 0.05);
        }

        .page-preview {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            font-size: 24px;
            color: var(--text-tertiary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">PDF 분할</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">cut</span>
                    </div>
                    <h1>PDF 분할</h1>
                    <p class="description">PDF 파일을 페이지별로 나누어 저장할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="pdf-split">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">upload_file</span>
                        <p style="margin-top: 16px;">PDF 파일을 업로드하세요</p>
                        <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
                    </div>

                    <div id="splitArea" style="display: none;">
                        <div class="page-grid" id="pageGrid">
                            <!-- Pages will be rendered here -->
                        </div>
                        <button class="btn btn-primary" id="splitBtn" style="width: 100%;">선택한 페이지 분할 저장</button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">원본 파일은 안전한가요?</div>
                            <div class="faq-answer">네, 원본 파일은 변경되지 않으며, 선택한 페이지만 별도의 새 PDF로 저장됩니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">여러 페이지를 한 번에 선택할 수 있나요?</div>
                            <div class="faq-answer">네, 원하는 페이지를 클릭하여 여러 개를 선택한 뒤 '분할 저장'을 누르면 해당 페이지들만 모은 PDF가 생성됩니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        Utilsly.registerTool('pdf-split', {
            currentPdf: null,
            selectedPages: null,
            elements: {},

            init() {
                this.selectedPages = new Set();
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    splitArea: document.getElementById('splitArea'),
                    pageGrid: document.getElementById('pageGrid'),
                    splitBtn: document.getElementById('splitBtn')
                };

                this.handleClickDropZone = () => this.elements.fileInput.click();
                this.handleChangeFile = (e) => {
                    if (e.target.files.length > 0) this.loadPDF(e.target.files[0]);
                };
                this.handleSplit = () => this.splitPDF();

                this.elements.dropZone.addEventListener('click', this.handleClickDropZone);
                this.elements.fileInput.addEventListener('change', this.handleChangeFile);
                this.elements.splitBtn.addEventListener('click', this.handleSplit);

                console.log('PDF Split initialized');
            },

            cleanup() {
                if (this.elements.dropZone) this.elements.dropZone.removeEventListener('click', this.handleClickDropZone);
                if (this.elements.fileInput) this.elements.fileInput.removeEventListener('change', this.handleChangeFile);
                if (this.elements.splitBtn) this.elements.splitBtn.removeEventListener('click', this.handleSplit);
                this.currentPdf = null;
                this.selectedPages = null;
                this.elements = {};
                console.log('PDF Split cleanup done');
            },

            async loadPDF(file) {
                const arrayBuffer = await file.arrayBuffer();
                this.currentPdf = await PDFLib.PDFDocument.load(arrayBuffer);
                const pageCount = this.currentPdf.getPageCount();

                this.elements.dropZone.style.display = 'none';
                this.elements.splitArea.style.display = 'block';
                this.elements.pageGrid.innerHTML = '';
                this.selectedPages.clear();

                for (let i = 0; i < pageCount; i++) {
                    const div = document.createElement('div');
                    div.className = 'page-item';
                    div.innerHTML = `
                        <div class="page-preview">${i + 1}</div>
                        <div style="text-align: center; font-size: 14px;">Page ${i + 1}</div>
                    `;
                    div.addEventListener('click', () => this.togglePage(i, div));
                    this.elements.pageGrid.appendChild(div);
                }
            },

            togglePage(index, element) {
                if (this.selectedPages.has(index)) {
                    this.selectedPages.delete(index);
                    element.classList.remove('selected');
                } else {
                    this.selectedPages.add(index);
                    element.classList.add('selected');
                }
            },

            async splitPDF() {
                if (this.selectedPages.size === 0) {
                    alert('분할할 페이지를 선택해주세요.');
                    return;
                }

                const newPdf = await PDFLib.PDFDocument.create();
                const indices = Array.from(this.selectedPages).sort((a, b) => a - b);
                const copiedPages = await newPdf.copyPages(this.currentPdf, indices);

                copiedPages.forEach(page => newPdf.addPage(page));

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `split-pages.pdf`;
                link.click();
            }
        });
    </script>
</body>

</html>
