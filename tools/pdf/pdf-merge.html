<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PDF 합치기 - Utilsly</title>
    <meta name="description" content="여러 개의 PDF 파일을 하나로 병합하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .file-list {
            margin-bottom: 24px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            background: var(--bg-primary);
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .file-name {
            font-weight: 500;
        }

        .remove-btn {
            color: #FF4B4B;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">PDF 합치기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">picture_as_pdf</span>
                    </div>
                    <h1>PDF 합치기</h1>
                    <p class="description">여러 개의 PDF 파일을 순서대로 하나로 합치세요.</p>
                </div>

                <div class="tool-container" data-tool-id="pdf-merge">
                    <div class="drop-zone" id="dropZone"
                        style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; cursor: pointer; margin-bottom: 24px;">
                        <span class="material-symbols-rounded"
                            style="font-size: 48px; color: var(--text-tertiary);">upload_file</span>
                        <p style="margin-top: 16px;">PDF 파일들을 드래그하거나 클릭하여 추가하세요</p>
                        <input type="file" id="fileInput" accept="application/pdf" multiple style="display: none;">
                    </div>

                    <div class="file-list" id="fileList">
                        <!-- Files will be listed here -->
                    </div>

                    <button class="btn btn-primary" id="mergeBtn" style="width: 100%; display: none;">PDF 합치기 및
                        다운로드</button>
                    <div class="tool-help-section"
                        style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>파일 추가:</strong> 'PDF 추가' 버튼으로 합치고 싶은 파일들을 불러오세요. (다중 선택 가능)</li>
                                <li><strong>순서 확인:</strong> 목록에서 파일들이 올바른 순서로 나열되었는지 확인하세요.</li>
                                <li><strong>병합:</strong> 'PDF 합치기'를 누르면 하나의 파일로 합쳐져 다운로드됩니다.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script>
        Utilsly.registerTool('pdf-merge', {
            files: [],
            elements: {},

            init() {
                this.elements = {
                    dropZone: document.getElementById('dropZone'),
                    fileInput: document.getElementById('fileInput'),
                    fileList: document.getElementById('fileList'),
                    mergeBtn: document.getElementById('mergeBtn')
                };

                this.handleClickDropZone = () => this.elements.fileInput.click();
                this.handleChangeFile = (e) => this.handleFiles(e.target.files);
                this.handleDragOver = (e) => {
                    e.preventDefault();
                    this.elements.dropZone.style.background = 'rgba(35, 131, 226, 0.05)';
                };
                this.handleDragLeave = () => {
                    this.elements.dropZone.style.background = 'transparent';
                };
                this.handleDrop = (e) => {
                    e.preventDefault();
                    this.elements.dropZone.style.background = 'transparent';
                    this.handleFiles(e.dataTransfer.files);
                };
                this.handleMerge = () => this.mergePDFs();

                // Remove Event delegation for delete buttons
                this.handleFileListClick = (e) => {
                    if (e.target.classList.contains('remove-btn')) {
                        const index = parseInt(e.target.dataset.index, 10);
                        this.removeFile(index);
                    }
                };

                this.elements.dropZone.addEventListener('click', this.handleClickDropZone);
                this.elements.dropZone.addEventListener('dragover', this.handleDragOver);
                this.elements.dropZone.addEventListener('dragleave', this.handleDragLeave);
                this.elements.dropZone.addEventListener('drop', this.handleDrop);
                this.elements.fileInput.addEventListener('change', this.handleChangeFile);
                this.elements.mergeBtn.addEventListener('click', this.handleMerge);
                this.elements.fileList.addEventListener('click', this.handleFileListClick);

                console.log('PDF Merge initialized');
            },

            cleanup() {
                if (this.elements.dropZone) {
                    this.elements.dropZone.removeEventListener('click', this.handleClickDropZone);
                    this.elements.dropZone.removeEventListener('dragover', this.handleDragOver);
                    this.elements.dropZone.removeEventListener('dragleave', this.handleDragLeave);
                    this.elements.dropZone.removeEventListener('drop', this.handleDrop);
                }
                if (this.elements.fileInput) this.elements.fileInput.removeEventListener('change', this.handleChangeFile);
                if (this.elements.mergeBtn) this.elements.mergeBtn.removeEventListener('click', this.handleMerge);
                if (this.elements.fileList) this.elements.fileList.removeEventListener('click', this.handleFileListClick);

                this.files = [];
                this.elements = {};
                console.log('PDF Merge cleanup done');
            },

            handleFiles(newFiles) {
                for (let file of newFiles) {
                    if (file.type === 'application/pdf') {
                        this.files.push(file);
                    }
                }
                this.renderFileList();
            },

            renderFileList() {
                this.elements.fileList.innerHTML = '';
                this.files.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <span class="file-name">${index + 1}. ${file.name}</span>
                        <span class="material-symbols-rounded remove-btn" data-index="${index}">close</span>
                    `;
                    this.elements.fileList.appendChild(item);
                });

                this.elements.mergeBtn.style.display = this.files.length >= 2 ? 'block' : 'none';
            },

            removeFile(index) {
                this.files.splice(index, 1);
                this.renderFileList();
            },

            async mergePDFs() {
                if (this.files.length < 2) return;

                const mergedPdf = await PDFLib.PDFDocument.create();

                for (let file of this.files) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'merged.pdf';
                link.click();
            }
        });
    </script>
</body>

</html>
