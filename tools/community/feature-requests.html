<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기능 추가 요청 - Utilsly</title>
    <meta name="description" content="Utilsly에 필요한 기능이나 버그를 제보해주세요.">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        .board-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .write-section {
            background: var(--bg-hover);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 32px;
        }

        .write-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .request-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .request-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            transition: box-shadow 0.2s;
        }

        .request-card:hover {
            border-color: var(--text-tertiary);
        }

        .req-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .req-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .req-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .req-body {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <div class="top-bar"></div>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">campaign</span>
                    </div>
                    <h1>기능 추가 요청</h1>
                    <p class="description">여러분의 소중한 의견을 들려주세요. 새로운 기능 제안이나 버그 리포트를 환영합니다.</p>
                </div>

                <div class="board-container">
                    <!-- Write Section -->
                    <div class="write-section">
                        <div class="write-title">새로운 요청 작성하기</div>
                        <form id="requestForm">
                            <div class="input-group">
                                <label for="reqTitle">제목</label>
                                <input type="text" id="reqTitle" placeholder="어떤 기능이 필요한가요?" required
                                    autocomplete="off">
                            </div>
                            <div class="input-group">
                                <label for="reqContent">내용</label>
                                <textarea id="reqContent" rows="3" placeholder="자세한 내용을 적어주세요." required></textarea>
                            </div>
                            <div style="text-align: right;">
                                <button type="submit" class="btn btn-primary" id="submitBtn">
                                    등록하기
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- List Section -->
                    <div id="loadingIndicator" style="text-align: center; padding: 20px;">
                        <div class="spinner"></div>
                    </div>
                    <div class="request-list" id="requestList">
                        <!-- Dynamic Content -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/common.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('requestForm');
        const submitBtn = document.getElementById('submitBtn');
        const list = document.getElementById('requestList');
        const loading = document.getElementById('loadingIndicator');

        // Load Requests
        async function loadRequests() {
            list.innerHTML = '';
            loading.style.display = 'block';

            try {
                const q = query(collection(db, "feature_requests"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                loading.style.display = 'none';

                if (querySnapshot.empty) {
                    list.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-rounded" style="font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.3;">inbox</span>
                        아직 등록된 요청이 없습니다.<br>첫 번째 제안자가 되어보세요!
                    </div>
                `;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : '방금 전';

                    const card = document.createElement('div');
                    card.className = 'request-card';
                    card.innerHTML = `
                    <div class="req-header">
                        <div class="req-title">${escapeHtml(data.title)}</div>
                        <div class="req-date">${date}</div>
                    </div>
                    <div class="req-body">${escapeHtml(data.description)}</div>
                `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading docs: ", error);
                loading.style.display = 'none';
                list.innerHTML = `<div class="empty-state">데이터를 불러오는데 실패했습니다.<br>${error.message}</div>`;
            }
        }

        // Submit Request
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('reqTitle').value.trim();
            const desc = document.getElementById('reqContent').value.trim();

            if (!title || !desc) return;

            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';

            try {
                await addDoc(collection(db, "feature_requests"), {
                    title: title,
                    description: desc,
                    createdAt: serverTimestamp()
                });

                form.reset();
                await loadRequests(); // Reload list
                Utilsly.showAlert('요청이 성공적으로 등록되었습니다.');
            } catch (error) {
                console.error("Error adding doc: ", error);
                Utilsly.showAlert('오류가 발생했습니다: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '등록하기';
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initial Load
        loadRequests();

    </script>
</body>

</html>
