<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>스마트 화이트보드 - Utilsly</title>
    <meta name="description" content="아이디어를 자유롭게 그리세요. 무한 확대/축소와 다양한 도구를 제공합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .whiteboard-container {
            position: relative;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            height: calc(100vh - 280px);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .whiteboard-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            z-index: 9999;
        }

        .wb-toolbar {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-sidebar);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .tool-group {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 0 8px;
            border-right: 1px solid var(--border-color);
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }

        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-primary);
        }

        [data-theme="dark"] .tool-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        [data-theme="dark"] .tool-btn.active {
            color: black;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            border: 2px solid var(--border-color);
            width: 32px;
            height: 32px;
            cursor: pointer;
            border-radius: 50%;
            padding: 0;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .size-display {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 32px;
            text-align: center;
        }

        input[type="range"] {
            width: 80px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
        }

        #canvas-wrapper {
            flex: 1;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            cursor: crosshair;
        }

        [data-theme="dark"] #canvas-wrapper {
            background-color: #1a1a1a;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        [data-theme="dark"] .grid-bg {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .zoom-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .zoom-btn:hover {
            background: var(--bg-hover);
        }

        .zoom-level {
            min-width: 50px;
            text-align: center;
            line-height: 32px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .fullscreen-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .fullscreen .fullscreen-hint {
            opacity: 1;
            animation: fadeOut 3s forwards;
            animation-delay: 2s;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }

        /* Tooltip */
        .tool-btn[data-title]:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .wb-toolbar {
                padding: 8px 12px;
                gap: 8px;
            }

            .tool-group {
                padding: 0 4px;
            }

            .tool-btn {
                width: 32px;
                height: 32px;
            }

            input[type="range"] {
                width: 60px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">스마트 화이트보드</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">draw</span>
                    </div>
                    <h1>스마트 화이트보드</h1>
                    <p class="description">자유롭게 그리고, 저장하고, 공유하세요. 전체화면으로 교실 수업에 활용하세요.</p>
                </div>

                <div class="whiteboard-container" id="whiteboardContainer" data-tool-id="whiteboard">
                    <div class="wb-toolbar">
                        <!-- Drawing Tools -->
                        <div class="tool-group">
                            <button class="tool-btn active" id="tool-pencil" data-tool="pencil" data-title="연필">
                                <span class="material-symbols-rounded">edit</span>
                            </button>
                            <button class="tool-btn" id="tool-highlighter" data-tool="highlighter" data-title="형광펜">
                                <span class="material-symbols-rounded">ink_highlighter</span>
                            </button>
                            <button class="tool-btn" id="tool-line" data-tool="line" data-title="직선">
                                <span class="material-symbols-rounded">remove</span>
                            </button>
                            <button class="tool-btn" id="tool-rect" data-tool="rect" data-title="사각형">
                                <span class="material-symbols-rounded">rectangle</span>
                            </button>
                            <button class="tool-btn" id="tool-circle" data-tool="circle" data-title="원">
                                <span class="material-symbols-rounded">circle</span>
                            </button>
                            <button class="tool-btn" id="tool-arrow" data-tool="arrow" data-title="화살표">
                                <span class="material-symbols-rounded">arrow_forward</span>
                            </button>
                            <button class="tool-btn" id="tool-text" data-tool="text" data-title="텍스트">
                                <span class="material-symbols-rounded">title</span>
                            </button>
                            <button class="tool-btn" id="tool-eraser" data-tool="eraser" data-title="지우개">
                                <span class="material-symbols-rounded">ink_eraser</span>
                            </button>
                        </div>

                        <!-- Properties -->
                        <div class="tool-group">
                            <div class="color-picker-wrapper">
                                <input type="color" id="strokeColor" value="#000000" title="색상">
                            </div>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <span class="material-symbols-rounded" style="font-size: 16px;">line_weight</span>
                                <input type="range" id="lineWidth" min="1" max="50" value="4">
                                <span class="size-display" id="sizeDisplay">4px</span>
                            </div>
                        </div>

                        <!-- Grid Toggle -->
                        <div class="tool-group">
                            <button class="tool-btn" id="btn-grid" data-title="격자 표시">
                                <span class="material-symbols-rounded">grid_on</span>
                            </button>
                        </div>

                        <!-- Actions -->
                        <div class="tool-group" style="border-right: none; margin-left: auto;">
                            <button class="tool-btn" id="btn-undo" data-title="되돌리기 (Ctrl+Z)">
                                <span class="material-symbols-rounded">undo</span>
                            </button>
                            <button class="tool-btn" id="btn-redo" data-title="다시실행 (Ctrl+Y)">
                                <span class="material-symbols-rounded">redo</span>
                            </button>
                            <button class="tool-btn" id="btn-clear" data-title="모두 지우기" style="color: #ef4444;">
                                <span class="material-symbols-rounded">delete</span>
                            </button>
                            <button class="tool-btn" id="btn-download" data-title="이미지 저장"
                                style="color: var(--accent-blue);">
                                <span class="material-symbols-rounded">save_alt</span>
                            </button>
                            <button class="tool-btn" id="btn-fullscreen" data-title="전체화면 (F11)">
                                <span class="material-symbols-rounded">fullscreen</span>
                            </button>
                        </div>
                    </div>

                    <div id="canvas-wrapper">
                        <canvas id="whiteboard"></canvas>

                        <div class="zoom-controls">
                            <button class="zoom-btn" id="btn-zoom-out">−</button>
                            <span class="zoom-level" id="zoomLevel">100%</span>
                            <button class="zoom-btn" id="btn-zoom-in">+</button>
                            <button class="zoom-btn" id="btn-zoom-reset" title="초기화">
                                <span class="material-symbols-rounded" style="font-size: 16px;">restart_alt</span>
                            </button>
                        </div>
                    </div>

                    <div class="fullscreen-hint">ESC를 눌러 전체화면 종료</div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('whiteboard', {
            wb: null,

            init() {
                const self = this;

                class Whiteboard {
                    constructor() {
                        this.container = document.getElementById('whiteboardContainer');
                        this.canvas = document.getElementById('whiteboard');
                        this.ctx = this.canvas.getContext('2d');
                        this.wrapper = document.getElementById('canvas-wrapper');

                        this.isDrawing = false;
                        this.currentTool = 'pencil';
                        this.startX = 0;
                        this.startY = 0;

                        this.history = [];
                        this.historyStep = -1;
                        this.maxHistory = 50;

                        this.scale = 1;
                        this.minScale = 0.25;
                        this.maxScale = 4;
                        this.offsetX = 0;
                        this.offsetY = 0;

                        this.properties = {
                            color: '#000000',
                            width: 4,
                            cap: 'round',
                            join: 'round'
                        };

                        this.isDarkMode = document.documentElement.getAttribute('data-theme') === 'dark';
                        if (this.isDarkMode) {
                            this.properties.color = '#ffffff';
                            const sc = document.getElementById('strokeColor');
                            if (sc) sc.value = '#ffffff';
                        }

                        this.isFullscreen = false;
                        this.showGrid = false;

                        this.bindMethods();
                        this.initEvents();
                        this.updateSizeDisplay();
                    }

                    bindMethods() {
                        this.resizeCanvas = this.resizeCanvas.bind(this);
                        this.startDrawing = this.startDrawing.bind(this);
                        this.draw = this.draw.bind(this);
                        this.stopDrawing = this.stopDrawing.bind(this);
                        this.handleTouchStart = this.handleTouchStart.bind(this);
                        this.handleTouchMove = this.handleTouchMove.bind(this);
                        this.handleTouchEnd = this.handleTouchEnd.bind(this);
                        this.handleKeyDown = this.handleKeyDown.bind(this);
                        this.handleToolClick = this.handleToolClick.bind(this);
                        this.handleColorInput = this.handleColorInput.bind(this);
                        this.handleWidthInput = this.handleWidthInput.bind(this);
                        this.handleWheel = this.handleWheel.bind(this);
                    }

                    initEvents() {
                        this.resizeCanvas();
                        window.addEventListener('resize', this.resizeCanvas);

                        this.canvas.addEventListener('mousedown', this.startDrawing);
                        this.canvas.addEventListener('mousemove', this.draw);
                        this.canvas.addEventListener('mouseup', this.stopDrawing);
                        this.canvas.addEventListener('mouseout', this.stopDrawing);

                        this.canvas.addEventListener('touchstart', this.handleTouchStart, { passive: false });
                        this.canvas.addEventListener('touchmove', this.handleTouchMove, { passive: false });
                        this.canvas.addEventListener('touchend', this.handleTouchEnd);

                        // Zoom with wheel
                        this.wrapper.addEventListener('wheel', this.handleWheel, { passive: false });

                        document.querySelectorAll('[data-tool]').forEach(btn => {
                            btn.addEventListener('click', this.handleToolClick);
                        });

                        const sc = document.getElementById('strokeColor');
                        if (sc) sc.addEventListener('input', this.handleColorInput);

                        const lw = document.getElementById('lineWidth');
                        if (lw) lw.addEventListener('input', this.handleWidthInput);

                        document.addEventListener('keydown', this.handleKeyDown);

                        this.saveState();
                    }

                    destroy() {
                        window.removeEventListener('resize', this.resizeCanvas);
                        this.wrapper?.removeEventListener('wheel', this.handleWheel);
                        if (this.canvas) {
                            this.canvas.removeEventListener('mousedown', this.startDrawing);
                            this.canvas.removeEventListener('mousemove', this.draw);
                            this.canvas.removeEventListener('mouseup', this.stopDrawing);
                            this.canvas.removeEventListener('mouseout', this.stopDrawing);
                            this.canvas.removeEventListener('touchstart', this.handleTouchStart);
                            this.canvas.removeEventListener('touchmove', this.handleTouchMove);
                            this.canvas.removeEventListener('touchend', this.handleTouchEnd);
                        }
                        document.querySelectorAll('[data-tool]').forEach(btn => {
                            btn.removeEventListener('click', this.handleToolClick);
                        });
                        document.getElementById('strokeColor')?.removeEventListener('input', this.handleColorInput);
                        document.getElementById('lineWidth')?.removeEventListener('input', this.handleWidthInput);
                        document.removeEventListener('keydown', this.handleKeyDown);
                    }

                    handleWheel(e) {
                        e.preventDefault();
                        const delta = e.deltaY > 0 ? -0.1 : 0.1;
                        this.zoom(delta, e.clientX, e.clientY);
                    }

                    zoom(delta, centerX, centerY) {
                        const oldScale = this.scale;
                        this.scale = Math.max(this.minScale, Math.min(this.maxScale, this.scale + delta));

                        // Apply scale transform via CSS
                        this.canvas.style.transform = `scale(${this.scale})`;
                        this.canvas.style.transformOrigin = 'top left';

                        this.updateZoomDisplay();
                    }

                    zoomIn() {
                        this.zoom(0.25);
                    }

                    zoomOut() {
                        this.zoom(-0.25);
                    }

                    resetZoom() {
                        this.scale = 1;
                        this.canvas.style.transform = `scale(1)`;
                        this.updateZoomDisplay();
                    }

                    updateZoomDisplay() {
                        const display = document.getElementById('zoomLevel');
                        if (display) {
                            display.textContent = Math.round(this.scale * 100) + '%';
                        }
                    }

                    updateSizeDisplay() {
                        const display = document.getElementById('sizeDisplay');
                        if (display) {
                            display.textContent = this.properties.width + 'px';
                        }
                    }

                    handleTouchStart(e) {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const mouseEvent = new MouseEvent('mousedown', {
                            clientX: touch.clientX,
                            clientY: touch.clientY
                        });
                        this.canvas.dispatchEvent(mouseEvent);
                    }

                    handleTouchMove(e) {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const mouseEvent = new MouseEvent('mousemove', {
                            clientX: touch.clientX,
                            clientY: touch.clientY
                        });
                        this.canvas.dispatchEvent(mouseEvent);
                    }

                    handleTouchEnd() {
                        const mouseEvent = new MouseEvent('mouseup', {});
                        this.canvas.dispatchEvent(mouseEvent);
                    }

                    handleToolClick(e) {
                        const tool = e.currentTarget.dataset.tool;
                        this.setTool(tool);
                        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                    }

                    handleColorInput(e) {
                        this.properties.color = e.target.value;
                    }

                    handleWidthInput(e) {
                        this.properties.width = parseInt(e.target.value);
                        this.updateSizeDisplay();
                    }

                    handleKeyDown(e) {
                        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                            e.preventDefault();
                            this.undo();
                        }
                        if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) {
                            e.preventDefault();
                            this.redo();
                        }
                        if (e.key === 'Escape' && this.isFullscreen) {
                            this.toggleFullscreen();
                        }
                        if (e.key === 'F11') {
                            e.preventDefault();
                            this.toggleFullscreen();
                        }
                    }

                    resizeCanvas() {
                        const tempCanvas = document.createElement('canvas');
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCanvas.width = this.canvas.width;
                        tempCanvas.height = this.canvas.height;
                        tempCtx.drawImage(this.canvas, 0, 0);

                        const rect = this.wrapper.getBoundingClientRect();
                        this.canvas.width = rect.width;
                        this.canvas.height = rect.height;

                        if (this.history.length > 0) {
                            this.ctx.drawImage(tempCanvas, 0, 0);
                        }
                    }

                    getMousePos(e) {
                        const rect = this.canvas.getBoundingClientRect();
                        return {
                            x: (e.clientX - rect.left) / this.scale,
                            y: (e.clientY - rect.top) / this.scale
                        };
                    }

                    startDrawing(e) {
                        this.isDrawing = true;
                        const pos = this.getMousePos(e);
                        this.startX = pos.x;
                        this.startY = pos.y;

                        this.ctx.lineWidth = this.properties.width;
                        this.ctx.lineCap = this.properties.cap;
                        this.ctx.lineJoin = this.properties.join;

                        if (this.currentTool === 'eraser') {
                            this.ctx.strokeStyle = this.isDarkMode ? '#1a1a1a' : '#ffffff';
                            this.ctx.globalAlpha = 1;
                        } else if (this.currentTool === 'highlighter') {
                            this.ctx.strokeStyle = this.properties.color;
                            this.ctx.globalAlpha = 0.3;
                            this.ctx.lineWidth = this.properties.width * 3;
                        } else {
                            this.ctx.strokeStyle = this.properties.color;
                            this.ctx.globalAlpha = 1;
                        }

                        if (this.currentTool === 'pencil' || this.currentTool === 'eraser' || this.currentTool === 'highlighter') {
                            this.ctx.beginPath();
                            this.ctx.moveTo(this.startX, this.startY);
                        } else if (this.currentTool === 'text') {
                            const text = prompt('텍스트를 입력하세요:');
                            if (text) {
                                this.ctx.font = `${this.properties.width * 4}px sans-serif`;
                                this.ctx.fillStyle = this.properties.color;
                                this.ctx.fillText(text, this.startX, this.startY);
                                this.saveState();
                            }
                            this.isDrawing = false;
                        } else {
                            this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                        }
                    }

                    draw(e) {
                        if (!this.isDrawing) return;
                        const pos = this.getMousePos(e);

                        if (this.currentTool === 'pencil' || this.currentTool === 'eraser' || this.currentTool === 'highlighter') {
                            this.ctx.lineTo(pos.x, pos.y);
                            this.ctx.stroke();
                        } else {
                            this.ctx.putImageData(this.snapshot, 0, 0);
                            this.ctx.beginPath();

                            if (this.currentTool === 'line') {
                                this.ctx.moveTo(this.startX, this.startY);
                                this.ctx.lineTo(pos.x, pos.y);
                            } else if (this.currentTool === 'arrow') {
                                this.drawArrow(this.startX, this.startY, pos.x, pos.y);
                            } else if (this.currentTool === 'rect') {
                                this.ctx.rect(this.startX, this.startY, pos.x - this.startX, pos.y - this.startY);
                            } else if (this.currentTool === 'circle') {
                                const radius = Math.sqrt(Math.pow(pos.x - this.startX, 2) + Math.pow(pos.y - this.startY, 2));
                                this.ctx.arc(this.startX, this.startY, radius, 0, 2 * Math.PI);
                            }
                            this.ctx.stroke();
                        }
                    }

                    drawArrow(fromX, fromY, toX, toY) {
                        const headLength = 15;
                        const angle = Math.atan2(toY - fromY, toX - fromX);

                        this.ctx.moveTo(fromX, fromY);
                        this.ctx.lineTo(toX, toY);
                        this.ctx.lineTo(
                            toX - headLength * Math.cos(angle - Math.PI / 6),
                            toY - headLength * Math.sin(angle - Math.PI / 6)
                        );
                        this.ctx.moveTo(toX, toY);
                        this.ctx.lineTo(
                            toX - headLength * Math.cos(angle + Math.PI / 6),
                            toY - headLength * Math.sin(angle + Math.PI / 6)
                        );
                    }

                    stopDrawing() {
                        if (!this.isDrawing) return;
                        this.isDrawing = false;
                        this.ctx.globalAlpha = 1;
                        this.saveState();
                    }

                    setTool(tool) {
                        this.currentTool = tool;
                        if (tool === 'eraser') {
                            this.canvas.style.cursor = 'cell';
                        } else if (tool === 'text') {
                            this.canvas.style.cursor = 'text';
                        } else {
                            this.canvas.style.cursor = 'crosshair';
                        }
                    }

                    toggleGrid() {
                        this.showGrid = !this.showGrid;
                        this.wrapper.classList.toggle('grid-bg', this.showGrid);
                        document.getElementById('btn-grid').classList.toggle('active', this.showGrid);
                    }

                    toggleFullscreen() {
                        this.isFullscreen = !this.isFullscreen;
                        this.container.classList.toggle('fullscreen', this.isFullscreen);

                        const btn = document.getElementById('btn-fullscreen');
                        if (btn) {
                            btn.querySelector('.material-symbols-rounded').textContent =
                                this.isFullscreen ? 'fullscreen_exit' : 'fullscreen';
                        }

                        // Resize canvas after fullscreen toggle
                        setTimeout(() => this.resizeCanvas(), 100);
                    }

                    saveState() {
                        if (this.historyStep < this.history.length - 1) {
                            this.history = this.history.slice(0, this.historyStep + 1);
                        }

                        this.history.push(this.canvas.toDataURL());
                        if (this.history.length > this.maxHistory) {
                            this.history.shift();
                        } else {
                            this.historyStep++;
                        }
                    }

                    undo() {
                        if (this.historyStep > 0) {
                            this.historyStep--;
                            const img = new Image();
                            img.src = this.history[this.historyStep];
                            img.onload = () => {
                                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                                this.ctx.drawImage(img, 0, 0);
                            };
                        }
                    }

                    redo() {
                        if (this.historyStep < this.history.length - 1) {
                            this.historyStep++;
                            const img = new Image();
                            img.src = this.history[this.historyStep];
                            img.onload = () => {
                                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                                this.ctx.drawImage(img, 0, 0);
                            };
                        }
                    }

                    clear() {
                        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                        this.saveState();
                    }

                    download() {
                        const tempCanvas = document.createElement('canvas');
                        const tempCtx = tempCanvas.getContext('2d');
                        tempCanvas.width = this.canvas.width;
                        tempCanvas.height = this.canvas.height;

                        tempCtx.fillStyle = this.isDarkMode ? '#1a1a1a' : '#ffffff';
                        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                        tempCtx.drawImage(this.canvas, 0, 0);

                        const link = document.createElement('a');
                        link.download = `whiteboard-${new Date().toISOString().slice(0, 10)}.png`;
                        link.href = tempCanvas.toDataURL();
                        link.click();
                    }
                }

                this.wb = new Whiteboard();

                // Button listeners
                this.handleUndo = () => this.wb.undo();
                this.handleRedo = () => this.wb.redo();
                this.handleClear = async () => {
                    const confirmed = await Utilsly.showConfirm('모든 내용을 지우시겠습니까?', '화이트보드 초기화');
                    if (confirmed) this.wb.clear();
                };
                this.handleDownload = () => this.wb.download();
                this.handleFullscreen = () => this.wb.toggleFullscreen();
                this.handleGrid = () => this.wb.toggleGrid();
                this.handleZoomIn = () => this.wb.zoomIn();
                this.handleZoomOut = () => this.wb.zoomOut();
                this.handleZoomReset = () => this.wb.resetZoom();

                document.getElementById('btn-undo')?.addEventListener('click', this.handleUndo);
                document.getElementById('btn-redo')?.addEventListener('click', this.handleRedo);
                document.getElementById('btn-clear')?.addEventListener('click', this.handleClear);
                document.getElementById('btn-download')?.addEventListener('click', this.handleDownload);
                document.getElementById('btn-fullscreen')?.addEventListener('click', this.handleFullscreen);
                document.getElementById('btn-grid')?.addEventListener('click', this.handleGrid);
                document.getElementById('btn-zoom-in')?.addEventListener('click', this.handleZoomIn);
                document.getElementById('btn-zoom-out')?.addEventListener('click', this.handleZoomOut);
                document.getElementById('btn-zoom-reset')?.addEventListener('click', this.handleZoomReset);

                console.log('Whiteboard initialized');
            },

            cleanup() {
                if (this.wb) {
                    this.wb.destroy();
                    this.wb = null;
                }

                document.getElementById('btn-undo')?.removeEventListener('click', this.handleUndo);
                document.getElementById('btn-redo')?.removeEventListener('click', this.handleRedo);
                document.getElementById('btn-clear')?.removeEventListener('click', this.handleClear);
                document.getElementById('btn-download')?.removeEventListener('click', this.handleDownload);
                document.getElementById('btn-fullscreen')?.removeEventListener('click', this.handleFullscreen);
                document.getElementById('btn-grid')?.removeEventListener('click', this.handleGrid);
                document.getElementById('btn-zoom-in')?.removeEventListener('click', this.handleZoomIn);
                document.getElementById('btn-zoom-out')?.removeEventListener('click', this.handleZoomOut);
                document.getElementById('btn-zoom-reset')?.removeEventListener('click', this.handleZoomReset);

                console.log('Whiteboard cleanup done');
            }
        });
    </script>
</body>

</html>
