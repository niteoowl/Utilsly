<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>비밀번호 생성기 - Utilsly</title>
    <meta name="description" content="강력하고 안전한 비밀번호를 무작위로 생성하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .password-display {
            background: var(--bg-sidebar);
            padding: 24px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            word-break: break-all;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }

        .password-display:hover {
            background: var(--bg-hover);
        }

        .password-display:active {
            transform: scale(0.98);
        }

        .options-grid {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .length-slider {
            width: 100%;
            margin-top: 8px;
        }



        [data-theme="dark"] .password-display {
            background: #2d2d2d;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">비밀번호 생성기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">password</span>
                    </div>
                    <h1>비밀번호 생성기</h1>
                    <p class="description">옵션을 선택하여 강력한 보안 비밀번호를 생성하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="password-generator-sec">
                    <div class="password-display" id="passwordDisplay" title="클릭하여 복사">
                        Generating...
                    </div>

                    <div class="options-grid">
                        <div style="padding: 12px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <label style="font-weight: 600;">길이</label>
                                <span id="lengthValue" style="font-weight: 700; color: var(--accent-blue);">16</span>
                            </div>
                            <input type="range" id="length" min="4" max="50" value="16" class="length-slider">
                        </div>

                        <label class="option-item">
                            <span>대문자 포함 (A-Z)</span>
                            <input type="checkbox" id="uppercase" checked>
                        </label>

                        <label class="option-item">
                            <span>소문자 포함 (a-z)</span>
                            <input type="checkbox" id="lowercase" checked>
                        </label>

                        <label class="option-item">
                            <span>숫자 포함 (0-9)</span>
                            <input type="checkbox" id="numbers" checked>
                        </label>

                        <label class="option-item">
                            <span>특수문자 포함 (!@#$)</span>
                            <input type="checkbox" id="symbols" checked>
                        </label>
                    </div>

                    <button class="btn btn-primary" id="generateBtn"
                        style="width: 100%; padding: 16px; font-size: 18px;">
                        <span class="material-symbols-rounded" style="margin-right: 8px;">refresh</span>
                        새로 생성
                    </button>
                    <div class="tool-help-section"
                        style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>옵션 설정:</strong> 비밀번호 길이와 포함할 문자 종류(특수문자, 숫자 등)를 선택하세요.</li>
                                <li><strong>생성:</strong> '재생성' 버튼을 누를 때마다 강력한 새 비밀번호가 만들어집니다.</li>
                                <li><strong>복사:</strong> 생성된 비밀번호 옆의 복사 아이콘을 눌러 클립보드에 저장하세요.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('password-generator-sec', {
            elements: {},
            chars: {
                upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lower: 'abcdefghijklmnopqrstuvwxyz',
                number: '0123456789',
                symbol: '!@#$%^&*()_+~`|}{[]:;?><,./-='
            },

            init() {
                this.elements = {
                    display: document.getElementById('passwordDisplay'),
                    lengthSlider: document.getElementById('length'),
                    lengthValue: document.getElementById('lengthValue'),
                    uppercase: document.getElementById('uppercase'),
                    lowercase: document.getElementById('lowercase'),
                    numbers: document.getElementById('numbers'),
                    symbols: document.getElementById('symbols'),
                    generateBtn: document.getElementById('generateBtn')
                };

                this.handleUpdate = () => {
                    if (this.elements.lengthValue) this.elements.lengthValue.innerText = this.elements.lengthSlider.value;
                    this.generatePassword();
                };
                this.handleGenerate = () => this.generatePassword();
                this.handleCopy = () => this.copyPassword();

                if (this.elements.lengthSlider) this.elements.lengthSlider.addEventListener('input', this.handleUpdate);
                if (this.elements.uppercase) this.elements.uppercase.addEventListener('change', this.handleGenerate);
                if (this.elements.lowercase) this.elements.lowercase.addEventListener('change', this.handleGenerate);
                if (this.elements.numbers) this.elements.numbers.addEventListener('change', this.handleGenerate);
                if (this.elements.symbols) this.elements.symbols.addEventListener('change', this.handleGenerate);
                if (this.elements.generateBtn) this.elements.generateBtn.addEventListener('click', this.handleGenerate);
                if (this.elements.display) this.elements.display.addEventListener('click', this.handleCopy);

                this.generatePassword();
                console.log('Security Password Generator initialized');
            },

            cleanup() {
                if (this.elements.lengthSlider) this.elements.lengthSlider.removeEventListener('input', this.handleUpdate);
                if (this.elements.uppercase) this.elements.uppercase.removeEventListener('change', this.handleGenerate);
                if (this.elements.lowercase) this.elements.lowercase.removeEventListener('change', this.handleGenerate);
                if (this.elements.numbers) this.elements.numbers.removeEventListener('change', this.handleGenerate);
                if (this.elements.symbols) this.elements.symbols.removeEventListener('change', this.handleGenerate);
                if (this.elements.generateBtn) this.elements.generateBtn.removeEventListener('click', this.handleGenerate);
                if (this.elements.display) this.elements.display.removeEventListener('click', this.handleCopy);

                this.elements = {};
                console.log('Security Password Generator cleanup done');
            },

            generatePassword() {
                if (!this.elements.display) return;

                let chars = '';
                if (this.elements.uppercase.checked) chars += this.chars.upper;
                if (this.elements.lowercase.checked) chars += this.chars.lower;
                if (this.elements.numbers.checked) chars += this.chars.number;
                if (this.elements.symbols.checked) chars += this.chars.symbol;

                if (chars === '') {
                    this.elements.display.innerText = '옵션을 선택하세요';
                    return;
                }

                let password = '';
                const length = this.elements.lengthSlider.value;
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * chars.length);
                    password += chars[randomIndex];
                }

                this.elements.display.innerText = password;
            },

            copyPassword() {
                if (!this.elements.display) return;
                const password = this.elements.display.innerText;
                if (password === '옵션을 선택하세요' || password === '복사되었습니다!' || password === 'Generating...') return;

                navigator.clipboard.writeText(password).then(() => {
                    const originalText = password;
                    this.elements.display.innerText = '복사되었습니다!';
                    setTimeout(() => {
                        if (this.elements.display) this.elements.display.innerText = originalText;
                    }, 1000);
                });
            }
        });
    </script>
</body>

</html>
