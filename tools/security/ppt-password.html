<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>PPT 암호 제거 - Utilsly</title>
    <meta name="description" content="PPTX 파일의 읽기 전용 보호 또는 수정 암호를 제거합니다.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">PPT 암호 제거</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">key_off</span>
                    </div>
                    <h1>PPT 암호 제거</h1>
                    <p class="description">PPTX 파일의 '수정 암호' 또는 '읽기 전용' 설정을 제거하여 자유롭게 편집할 수 있도록 합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="ppt-password">
                    <div class="card">
                        <div class="drop-zone" id="dropZone">
                            <input type="file" id="fileInput" accept=".pptx" style="display: none;">
                            <span class="material-symbols-rounded upload-icon">file_present</span>
                            <div class="upload-text">수정 제한을 제거할 PPTX 파일을 선택하세요</div>
                            <div class="upload-hint">'수정 시 비밀번호 입력'이 걸린 파일의 편집 제한을 해제합니다.</div>
                        </div>
                        <div id="fileInfo" class="file-info" style="display: none;">
                            <span class="material-symbols-rounded" style="color: #d14424;">slideshow</span>
                            <span id="fileName" style="font-weight: 600; font-size: 14px;">파일명.pptx</span>
                        </div>
                    </div>

                    <div id="actionSection" class="card" style="display: none;">
                        <p
                            style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6;">
                            업로드된 PPTX 파일 내부의 편집 제한 설정(modifyVerifier)을 제거합니다.<br>
                            읽기 전용으로 열리는 문서를 자유롭게 수정할 수 있게 변경합니다.
                        </p>
                        <button id="processBtn" class="btn btn-primary"
                            style="width: 100%; padding: 12px; font-weight: 700;">편집 제한 제거 및 다운로드</button>
                    </div>

                    <div id="statusMessage"
                        style="margin-top: 16px; text-align: center; font-size: 0.875rem; color: var(--text-tertiary);">
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const PptPasswordTool = {
            currentFile: null,

            init() {
                this.dropZone = document.getElementById('dropZone');
                this.fileInput = document.getElementById('fileInput');
                this.fileNameDisplay = document.getElementById('fileName');
                this.actionSection = document.getElementById('actionSection');
                this.processBtn = document.getElementById('processBtn');
                this.statusMsg = document.getElementById('statusMessage');

                this.dropZone.addEventListener('click', () => this.fileInput.click());
                this.fileInput.addEventListener('change', (e) => this.handleFile(e.target.files[0]));

                this.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.dropZone.style.borderColor = 'var(--accent-color)';
                });

                this.dropZone.addEventListener('dragleave', () => {
                    this.dropZone.style.borderColor = 'var(--border-color)';
                });

                this.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.handleFile(e.dataTransfer.files[0]);
                });

                this.processBtn.addEventListener('click', () => this.processPptx());
            },

            handleFile(file) {
                if (!file || !file.name.endsWith('.pptx')) {
                    Utilsly.showAlert('PPTX 파일만 지원합니다.');
                    return;
                }
                this.currentFile = file;
                this.fileNameDisplay.textContent = file.name;
                this.actionSection.style.display = 'block';
                this.statusMsg.textContent = '준비되었습니다.';
            },

            async processPptx() {
                if (!this.currentFile) return;

                this.statusMsg.textContent = '처리 중...';
                this.processBtn.disabled = true;

                try {
                    const zip = new JSZip();
                    const contents = await zip.loadAsync(this.currentFile);

                    // PPTX edit protection is stored in ppt/presentation.xml as <p:modifyVerifier ... />
                    const presentationXmlPath = 'ppt/presentation.xml';

                    if (contents.file(presentationXmlPath)) {
                        let xml = await contents.file(presentationXmlPath).async('text');

                        // Regex to find and remove modifyVerifier tag
                        const newXml = xml.replace(/<p:modifyVerifier[^>]*\/>/g, '');

                        if (xml === newXml) {
                            // Try another common tag for protection
                            // Sometimes it's in settings or other places, but modifyVerifier is standard.
                        }

                        zip.file(presentationXmlPath, newXml);
                    } else {
                        throw new Error('PPTX 구조가 올바르지 않습니다.');
                    }

                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `[Unlocked]_${this.currentFile.name}`;
                    link.click();

                    this.statusMsg.textContent = '보호 해제가 완료되었습니다!';
                    Utilsly.showAlert('수정 제한이 제거되었습니다. 파일이 다운로드됩니다.');

                } catch (e) {
                    console.error(e);
                    Utilsly.showAlert('PPT 처리 중 오류가 발생했습니다. (파일이 전체 암호화되어 있을 수 있습니다)');
                    this.statusMsg.textContent = '실패.';
                } finally {
                    this.processBtn.disabled = false;
                }
            },

            cleanup() { }
        };

        Utilsly.registerTool('ppt-password', PptPasswordTool);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            PptPasswordTool.init();
        } else {
            document.addEventListener('DOMContentLoaded', () => PptPasswordTool.init());
        }
    </script>
</body>

</html>
