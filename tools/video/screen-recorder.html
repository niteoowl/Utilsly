<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>화면 녹화 - Utilsly</title>
    <meta name="description" content="설치 없이 브라우저에서 화면을 녹화하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .recorder-container {

            text-align: center;
        }

        .video-preview {
            width: 100%;
            background: black;
            border-radius: 12px;
            margin-bottom: 24px;
            aspect-ratio: 16/9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .status-indicator {
            display: inline-flex;
            gap: 8px;
            padding: 8px 16px;
            background: #ffebee;
            color: #c62828;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: none;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: #c62828;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">화면 녹화</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">screen_record</span>
                    </div>
                    <h1>화면 녹화</h1>
                    <p class="description">전체 화면, 창, 또는 브라우저 탭을 녹화하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="screen-recorder">
                    <div class="status-indicator" id="statusIndicator">
                        <div class="recording-dot"></div>
                        녹화 중...
                    </div>

                    <video id="preview" class="video-preview" autoplay muted></video>

                    <div class="controls">
                        <button class="btn btn-primary" id="startBtn" style="padding: 12px 32px; font-size: 18px;">
                            <span class="material-symbols-rounded" style="margin-right: 8px;">fiber_manual_record</span>
                            녹화 시작
                        </button>
                        <button class="btn" id="stopBtn"
                            style="padding: 12px 32px; font-size: 18px; display: none; background: #FF4B4B; color: white; border-color: #FF4B4B;">
                            <span class="material-symbols-rounded" style="margin-right: 8px;">stop</span>
                            녹화 중지
                        </button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">녹화 시간 제한이 있나요?</div>
                            <div class="faq-answer">브라우저의 메모리 용량에 따라 다르지만, 일반적으로 수십 분 이상의 긴 영상은 저장이 어려울 수 있습니다. 짧은 영상
                                녹화에 최적화되어 있습니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">소리도 녹음되나요?</div>
                            <div class="faq-answer">녹화 시작 시 '시스템 오디오 공유' 옵션을 체크하면 컴퓨터 소리도 함께 녹음할 수 있습니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('screen-recorder', {
            mediaRecorder: null,
            recordedChunks: [],
            stream: null,
            elements: {},

            init() {
                this.elements = {
                    preview: document.getElementById('preview'),
                    startBtn: document.getElementById('startBtn'),
                    stopBtn: document.getElementById('stopBtn'),
                    statusIndicator: document.getElementById('statusIndicator')
                };

                this.handleStart = () => this.startRecording();
                this.handleStop = () => this.stopRecording();

                if (this.elements.startBtn) this.elements.startBtn.addEventListener('click', this.handleStart);
                if (this.elements.stopBtn) this.elements.stopBtn.addEventListener('click', this.handleStop);

                console.log('Screen Recorder initialized');
            },

            cleanup() {
                this.stopRecording(true); // Stop if still running
                if (this.elements.startBtn) this.elements.startBtn.removeEventListener('click', this.handleStart);
                if (this.elements.stopBtn) this.elements.stopBtn.removeEventListener('click', this.handleStop);

                this.elements = {};
                this.recordedChunks = [];
                console.log('Screen Recorder cleanup done');
            },

            async startRecording() {
                try {
                    this.stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen" },
                        audio: true
                    });

                    if (this.elements.preview) this.elements.preview.srcObject = this.stream;

                    this.mediaRecorder = new MediaRecorder(this.stream);
                    this.recordedChunks = [];

                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            this.recordedChunks.push(e.data);
                        }
                    };

                    this.mediaRecorder.onstop = () => {
                        this.finishRecording();
                    };

                    this.mediaRecorder.start();

                    // UI Updates
                    this.elements.startBtn.style.display = 'none';
                    this.elements.stopBtn.style.display = 'inline-flex';
                    this.elements.statusIndicator.style.display = 'inline-flex';

                    // Handle user stopping via browser UI
                    this.stream.getVideoTracks()[0].onended = () => {
                        this.stopRecording();
                    };

                } catch (err) {
                    console.error("Error: " + err);
                    // Could be permission denied
                    Utilsly.showAlert('녹화 권한이 필요하거나 취소되었습니다.');
                }
            },

            stopRecording(skipDownload = false) {
                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    this.mediaRecorder.stop();
                    // Just stop the recorder. onstop will trigger finishRecording.
                    // However, if we come from cleanup (skipDownload=true), we need to override onstop?
                    // Actually, modifying onstop or handling skipDownload in onstop is tricky if this is async.
                    // If cleaning up, we probably don't want to download.

                    if (skipDownload) {
                        this.mediaRecorder.onstop = null; // Disable callback
                    }
                }

                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                }

                if (skipDownload) {
                    if (this.elements.preview) this.elements.preview.srcObject = null;
                }
            },

            finishRecording() {
                const blob = new Blob(this.recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);

                // Create download link
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'screen-recording.webm';
                document.body.appendChild(a);
                a.click();

                // Cleanup
                window.URL.revokeObjectURL(url);
                if (this.elements.preview) this.elements.preview.srcObject = null;
                this.recordedChunks = [];
                this.stream = null;

                this.resetUI();
            },

            resetUI() {
                if (!this.elements.startBtn) return;
                this.elements.startBtn.style.display = 'inline-flex';
                this.elements.stopBtn.style.display = 'none';
                this.elements.statusIndicator.style.display = 'none';
            }
        });
    </script>
</body>

</html>
