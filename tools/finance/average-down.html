<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>물타기 계산기 (평단가) - Utilsly</title>
    <meta name="description" content="주식 및 코인 물타기(추가 매수) 시 변동되는 평단가와 수익률을 미리 계산해보세요.">

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .result-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-weight: 700;
            font-size: 18px;
            color: var(--accent-blue);
        }

        .result-label {
            color: var(--text-secondary);
        }

        .result-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .disclaimer {
            margin-top: 32px;
            padding: 16px;
            background: rgba(255, 59, 48, 0.05);
            /* Light red tint */
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            border: 1px solid rgba(255, 59, 48, 0.1);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">물타기 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">water_drop</span>
                    </div>
                    <h1>물타기 계산기</h1>
                    <p class="description">추가 매수 시 변화하는 평단가와 수량을 계산합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="average-down">
                    <div class="dashboard-grid">
                        <!-- Current Holding -->
                        <div class="tool-card" style="cursor: default;">
                            <h3 style="margin-bottom: 16px; font-size: 16px;">현재 보유</h3>
                            <div class="input-group">
                                <label>보유 수량</label>
                                <input type="number" id="current-qty" class="search-input" placeholder="0" min="0">
                            </div>
                            <div class="input-group">
                                <label>평균 단가</label>
                                <input type="number" id="current-price" class="search-input" placeholder="0" min="0">
                            </div>
                        </div>

                        <!-- Additional Buy -->
                        <div class="tool-card" style="cursor: default;">
                            <h3 style="margin-bottom: 16px; font-size: 16px;">추가 매수</h3>
                            <div class="input-group">
                                <label>매수 수량</label>
                                <input type="number" id="buy-qty" class="search-input" placeholder="0" min="0">
                            </div>
                            <div class="input-group">
                                <label>매수 단가</label>
                                <input type="number" id="buy-price" class="search-input" placeholder="0" min="0">
                            </div>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="result-item">
                            <span class="result-label">총 매입 금액</span>
                            <span class="result-value" id="total-amount">0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">총 보유 수량</span>
                            <span class="result-value" id="total-qty">0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">최종 평단가</span>
                            <span class="result-value" id="final-price">0</span>
                        </div>
                    </div>

                    <div class="disclaimer">
                        <span class="material-symbols-rounded"
                            style="font-size: 16px; vertical-align: text-bottom; margin-right: 4px; color: #ff3b30;">warning</span>
                        본 계산기의 결과는 단순 참고용이며, 실제 매매 비용(수수료, 세금 등)은 포함되지 않을 수 있습니다.
                        <strong>본 결과는 투자 판단의 근거가 되지 않으며, 투자 결과에 대한 책임은 본인에게 있습니다.</strong>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('average-down', {
            elements: {},

            init() {
                this.elements = {
                    currentQty: document.getElementById('current-qty'),
                    currentPrice: document.getElementById('current-price'),
                    buyQty: document.getElementById('buy-qty'),
                    buyPrice: document.getElementById('buy-price'),
                    totalAmount: document.getElementById('total-amount'),
                    totalQty: document.getElementById('total-qty'),
                    finalPrice: document.getElementById('final-price')
                };

                const inputs = [
                    this.elements.currentQty,
                    this.elements.currentPrice,
                    this.elements.buyQty,
                    this.elements.buyPrice
                ];

                inputs.forEach(input => {
                    input.addEventListener('input', () => this.calculate());
                });

                console.log('Average Down Calculator initialized');
            },

            cleanup() {
                // Event listeners on elements are automatically removed when elements are removed from DOM
                // But if we wanted to be strict:
                /*
                const inputs = [
                    this.elements.currentQty, 
                    this.elements.currentPrice, 
                    this.elements.buyQty, 
                    this.elements.buyPrice
                ];
                inputs.forEach(input => {
                    input?.removeEventListener('input', this.calculate); // Need to bind calculate or use arrow function ref
                });
                */
                this.elements = {};
                console.log('Average Down Calculator cleanup done');
            },

            calculate() {
                const cQty = parseFloat(this.elements.currentQty.value) || 0;
                const cPrice = parseFloat(this.elements.currentPrice.value) || 0;
                const bQty = parseFloat(this.elements.buyQty.value) || 0;
                const bPrice = parseFloat(this.elements.buyPrice.value) || 0;

                const currentTotal = cQty * cPrice;
                const buyTotal = bQty * bPrice;

                const finalTotalAmount = currentTotal + buyTotal;
                const finalTotalQty = cQty + bQty;

                let finalAvgPrice = 0;
                if (finalTotalQty > 0) {
                    finalAvgPrice = finalTotalAmount / finalTotalQty;
                }

                // Format numbers
                const fmt = (num) => num.toLocaleString('ko-KR', { maximumFractionDigits: 2 });

                this.elements.totalAmount.textContent = fmt(finalTotalAmount);
                this.elements.totalQty.textContent = fmt(finalTotalQty);
                this.elements.finalPrice.textContent = fmt(finalAvgPrice);
            }
        });
    </script>
</body>

</html>
