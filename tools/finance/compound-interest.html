<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>복리 이자 계산기 - Utilsly</title>
    <meta name="description" content="초기 금액, 월 적립액, 이자율, 기간을 설정하여 복리 수익을 정확히 계산하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }

        .inputs-panel {
            background: var(--bg-sidebar);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            padding-right: 40px;
        }

        .input-unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 14px;
        }

        .results-panel {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .summary-card-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: var(--bg-sidebar);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .summary-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .summary-value.highlight {
            color: var(--accent-blue);
        }

        .table-container {
            margin-top: 24px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 12px;
            background: var(--bg-sidebar);
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">금융 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">trending_up</span>
                    </div>
                    <h1>복리 이자 계산기</h1>
                    <p class="description">시간이 지날수록 불어나는 복리 효과를 시각적으로 확인해보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="compound-interest">
                    <div class="calculator-grid">
                        <div class="inputs-panel">
                            <div class="input-group">
                                <label>초기 예치금</label>
                                <div class="input-wrapper">
                                    <input type="number" id="initialPrincipal" value="1000000">
                                    <span class="input-unit">원</span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>월 적립액</label>
                                <div class="input-wrapper">
                                    <input type="number" id="monthlyContribution" value="100000">
                                    <span class="input-unit">원</span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>연 이자율</label>
                                <div class="input-wrapper">
                                    <input type="number" id="interestRate" value="5" step="0.1">
                                    <span class="input-unit">%</span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>기간</label>
                                <div class="input-wrapper">
                                    <input type="number" id="years" value="10">
                                    <span class="input-unit">년</span>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>복리 방식</label>
                                <select id="compoundFrequency">
                                    <option value="12">매월 (월복리)</option>
                                    <option value="1">매년 (연복리)</option>
                                    <option value="4">분기별</option>
                                </select>
                            </div>

                            <button class="btn btn-primary" id="calculateBtn"
                                style="width: 100%; margin-top: 8px;">계산하기</button>
                        </div>

                        <div class="results-panel">
                            <div class="summary-card-container">
                                <div class="summary-card">
                                    <div class="summary-label">최종 금액</div>
                                    <div class="summary-value highlight" id="finalAmount">-</div>
                                </div>
                                <div class="summary-card">
                                    <div class="summary-label">총 이자 수익</div>
                                    <div class="summary-value" id="totalInterest">-</div>
                                </div>
                                <div class="summary-card">
                                    <div class="summary-label">총 납입 원금</div>
                                    <div class="summary-value" id="totalPrincipal">-</div>
                                </div>
                                <div class="summary-card">
                                    <div class="summary-label">수익률</div>
                                    <div class="summary-value" id="returnRate">-</div>
                                </div>
                            </div>

                            <div style="flex: 1; min-height: 300px;">
                                <canvas id="resultChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('compound-interest', {
            elements: {},
            chart: null,

            init() {
                this.elements = {
                    initialPrincipal: document.getElementById('initialPrincipal'),
                    monthlyContribution: document.getElementById('monthlyContribution'),
                    interestRate: document.getElementById('interestRate'),
                    years: document.getElementById('years'),
                    compoundFrequency: document.getElementById('compoundFrequency'),
                    calculateBtn: document.getElementById('calculateBtn'),
                    finalAmount: document.getElementById('finalAmount'),
                    totalInterest: document.getElementById('totalInterest'),
                    totalPrincipal: document.getElementById('totalPrincipal'),
                    returnRate: document.getElementById('returnRate'),
                    ctx: document.getElementById('resultChart').getContext('2d')
                };

                this.elements.calculateBtn.addEventListener('click', () => this.calculate());

                // Auto calculate on enter or initial load?
                this.calculate();

                console.log('Compound Interest Calculator initialized');
            },

            calculate() {
                const P = parseFloat(this.elements.initialPrincipal.value) || 0;
                const PMT = parseFloat(this.elements.monthlyContribution.value) || 0;
                const r = (parseFloat(this.elements.interestRate.value) || 0) / 100;
                const t = parseFloat(this.elements.years.value) || 1;
                const n = parseInt(this.elements.compoundFrequency.value);

                const totalMonths = t * 12;
                let futureValue = P;
                let totalInvested = P;

                // Data for chart
                const labels = [];
                const principalData = [];
                const interestData = [];

                // Calculation logic: Step by step for accurate monthly additional accumulation even if compounding varies
                // Simple approx: convert everything to monthly steps for chart

                // If freq is 12 (monthly), simple. If 1 (yearly), interest adds only annually but PMT adds monthly?
                // Usually compound interest calc with monthly contribution assumes monthly compounding or contribution happening at compounding interval.
                // Let's assume contribution happens at the end of each compounding period for simplicity if matched,
                // or just standard formula: FV = P(1+r/n)^(nt) + PMT * ... ?
                // Standard formula for Monthly Contribution PMT, Monthly Compounding:
                // FV = P * (1 + r/12)^(12t) + PMT * [ (1 + r/12)^(12t) - 1 ] / (r/12)

                // Let's do a loop for year-by-year data points for the chart.

                let currentBalance = P;
                let totalPrincipal = P;

                for (let year = 1; year <= t; year++) {
                    labels.push(year + '년');

                    // Add monthly contributions and compound
                    // To support different compounding frequencies accurately, let's step by month internally

                    for (let m = 0; m < 12; m++) {
                        // Interest accrual depends on n
                        // Simplified: daily/monthly accrual is common. 
                        // If user selects Annual compounding but Monthly contribution, strictly interest applies only at yearend.
                        // But usually banks calculate monthly or daily. Let's stick to n=12 is standard for "Monthly", n=1 for "Yearly".

                        // Wait, if n=1 (Yearly), effectively PMT sits idle until year capitalization? 
                        // Let's simplify: Treat 'n' strictly as capitalization frequency.
                        // Contributions PMT happen monthly.

                        // We accumulate PMT to a non-interest bucket every month.
                        // At compounding event (every 12/n months), we apply interest to Balance and merge accumulations.

                        // For chart smoothness, let's use the Formula approach for end-of-year points.
                    }

                    // Actually, let's just use the standard Future Value of a Series formula modified for P and PMT
                    // Assuming PMT is made at end of each month, and compounding is 'n' times per year.
                    // This is complex. Most calculators simplify to: Compounding = Monthly (n=12).
                    // If user selects n=1, it's roughly:

                    // Let's stick to the n=12 (Monthly Compounding) formula for monthly contributions as default best practice unless strict yearly is needed.
                    // If n differs, we iterate.

                    // ITERATIVE SIMULATION (Best for chart)
                    // Reset for full simulation
                }

                labels.length = 0; principalData.length = 0; interestData.length = 0;

                currentBalance = P;
                totalPrincipal = P;

                // Simulation step: 1 Month
                // Rate per month = r / 12 (if n=12). 
                // If n=1, rate per month = 0, rate per year = r.

                const compoundIntervalMonths = 12 / n; // e.g. 12/12=1 month, 12/1=12 months
                let nextCompoundMonth = compoundIntervalMonths;

                // Start with Year 0
                labels.push('시작');
                principalData.push(P);
                interestData.push(0);

                for (let month = 1; month <= totalMonths; month++) {
                    // Add contribution
                    currentBalance += PMT;
                    totalPrincipal += PMT;

                    // Compound Interest?
                    if (month % (12 / n) < 0.01) { // Floating point safety, or just checking integer divisibility
                        // close enough to compound interval? 
                        // actually 12/n might be integer. 12/12=1, 12/1=12, 12/4=3. Yes.
                        // Wait, logic: At month M, if M is multiple of interval, apply interest.
                        // Interest Rate per period = r / n
                        const interest = (currentBalance - PMT) * (r / n); // Previous balance earns interest
                        // Actually interest is usually on average balance or start balance. 
                        // Let's assume interest applies to balance BEFORE this month's deposit generally, or After? 
                        // Standard: Interest on balance at start of period.
                        // let's apply interest to (CurrentBalance - PMT).
                        currentBalance += interest;
                    }

                    // Record data point at end of each YEAR
                    if (month % 12 === 0) {
                        labels.push((month / 12) + '년');
                        principalData.push(Math.round(totalPrincipal));
                        interestData.push(Math.round(currentBalance - totalPrincipal));
                    }
                }

                // Display Results
                const finalBal = Math.round(currentBalance);
                const totalPrin = Math.round(totalPrincipal);
                const totalInt = finalBal - totalPrin;
                const retRate = ((totalInt / totalPrin) * 100).toFixed(2);

                this.elements.finalAmount.innerText = finalBal.toLocaleString() + '원';
                this.elements.totalInterest.innerText = totalInt.toLocaleString() + '원';
                this.elements.totalPrincipal.innerText = totalPrin.toLocaleString() + '원';
                this.elements.returnRate.innerText = retRate + '%';

                this.drawChart(labels, principalData, interestData);
            },

            drawChart(labels, principalData, interestData) {
                if (this.chart) this.chart.destroy();

                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const gridColor = isDark ? '#333' : '#E5E5E5';
                const textColor = isDark ? '#AAA' : '#666';

                this.chart = new Chart(this.elements.ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '원금',
                                data: principalData,
                                borderColor: '#9B9A97', // Grey
                                backgroundColor: 'rgba(155, 154, 151, 0.1)',
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: '이자 수익',
                                data: interestData, // We want stacked? No, total value line?
                                // Let's show Total Value vs Principal
                                // Actually better: Stacked Area? Or just two lines.
                                // Let's show Total Balance line and Principal line.
                                // "interestData" here is just interest amount. 
                                // Total Balance = Principal + Interest.
                                // Let's re-map to: Principal (Base), Total (Top)
                            }
                        ]
                    },
                    // Re-do datasets for better viz
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '총 자산',
                                data: principalData.map((p, i) => p + interestData[i]),
                                borderColor: '#000000', // Accent Blue equivalent? or Black/White
                                backgroundColor: 'rgba(0, 0, 0, 0.05)',
                                fill: true,
                                tension: 0.4,
                                order: 1
                            },
                            {
                                label: '납입 원금',
                                data: principalData,
                                borderColor: '#9B9A97',
                                borderDash: [5, 5],
                                fill: false,
                                tension: 0.4,
                                order: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        scales: {
                            x: {
                                grid: { color: 'transparent' },
                                ticks: { color: textColor }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: {
                                    color: textColor,
                                    callback: (val) => {
                                        if (val >= 100000000) return (val / 100000000).toFixed(1) + '억';
                                        if (val >= 10000) return (val / 10000).toFixed(0) + '만';
                                        return val;
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: textColor }
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => ctx.dataset.label + ': ' + ctx.raw.toLocaleString() + '원'
                                }
                            }
                        }
                    }
                });

                // Color adjustment for Dark Mode
                if (isDark) {
                    this.chart.data.datasets[0].borderColor = '#FFFFFF';
                    this.chart.data.datasets[0].backgroundColor = 'rgba(255, 255, 255, 0.1)';
                    this.chart.update();
                }
            }
        });
    </script>
</body>

</html>
