<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>복리 이자 계산기 - Utilsly</title>
    <meta name="description" content="초기 투자금, 월 적립액, 이자율, 기간을 설정하여 복리 수익을 계산해보고 자산 증식 효과를 확인하세요.">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 800px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-section {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .result-section {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 12px;
            padding-right: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
        }

        .input-wrapper .unit {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 14px;
            pointer-events: none;
        }

        .summary-card {
            background: var(--bg-hover);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .summary-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 600;
        }

        /* Simple Bar Chart Visualization using CSS */
        .chart-container {
            margin-top: 24px;
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            /* Reduced gap */
            padding-top: 20px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            /* Allow horizontal scroll if many years */
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100%;
            min-width: 20px;
            /* Ensure visibility */
            position: relative;
        }

        .bar {
            width: 80%;
            background: var(--accent-blue);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s;
            position: relative;
        }

        .bar:hover::after {
            content: attr(data-value);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
        }

        .bar-principal {
            background: #aaa;
            width: 100%;
        }

        .bar-interest {
            background: var(--accent-blue);
            width: 100%;
        }

        .stacked-bar {
            width: 80%;
            display: flex;
            flex-direction: column-reverse;
            height: 100%;
            /* logic handles height via style */
        }

        .x-label {
            margin-top: 6px;
            font-size: 10px;
            color: var(--text-tertiary);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Utilsly</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item">금융</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">복리 이자 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">savings</span>
                    </div>
                    <h1>복리 이자 계산기</h1>
                    <p class="description">시간의 마법, 복리 효과를 계산해보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="compound-interest">
                    <div class="calculator-grid">
                        <!-- Input Section -->
                        <div class="input-section">
                            <div class="input-group">
                                <label>초기 투자금 (원)</label>
                                <div class="input-wrapper">
                                    <input type="number" id="principal" value="10000000" placeholder="0">
                                    <span class="unit">원</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>월 적립액 (원)</label>
                                <div class="input-wrapper">
                                    <input type="number" id="monthlyContribution" value="1000000" placeholder="0">
                                    <span class="unit">원</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>연 이자율 (%)</label>
                                <div class="input-wrapper">
                                    <input type="number" id="interestRate" value="5" step="0.1" placeholder="5.0">
                                    <span class="unit">%</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>투자 기간 (년)</label>
                                <div class="input-wrapper">
                                    <input type="number" id="years" value="10" min="1" max="50">
                                    <span class="unit">년</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>복리 주기</label>
                                <div class="input-wrapper">
                                    <select id="compoundFreq">
                                        <option value="12">매월 (월복리)</option>
                                        <option value="4">매분기 (분기복리)</option>
                                        <option value="2">반기마다</option>
                                        <option value="1">매년 (연복리)</option>
                                    </select>
                                </div>
                            </div>

                            <button class="btn btn-primary" id="btnCalculate"
                                style="width: 100%; padding: 14px;">계산하기</button>
                        </div>

                        <!-- Result Section -->
                        <div class="result-section">
                            <div class="summary-card">
                                <div class="summary-title">최종 금액 (예상)</div>
                                <div class="summary-value" id="finalBalance">0원</div>
                            </div>

                            <div class="detail-row">
                                <span class="detail-label">총 원금</span>
                                <span class="detail-value" id="totalPrincipal">0원</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">총 이자 수익</span>
                                <span class="detail-value" id="totalInterest"
                                    style="color: var(--accent-blue);">0원</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">총 수익률</span>
                                <span class="detail-value" id="totalReturn">0%</span>
                            </div>

                            <div class="chart-container" id="chartContainer">
                                <!-- Bars injected by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('compound-interest', {
            init() {
                this.els = {
                    principal: document.getElementById('principal'),
                    monthly: document.getElementById('monthlyContribution'),
                    rate: document.getElementById('interestRate'),
                    years: document.getElementById('years'),
                    freq: document.getElementById('compoundFreq'),
                    btnCalc: document.getElementById('btnCalculate'),

                    finalBalance: document.getElementById('finalBalance'),
                    totalPrincipal: document.getElementById('totalPrincipal'),
                    totalInterest: document.getElementById('totalInterest'),
                    totalReturn: document.getElementById('totalReturn'),
                    chartContainer: document.getElementById('chartContainer')
                };

                this.els.btnCalc.addEventListener('click', () => this.calculate());

                // Init calc
                this.calculate();
            },

            formatMoney(num) {
                return Math.floor(num).toLocaleString('ko-KR') + '원';
            },

            calculate() {
                const P = parseFloat(this.els.principal.value) || 0;
                const PMT = parseFloat(this.els.monthly.value) || 0;
                const rPercent = parseFloat(this.els.rate.value) || 0;
                const t = parseInt(this.els.years.value) || 1;
                const n = parseInt(this.els.freq.value) || 12;

                const r = rPercent / 100;

                // Logic: Iterate to build yearly data for chart
                // Formula: A = P(1 + r/n)^(nt) + PMT * [ (1 + r/n)^(nt) - 1 ] / (r/n)
                // BUT PMT is usually monthly. If n != 12, calculation is complex.
                // WE assume PMT is deposited monthly.
                // If Compounding is e.g. Yearly, monthly deposits sit there until compound time? 
                // Usually "Monthly Contribution" implies Monthly Compounding is best fit, but generalized formula matches frequency.
                // Standard Future Value of Ordinary Annuity formula assumes payment frequency matches compound frequency.
                // If PMT is monthly but n=1 (Yearly), we treat PMT as 12*PMT added yearly? No, that loses intra-year interest if any (simple interest).
                // Let's simplify: 
                // Assume standard "Monthly Compounding" for the PMT part if n=12.
                // If user selects Annual compounding but makes Monthly deposits:
                // We'll simulate month by month.

                let currentBalance = P;
                let totalInvested = P;
                let yearlyData = [];

                const totalorMonths = t * 12;

                for (let m = 1; m <= totalorMonths; m++) {
                    // Add monthly contribution
                    currentBalance += PMT;
                    totalInvested += PMT;

                    // Apply Interest
                    // Effective monthly rate depends on compounding frequency 'n'
                    // If n=12 (Monthly), rate is r/12
                    // If n=1 (Yearly), rate is applied only at month 12, 24...
                    // Or we calculate effective monthly rate: (1+r)^(1/12) - 1

                    if (n === 12) {
                        currentBalance *= (1 + r / 12);
                    } else if (n === 1) {
                        // Yearly compounding
                        if (m % 12 === 0) {
                            currentBalance *= (1 + r);
                        }
                    } else if (n === 4) {
                        // Quarterly
                        if (m % 3 === 0) {
                            currentBalance *= (1 + r / 4);
                        }
                    } else if (n === 2) {
                        // Half Yearly
                        if (m % 6 === 0) {
                            currentBalance *= (1 + r / 2);
                        }
                    }

                    // Store yearly snapshot
                    if (m % 12 === 0) {
                        yearlyData.push({
                            year: m / 12,
                            invested: totalInvested,
                            balance: currentBalance,
                            interest: currentBalance - totalInvested
                        });
                    }
                }

                // Display Results
                this.els.finalBalance.textContent = this.formatMoney(currentBalance);
                this.els.totalPrincipal.textContent = this.formatMoney(totalInvested);
                this.els.totalInterest.textContent = this.formatMoney(currentBalance - totalInvested);

                const returnRate = totalInvested > 0 ? ((currentBalance - totalInvested) / totalInvested * 100) : 0;
                this.els.totalReturn.textContent = returnRate.toFixed(2) + '%';

                // Render Chart
                this.renderChart(yearlyData, currentBalance);
            },

            renderChart(data, maxBalance) {
                this.els.chartContainer.innerHTML = '';

                // If too many bars, skip some labels
                // Just use max 20 bars logic?
                // Or just scroll. CSS handles scroll.

                data.forEach((d) => {
                    const barGroup = document.createElement('div');
                    barGroup.className = 'bar-group';

                    const heightPercent = (d.balance / maxBalance) * 100;

                    // Stacked visual: Principal (Grey), Interest (Blue)
                    const principalPercent = (d.invested / d.balance) * 100; // relative to the bar height
                    const interestPercent = 100 - principalPercent;

                    barGroup.innerHTML = `
                        <div class="bar" style="height: ${heightPercent}%; background: transparent; display: flex; flex-direction: column-reverse;" data-value="${this.formatMoney(d.balance)}">
                             <div class="bar-principal" style="height: ${principalPercent}%; background: #ccc;"></div>
                             <div class="bar-interest" style="height: ${interestPercent}%; background: var(--accent-blue);"></div>
                        </div>
                        <div class="x-label">${d.year}년</div>
                    `;
                    this.els.chartContainer.appendChild(barGroup);
                });
            }
        });
    </script>
</body>

</html>
