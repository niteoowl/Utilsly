<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>수익률 계산기 - Utilsly</title>
    <meta name="description" content="매수/매도 가격과 수수료를 반영하여 정확한 주식, 코인 수익률과 실현 손익을 계산하세요.">

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .result-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .result-item.highlight {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            font-weight: 700;
            font-size: 18px;
        }

        .result-label {
            color: var(--text-secondary);
        }

        .result-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .value-plus {
            color: #34c759;
        }

        .value-minus {
            color: #ff3b30;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .disclaimer {
            margin-top: 32px;
            padding: 16px;
            background: rgba(255, 59, 48, 0.05);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            border: 1px solid rgba(255, 59, 48, 0.1);
        }

        .preset-btn {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            cursor: pointer;
            margin-right: 4px;
        }

        .preset-btn:hover {
            background: var(--bg-hover);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">수익률 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">trending_up</span> // Icon choice
                    </div>
                    <h1>수익률 계산기</h1>
                    <p class="description">매매 수수료를 포함한 정확한 수익금을 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="profit-calculator">
                    <div class="dashboard-grid">
                        <div class="tool-card" style="cursor: default; grid-column: span 2;">
                            <div class="dashboard-grid" style="gap: 20px;">
                                <div class="input-group">
                                    <label>매수 가격 (단가)</label>
                                    <input type="number" id="buy-price" class="search-input" placeholder="0" min="0">
                                </div>
                                <div class="input-group">
                                    <label>매도 가격 (단가)</label>
                                    <input type="number" id="sell-price" class="search-input" placeholder="0" min="0">
                                </div>
                                <div class="input-group">
                                    <label>수량</label>
                                    <input type="number" id="quantity" class="search-input" placeholder="0" min="0">
                                </div>
                                <div class="input-group">
                                    <label>
                                        수수료율 (%)
                                        <div style="float: right;">
                                            <button class="preset-btn"
                                                onclick="Utilsly.tools['profit-calculator'].setFee(0.015)">국내주식</button>
                                            <button class="preset-btn"
                                                onclick="Utilsly.tools['profit-calculator'].setFee(0.25)">해외주식</button>
                                            <button class="preset-btn"
                                                onclick="Utilsly.tools['profit-calculator'].setFee(0.05)">코인</button>
                                        </div>
                                    </label>
                                    <input type="number" id="fee-rate" class="search-input" placeholder="0.015"
                                        step="0.001" min="0" value="0.015">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="result-item">
                            <span class="result-label">총 매수 금액</span>
                            <span class="result-value" id="total-buy">0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">총 매도 금액</span>
                            <span class="result-value" id="total-sell">0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">예상 수수료 (매수+매도)</span>
                            <span class="result-value" id="total-fee">0</span>
                        </div>
                        <div class="result-item highlight">
                            <span class="result-label">순수익 (수익금)</span>
                            <span class="result-value" id="net-profit">0</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">최종 수익률</span>
                            <span class="result-value" id="roi">0%</span>
                        </div>
                    </div>

                    <div class="disclaimer">
                        <span class="material-symbols-rounded"
                            style="font-size: 16px; vertical-align: text-bottom; margin-right: 4px; color: #ff3b30;">warning</span>
                        본 계산기의 결과는 단순 참고용이며, 실제 매매 비용(증권사/거래소 정책, 세금 등)은 포함되지 않을 수 있습니다.
                        <strong>본 결과는 투자 판단의 근거가 되지 않으며, 투자 결과에 대한 책임은 본인에게 있습니다.</strong>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('profit-calculator', {
            elements: {},

            init() {
                this.elements = {
                    buyPrice: document.getElementById('buy-price'),
                    sellPrice: document.getElementById('sell-price'),
                    quantity: document.getElementById('quantity'),
                    feeRate: document.getElementById('fee-rate'),
                    totalBuy: document.getElementById('total-buy'),
                    totalSell: document.getElementById('total-sell'),
                    totalFee: document.getElementById('total-fee'),
                    netProfit: document.getElementById('net-profit'),
                    roi: document.getElementById('roi')
                };

                const inputs = [
                    this.elements.buyPrice,
                    this.elements.sellPrice,
                    this.elements.quantity,
                    this.elements.feeRate
                ];

                inputs.forEach(input => {
                    input.addEventListener('input', () => this.calculate());
                });

                console.log('Profit Calculator initialized');
            },

            cleanup() {
                this.elements = {};
            },

            setFee(rate) {
                if (this.elements.feeRate) {
                    this.elements.feeRate.value = rate;
                    this.calculate();
                }
            },

            calculate() {
                const bPrice = parseFloat(this.elements.buyPrice.value) || 0;
                const sPrice = parseFloat(this.elements.sellPrice.value) || 0;
                const qty = parseFloat(this.elements.quantity.value) || 0;
                const feePercent = parseFloat(this.elements.feeRate.value) || 0;

                const buyAmt = bPrice * qty;
                const sellAmt = sPrice * qty;

                // Fee is usually applied on both buy and sell total amounts
                const buyFee = buyAmt * (feePercent / 100);
                const sellFee = sellAmt * (feePercent / 100);
                const totalFee = buyFee + sellFee;

                const netProfit = sellAmt - buyAmt - totalFee;
                let roi = 0;
                if (buyAmt > 0) {
                    roi = (netProfit / buyAmt) * 100;
                }

                const fmt = (num) => num.toLocaleString('ko-KR', { maximumFractionDigits: 0 });
                const fmtPct = (num) => num.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';

                this.elements.totalBuy.textContent = fmt(buyAmt);
                this.elements.totalSell.textContent = fmt(sellAmt);
                this.elements.totalFee.textContent = fmt(totalFee);

                this.elements.netProfit.textContent = (netProfit > 0 ? '+' : '') + fmt(netProfit);
                this.elements.netProfit.className = 'result-value ' + (netProfit > 0 ? 'value-plus' : (netProfit < 0 ? 'value-minus' : ''));

                this.elements.roi.textContent = (roi > 0 ? '+' : '') + fmtPct(roi);
                this.elements.roi.className = 'result-value ' + (roi > 0 ? 'value-plus' : (roi < 0 ? 'value-minus' : ''));
            }
        });
    </script>
</body>

</html>
