<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>수익률 계산기 - Utilsly</title>
    <meta name="description" content="매수/매도 가격과 수수료, 거래세를 반영하여 정확한 주식, 코인 수익률을 계산합니다.">

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .tool-container {
            max-width: 1200px !important;
        }

        .calc-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .calc-wrapper {
                grid-template-columns: 1fr;
            }
        }

        .section-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            height: 100%;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .relative-input {
            position: relative;
        }

        .relative-input input {
            width: 100%;
            padding-right: 32px;
            text-align: right;
            font-weight: 500;
        }

        .unit-label {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 13px;
            pointer-events: none;
        }

        .preset-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            font-size: 11px;
            margin-left: 8px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .preset-badge:hover {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        /* Result Section */
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row.total {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            border: 1px solid var(--border-color);
        }

        .result-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .result-val {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 15px;
        }

        .val-plus {
            color: #34c759;
        }

        .val-minus {
            color: #ff3b30;
        }

        .val-total {
            font-size: 20px;
            font-weight: 700;
        }

        .disclaimer {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 59, 48, 0.05);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 59, 48, 0.1);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">금융</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-item">수익률 계산기</span>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-secondary" onclick="Utilsly.tools['profit-calculator'].reset()">
                        <span class="material-symbols-rounded">refresh</span>
                        초기화
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">trending_up</span>
                    </div>
                    <h1>수익률 계산기</h1>
                    <p class="description">수수료와 거래세를 포함한 실현 손익 계산</p>
                </div>

                <div class="tool-container" data-tool-id="profit-calculator">
                    <div class="calc-wrapper">
                        <!-- Input Section -->
                        <div class="section-card">
                            <h3 style="margin-bottom: 20px; font-size: 16px;">매매 정보 입력</h3>

                            <div class="input-group">
                                <label>
                                    수수료 (매수/매도 각각 적용)
                                    <span class="preset-badge"
                                        onclick="Utilsly.tools['profit-calculator'].setPreset(0.015, 0.2)">국내주식</span>
                                    <span class="preset-badge"
                                        onclick="Utilsly.tools['profit-calculator'].setPreset(0.25, 0)">해외주식</span>
                                    <span class="preset-badge"
                                        onclick="Utilsly.tools['profit-calculator'].setPreset(0.05, 0)">코인</span>
                                </label>
                                <div class="relative-input">
                                    <input type="number" id="fee-rate" class="search-input" value="0.015" step="0.001">
                                    <span class="unit-label">%</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>거래세 (매도 시에만 적용)</label>
                                <div class="relative-input">
                                    <input type="number" id="tax-rate" class="search-input" value="0.20" step="0.01">
                                    <span class="unit-label">%</span>
                                </div>
                            </div>

                            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 24px 0;">

                            <div class="input-group">
                                <label>매수 단가</label>
                                <div class="relative-input">
                                    <input type="number" id="buy-price" class="search-input" placeholder="0">
                                    <span class="unit-label">원</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>매도 수량</label>
                                <div class="relative-input">
                                    <input type="number" id="sell-qty" class="search-input" placeholder="0">
                                    <span class="unit-label">주</span>
                                </div>
                            </div>

                            <div class="input-group">
                                <label>매도 단가</label>
                                <div class="relative-input">
                                    <input type="number" id="sell-price" class="search-input" placeholder="0">
                                    <span class="unit-label">원</span>
                                </div>
                            </div>
                        </div>

                        <!-- Result Section -->
                        <div class="section-card">
                            <h3 style="margin-bottom: 20px; font-size: 16px;">계산 결과</h3>

                            <div class="result-row">
                                <span class="result-label">총 매수 금액</span>
                                <span class="result-val" id="res-buy-total">0원</span>
                            </div>
                            <div class="result-row">
                                <span class="result-label">총 매도 금액</span>
                                <span class="result-val" id="res-sell-total">0원</span>
                            </div>

                            <div
                                style="margin: 20px 0; padding: 16px; background: var(--bg-hover); border-radius: 8px; font-size: 13px;">
                                <div class="result-row" style="border:none; padding: 4px 0;">
                                    <span class="result-label">매수 수수료</span>
                                    <span class="result-val" id="res-buy-fee"
                                        style="color: var(--text-secondary); font-weight: 500;">0원</span>
                                </div>
                                <div class="result-row" style="border:none; padding: 4px 0;">
                                    <span class="result-label">매도 수수료</span>
                                    <span class="result-val" id="res-sell-fee"
                                        style="color: var(--text-secondary); font-weight: 500;">0원</span>
                                </div>
                                <div class="result-row" style="border:none; padding: 4px 0;">
                                    <span class="result-label">거래세 (매도)</span>
                                    <span class="result-val" id="res-tax"
                                        style="color: var(--text-secondary); font-weight: 500;">0원</span>
                                </div>
                                <div class="result-row"
                                    style="border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 4px;">
                                    <span class="result-label">제비용 합계</span>
                                    <span class="result-val" id="res-total-cost"
                                        style="color: var(--text-tertiary);">0원</span>
                                </div>
                            </div>

                            <div class="result-row total">
                                <span class="result-label" style="font-weight: 600;">최종 수익금</span>
                                <span class="result-val val-total" id="res-net-profit">0원</span>
                            </div>

                            <div class="result-row" style="justify-content: center; border: none; padding-top: 16px;">
                                <span class="result-val" id="res-roi" style="font-size: 24px;">0.00%</span>
                            </div>
                        </div>
                    </div>

                    <div class="disclaimer">
                        <span class="material-symbols-rounded"
                            style="font-size: 16px; vertical-align: text-bottom; margin-right: 4px; color: #ff3b30;">warning</span>
                        본 계산기의 결과는 단순 참고용이며, 실제 증권사/거래소 정책에 따라 다를 수 있습니다.
                        <strong>본 결과는 투자 판단의 근거가 되지 않으며, 투자 결과에 대한 책임은 본인에게 있습니다.</strong>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('profit-calculator', {
            elements: {},

            init() {
                this.elements = {
                    feeRate: document.getElementById('fee-rate'),
                    taxRate: document.getElementById('tax-rate'),
                    buyPrice: document.getElementById('buy-price'),
                    sellQty: document.getElementById('sell-qty'),
                    sellPrice: document.getElementById('sell-price'),

                    resBuyTotal: document.getElementById('res-buy-total'),
                    resSellTotal: document.getElementById('res-sell-total'),
                    resBuyFee: document.getElementById('res-buy-fee'),
                    resSellFee: document.getElementById('res-sell-fee'),
                    resTax: document.getElementById('res-tax'),
                    resTotalCost: document.getElementById('res-total-cost'),
                    resNetProfit: document.getElementById('res-net-profit'),
                    resRoi: document.getElementById('res-roi')
                };

                const inputs = [
                    this.elements.feeRate, this.elements.taxRate,
                    this.elements.buyPrice, this.elements.sellQty, this.elements.sellPrice
                ];

                inputs.forEach(el => el.addEventListener('input', () => this.calculate()));
            },

            cleanup() { this.elements = {}; },

            reset() {
                this.elements.buyPrice.value = '';
                this.elements.sellQty.value = '';
                this.elements.sellPrice.value = '';
                this.calculate();
            },

            setPreset(fee, tax) {
                this.elements.feeRate.value = fee;
                this.elements.taxRate.value = tax;
                this.calculate();
            },

            format(num) {
                return num.toLocaleString('ko-KR') + '원';
            },

            calculate() {
                const feeRate = parseFloat(this.elements.feeRate.value) || 0;
                const taxRate = parseFloat(this.elements.taxRate.value) || 0;

                const bPrice = parseFloat(this.elements.buyPrice.value) || 0;
                const qty = parseFloat(this.elements.sellQty.value) || 0;
                const sPrice = parseFloat(this.elements.sellPrice.value) || 0;

                const buyTotal = bPrice * qty;
                const sellTotal = sPrice * qty;

                // Fee Logic: Fee is percent of total transaction amount
                const buyFee = buyTotal * (feeRate / 100);
                const sellFee = sellTotal * (feeRate / 100);

                // Tax Logic: Tax is percent of sell amount (usually only on sell)
                const tax = sellTotal * (taxRate / 100);

                const totalCost = buyFee + sellFee + tax;
                const netProfit = sellTotal - buyTotal - totalCost; // Profit = Revenue - Cost - Fees

                // Handle visual
                this.elements.resBuyTotal.textContent = this.format(Math.floor(buyTotal));
                this.elements.resSellTotal.textContent = this.format(Math.floor(sellTotal));

                this.elements.resBuyFee.textContent = this.format(Math.floor(buyFee));
                this.elements.resSellFee.textContent = this.format(Math.floor(sellFee));
                this.elements.resTax.textContent = this.format(Math.floor(tax));
                this.elements.resTotalCost.textContent = '-' + this.format(Math.floor(totalCost));

                const profitStr = (netProfit > 0 ? '+' : '') + this.format(Math.floor(netProfit));
                this.elements.resNetProfit.textContent = profitStr;
                this.elements.resNetProfit.className = 'result-val val-total ' + (netProfit > 0 ? 'val-plus' : (netProfit < 0 ? 'val-minus' : ''));

                let roi = 0;
                if (buyTotal > 0) roi = (netProfit / buyTotal) * 100;

                const roiStr = (roi > 0 ? '+' : '') + roi.toFixed(2) + '%';
                this.elements.resRoi.textContent = roiStr;
                this.elements.resRoi.className = 'result-val ' + (roi > 0 ? 'val-plus' : (roi < 0 ? 'val-minus' : ''));
            }
        });
    </script>
</body>

</html>
