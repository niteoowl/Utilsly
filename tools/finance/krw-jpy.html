<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>엔화 환율 - Utilsly</title>
    <meta name="description" content="실시간 원엔(JPY/KRW) 환율을 확인하고 변환하세요.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">금융/투자</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">엔화 환율</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">currency_yen</span>
                    </div>
                    <h1>엔화 환율</h1>
                    <p class="description">일본 엔과 대한민국 원 사이의 실시간 환율을 계산합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="krw-jpy">
                    <div class="calc-wrapper" style="max-width:500px; margin:0 auto;">

                        <div class="input-group">
                            <label class="input-label" id="from-label">일본 엔 (JPY)</label>
                            <div style="display:flex; gap:12px; align-items:center;">
                                <input type="number" id="from-amount" class="search-input" placeholder="0"
                                    style="flex:1;" value="100">
                                <span style="font-size:24px;">🇯🇵</span>
                            </div>
                        </div>

                        <div style="display:flex; justify-content:center; padding:16px 0; color:var(--text-tertiary);">
                            <span class="material-symbols-rounded" id="swap-btn"
                                style="cursor:pointer;">swap_vert</span>
                        </div>

                        <div class="input-group">
                            <label class="input-label" id="to-label">대한민국 원 (KRW)</label>
                            <div style="display:flex; gap:12px; align-items:center;">
                                <input type="text" id="to-amount" class="search-input" placeholder="0" style="flex:1;"
                                    readonly>
                                <span style="font-size:24px;">🇰🇷</span>
                            </div>
                        </div>

                        <div style="margin-top:32px; text-align:center;">
                            <div id="rate-display"
                                style="font-size:20px; font-weight:800; color:var(--accent-blue); margin-bottom:4px;">
                                100 JPY = 0 KRW</div>
                            <div id="update-time" style="font-size:12px; color:var(--text-tertiary);">정보 업데이트 중...</div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('krw-jpy', {
            rates: {},
            mode: 'JPYToKRW',

            async init() {
                this.elements = {
                    fromAmt: document.getElementById('from-amount'),
                    toAmt: document.getElementById('to-amount'),
                    fromLabel: document.getElementById('from-label'),
                    toLabel: document.getElementById('to-label'),
                    swapBtn: document.getElementById('swap-btn'),
                    rateDisplay: document.getElementById('rate-display'),
                    updateTime: document.getElementById('update-time'),
                    fromFlag: document.querySelector('.input-group:nth-child(1) span'),
                    toFlag: document.querySelector('.input-group:nth-child(3) span')
                };

                await this.fetchRates();

                this.elements.fromAmt.addEventListener('input', () => this.calculate());
                this.elements.swapBtn.addEventListener('click', async () => {
                    this.mode = this.mode === 'JPYToKRW' ? 'KRWToJPY' : 'JPYToKRW';
                    this.updateUI();
                    await this.fetchRates();
                    this.calculate();
                });

                this.calculate();
            },

            async fetchRates() {
                const base = this.mode === 'JPYToKRW' ? 'JPY' : 'KRW';
                try {
                    const res = await fetch(`https://open.er-api.com/v6/latest/${base}`);
                    const data = await res.json();
                    if (data.result === 'success') {
                        this.rates = data.rates;
                        this.elements.updateTime.textContent = `최종 업데이트: ${new Date(data.time_last_update_utc).toLocaleString('ko-KR')}`;
                    }
                } catch (e) {
                    this.elements.updateTime.textContent = '환율 정보를 불러오지 못했습니다.';
                }
            },

            updateUI() {
                if (this.mode === 'JPYToKRW') {
                    this.elements.fromLabel.textContent = '일본 엔 (JPY)';
                    this.elements.fromFlag.textContent = '🇯🇵';
                    this.elements.toLabel.textContent = '대한민국 원 (KRW)';
                    this.elements.toFlag.textContent = '🇰🇷';
                    this.elements.fromAmt.value = 100;
                } else {
                    this.elements.fromLabel.textContent = '대한민국 원 (KRW)';
                    this.elements.fromFlag.textContent = '🇰🇷';
                    this.elements.toLabel.textContent = '일본 엔 (JPY)';
                    this.elements.toFlag.textContent = '🇯🇵';
                    this.elements.fromAmt.value = 1000;
                }
            },

            calculate() {
                const val = parseFloat(this.elements.fromAmt.value) || 0;
                const target = this.mode === 'JPYToKRW' ? 'KRW' : 'JPY';
                const rate = this.rates[target];
                if (rate) {
                    const result = val * rate;
                    this.elements.toAmt.value = result.toLocaleString(undefined, { maximumFractionDigits: 2 });

                    if (this.mode === 'JPYToKRW') {
                        this.elements.rateDisplay.textContent = `100 JPY = ${(rate * 100).toLocaleString(undefined, { maximumFractionDigits: 2 })} KRW`;
                    } else {
                        this.elements.rateDisplay.textContent = `1 KRW = ${rate.toLocaleString(undefined, { maximumFractionDigits: 4 })} JPY`;
                    }
                }
            },

            cleanup() { this.elements = {}; }
        });
    </script>
</body>

</html>
