<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>타이머 - Utilsly</title>
    <meta name="description" content="간편한 카운트다운 타이머입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .timer-display {
            font-size: 120px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
            color: var(--text-primary);
            line-height: 1;
            margin: 40px 0;
            cursor: pointer;
        }

        .timer-display.editing {
            display: none;
        }

        .time-input-container {
            display: none;
            gap: 16px;
            margin: 40px 0;
        }

        .time-input-container.editing {
            display: flex;
        }

        .time-input {
            font-size: 80px;
            font-weight: 800;
            width: 120px;
            border: none;
            border-bottom: 4px solid var(--border-color);
            text-align: center;
            background: transparent;
            color: var(--text-primary);
            outline: none;
        }

        .time-input:focus {
            border-color: var(--accent-blue);
        }

        .separator {
            font-size: 80px;
            font-weight: 800;
            color: var(--text-tertiary);
            margin-top: -20px;
        }

        .controls {
            display: flex;
            gap: 24px;
        }

        .btn-control {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-control:hover {
            background: var(--bg-hover);
            border-color: var(--text-primary);
        }

        .btn-main {
            width: 96px;
            height: 96px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            font-size: 40px;
            border-radius: 32px;
        }

        .btn-main:hover {
            transform: scale(1.05);
            background: var(--accent-blue);
            color: white;
        }

        .presets {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
        }

        .preset-chip {
            padding: 8px 16px;
            border-radius: 50px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-chip:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        [data-theme="dark"] .btn-main {
            background: var(--bg-primary);
            color: black;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">타이머</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">timer</span>
                    </div>
                    <h1>타이머</h1>
                    <p class="description">간편한 카운트다운 타이머로 시간을 관리하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="timer"
                    style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
                    <div class="presets">
                        <div class="preset-chip" data-time="60">1분</div>
                        <div class="preset-chip" data-time="180">3분</div>
                        <div class="preset-chip" data-time="300">5분</div>
                        <div class="preset-chip" data-time="600">10분</div>
                        <div class="preset-chip" data-time="1800">30분</div>
                    </div>

                    <div class="timer-display" id="display">05:00</div>

                    <div class="time-input-container" id="inputContainer">
                        <input type="number" class="time-input" id="inputMin" value="05" min="0" max="99">
                        <span class="separator">:</span>
                        <input type="number" class="time-input" id="inputSec" value="00" min="0" max="59">
                    </div>

                    <div class="controls">
                        <button class="btn-control" id="resetBtn">
                            <span class="material-symbols-rounded">refresh</span>
                        </button>
                        <button class="btn-control btn-main" id="toggleBtn">
                            <span class="material-symbols-rounded" id="toggleIcon">play_arrow</span>
                        </button>
                        <button class="btn-control" id="editBtn">
                            <span class="material-symbols-rounded">edit</span>
                        </button>
                    </div>
                </div>
                <div class="tool-help-section" style="max-width: 500px; width: 100%;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li><strong>시간 설정:</strong> '+', '-' 버튼을 누르거나 숫자를 직접 입력하여 타이머 시간을 맞추세요.</li>
                            <li><strong>시작:</strong> 시작(▶) 버튼을 누르면 카운트다운이 시작됩니다.</li>
                            <li><strong>종료:</strong> 시간이 0이 되면 경쾌한 알림음이 울립니다. (소리를 켜주세요!)</li>
                        </ol>
                    </div>
                </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('timer', {
            timerId: null,
            totalSeconds: 300,
            initialSeconds: 300,
            isRunning: false,
            isEditing: false,

            // DOM Elements
            display: null,
            inputContainer: null,
            inputMin: null,
            inputSec: null,
            toggleIcon: null,
            toggleBtn: null,
            resetBtn: null,
            editBtn: null,

            init() {
                // Initialize Elements
                this.display = document.getElementById('display');
                this.inputContainer = document.getElementById('inputContainer');
                this.inputMin = document.getElementById('inputMin');
                this.inputSec = document.getElementById('inputSec');
                this.toggleIcon = document.getElementById('toggleIcon');
                this.toggleBtn = document.getElementById('toggleBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.editBtn = document.getElementById('editBtn');

                // Attach Listeners
                this.toggleBtn.onclick = () => this.toggleTimer();
                this.resetBtn.onclick = () => this.resetTimer();
                this.editBtn.onclick = () => this.toggleEdit();
                this.display.onclick = () => this.toggleEdit();

                this.inputMin.onchange = () => this.updateFromInput();
                this.inputSec.onchange = () => this.updateFromInput();

                // Presets
                document.querySelectorAll('.preset-chip').forEach(chip => {
                    chip.onclick = (e) => {
                        const seconds = parseInt(e.target.dataset.time);
                        this.setTimer(Math.floor(seconds / 60), seconds % 60);
                    };
                });

                // Initial Display
                this.updateDisplay();
                console.log('Timer initialized');
            },

            cleanup() {
                if (this.timerId) clearInterval(this.timerId);
                // Remove listeners (optional since DOM is being replaced, but good practice if we reused DOM)
                this.toggleBtn.onclick = null;
                // ...
                console.log('Timer cleanup done');
            },

            updateDisplay() {
                if (!this.display) return;
                const m = Math.floor(this.totalSeconds / 60).toString().padStart(2, '0');
                const s = (this.totalSeconds % 60).toString().padStart(2, '0');
                this.display.textContent = `${m}:${s}`;
                document.title = this.isRunning ? `${m}:${s} - 타이머` : '타이머';
            },

            toggleTimer() {
                if (this.isEditing) this.toggleEdit();

                if (this.isRunning) {
                    clearInterval(this.timerId);
                    this.toggleIcon.textContent = 'play_arrow';
                } else {
                    if (this.totalSeconds <= 0) return;

                    this.timerId = setInterval(() => {
                        this.totalSeconds--;
                        this.updateDisplay();
                        if (this.totalSeconds <= 0) {
                            clearInterval(this.timerId);
                            this.isRunning = false;
                            this.toggleIcon.textContent = 'play_arrow';
                            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                            alert('타이머 종료!'); // Should use Utilsly.showAlert in future
                        }
                    }, 1000);
                    this.toggleIcon.textContent = 'pause';
                }
                this.isRunning = !this.isRunning;
            },

            resetTimer() {
                clearInterval(this.timerId);
                this.isRunning = false;
                if (this.toggleIcon) this.toggleIcon.textContent = 'play_arrow';
                this.totalSeconds = this.initialSeconds;
                this.updateDisplay();
            },

            setTimer(m, s) {
                if (this.isRunning) this.toggleTimer();
                this.initialSeconds = m * 60 + s;
                this.totalSeconds = this.initialSeconds;
                if (this.inputMin) this.inputMin.value = m.toString().padStart(2, '0');
                if (this.inputSec) this.inputSec.value = s.toString().padStart(2, '0');
                this.updateDisplay();
            },

            toggleEdit() {
                if (this.isRunning) return;
                this.isEditing = !this.isEditing;
                if (this.isEditing) {
                    this.display.classList.add('editing');
                    this.inputContainer.classList.add('editing');
                    this.inputMin.focus();
                } else {
                    this.display.classList.remove('editing');
                    this.inputContainer.classList.remove('editing');
                    this.updateFromInput();
                }
            },

            updateFromInput() {
                let m = parseInt(this.inputMin.value) || 0;
                let s = parseInt(this.inputSec.value) || 0;
                if (s > 59) { m += Math.floor(s / 60); s = s % 60; }

                this.inputMin.value = m.toString().padStart(2, '0');
                this.inputSec.value = s.toString().padStart(2, '0');

                this.initialSeconds = m * 60 + s;
                this.totalSeconds = this.initialSeconds;
                this.updateDisplay();
            }
        });
    </script>
</body>

</html>
