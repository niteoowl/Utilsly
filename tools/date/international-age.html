<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>만 나이 계산기 - Utilsly</title>
    <meta name="description" content="생년월일을 입력하여 정확한 만 나이를 계산해 보세요.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Utilsly</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item">날짜/시간</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">만 나이 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">calendar_today</span>
                    </div>
                    <h1>만 나이 계산기</h1>
                    <p class="description">생년월일을 입력하여 정확한 만 나이와 띠, 별자리를 확인해 보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="international-age">
                    <div class="card">
                        <div class="input-group">
                            <label for="birthDate">생년월일</label>
                            <input type="date" id="birthDate" class="input-field">
                        </div>
                        <div class="input-group">
                            <label for="targetDate">기준일 (오늘)</label>
                            <input type="date" id="targetDate" class="input-field">
                        </div>
                        <button id="calculateBtn" class="btn btn-primary"
                            style="width: 100%; margin-top: 16px;">계산하기</button>
                    </div>

                    <div id="resultArea" class="card result-card" style="display: none; margin-top: 24px;">
                        <h2 style="font-size: 1.25rem; margin-bottom: 20px;">계산 결과</h2>
                        <div class="result-grid"
                            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;">
                            <div class="result-item"
                                style="padding: 16px; background: var(--bg-secondary); border-radius: 12px; text-align: center;">
                                <div style="font-size: 0.875rem; color: var(--text-tertiary); margin-bottom: 4px;">만 나이
                                </div>
                                <div id="ageResult"
                                    style="font-size: 1.5rem; font-weight: 700; color: var(--accent-color);">0세</div>
                            </div>
                            <div class="result-item"
                                style="padding: 16px; background: var(--bg-secondary); border-radius: 12px; text-align: center;">
                                <div style="font-size: 0.875rem; color: var(--text-tertiary); margin-bottom: 4px;">연 나이
                                </div>
                                <div id="yearAgeResult" style="font-size: 1.5rem; font-weight: 700;">0세</div>
                            </div>
                            <div class="result-item"
                                style="padding: 16px; background: var(--bg-secondary); border-radius: 12px; text-align: center;">
                                <div style="font-size: 0.875rem; color: var(--text-tertiary); margin-bottom: 4px;">띠
                                </div>
                                <div id="zodiacResult" style="font-size: 1.5rem; font-weight: 700;">-</div>
                            </div>
                            <div class="result-item"
                                style="padding: 16px; background: var(--bg-secondary); border-radius: 12px; text-align: center;">
                                <div style="font-size: 0.875rem; color: var(--text-tertiary); margin-bottom: 4px;">별자리
                                </div>
                                <div id="constellationResult" style="font-size: 1.5rem; font-weight: 700;">-</div>
                            </div>
                        </div>
                        <div id="detailResult"
                            style="margin-top: 20px; padding: 16px; border-top: 1px solid var(--border-color); color: var(--text-secondary); line-height: 1.6;">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const InternationalAgeTool = {
            init() {
                this.birthDateInput = document.getElementById('birthDate');
                this.targetDateInput = document.getElementById('targetDate');
                this.calculateBtn = document.getElementById('calculateBtn');
                this.resultArea = document.getElementById('resultArea');

                // Set default target date to today
                const today = new Date().toISOString().split('T')[0];
                this.targetDateInput.value = today;

                this.calculateBtn.addEventListener('click', () => this.calculate());

                // Prevent multiple init calls in SPA
                this.isInitialized = true;
            },

            calculate() {
                const birthStr = this.birthDateInput.value;
                const targetStr = this.targetDateInput.value;

                if (!birthStr || !targetStr) {
                    Utilsly.showAlert('생년월일과 기준일을 모두 입력해주세요.');
                    return;
                }

                const birthDate = new Date(birthStr);
                const targetDate = new Date(targetStr);

                if (birthDate > targetDate) {
                    Utilsly.showAlert('생년월일이 기준일보다 미래일 수 없습니다.');
                    return;
                }

                // 1. Man Age (International Age)
                let age = targetDate.getFullYear() - birthDate.getFullYear();
                const m = targetDate.getMonth() - birthDate.getMonth();
                if (m < 0 || (m === 0 && targetDate.getDate() < birthDate.getDate())) {
                    age--;
                }

                // 2. Year Age
                const yearAge = targetDate.getFullYear() - birthDate.getFullYear();

                // 3. Zodiac (띠) - Based on Lunar year usually, but simplified to Solar year for general tool
                const zodiacs = ["원숭이", "닭", "개", "돼지", "쥐", "소", "호랑이", "토끼", "용", "뱀", "말", "양"];
                const zodiac = zodiacs[birthDate.getFullYear() % 12];

                // 4. Constellation (별자리)
                const constellation = this.getConstellation(birthDate.getMonth() + 1, birthDate.getDate());

                // Update UI
                document.getElementById('ageResult').textContent = age + '세';
                document.getElementById('yearAgeResult').textContent = yearAge + '세';
                document.getElementById('zodiacResult').textContent = zodiac + '띠';
                document.getElementById('constellationResult').textContent = constellation;

                const detailArea = document.getElementById('detailResult');
                const nextBirthday = new Date(targetDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
                if (nextBirthday < targetDate) {
                    nextBirthday.setFullYear(nextBirthday.getFullYear() + 1);
                }
                const diffTime = Math.abs(nextBirthday - targetDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                detailArea.innerHTML = `
                    점검일 기준 <strong>만 ${age}세</strong>입니다.<br>
                    다음 생일까지 <strong>${diffDays}일</strong> 남았습니다.
                `;

                this.resultArea.style.display = 'block';
                this.resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            },

            getConstellation(month, day) {
                const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
                const names = ["염소자리", "물병자리", "물고기자리", "양자리", "황소자리", "쌍둥이자리", "게자리", "사자자리", "처녀자리", "천칭자리", "전갈자리", "사수자리"];
                return day >= dates[month - 1] ? names[month % 12] : names[month - 1];
            },

            cleanup() {
                // Remove listeners if needed, though they go with the DOM in SPA
            }
        };

        // Register for SPA
        Utilsly.registerTool('international-age', InternationalAgeTool);

        // Initial load if not SPA
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            InternationalAgeTool.init();
        } else {
            document.addEventListener('DOMContentLoaded', () => InternationalAgeTool.init());
        }
    </script>
</body>

</html>
