<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>D-Day 계산기 - Utilsly</title>
    <meta name="description" content="기념일, 시험, 여행 등 중요한 날까지 남은 날짜를 계산하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">D-Day 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">event_upcoming</span>
                    </div>
                    <h1>D-Day 계산기</h1>
                    <p class="description">중요한 날까지 남은 날짜를 계산하거나 지난 날짜를 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="d-day-counter">
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">날짜 선택</label>
                        <input type="date" id="target-date"
                            style="padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 16px;">
                    </div>

                    <div id="result"
                        style="padding: 32px; background: var(--bg-secondary); border-radius: 8px; border: 1px solid var(--border-color); text-align: center; display: none;">
                        <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px;">남은 시간</div>
                        <div id="d-day-text" style="font-size: 48px; font-weight: 700; color: var(--accent-blue);">D-100
                        </div>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">D-Day 계산 기준이 어떻게 되나요?</div>
                            <div class="faq-answer">당일을 0일로 기준 삼아 계산합니다. 즉, 목표 날짜까지 남은 순수 일수를 의미합니다. 지난 날짜는 D+, 미래 날짜는
                                D-로 표시됩니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">음력 날짜도 지원하나요?</div>
                            <div class="faq-answer">현재 버전은 양력 날짜만 지원합니다. 추후 음력 변환 기능도 추가될 예정입니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('d-day-counter', {
            elements: {},

            init() {
                this.elements = {
                    dateInput: document.getElementById('target-date'),
                    resultDiv: document.getElementById('result'),
                    dDayText: document.getElementById('d-day-text')
                };

                this.handleChange = this.calculate.bind(this);
                this.elements.dateInput.addEventListener('change', this.handleChange);
                console.log('D-Day Counter initialized');
            },

            cleanup() {
                if (this.elements.dateInput) {
                    this.elements.dateInput.removeEventListener('change', this.handleChange);
                }
                this.elements = {};
                console.log('D-Day Counter cleaned up');
            },

            calculate() {
                const target = new Date(this.elements.dateInput.value);
                const today = new Date();

                // Reset hours to compare dates only
                target.setHours(0, 0, 0, 0);
                today.setHours(0, 0, 0, 0);

                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let text = '';
                if (diffDays === 0) {
                    text = "D-Day";
                } else if (diffDays > 0) {
                    text = `D-${diffDays}`;
                } else {
                    text = `D+${Math.abs(diffDays)}`;
                }

                this.elements.dDayText.textContent = text;
                this.elements.resultDiv.style.display = 'block';
            }
        });
    </script>
</body>

</html>
