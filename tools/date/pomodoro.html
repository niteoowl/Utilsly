<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀모도로 타이머 - Utilsly</title>
    <meta name="description" content="집중력 향상을 위한 뽀모도로 타이머입니다. 25분 집중, 5분 휴식을 반복하세요.">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .timer-display {
            font-size: 80px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            text-align: center;
            margin: 40px 0;
            color: var(--text-primary);
        }

        .mode-indicator {
            text-align: center;
            margin-bottom: 20px;
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            background: var(--bg-hover);
            color: var(--text-secondary);
        }

        .mode-badge.active {
            background: #FF3B30;
            /* Red for Work */
            color: white;
        }

        .mode-badge.break {
            background: #30D158;
            /* Green for Break */
            color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .btn-large span {
            font-size: 32px;
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="sidebar"></nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">뽀모도로 타이머</span>
                </div>
            </header>

            <div class="tool-header">
                <div class="header-icon-wrapper">
                    <span class="material-symbols-rounded">check_circle</span>
                </div>
                <h1>뽀모도로 타이머</h1>
                <p class="description">강력한 집중을 위한 최고의 도구. 25분 집중하고 5분 쉬세요.</p>
            </div>

            <div class="tool-container" data-tool-id="pomodoro">

                <div class="calc-wrapper" style="max-width: 500px; margin: 0 auto;">

                    <div class="mode-indicator">
                        <span class="mode-badge active" id="mode-badge">집중 시간 (Work)</span>
                    </div>

                    <div class="timer-display" id="timer-display">25:00</div>

                    <div class="controls">
                        <button class="btn btn-secondary btn-large" id="btn-reset" title="리셋">
                            <span class="material-symbols-rounded">refresh</span>
                        </button>
                        <button class="btn btn-primary btn-large" id="btn-toggle" title="시작/일시정지"
                            style="background: #FF3B30; border-color: #FF3B30;">
                            <span class="material-symbols-rounded" id="icon-toggle">play_arrow</span>
                        </button>
                        <button class="btn btn-secondary btn-large" id="btn-skip" title="스킵">
                            <span class="material-symbols-rounded">skip_next</span>
                        </button>
                    </div>

                    <div class="settings-panel">
                        <h3 style="font-size:14px; margin-bottom:12px; color:var(--text-secondary);">설정</h3>
                        <div class="input-group">
                            <label class="input-label" style="display:flex; justify-content:space-between;">
                                <span>집중 시간 (분)</span>
                                <input type="number" id="inp-work" value="25"
                                    style="width:60px; text-align:right; border:none; background:transparent; font-weight:700;">
                            </label>
                            <input type="range" id="range-work" min="5" max="60" step="1" value="25"
                                style="width:100%;">
                        </div>
                        <div class="input-group" style="margin-top:16px;">
                            <label class="input-label" style="display:flex; justify-content:space-between;">
                                <span>휴식 시간 (분)</span>
                                <input type="number" id="inp-break" value="5"
                                    style="width:60px; text-align:right; border:none; background:transparent; font-weight:700;">
                            </label>
                            <input type="range" id="range-break" min="1" max="30" step="1" value="5"
                                style="width:100%;">
                        </div>
                    </div>

                </div>

            </div>
            <div class="tool-help-section" style="max-width: 500px; margin: 40px auto 0;">
                <div class="tool-help-header"
                    onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                    <div class="tool-help-title">이용 가이드 및 FAQ</div>
                    <span class="material-symbols-rounded toggle-icon">expand_more</span>
                </div>
                <div class="tool-help-content">
                    <div class="faq-item">
                        <div class="faq-question">시간이 지나면 알림이 울리나요?</div>
                        <div class="faq-answer">네, 타이머가 0이 되면 브라우저 알림과 비프음이 재생됩니다. 브라우저 설정에서 알림 및 소리 권한을 허용해주세요.</div>
                    </div>
                    <div class="faq-item">
                        <div class="faq-question">뽀모도로 기법이 뭔가요?</div>
                        <div class="faq-answer">1980년대 프란체스코 시릴로가 제안한 시간 관리법입니다. 보통 '25분 집중 + 5분 휴식'을 한 세트로 반복하여 집중력을
                            극대화합니다.</div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('pomodoro', {
            state: {
                mode: 'work', // 'work' or 'break'
                timeLeft: 25 * 60,
                isRunning: false,
                workTime: 25,
                breakTime: 5
            },
            timerId: null,

            init() {
                this.elements = {
                    display: document.getElementById('timer-display'),
                    badge: document.getElementById('mode-badge'),
                    btnToggle: document.getElementById('btn-toggle'),
                    iconToggle: document.getElementById('icon-toggle'),
                    btnReset: document.getElementById('btn-reset'),
                    btnSkip: document.getElementById('btn-skip'),

                    inpWork: document.getElementById('inp-work'),
                    rangeWork: document.getElementById('range-work'),
                    inpBreak: document.getElementById('inp-break'),
                    rangeBreak: document.getElementById('range-break')
                };

                this.bindEvents();
                this.updateDisplay();
            },

            cleanup() {
                this.pause();
                this.elements = {};
            },

            bindEvents() {
                this.elements.btnToggle.addEventListener('click', () => this.toggle());
                this.elements.btnReset.addEventListener('click', () => this.reset());
                this.elements.btnSkip.addEventListener('click', () => this.skip());

                // Settings Sync
                const sync = (range, inp, key) => {
                    range.addEventListener('input', (e) => {
                        inp.value = e.target.value;
                        this.state[key] = parseInt(e.target.value);
                        if (!this.state.isRunning && this.state.mode === (key === 'workTime' ? 'work' : 'break')) {
                            this.reset();
                        }
                    });
                    inp.addEventListener('change', (e) => {
                        let val = parseInt(e.target.value);
                        if (val < 1) val = 1;
                        range.value = val;
                        this.state[key] = val;
                        if (!this.state.isRunning && this.state.mode === (key === 'workTime' ? 'work' : 'break')) {
                            this.reset();
                        }
                    });
                };

                sync(this.elements.rangeWork, this.elements.inpWork, 'workTime');
                sync(this.elements.rangeBreak, this.elements.inpBreak, 'breakTime');
            },

            toggle() {
                if (this.state.isRunning) {
                    this.pause();
                } else {
                    this.start();
                }
            },

            start() {
                if (this.state.isRunning) return;
                this.state.isRunning = true;
                this.updateControls();

                this.timerId = setInterval(() => {
                    if (this.state.timeLeft > 0) {
                        this.state.timeLeft--;
                        this.updateDisplay();
                    } else {
                        // Time's up
                        this.finish();
                    }
                }, 1000);
            },

            pause() {
                this.state.isRunning = false;
                clearInterval(this.timerId);
                this.updateControls();
            },

            reset() {
                this.pause();
                const duration = this.state.mode === 'work' ? this.state.workTime : this.state.breakTime;
                this.state.timeLeft = duration * 60;
                this.updateDisplay();
            },

            skip() {
                this.finish();
            },

            finish() {
                this.pause();
                // Play Sound?
                const beep = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'); // dummy default
                // Using browser notification
                if (Notification.permission === "granted") {
                    new Notification(this.state.mode === 'work' ? "집중 시간 종료!" : "휴식 시간 종료!");
                } else if (Notification.permission !== "denied") {
                    Notification.requestPermission();
                }

                // Switch Mode
                if (this.state.mode === 'work') {
                    this.state.mode = 'break';
                    this.state.timeLeft = this.state.breakTime * 60;
                } else {
                    this.state.mode = 'work';
                    this.state.timeLeft = this.state.workTime * 60;
                }
                this.updateUIForMode();
                this.updateDisplay();
                // Auto start optional? Let's manual start for now.
            },

            updateDisplay() {
                const m = Math.floor(this.state.timeLeft / 60);
                const s = this.state.timeLeft % 60;
                this.elements.display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

                // Update Badge
            },

            updateControls() {
                this.elements.iconToggle.textContent = this.state.isRunning ? 'pause' : 'play_arrow';
            },

            updateUIForMode() {
                const isWork = this.state.mode === 'work';
                this.elements.badge.className = `mode-badge ${isWork ? 'active' : 'break'}`;
                this.elements.badge.textContent = isWork ? '집중 시간 (Work)' : '휴식 시간 (Break)';

                const color = isWork ? '#FF3B30' : '#30D158';
                this.elements.btnToggle.style.backgroundColor = color;
                this.elements.btnToggle.style.borderColor = color;
            }
        });
    </script>
</body>

</html>
