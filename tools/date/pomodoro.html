<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>뽀모도로 타이머 - Utilsly</title>
    <meta name="description" content="집중력을 높여주는 뽀모도로 타이머입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .timer-display {
            font-size: 120px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -4px;
            color: var(--text-primary);
            line-height: 1;
            margin: 40px 0;
        }

        .mode-tabs {
            display: inline-flex;
            background: var(--bg-secondary);
            padding: 6px;
            border-radius: 16px;
            gap: 4px;
        }

        .mode-tab {
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            color: var(--text-tertiary);
            transition: all 0.2s;
        }

        .mode-tab:hover {
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.05);
        }

        .mode-tab.active {
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .controls {
            display: flex;
            gap: 24px;
        }

        .btn-control {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-size: 28px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-control:hover {
            background: var(--bg-hover);
            border-color: var(--text-primary);
        }

        .btn-main {
            width: 96px;
            height: 96px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            font-size: 40px;
            border-radius: 32px;
        }

        .btn-main:hover {
            transform: scale(1.05);
            background: var(--accent-blue);
            color: white;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .mode-tabs {
            background: rgba(255, 255, 255, 0.05);
        }

        [data-theme="dark"] .mode-tab.active {
            background: rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] .btn-main {
            background: var(--bg-primary);
            color: black;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">뽀모도로 타이머</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">check_circle</span>
                    </div>
                    <h1>뽀모도로 타이머</h1>
                    <p class="description">25분 집중, 5분 휴식으로 생산성을 높여보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="pomodoro"
                    style="display: flex; flex-direction: column; align-items: center; gap: 32px;">
                    <div class="mode-tabs">
                        <div class="mode-tab active" data-mode="pomodoro">집중 (25분)</div>
                        <div class="mode-tab" data-mode="short">짧은 휴식 (5분)</div>
                        <div class="mode-tab" data-mode="long">긴 휴식 (15분)</div>
                    </div>

                    <div class="timer-display" id="timer">25:00</div>

                    <div class="controls">
                        <button class="btn-control" id="resetBtn">
                            <span class="material-symbols-rounded">refresh</span>
                        </button>
                        <button class="btn-control btn-main" id="toggleBtn">
                            <span class="material-symbols-rounded" id="toggleIcon">play_arrow</span>
                        </button>
                        <button class="btn-control" id="skipBtn">
                            <span class="material-symbols-rounded">skip_next</span>
                        </button>
                    </div>
                </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('pomodoro', {
            timeLeft: 25 * 60,
            timerId: null,
            isRunning: false,
            currentMode: 'pomodoro',
            modes: {
                pomodoro: 25 * 60,
                short: 5 * 60,
                long: 15 * 60
            },
            elements: {},

            init() {
                this.elements = {
                    display: document.getElementById('timer'),
                    toggleIcon: document.getElementById('toggleIcon'),
                    tabs: document.querySelectorAll('.mode-tab'),
                    toggleBtn: document.getElementById('toggleBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    skipBtn: document.getElementById('skipBtn')
                };

                this.handleToggle = this.toggleTimer.bind(this);
                this.handleReset = () => this.resetTimer(true);
                this.handleSkip = this.skipTimer.bind(this);
                this.handleModeClick = (e) => {
                    const mode = e.target.dataset.mode;
                    if (mode) this.setMode(mode);
                };

                this.elements.toggleBtn.addEventListener('click', this.handleToggle);
                this.elements.resetBtn.addEventListener('click', this.handleReset);
                this.elements.skipBtn.addEventListener('click', this.handleSkip);
                this.elements.tabs.forEach(tab => tab.addEventListener('click', this.handleModeClick));

                console.log('Pomodoro initialized');
            },

            cleanup() {
                if (this.timerId) clearInterval(this.timerId);

                if (this.elements.toggleBtn) {
                    this.elements.toggleBtn.removeEventListener('click', this.handleToggle);
                    this.elements.resetBtn.removeEventListener('click', this.handleReset);
                    this.elements.skipBtn.removeEventListener('click', this.handleSkip);
                    this.elements.tabs.forEach(tab => tab.removeEventListener('click', this.handleModeClick));
                }

                this.elements = {};
                console.log('Pomodoro cleanup done');
            },

            updateDisplay() {
                const m = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                const s = (this.timeLeft % 60).toString().padStart(2, '0');
                if (this.elements.display) this.elements.display.textContent = `${m}:${s}`;
                document.title = this.isRunning ? `${m}:${s} - 집중` : '뽀모도로 타이머';
            },

            setMode(mode) {
                this.currentMode = mode;
                this.timeLeft = this.modes[mode];
                this.resetTimer(false);

                this.elements.tabs.forEach(tab => {
                    if (tab.dataset.mode === mode) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            },

            toggleTimer() {
                if (this.isRunning) {
                    clearInterval(this.timerId);
                    this.elements.toggleIcon.textContent = 'play_arrow';
                } else {
                    this.timerId = setInterval(() => {
                        this.timeLeft--;
                        this.updateDisplay();
                        if (this.timeLeft <= 0) {
                            clearInterval(this.timerId);
                            this.isRunning = false;
                            this.elements.toggleIcon.textContent = 'play_arrow';
                            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
                            alert('시간이 종료되었습니다!');
                            this.setMode(this.currentMode);
                        }
                    }, 1000);
                    this.elements.toggleIcon.textContent = 'pause';
                }
                this.isRunning = !this.isRunning;
                this.updateDisplay();
            },

            resetTimer(autoUpdate = true) {
                clearInterval(this.timerId);
                this.isRunning = false;
                if (this.elements.toggleIcon) this.elements.toggleIcon.textContent = 'play_arrow';
                if (autoUpdate) this.timeLeft = this.modes[this.currentMode];
                this.updateDisplay();
            },

            skipTimer() {
                clearInterval(this.timerId);
                this.isRunning = false;
                if (this.elements.toggleIcon) this.elements.toggleIcon.textContent = 'play_arrow';
                this.timeLeft = 0;
                this.updateDisplay();
            }
        });
    </script>
</body>

</html>
