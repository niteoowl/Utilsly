<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>스톱워치 - Utilsly</title>
    <meta name="description" content="정확한 시간 측정, 랩 타임 기록이 가능한 온라인 스톱워치입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .timer-display {
            font-size: 80px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-align: center;
            margin: 40px 0;
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .btn-large {
            padding: 12px 32px;
            font-size: 18px;
        }

        .laps {

            border-top: 1px solid var(--border-color);
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-variant-numeric: tabular-nums;
        }

        .lap-number {
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">스톱워치</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">timer_off</span>
                    </div>
                    <h1>스톱워치</h1>
                    <p class="description">정밀한 시간 측정과 랩 타임 기록이 가능합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="stopwatch">
                    <div class="timer-display" id="display">00:00:00.00</div>

                    <div class="controls">
                        <button class="btn btn-large btn-primary" id="start-btn">시작</button>
                        <button class="btn btn-large" id="lap-btn" disabled>랩</button>
                        <button class="btn btn-large" id="reset-btn">리셋</button>
                    </div>

                    <div class="laps" id="laps">
                        <!-- Laps go here -->
                    </div>
                </div>
                <div class="tool-help-section" style="margin-top: 32px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">랩(Lap) 기능은 무엇인가요?</div>
                            <div class="faq-answer">스톱워치를 멈추지 않고 특정 구간 기록을 측정할 때 사용합니다. 예를 들어 운동장 한 바퀴를 돌 때마다 누르면 각 바퀴의
                                시간을 따로 기록할 수 있습니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">페이지를 닫아도 계속 측정되나요?</div>
                            <div class="faq-answer">아니요, 브라우저 탭을 닫거나 새로고침하면 타이머가 초기화됩니다. 장시간 측정이 필요하다면 탭을 유지해주세요.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('stopwatch', {
            startTime: 0,
            elapsedTime: 0,
            timerInterval: null,
            isRunning: false,
            lapCount: 1,
            elements: {},

            init() {
                this.elements = {
                    display: document.getElementById('display'),
                    startBtn: document.getElementById('start-btn'),
                    lapBtn: document.getElementById('lap-btn'),
                    resetBtn: document.getElementById('reset-btn'),
                    lapsContainer: document.getElementById('laps')
                };

                this.handleStartStop = this.startStop.bind(this);
                this.handleLap = this.recordLap.bind(this);
                this.handleReset = this.reset.bind(this);

                this.elements.startBtn.addEventListener('click', this.handleStartStop);
                this.elements.lapBtn.addEventListener('click', this.handleLap);
                this.elements.resetBtn.addEventListener('click', this.handleReset);

                console.log('Stopwatch initialized');
            },

            cleanup() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                if (this.elements.startBtn) {
                    this.elements.startBtn.removeEventListener('click', this.handleStartStop);
                    this.elements.lapBtn.removeEventListener('click', this.handleLap);
                    this.elements.resetBtn.removeEventListener('click', this.handleReset);
                }
                this.elements = {};
                console.log('Stopwatch cleanup done');
            },

            formatTime(ms) {
                const date = new Date(ms);
                const m = date.getUTCHours() * 60 + date.getUTCMinutes();
                const s = date.getUTCSeconds();
                const cs = Math.floor(date.getUTCMilliseconds() / 10);
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
            },

            updateDisplay() {
                const now = Date.now();
                const time = this.elapsedTime + (now - this.startTime);
                if (this.elements.display) this.elements.display.textContent = this.formatTime(time);
            },

            startStop() {
                if (this.isRunning) {
                    // Stop
                    clearInterval(this.timerInterval);
                    this.elapsedTime += Date.now() - this.startTime;
                    this.isRunning = false;
                    this.elements.startBtn.textContent = "시작";
                    this.elements.startBtn.style.backgroundColor = "var(--accent-blue)";
                    this.elements.lapBtn.disabled = true;
                } else {
                    // Start
                    this.startTime = Date.now();
                    this.timerInterval = setInterval(this.updateDisplay.bind(this), 10);
                    this.isRunning = true;
                    this.elements.startBtn.textContent = "중지";
                    this.elements.startBtn.style.backgroundColor = "#E03E3E";
                    this.elements.startBtn.style.borderColor = "#E03E3E";
                    this.elements.lapBtn.disabled = false;
                }
            },

            recordLap() {
                if (!this.isRunning) return;
                const now = Date.now();
                const time = this.elapsedTime + (now - this.startTime);

                const lapItem = document.createElement('div');
                lapItem.className = 'lap-item';
                lapItem.innerHTML = `
                    <span class="lap-number">랩 ${this.lapCount}</span>
                    <span class="lap-time">${this.formatTime(time)}</span>
                `;

                this.elements.lapsContainer.insertBefore(lapItem, this.elements.lapsContainer.firstChild);
                this.lapCount++;
            },

            reset() {
                clearInterval(this.timerInterval);
                this.isRunning = false;
                this.elapsedTime = 0;
                this.lapCount = 1;

                if (this.elements.display) this.elements.display.textContent = "00:00:00.00";
                if (this.elements.startBtn) {
                    this.elements.startBtn.textContent = "시작";
                    this.elements.startBtn.style.backgroundColor = "var(--accent-blue)";
                    this.elements.startBtn.style.borderColor = "var(--accent-blue)";
                }
                if (this.elements.lapBtn) this.elements.lapBtn.disabled = true;
                if (this.elements.lapsContainer) this.elements.lapsContainer.innerHTML = '';
            }
        });
    </script>
</body>

</html>
