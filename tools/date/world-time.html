<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>세계 시간 변환기 - Utilsly</title>
    <meta name="description" content="전 세계 주요 도시의 현재 시간을 한눈에 확인하고 비교하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .clock-card {
            padding: 24px;
            text-align: center;
        }

        .city-name {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .time-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .date-display {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">세계 시간</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">public</span>
                    </div>
                    <h1>세계 시간 변환기</h1>
                    <p class="description">전 세계 주요 도시의 실시간 날짜와 시간을 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="world-time">
                    <div class="clock-grid" id="clockGrid">
                        <!-- Clocks generated by JS -->
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">서머타임(Summer Time)이 반영되나요?</div>
                            <div class="faq-answer">네, 각 도시의 타임존(Timezone) 정보를 실시간으로 받아오므로 서머타임 적용 여부가 자동으로 반영된 정확한
                                시간입니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">원하는 도시를 추가할 수 있나요?</div>
                            <div class="faq-answer">현재는 전 세계 주요 금융/상업 도시 8곳을 선별하여 보여드리고 있습니다. 추후 도시 검색 및 추가 기능을 업데이트할
                                예정입니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('world-time', {
            intervalId: null,
            cities: [
                { name: "서울 (Seoul)", zone: "Asia/Seoul" },
                { name: "뉴욕 (New York)", zone: "America/New_York" },
                { name: "런던 (London)", zone: "Europe/London" },
                { name: "파리 (Paris)", zone: "Europe/Paris" },
                { name: "도쿄 (Tokyo)", zone: "Asia/Tokyo" },
                { name: "시드니 (Sydney)", zone: "Australia/Sydney" },
                { name: "로스앤젤레스 (LA)", zone: "America/Los_Angeles" },
                { name: "두바이 (Dubai)", zone: "Asia/Dubai" }
            ],

            init() {
                this.updateClocks = this.updateClocks.bind(this);
                this.updateClocks();
                this.intervalId = setInterval(this.updateClocks, 1000);
                console.log('World Time initialized');
            },

            cleanup() {
                if (this.intervalId) clearInterval(this.intervalId);
                console.log('World Time cleanup done');
            },

            updateClocks() {
                const grid = document.getElementById('clockGrid');
                if (!grid) return;

                const now = new Date();

                let html = '';
                this.cities.forEach(city => {
                    const timeString = now.toLocaleTimeString('en-US', { timeZone: city.zone, hour12: false, hour: '2-digit', minute: '2-digit' });
                    const dateString = now.toLocaleDateString('ko-KR', { timeZone: city.zone, month: 'long', day: 'numeric', weekday: 'short' });

                    html += `
                        <div class="clock-card">
                            <div class="city-name">${city.name}</div>
                            <div class="time-display">${timeString}</div>
                            <div class="date-display">${dateString}</div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            }
        });
    </script>
</body>

</html>
