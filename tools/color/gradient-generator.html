<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>그라디언트 생성기 - Utilsly</title>
    <meta name="description" content="CSS 그라디언트를 시각적으로 만들고 코드를 복사하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">그라디언트 생성</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">gradient</span></div>
                    <h1>그라디언트 생성기</h1>
                    <p class="description">CSS 그라디언트를 시각적으로 만들고 코드를 복사하세요.</p>
                </div>
                <div class="tool-container">
                    <div id="preview" style="width: 100%; height: 300px; border-radius: 12px; margin-bottom: 24px;">
                    </div>
                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">시작 색상</label>
                            <input type="color" id="color1" value="#667eea"
                                style="width: 100%; height: 50px; border: none; border-radius: 8px; cursor: pointer;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">끝 색상</label>
                            <input type="color" id="color2" value="#764ba2"
                                style="width: 100%; height: 50px; border: none; border-radius: 8px; cursor: pointer;">
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">각도 (<span
                                    id="angleValue">45</span>°)</label>
                            <input type="range" id="angle" min="0" max="360" value="45" style="width: 100%;">
                        </div>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">CSS 코드</label>
                        <textarea id="cssCode" readonly
                            style="width: 100%; height: 100px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-mono); font-size: 14px;"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="copyCSS()" style="width: 100%;">CSS 복사</button>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const preview = document.getElementById('preview');
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const angle = document.getElementById('angle');
        const angleValue = document.getElementById('angleValue');
        const cssCode = document.getElementById('cssCode');

        function updateGradient() {
            const css = `linear-gradient(${angle.value}deg, ${color1.value}, ${color2.value})`;
            preview.style.background = css;
            cssCode.value = `background: ${css};`;
            angleValue.textContent = angle.value;
        }

        function copyCSS() {
            navigator.clipboard.writeText(cssCode.value);
        }

        color1.addEventListener('input', updateGradient);
        color2.addEventListener('input', updateGradient);
        angle.addEventListener('input', updateGradient);

        updateGradient();
    </script>
</body>

</html>
