<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>호흡 운동 - Utilsly</title>
    <meta name="description" content="4-7-8 호흡법으로 스트레스를 줄이고 안정을 찾으세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .breathing-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 400px;
            position: relative;
        }

        .circle-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
        }

        .circle {
            background: #E3F2FD;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            z-index: 1;
            transform: scale(0.3);
            transition: transform 4s ease-in-out;
        }

        .instruction {
            z-index: 2;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
        }

        .timer-text {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .controls {
            margin-top: 40px;
        }

        /* Animation States */
        .circle.inhale {
            transform: scale(1);
            background: #BBDEFB;
            transition-duration: 4s;
            /* 4초 들이마시기 */
        }

        .circle.hold {
            transform: scale(1);
            background: #90CAF9;
            transition-duration: 0s;
            /* 멈춤 */
        }

        .circle.exhale {
            transform: scale(0.3);
            background: #E3F2FD;
            transition-duration: 8s;
            /* 8초 내뱉기 */
        }

        [data-theme="dark"] .circle {
            background: #1e3a5f;
        }

        [data-theme="dark"] .circle.inhale {
            background: #2b5285;
        }

        [data-theme="dark"] .circle.hold {
            background: #386ab0;
        }

        [data-theme="dark"] .circle.exhale {
            background: #1e3a5f;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">호흡 운동</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">self_improvement</span>
                    </div>
                    <h1>호흡 운동 (4-7-8)</h1>
                    <p class="description">4초간 들이마시고, 7초간 멈추고, 8초간 내뱉으며 안정을 찾으세요.</p>
                </div>

                <div class="tool-container" data-tool-id="breathing">
                    <div class="breathing-container">
                        <div class="circle-container">
                            <div class="circle" id="circle"></div>
                            <div style="text-align: center; z-index: 2;">
                                <div class="instruction" id="instruction">준비</div>
                                <div class="timer-text" id="timerText">시작하려면 버튼을 누르세요</div>
                            </div>
                        </div>

                        <div class="controls">
                            <button class="btn btn-primary" id="startBtn" style="padding: 12px 32px; font-size: 18px;">
                                시작하기
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('breathing', {
            elements: {},
            isRunning: false,
            timeoutId: null,

            init() {
                this.elements = {
                    circle: document.getElementById('circle'),
                    instruction: document.getElementById('instruction'),
                    timerText: document.getElementById('timerText'),
                    startBtn: document.getElementById('startBtn')
                };

                this.handleToggle = () => this.toggleBreathing();
                this.elements.startBtn.addEventListener('click', this.handleToggle);

                console.log('Breathing Tool initialized');
            },

            cleanup() {
                if (this.elements.startBtn) {
                    this.elements.startBtn.removeEventListener('click', this.handleToggle);
                }
                this.stopBreathing();
                this.elements = {};
                console.log('Breathing Tool cleanup done');
            },

            toggleBreathing() {
                if (this.isRunning) {
                    this.stopBreathing();
                } else {
                    this.startBreathing();
                }
            },

            startBreathing() {
                this.isRunning = true;
                this.elements.startBtn.textContent = '중지하기';
                this.elements.startBtn.style.background = '#FF4B4B';
                this.elements.startBtn.style.borderColor = '#FF4B4B';

                this.runCycle();
            },

            stopBreathing() {
                this.isRunning = false;
                if (this.timeoutId) {
                    clearTimeout(this.timeoutId);
                    this.timeoutId = null;
                }
                if (this.elements.startBtn) {
                    this.elements.startBtn.textContent = '시작하기';
                    this.elements.startBtn.style.background = ''; // Reset to default
                    this.elements.startBtn.style.borderColor = '';
                }

                if (this.elements.circle) {
                    this.elements.circle.className = 'circle';
                    this.elements.instruction.textContent = '준비';
                    this.elements.timerText.textContent = '시작하려면 버튼을 누르세요';
                }
            },

            runCycle() {
                if (!this.isRunning) return;

                // Inhale (4s)
                this.elements.instruction.textContent = '들이마시기';
                this.elements.timerText.textContent = '4초';
                this.elements.circle.className = 'circle inhale';

                this.timeoutId = setTimeout(() => {
                    if (!this.isRunning) return;

                    // Hold (7s)
                    this.elements.instruction.textContent = '멈추기';
                    this.elements.timerText.textContent = '7초';
                    this.elements.circle.className = 'circle hold';

                    this.timeoutId = setTimeout(() => {
                        if (!this.isRunning) return;

                        // Exhale (8s)
                        this.elements.instruction.textContent = '내뱉기';
                        this.elements.timerText.textContent = '8초';
                        this.elements.circle.className = 'circle exhale';

                        this.timeoutId = setTimeout(() => {
                            if (!this.isRunning) return;
                            this.runCycle(); // Repeat
                        }, 8000);

                    }, 7000);

                }, 4000);
            }
        });
    </script>
</body>

</html>
