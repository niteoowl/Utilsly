<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>사다리 타기 - Utilsly</title>
    <meta name="description" content="친구, 동료와 함께하는 사다리 타기 게임입니다. 점심 메뉴, 벌칙 당첨자를 재미있게 정해보세요.">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .game-setup {
            background: var(--bg-sidebar);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .setup-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .player-inputs,
        .result-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .game-area {
            position: relative;
            background: var(--bg-primary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            /* Scroll handled manually if needed */
            min-height: 500px;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        canvas {
            box-shadow: var(--shadow-sm);
            border-radius: 8px;
            background: #fff;
            /* Canvas is white based by default for contrast, or logic to handle theme */
            cursor: pointer;
        }

        /* Dark mode canvas adjustment if we want transparent bg */
        [data-theme="dark"] canvas {
            background: #2a2a2a;
        }

        .game-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .result-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-primary);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
            display: none;
            border: 1px solid var(--border-color);
        }

        .result-modal h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .result-modal p {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-blue);
            margin: 20px 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Utilsly</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item">랜덤</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">사다리 타기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">polyline</span>
                    </div>
                    <h1>사다리 타기</h1>
                    <p class="description">인원을 설정하고 결과를 입력한 뒤 사다리를 타보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="ghost-leg">
                    <div class="game-setup" id="setupSection">
                        <div class="setup-controls">
                            <label style="font-weight: 600;">참가 인원:</label>
                            <input type="number" id="playerCount" value="4" min="2" max="10"
                                style="width: 80px; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color);">
                            <button class="btn btn-primary" id="btnUpdateInputs">설정 적용</button>
                        </div>

                        <div style="margin-bottom: 10px; font-weight: 600;">참가자 이름</div>
                        <div class="player-inputs" id="playerInputs"></div>

                        <div style="margin-bottom: 10px; font-weight: 600;">당첨 결과</div>
                        <div class="result-inputs" id="resultInputs"></div>

                        <button class="btn btn-primary" id="btnStartGame"
                            style="width: 100%; padding: 14px; font-size: 16px;">
                            <span class="material-symbols-rounded" style="margin-right: 8px;">play_arrow</span>
                            게임 시작
                        </button>
                    </div>

                    <div class="game-area" id="gameSection">
                        <canvas id="ladderCanvas"></canvas>

                        <div class="game-actions">
                            <button class="btn" id="btnReset">
                                <span class="material-symbols-rounded" style="margin-right: 6px;">refresh</span>
                                다시 하기
                            </button>
                            <button class="btn btn-primary" id="btnShowAll">
                                <span class="material-symbols-rounded" style="margin-right: 6px;">visibility</span>
                                전체 결과 보기
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="result-modal" id="resultModal">
        <h3>결과 확인</h3>
        <p id="modalResultText">꽝</p>
        <button class="btn btn-primary"
            onclick="document.getElementById('resultModal').style.display='none'; document.getElementById('overlay').style.display='none';">확인</button>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('ghost-leg', {
            playerCount: 4,
            players: [],
            results: [],
            ladderData: [], // horizontal lines { col: i, row: y }
            stepY: 40, // vertical gap between potential bridge slots
            colWidth: 100,
            canvasHeight: 500,
            canvasPadding: 50,
            isAnimating: false,
            ctx: null,
            canvas: null,
            paths: [], // Pre-calculated paths
            colors: [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#F1948A', '#82E0AA', '#85C1E9'
            ],

            init() {
                this.canvas = document.getElementById('ladderCanvas');
                this.ctx = this.canvas.getContext('2d');

                // Elements
                this.els = {
                    playerCount: document.getElementById('playerCount'),
                    playerInputs: document.getElementById('playerInputs'),
                    resultInputs: document.getElementById('resultInputs'),
                    btnUpdate: document.getElementById('btnUpdateInputs'),
                    btnStart: document.getElementById('btnStartGame'),
                    btnReset: document.getElementById('btnReset'),
                    btnShowAll: document.getElementById('btnShowAll'),
                    setupSection: document.getElementById('setupSection'),
                    gameSection: document.getElementById('gameSection'),
                    overlay: document.getElementById('overlay'),
                    resultModal: document.getElementById('resultModal'),
                    modalResultText: document.getElementById('modalResultText'),
                };

                // Listeners
                this.handlerUpdate = () => this.generateInputs();
                this.handlerStart = () => this.startGame();
                this.handlerReset = () => this.resetGame();
                this.handlerShowAll = () => this.animateAll();
                this.handlerCanvasClick = (e) => this.handleCanvasClick(e);

                this.els.btnUpdate.addEventListener('click', this.handlerUpdate);
                this.els.btnStart.addEventListener('click', this.handlerStart);
                this.els.btnReset.addEventListener('click', this.handlerReset);
                this.els.btnShowAll.addEventListener('click', this.handlerShowAll);
                this.canvas.addEventListener('click', this.handlerCanvasClick);

                // Initial generation
                this.generateInputs();

                console.log('Ladder Game initialized');
            },

            cleanup() {
                this.els.btnUpdate.removeEventListener('click', this.handlerUpdate);
                this.els.btnStart.removeEventListener('click', this.handlerStart);
                this.els.btnReset.removeEventListener('click', this.handlerReset);
                this.els.btnShowAll.removeEventListener('click', this.handlerShowAll);
                this.canvas.removeEventListener('click', this.handlerCanvasClick);
                console.log('Ladder Game cleanup');
            },

            generateInputs() {
                let count = parseInt(this.els.playerCount.value);
                if (count < 2) count = 2;
                if (count > 10) count = 10;
                this.els.playerCount.value = count;
                this.playerCount = count;

                this.els.playerInputs.innerHTML = '';
                this.els.resultInputs.innerHTML = '';

                // Restore previous values if possible? No, keep it simple reflow
                for (let i = 0; i < count; i++) {
                    // Player Input
                    const pDiv = document.createElement('div');
                    pDiv.className = 'input-group';
                    pDiv.innerHTML = `<label>참가자 ${i + 1}</label><input type="text" value="참가자 ${i + 1}" class="p-input">`;
                    this.els.playerInputs.appendChild(pDiv);

                    // Result Input
                    const rDiv = document.createElement('div');
                    rDiv.className = 'input-group';
                    rDiv.innerHTML = `<label>결과 ${i + 1}</label><input type="text" value="${i % 2 === 0 ? '당첨' : '꽝'}" class="r-input">`;
                    this.els.resultInputs.appendChild(rDiv);
                }
            },

            startGame() {
                // Collect Data
                this.players = Array.from(this.els.playerInputs.querySelectorAll('.p-input')).map(input => input.value);
                this.results = Array.from(this.els.resultInputs.querySelectorAll('.r-input')).map(input => input.value);

                // Generate Ladder Logic
                this.generateLadder();

                // Setup Canvas
                const paddingCheck = 20;
                this.colWidth = Math.max(60, Math.min(100, (800 - paddingCheck * 2) / this.playerCount));

                // Adjust canvas width based on columns
                const requiredWidth = this.colWidth * (this.playerCount - 1) + 100; // padding
                this.canvas.width = Math.max(600, requiredWidth);
                this.canvas.height = this.canvasHeight + 100; // + padding for text

                // Switch View
                this.els.setupSection.style.display = 'none';
                this.els.gameSection.style.display = 'flex';
                this.els.gameSection.scrollIntoView({ behavior: 'smooth' });

                this.drawBase();
            },

            resetGame() {
                this.els.setupSection.style.display = 'block';
                this.els.gameSection.style.display = 'none';
                this.isAnimating = false;
            },

            generateLadder() {
                this.ladderData = [];
                // Grid: columns = playerCount, rows = e.g., 10-15 steps
                const rows = 12; // Adjusted for height
                this.stepY = (this.canvasHeight - 100) / rows;

                for (let r = 0; r < rows; r++) {
                    // Randomly place horizontal bridges
                    // Rules: 
                    // 1. Bridges cannot overlap (if col i has bridge to i+1, col i+1 cannot have bridge to i+2 at same row)

                    for (let c = 0; c < this.playerCount - 1; c++) {
                        // 50% chance? lower 
                        if (Math.random() > 0.6) {
                            // Valid spot?
                            // Check left neighbor at same row
                            const conflictLeft = this.ladderData.some(b => b.row === r && b.col === c - 1);
                            if (!conflictLeft) {
                                this.ladderData.push({ col: c, row: r });
                            }
                        }
                    }
                }
            },

            drawBase() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const topY = 60;
                const bottomY = h - 60;

                ctx.clearRect(0, 0, w, h);

                // Theme color handling
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const lineColor = isDark ? '#666' : '#ddd';
                const textColor = isDark ? '#fff' : '#333';

                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.font = 'bold 14px "Material Symbols Rounded", sans-serif';
                ctx.textAlign = 'center';

                // 1. Vertical Lines
                for (let i = 0; i < this.playerCount; i++) {
                    const x = this.canvasPadding + i * this.colWidth;

                    // Line
                    ctx.beginPath();
                    ctx.moveTo(x, topY);
                    ctx.lineTo(x, bottomY);
                    ctx.strokeStyle = lineColor;
                    ctx.stroke();

                    // Text Top
                    ctx.fillStyle = textColor;
                    ctx.fillText(this.players[i], x, topY - 20);

                    // Text Bottom
                    ctx.fillText(this.results[i], x, bottomY + 30);

                    // Click Hitbox (Circles at top)
                    ctx.beginPath();
                    ctx.arc(x, topY - 5, 20, 0, Math.PI * 2);
                    ctx.fillStyle = 'transparent'; // invisible hitbox overlay logic handled by click
                    ctx.fill();

                    // Start Button Visual
                    ctx.fillStyle = this.colors[i % this.colors.length];
                    ctx.beginPath();
                    ctx.arc(x, topY, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 2. Horizontal Lines
                ctx.lineWidth = 4;
                for (const bridge of this.ladderData) {
                    const x1 = this.canvasPadding + bridge.col * this.colWidth;
                    const x2 = x1 + this.colWidth;
                    const y = topY + 30 + bridge.row * this.stepY; // Offset from top

                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.strokeStyle = lineColor;
                    ctx.stroke();
                }
            },

            handleCanvasClick(e) {
                if (this.isAnimating) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Check top text area hits
                const topY = 60;

                for (let i = 0; i < this.playerCount; i++) {
                    const lineX = this.canvasPadding + i * this.colWidth;
                    // Hit detection area around the start node
                    if (Math.abs(x - lineX) < 30 && y < topY + 20) {
                        this.animatePath(i);
                        break;
                    }
                }
            },

            async animatePath(startIndex) {
                if (this.isAnimating) return;
                this.isAnimating = true;

                const ctx = this.ctx;
                const playerColor = this.colors[startIndex % this.colors.length];
                const lineWidth = 6;
                const speed = 5; // pixels per frame

                let currentCol = startIndex;
                let currentX = this.canvasPadding + currentCol * this.colWidth;
                let topY = 60;
                let currentY = topY;
                const bottomY = this.canvas.height - 60;

                // Build Path Nodes efficiently
                // Path is a series of segments: {x, y}
                let path = [{ x: currentX, y: currentY }];

                // Simulate Ladder Logic to build path points
                // Rows are 0..11. Y pos = topY + 30 + row * stepY
                // We need to check collisions at each step Y

                // Sorted bridges relevant to current column
                // But efficient way: traverse down y, check bridges at specific Y

                const bridges = this.ladderData.map(b => ({
                    ...b,
                    y: topY + 30 + b.row * this.stepY
                })).sort((a, b) => a.y - b.y);

                let y = currentY;

                // We traverse pixel by pixel or segment by segment? Segment is better.
                // Current segment: vertical down to next bridge OR bottom

                while (y < bottomY) {
                    // Find next bridge for this column
                    // Bridges connected to col: LEFT (col-1) or RIGHT (col)
                    const nextBridge = bridges.find(b =>
                        b.y > y && (b.col === currentCol || b.col === currentCol - 1)
                    );

                    if (nextBridge) {
                        // Move down to bridge
                        path.push({ x: currentX, y: nextBridge.y });
                        y = nextBridge.y;

                        // Cross bridge
                        if (nextBridge.col === currentCol) {
                            // Move Right
                            currentCol++;
                            currentX += this.colWidth;
                        } else {
                            // Move Left
                            currentCol--;
                            currentX -= this.colWidth;
                        }
                        path.push({ x: currentX, y: y });
                    } else {
                        // No more bridges, go to bottom
                        path.push({ x: currentX, y: bottomY });
                        y = bottomY;
                    }
                }

                // Animate along path
                let pointIndex = 0;
                let progress = 0; // 0 to 1 along current segment

                return new Promise(resolve => {
                    const animate = () => {
                        const p1 = path[pointIndex];
                        const p2 = path[pointIndex + 1];

                        if (!p2) {
                            // Finished
                            this.isAnimating = false;

                            // Show Result (highlight bottom text)
                            ctx.beginPath();
                            ctx.arc(p1.x, p1.y, 10, 0, Math.PI * 2);
                            ctx.fillStyle = playerColor;
                            ctx.fill();

                            const result = this.results[currentCol];
                            this.showResultModal(this.players[startIndex], result);

                            resolve();
                            return;
                        }

                        // Distance
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        // Increment
                        progress += speed;

                        if (progress >= dist) {
                            // Segment done
                            pointIndex++;
                            progress = 0;

                            // Draw full segment
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = playerColor;
                            ctx.lineWidth = lineWidth;
                            ctx.stroke();
                        } else {
                            // Draw partial
                            const ratio = progress / dist;
                            const tx = p1.x + dx * ratio;
                            const ty = p1.y + dy * ratio;

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y); // Should we clear rect? No, we draw trace over base
                            // Actually to avoid redrawing full previous segments every frame if we cleared, we just add on top.
                            // But we aren't clearing canvas in loop. So just drawing tip segment is wrong if we don't persist previous.
                            // Since we aren't clearing, we can just draw the small step from prev frame to current?
                            // Easier: Draw line from p1 to current trace pos
                            // Even better: draw segment from prevPos to currPos

                            const prevRatio = (progress - speed) / dist;
                            const prevTx = p1.x + dx * Math.max(0, prevRatio);
                            const prevTy = p1.y + dy * Math.max(0, prevRatio);

                            ctx.beginPath();
                            ctx.moveTo(prevTx, prevTy);
                            ctx.lineTo(tx, ty);
                            ctx.strokeStyle = playerColor;
                            ctx.lineWidth = lineWidth;
                            ctx.stroke();
                        }

                        requestAnimationFrame(animate);
                    };
                    animate();
                });
            },

            async animateAll() {
                if (this.isAnimating) return;

                // Sequentially or Parallel? Parallel is chaos. Sequential is slow.
                // Let's just draw all permanent lines quickly.

                this.isAnimating = true;
                const ctx = this.ctx;

                for (let i = 0; i < this.playerCount; i++) {
                    // Calculate path
                    // Just reuse logic but draw instantly
                    await this.instantPath(i);
                }
                this.isAnimating = false;
            },

            instantPath(startIndex) {
                const ctx = this.ctx;
                const playerColor = this.colors[startIndex % this.colors.length];
                const lineWidth = 3;

                let currentCol = startIndex;
                let currentX = this.canvasPadding + currentCol * this.colWidth;
                let topY = 60;
                const bottomY = this.canvas.height - 60;

                const bridges = this.ladderData.map(b => ({
                    ...b,
                    y: topY + 30 + b.row * this.stepY
                })).sort((a, b) => a.y - b.y);

                let y = topY;
                ctx.beginPath();
                ctx.moveTo(currentX, y);

                while (y < bottomY) {
                    const nextBridge = bridges.find(b =>
                        b.y > y && (b.col === currentCol || b.col === currentCol - 1)
                    );

                    if (nextBridge) {
                        ctx.lineTo(currentX, nextBridge.y);
                        y = nextBridge.y;
                        if (nextBridge.col === currentCol) {
                            currentCol++;
                            currentX += this.colWidth;
                        } else {
                            currentCol--;
                            currentX -= this.colWidth;
                        }
                        ctx.lineTo(currentX, y);
                    } else {
                        ctx.lineTo(currentX, bottomY);
                        y = bottomY;
                    }
                }
                ctx.strokeStyle = playerColor;
                ctx.lineWidth = lineWidth;
                ctx.stroke();

                // Draw bottom dot
                ctx.beginPath();
                ctx.arc(currentX, bottomY, 5, 0, Math.PI * 2);
                ctx.fillStyle = playerColor;
                ctx.fill();
            },

            showResultModal(player, result) {
                this.els.modalResultText.innerHTML = `${player}<br><span style="font-size:20px; color:var(--text-primary)">➡️</span><br>${result}`;
                this.els.resultModal.style.display = 'block';
                this.els.overlay.style.display = 'block';
            }
        });
    </script>
</body>

</html>
