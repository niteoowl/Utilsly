<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>사다리 타기 - Utilsly</title>
    <meta name="description" content="랜덤으로 결과를 결정하는 사다리 타기 게임입니다. 내기나 추첨에 활용하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .game-setup {
            background: var(--bg-sidebar);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .controls-row {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
        }

        .player-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .input-group input {
            text-align: center;
        }

        .game-board {
            position: relative;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            cursor: pointer;
        }

        .result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-width: 300px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span class="username">Utilsly</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">랜덤/추첨</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">line_style</span>
                    </div>
                    <h1>사다리 타기</h1>
                    <p class="description">참여자 수와 벌칙을 입력하고 사다리를 타보세요.</p>
                </div>

                <div class="tool-container" data-tool-id="ladder-game">
                    <div class="game-setup" id="setupArea">
                        <div class="controls-row">
                            <label style="font-weight: 600;">참여자 수 (2~10명)</label>
                            <input type="number" id="playerCount" value="4" min="2" max="10" style="width: 80px;">
                            <button class="btn btn-primary" id="setupBtn">설정</button>
                        </div>

                        <div id="inputsArea" style="display: none;">
                            <div style="display: flex; justify-content: space-between; margin-top: 16px;">
                                <strong>참여자 이름 / 결과 입력</strong>
                            </div>
                            <div class="player-inputs" id="playerList"></div>

                            <div style="margin-top: 24px; text-align: center;">
                                <button class="btn btn-primary" id="startBtn" style="padding: 10px 32px;">
                                    <span class="material-symbols-rounded"
                                        style="font-size: 20px; margin-right: 8px;">play_arrow</span>
                                    사다리 생성 및 시작
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="game-board" id="gameBoard" style="display: none;">
                        <canvas id="ladderCanvas"></canvas>
                        <div style="margin-top: 16px;">
                            <button class="btn" id="resetBtn">다시 하기</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="result-modal" id="resultModal">
            <h3 style="margin-bottom: 16px; font-size: 20px;">결과 확인</h3>
            <div id="resultText" style="font-size: 24px; margin-bottom: 24px; font-weight: bold;"></div>
            <button class="btn btn-primary"
                onclick="document.getElementById('resultModal').style.display='none'">닫기</button>
        </div>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('ladder-game', {
            elements: {},
            players: [],
            results: [],
            ladderData: [], // horizontal lines
            stepHeight: 40,
            columnWidth: 80,
            ctx: null,
            isAnimating: false,

            init() {
                this.elements = {
                    playerCount: document.getElementById('playerCount'),
                    setupBtn: document.getElementById('setupBtn'),
                    inputsArea: document.getElementById('inputsArea'),
                    playerList: document.getElementById('playerList'),
                    startBtn: document.getElementById('startBtn'),
                    gameBoard: document.getElementById('gameBoard'),
                    canvas: document.getElementById('ladderCanvas'),
                    resetBtn: document.getElementById('resetBtn'),
                    setupArea: document.getElementById('setupArea')
                };

                this.ctx = this.elements.canvas.getContext('2d');
                this.elements.setupBtn.addEventListener('click', () => this.generateInputs());
                this.elements.startBtn.addEventListener('click', () => this.startGame());
                this.elements.resetBtn.addEventListener('click', () => this.resetGame());
                this.elements.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));

                // Initial inputs generation
                this.generateInputs();

                console.log('Ladder Game initialized');
            },

            generateInputs() {
                const count = parseInt(this.elements.playerCount.value);
                if (count < 2 || count > 10) {
                    alert("참여자 수는 2명에서 10명 사이여야 합니다.");
                    return;
                }

                let html = '';
                for (let i = 0; i < count; i++) {
                    html += `
                    <div class="input-group">
                        <input type="text" placeholder="이름 ${i + 1}" class="player-name" value="${i + 1}">
                        <div style="height: 20px; border-left: 2px solid var(--border-color); margin: 0 auto;"></div>
                        <input type="text" placeholder="결과 ${i + 1}" class="player-result" value="꽝">
                    </div>
                    `;
                }
                this.elements.playerList.innerHTML = html;
                this.elements.inputsArea.style.display = 'block';

                // Set default winning/losing mostly losing for fun default?
                // actually users will type.
            },

            startGame() {
                // Collect inputs
                const nameInputs = document.querySelectorAll('.player-name');
                const resultInputs = document.querySelectorAll('.player-result');

                this.players = Array.from(nameInputs).map(input => input.value || 'Player');
                this.results = Array.from(resultInputs).map(input => input.value || 'Result');

                this.elements.setupArea.style.display = 'none';
                this.elements.gameBoard.style.display = 'flex';

                this.generateLadder();
                this.drawLadder();
            },

            generateLadder() {
                const count = this.players.length;
                const height = 400; // Fixed height for ladder part
                const steps = 10; // Number of potential horizontal lines per column gap

                this.ladderData = [];

                // For each gap between vertical lines (count - 1 gaps)
                for (let gap = 0; gap < count - 1; gap++) {
                    // Decide random horizontal bridges
                    for (let s = 0; s < steps; s++) {
                        // 50% chance to have a bridge? Maybe less to avoid clutter
                        if (Math.random() > 0.6) {
                            // Ensure no adjacent bridges connected to the same point? 
                            // Simple logic: just store step index.
                            // We need to coordinate to avoid overlapping or X shapes (unless allowed?)
                            // Standard ladder doesn't cross.
                            this.ladderData.push({ col: gap, step: s });
                        }
                    }
                }
                // Filter to ensure no two bridges share a start point on the same vertical line at same step
                // Actually simple grid model: Lines are at discrete y-steps.
                // If column i has bridge at step k, column i-1 or i+1 cannot have bridge at step k.

                // Re-gen with safety
                this.ladderData = [];
                const numSteps = 15;
                const grid = Array(count - 1).fill().map(() => Array(numSteps).fill(false));

                for (let y = 0; y < numSteps; y++) {
                    for (let x = 0; x < count - 1; x++) {
                        // Check left neighbor at this step
                        let canPlace = true;
                        if (x > 0 && grid[x - 1][y]) canPlace = false;

                        // Random placement if valid
                        if (canPlace && Math.random() > 0.6) {
                            grid[x][y] = true;
                        }
                    }
                }
                this.ladderData = grid;
                this.numSteps = numSteps;
            },

            drawLadder() {
                const ctx = this.ctx;
                const canvas = this.elements.canvas;
                const pCount = this.players.length;

                // Dimensions
                const margin = 50;
                const topPadd = 60;
                const bottomPadd = 60;
                const colW = this.columnWidth; // 80px
                const stepH = 25; // height per step

                const w = Math.max(800, pCount * colW + margin * 2);
                const h = topPadd + this.numSteps * stepH + bottomPadd;

                canvas.width = w;
                canvas.height = h;

                ctx.clearRect(0, 0, w, h);
                ctx.font = '16px "Pretendard"';
                ctx.textAlign = 'center';

                // Draw Vertical Lines & Names
                ctx.strokeStyle = '#DDD';
                ctx.lineWidth = 4;
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text-primary');

                for (let i = 0; i < pCount; i++) {
                    const x = margin + i * colW;
                    // Name
                    ctx.fillText(this.players[i], x, 30);
                    // Line
                    ctx.beginPath();
                    ctx.moveTo(x, topPadd);
                    ctx.lineTo(x, h - bottomPadd);
                    ctx.stroke();
                    // Result
                    ctx.fillText(this.results[i], x, h - 10);
                }

                // Draw Horizontal Lines
                ctx.lineWidth = 4;
                for (let x = 0; x < pCount - 1; x++) {
                    for (let y = 0; y < this.numSteps; y++) {
                        if (this.ladderData[x][y]) {
                            const x1 = margin + x * colW;
                            const x2 = x1 + colW;
                            const yPos = topPadd + y * stepH + (stepH / 2);

                            ctx.beginPath();
                            ctx.moveTo(x1, yPos);
                            ctx.lineTo(x2, yPos);
                            ctx.stroke();
                        }
                    }
                }
            },

            async runPath(playerIndex) {
                if (this.isAnimating) return;
                this.isAnimating = true;

                const ctx = this.ctx;
                const margin = 50;
                const topPadd = 60;
                const colW = this.columnWidth;
                const stepH = 25;

                let currentCol = playerIndex;
                let currentX = margin + currentCol * colW;
                let currentY = topPadd;

                ctx.beginPath();
                ctx.strokeStyle = '#FF3B30'; // Red path
                ctx.lineWidth = 6;
                ctx.moveTo(currentX, currentY);

                // Animation loop logic simplified: move step by step
                // We will just draw stepwise with small delay

                for (let y = 0; y < this.numSteps; y++) {
                    const yPos = topPadd + y * stepH + (stepH / 2);

                    // Move down to next bridge level
                    await this.animateLine(currentX, currentY, currentX, yPos);
                    currentY = yPos;

                    // Check bridges
                    // Check right
                    if (currentCol < this.players.length - 1 && this.ladderData[currentCol][y]) {
                        // Move right
                        await this.animateLine(currentX, currentY, currentX + colW, currentY);
                        currentCol++;
                        currentX += colW;
                    }
                    // Check left
                    else if (currentCol > 0 && this.ladderData[currentCol - 1][y]) {
                        // Move left
                        await this.animateLine(currentX, currentY, currentX - colW, currentY);
                        currentCol--;
                        currentX -= colW;
                    }
                }

                // Final drop
                await this.animateLine(currentX, currentY, currentX, this.elements.canvas.height - 60);

                // Show result
                document.getElementById('resultText').innerText = `${this.players[playerIndex]} -> ${this.results[currentCol]}`;
                document.getElementById('resultModal').style.display = 'block';
                this.isAnimating = false;
            },

            animateLine(x1, y1, x2, y2) {
                return new Promise(resolve => {
                    const duration = 100; // ms per segment
                    const startTime = performance.now();
                    const ctx = this.ctx;

                    function step(time) {
                        const progress = Math.min((time - startTime) / duration, 1);
                        const currX = x1 + (x2 - x1) * progress;
                        const currY = y1 + (y2 - y1) * progress;

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(currX, currY);
                        ctx.stroke();

                        if (progress < 1) requestAnimationFrame(step);
                        else resolve();
                    }
                    requestAnimationFrame(step);
                });
            },

            handleCanvasClick(e) {
                if (this.isAnimating) return;

                const rect = this.elements.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Click on start area?
                if (y < 60) {
                    const col = Math.round((x - 50) / this.columnWidth);
                    if (col >= 0 && col < this.players.length && Math.abs(x - (50 + col * this.columnWidth)) < 30) {
                        this.drawLadder(); // Clear previous paths
                        this.runPath(col);
                    }
                }
            },

            resetGame() {
                this.elements.gameBoard.style.display = 'none';
                this.elements.setupArea.style.display = 'block';
                this.isAnimating = false;
            }
        });
    </script>
</body>

</html>
