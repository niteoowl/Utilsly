<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사다리 타기 - Utilsly</title>
    <meta name="description" content="참여자와 벌칙을 설정하고 두근두근 사다리 게임을 즐겨보세요.">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .game-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Setup Card */
        .setup-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .setup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .player-count-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .count-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-hover);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .count-btn:hover {
            background: var(--border-color);
        }

        .count-display {
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            font-size: 16px;
        }

        /* Separate Lists for Names and Results */
        .setup-lists-container {
            display: flex;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .setup-lists-container {
                flex-direction: column;
            }
        }

        .setup-list-col {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .setup-list-header {
            font-weight: 700;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .setup-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .index-badge {
            width: 24px;
            height: 24px;
            background: var(--bg-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .p-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-sidebar);
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .p-input:focus {
            border-color: var(--accent-blue);
            outline: none;
        }

        /* Game Board */
        .game-board {
            display: none;
            flex-direction: column;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .board-toolbar {
            padding: 16px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .canvas-container {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px 20px;
            /* Custom Scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--text-tertiary) transparent;
            text-align: center;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        /* Modal for single result */
        .result-toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">사다리 타기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">line_style</span>
                    </div>
                    <h1>사다리 타기</h1>
                    <p class="description">친구, 동료들과 함께 즐기는 스릴 만점 사다리 게임!</p>
                </div>

                <div class="tool-container" data-tool-id="ladder-game">
                    <div class="game-container">

                        <!-- STEP 1: SETUP -->
                        <div class="setup-card" id="setupCard">
                            <div class="setup-header">
                                <h3 style="margin:0; font-size:18px;">참여자 설정</h3>
                                <div class="player-count-control">
                                    <button class="count-btn" id="decreaseBtn"><span
                                            class="material-symbols-rounded">remove</span></button>
                                    <div class="count-display" id="countDisplay">4</div>
                                    <button class="count-btn" id="increaseBtn"><span
                                            class="material-symbols-rounded">add</span></button>
                                </div>
                            </div>

                            <!-- SEPARATE LISTS: Names | Results -->
                            <div class="setup-lists-container">
                                <div class="setup-list-col">
                                    <div class="setup-list-header">참가자 이름 (윗쪽)</div>
                                    <div id="namesList"></div>
                                </div>
                                <div class="setup-list-col">
                                    <div class="setup-list-header">
                                        <span>결과 (아랫쪽)</span>
                                        <button class="btn btn-sm" id="shuffleResultsBtn"
                                            style="font-size:11px; padding:2px 8px;">순서 섞기</button>
                                    </div>
                                    <div id="resultsList"></div>
                                </div>
                            </div>

                            <div style="display:flex; justify-content:center; gap:12px; margin-top:32px;">
                                <button class="btn" id="autoFillBtn" style="color:var(--text-secondary);">
                                    <span class="material-symbols-rounded" style="margin-right:6px">autorenew</span>
                                    자동 채우기
                                </button>
                                <button class="btn btn-primary" id="startDeviceBtn"
                                    style="padding:12px 40px; font-size:16px;">
                                    게임 시작
                                    <span class="material-symbols-rounded" style="margin-left:8px">arrow_forward</span>
                                </button>
                            </div>
                        </div>

                        <!-- STEP 2: GAME BOARD -->
                        <div class="game-board" id="gameBoard">
                            <div class="board-toolbar">
                                <button class="btn btn-sm" id="resetGameBtn">
                                    <span class="material-symbols-rounded"
                                        style="font-size:18px; margin-right:4px;">arrow_back</span>
                                    설정으로
                                </button>

                                <div class="speed-control">
                                    <span>속도</span>
                                    <input type="range" id="speedRange" min="1" max="5" value="3" style="width:80px">
                                </div>

                                <button class="btn btn-primary btn-sm" id="runAllBtn">
                                    <span class="material-symbols-rounded"
                                        style="font-size:18px; margin-right:4px;">play_circle</span>
                                    전체 결과
                                </button>
                                <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 8px;">
                                </div>
                                <button class="btn btn-sm" id="downloadBtn" title="이미지로 저장">
                                    <span class="material-symbols-rounded">image</span>
                                </button>
                                <button class="btn btn-sm" id="copyBtn" title="결과 텍스트 복사">
                                    <span class="material-symbols-rounded">content_copy</span>
                                </button>
                            </div>

                            <div class="canvas-container" id="canvasContainer">
                                <canvas id="ladderCanvas"></canvas>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="tool-help-section">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li><strong>설정:</strong> 참여 인원 수를 설정하고 '사다리 생성'을 누르세요.</li>
                            <li><strong>입력:</strong> 참가자 이름과 벌칙(결과) 내용을 입력하세요.</li>
                            <li><strong>진행:</strong> 각 참가자의 시작점을 클릭하거나 '전체 결과 보기'를 눌러 결과를 확인하세요.</li>
                        </ol>
                    </div>
                </div>
            </div>
        </main>

        <div class="result-toast" id="resultToast">
            <span id="toastMessage">결과 메세지</span>
        </div>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('ladder-game', {
            // Data
            names: [], // just strings
            results: [], // just strings

            // Runtime State
            players: [], // { id, name, finalResult, color, pathData } - Built at start
            ladderMap: [],
            isGameRunning: false,
            isAnimating: false,
            animationSpeed: 3,

            COLORS: [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                '#F7DC6F', '#BB8FCE', '#F1948A', '#82E0AA', '#85C1E9'
            ],
            colWidth: 100,
            stepHeight: 40,
            numSteps: 12,

            elements: {},
            ctx: null,

            init() {
                this.elements = {
                    setupCard: document.getElementById('setupCard'),
                    gameBoard: document.getElementById('gameBoard'),
                    namesList: document.getElementById('namesList'),
                    resultsList: document.getElementById('resultsList'),
                    countDisplay: document.getElementById('countDisplay'),
                    decreaseBtn: document.getElementById('decreaseBtn'),
                    increaseBtn: document.getElementById('increaseBtn'),
                    autoFillBtn: document.getElementById('autoFillBtn'),
                    shuffleResultsBtn: document.getElementById('shuffleResultsBtn'),
                    startDeviceBtn: document.getElementById('startDeviceBtn'),
                    resetGameBtn: document.getElementById('resetGameBtn'),
                    runAllBtn: document.getElementById('runAllBtn'),
                    speedRange: document.getElementById('speedRange'),
                    canvas: document.getElementById('ladderCanvas'),
                    canvasContainer: document.getElementById('canvasContainer'),
                    resultToast: document.getElementById('resultToast'),
                    toastMessage: document.getElementById('toastMessage'),
                    downloadBtn: document.getElementById('downloadBtn'),
                    copyBtn: document.getElementById('copyBtn')
                };

                this.ctx = this.elements.canvas.getContext('2d');
                this.bindEvents();
                this.updateInputCount(4);
            },

            bindEvents() {
                this.elements.decreaseBtn.addEventListener('click', () => this.updateInputCount(this.names.length - 1));
                this.elements.increaseBtn.addEventListener('click', () => this.updateInputCount(this.names.length + 1));

                this.elements.shuffleResultsBtn.addEventListener('click', () => this.shuffleInputs('results'));
                this.elements.autoFillBtn.addEventListener('click', () => this.autoFill());
                this.elements.startDeviceBtn.addEventListener('click', () => this.startGame());
                this.elements.resetGameBtn.addEventListener('click', () => this.resetGame());

                this.elements.runAllBtn.addEventListener('click', () => this.runAll());
                this.elements.speedRange.addEventListener('input', (e) => this.animationSpeed = parseInt(e.target.value));
                this.elements.downloadBtn.addEventListener('click', () => this.downloadImage());
                this.elements.copyBtn.addEventListener('click', () => this.copyResults());

                this.elements.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));

                // Drag to scroll
                let isDown = false;
                let startX;
                let scrollLeft;
                const slider = this.elements.canvasContainer;
                slider.addEventListener('mousedown', (e) => { isDown = true; slider.classList.add('active'); startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
                slider.addEventListener('mouseleave', () => { isDown = false; slider.classList.remove('active'); });
                slider.addEventListener('mouseup', () => { isDown = false; slider.classList.remove('active'); });
                slider.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });
            },

            updateInputCount(count) {
                if (count < 2) count = 2;
                if (count > 24) count = 24;

                // Resize arrays
                while (this.names.length < count) this.names.push(`참가자 ${this.names.length + 1}`);
                while (this.names.length > count) this.names.pop();

                while (this.results.length < count) this.results.push(this.results.length % 2 === 0 ? "꽝" : "당첨");
                while (this.results.length > count) this.results.pop();

                this.elements.countDisplay.textContent = count;
                this.renderSetupLists();
            },

            renderSetupLists() {
                // Names
                this.elements.namesList.innerHTML = '';
                this.names.forEach((name, i) => {
                    const row = document.createElement('div');
                    row.className = 'setup-item';
                    row.innerHTML = `<div class="index-badge">${i + 1}</div><input class="p-input name-input" data-index="${i}" value="${name}">`;
                    this.elements.namesList.appendChild(row);
                });
                // Results
                this.elements.resultsList.innerHTML = '';
                this.results.forEach((res, i) => {
                    const row = document.createElement('div');
                    row.className = 'setup-item';
                    row.innerHTML = `<div class="index-badge">${i + 1}</div><input class="p-input result-input" data-index="${i}" value="${res}">`;
                    this.elements.resultsList.appendChild(row);
                });

                // Bind
                this.elements.namesList.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => this.names[e.target.dataset.index] = e.target.value));
                this.elements.resultsList.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => this.results[e.target.dataset.index] = e.target.value));
            },

            shuffleInputs(type) {
                if (type === 'results') {
                    for (let i = this.results.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [this.results[i], this.results[j]] = [this.results[j], this.results[i]];
                    }
                    this.renderSetupLists();
                    Utilsly.showAlert('결과 순서를 섞었습니다.');
                }
            },

            autoFill() {
                this.names = this.names.map((_, i) => `참가자 ${i + 1}`);
                this.results = this.results.map((_, i) => (i === 0) ? "당첨" : "꽝");
                this.shuffleInputs('results');
                this.renderSetupLists();
            },

            startGame() {
                // LOCK IN Data
                this.generateGameData();

                this.elements.setupCard.style.display = 'none';
                this.elements.gameBoard.style.display = 'flex';
                this.resizeCanvas();
                this.drawLadderBase();
                this.showToast('이름을 클릭하여 게임을 시작하세요!', 3000);
            },

            resetGame() {
                this.isGameRunning = false;
                this.isAnimating = false;
                this.elements.gameBoard.style.display = 'none';
                this.elements.setupCard.style.display = 'block';
            },

            generateGameData() {
                const count = this.names.length;
                this.numSteps = Math.max(10, count * 2);

                // 1. Generate Ladder Topology
                this.ladderMap = Array(count - 1).fill().map(() => Array(this.numSteps).fill(false));
                for (let step = 0; step < this.numSteps; step++) {
                    for (let col = 0; col < count - 1; col++) {
                        let canPlace = true;
                        if (col > 0 && this.ladderMap[col - 1][step]) canPlace = false;
                        if (canPlace && Math.random() < 0.4) this.ladderMap[col][step] = true;
                    }
                }

                // 2. Pre-calculate outcomes to bind names to results
                // Actually, the "Results" inputs (bottom list) correspond to the Bottom Slots 1..N
                // So Result[0] is the label for the first column's bottom.
                // We don't need to "calculate" who gets what yet. The path determines it.
                // WE JUST NEED TO STORE THEM.

                this.players = this.names.map((name, i) => ({
                    id: i,
                    name: name,
                    color: this.COLORS[i % this.COLORS.length],
                    done: false
                }));
            },

            resizeCanvas() {
                const padding = 50;
                const width = Math.max(this.elements.canvasContainer.clientWidth, this.names.length * this.colWidth + padding * 2);
                const height = this.numSteps * this.stepHeight + 200;
                const dpr = window.devicePixelRatio || 1;
                this.elements.canvas.width = width * dpr;
                this.elements.canvas.height = height * dpr;
                this.elements.canvas.style.width = width + 'px';
                this.elements.canvas.style.height = height + 'px';
                this.ctx.scale(dpr, dpr);
                this.canvasW = width;
                this.canvasH = height;
            },

            drawLadderBase() {
                const ctx = this.ctx;
                const marginX = 60;
                const marginY = 80;
                ctx.clearRect(0, 0, this.canvasW, this.canvasH);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Draw Vertical Lines & Labels
                this.players.forEach((p, i) => {
                    const x = marginX + i * this.colWidth;

                    // Name Top
                    ctx.fillStyle = this.isAnimating || p.done ? p.color : '#333'; // Highlight if done/running
                    ctx.font = 'bold 14px Pretendard';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name, x, marginY - 20);

                    // Line
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#DDD';
                    ctx.beginPath();
                    ctx.moveTo(x, marginY);
                    ctx.lineTo(x, marginY + this.numSteps * this.stepHeight);
                    ctx.stroke();

                    // Result Bottom (From this.results array, indexed by column!)
                    const resY = marginY + this.numSteps * this.stepHeight + 30;
                    ctx.fillStyle = '#666';
                    ctx.font = 'bold 15px Pretendard';
                    // The result at the bottom of column i is results[i]
                    // (Assuming users entered results 1..N order)
                    ctx.fillText(this.results[i], x, resY);

                    // Box around result?
                    ctx.strokeStyle = '#DDD';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x - 40, resY - 20, 80, 30);
                });

                // Bridges
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#DDD';
                for (let col = 0; col < this.names.length - 1; col++) {
                    for (let step = 0; step < this.numSteps; step++) {
                        if (this.ladderMap[col][step]) {
                            const x1 = marginX + col * this.colWidth;
                            const x2 = x1 + this.colWidth;
                            const y = marginY + step * this.stepHeight + (this.stepHeight / 2);
                            ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
                        }
                    }
                }
            },

            handleCanvasClick(e) {
                if (this.isAnimating) return;
                const rect = this.elements.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (this.elements.canvas.width / rect.width / window.devicePixelRatio);
                const y = (e.clientY - rect.top) * (this.elements.canvas.height / rect.height / window.devicePixelRatio);

                // Top Area Click
                if (y < 80) {
                    const marginX = 60;
                    const clickedCol = Math.round((x - marginX) / this.colWidth);
                    if (clickedCol >= 0 && clickedCol < this.names.length) {
                        if (Math.abs(x - (marginX + clickedCol * this.colWidth)) < 40) {
                            this.runPath(clickedCol);
                        }
                    }
                }
            },

            async runPath(playerIdx) {
                if (this.isAnimating) return;
                this.isAnimating = true;

                this.clearAllPaths(); // Clear previous paths before drawing new ones
                this.drawLadderBase();
                // Draw all *previously* done paths?
                // Let's implement persistence.
                for (let i = 0; i < this.players.length; i++) {
                    if (this.players[i].done) {
                        const path = this.calculatePath(i);
                        this.drawStaticPath(path, this.players[i].color);
                    }
                }

                const path = this.calculatePath(playerIdx);
                await this.animatePath(path, this.players[playerIdx].color);

                // Mark Done
                this.players[playerIdx].done = true;

                // Show Result
                const finalCol = path[path.length - 1].col;
                const result = this.results[finalCol];
                this.showToast(`${this.players[playerIdx].name} 결과: ${result}`);

                this.isAnimating = false;

                // Final re-draw to ensure clean layers
                this.drawLadderBase();
                for (let i = 0; i < this.players.length; i++) {
                    if (this.players[i].done) {
                        const p = this.calculatePath(i);
                        this.drawStaticPath(p, this.players[i].color);
                    }
                }
            },

            async runAll() {
                if (this.isAnimating) return;
                this.isAnimating = true;
                this.drawLadderBase();

                const promises = this.players.map((p, idx) => {
                    const path = this.calculatePath(idx);
                    return this.animatePath(path, p.color, true); // true = concurrent
                });

                await Promise.all(promises);
                this.players.forEach(p => p.done = true);

                this.showToast("모든 결과 확인 완료!");
                this.isAnimating = false;
            },

            calculatePath(startCol) {
                const marginX = 60;
                const marginY = 80;
                let col = startCol;
                let x = marginX + col * this.colWidth;
                let y = marginY;
                const path = [{ x, y }];

                for (let step = 0; step < this.numSteps; step++) {
                    const stepY = marginY + step * this.stepHeight + (this.stepHeight / 2);
                    path.push({ x: marginX + col * this.colWidth, y: stepY });

                    let bridgeDir = 0;
                    if (col < this.names.length - 1 && this.ladderMap[col][step]) bridgeDir = 1;
                    else if (col > 0 && this.ladderMap[col - 1][step]) bridgeDir = -1;

                    if (bridgeDir !== 0) {
                        col += bridgeDir;
                        path.push({ x: marginX + col * this.colWidth, y: stepY });
                    }
                }
                path.push({ x: marginX + col * this.colWidth, y: marginY + this.numSteps * this.stepHeight });
                path[path.length - 1].col = col;
                return path;
            },

            animatePath(path, color, isConcurrent) {
                return new Promise(resolve => {
                    const ctx = this.ctx;
                    let currentPoint = 0;
                    const baseFrames = 20;
                    const framesPerSeg = Math.max(1, baseFrames / this.animationSpeed);
                    let progress = 0;

                    const tick = () => {
                        if (currentPoint >= path.length - 1) {
                            resolve();
                            return;
                        }
                        const p1 = path[currentPoint];
                        const p2 = path[currentPoint + 1];
                        progress += 1 / framesPerSeg;
                        if (progress > 1) progress = 1;

                        const curX = p1.x + (p2.x - p1.x) * progress;
                        const curY = p1.y + (p2.y - p1.y) * progress;

                        ctx.beginPath();
                        ctx.strokeStyle = color;
                        ctx.lineWidth = 5;
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(curX, curY);
                        ctx.stroke();

                        if (progress >= 1) {
                            progress = 0;
                            currentPoint++;
                        }
                        if (this.isAnimating) requestAnimationFrame(tick);
                    };
                    tick();
                });
            },

            drawStaticPath(path, color) {
                const ctx = this.ctx;
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 5;
                ctx.globalAlpha = 0.5; // Dim finished paths slightly?
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            },

            showToast(msg, duration = 3000) {
                const toast = this.elements.resultToast;
                this.elements.toastMessage.textContent = msg;
                toast.classList.add('show');
                if (this.toastTimer) clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            },

            downloadImage() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.elements.canvas.width;
                tempCanvas.height = this.elements.canvas.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.fillStyle = isDark ? '#1e1e1e' : '#ffffff';
                tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                tCtx.drawImage(this.elements.canvas, 0, 0);
                const link = document.createElement('a');
                link.download = `ladder-result-${new Date().getTime()}.png`;
                link.href = tempCanvas.toDataURL();
                link.click();
            },

            copyResults() {
                let text = "🪜 사다리 타기 결과 🪜\n\n";
                this.players.forEach((p, i) => {
                    const path = this.calculatePath(i);
                    const finalCol = path[path.length - 1].col;
                    const result = this.results[finalCol];
                    text += `${p.name} -> ${result}\n`;
                });
                navigator.clipboard.writeText(text).then(() => {
                    this.showToast("결과가 복사되었습니다!");
                }).catch(err => {
                    this.showToast("복사 실패");
                });
            }
        });
    </script>
</body>
