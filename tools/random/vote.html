<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>투표 하기 - Utilsly</title>
    <meta name="description" content="비밀 투표와 긴장감 넘치는 결과 공개 기능을 제공하는 투표 도구입니다.">
    <script>
        // Prevent dark mode flash
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .vote-container {

            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Setup Phase */
        .setup-phase {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .candidate-input-row {
            display: flex;
            gap: 12px;
        }

        .candidate-list-setup {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .candidate-item-setup {
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        /* Voting Phase */
        .voting-phase {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .voting-instruction {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .secret-feedback {
            font-size: 18px;
            color: var(--text-secondary);
            height: 40px;
            margin-bottom: 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .secret-feedback.show {
            opacity: 1;
        }

        /* Result Phase */
        .result-phase {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .result-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .result-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(0, 0, 0, 0.08);
            /* Black accent soft */
            z-index: 1;
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
        }

        .key-hint {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #eee;
            border-radius: 4px;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            font-weight: 700;
            margin-right: 8px;
            color: #555;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .candidate-input-row {
                flex-direction: column;
            }

            .voting-instruction {
                font-size: 18px;
            }

            #votingListPreview {
                padding: 16px !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">투표 하기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">how_to_vote</span>
                    </div>
                    <h1>투표 하기</h1>
                    <p class="description">후보를 등록하고 비밀 투표를 진행하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="vote">
                    <div class="vote-container">

                        <!-- 1. Setup Phase -->
                        <div id="setupPhase" class="setup-phase">
                            <div class="candidate-input-row">
                                <input type="text" id="candidateInput" placeholder="후보 이름 입력 (예: 짜장면)">
                                <button class="btn btn-primary" id="addCandidateBtn">추가</button>
                                <button class="btn" id="quickFillBtn">1~20 자동입력</button>
                            </div>

                            <div id="setupList" class="candidate-list-setup">
                                <!-- Items added here -->
                            </div>

                            <button class="btn btn-primary" id="startVotingBtn"
                                style="margin-top: 16px; padding: 16px;">
                                투표 시작하기
                            </button>
                        </div>

                        <!-- 2. Voting Phase -->
                        <div id="votingPhase" class="voting-phase">
                            <div class="voting-instruction">
                                키보드 숫자키(1~9)를 눌러 투표하세요.<br>
                                <span
                                    style="font-size: 16px; font-weight: 400; color: var(--text-secondary); display: block; margin-top: 16px;">
                                    화면에는 아무것도 표시되지 않습니다.
                                </span>
                            </div>

                            <div id="votingListPreview"
                                style="text-align: left; margin-bottom: 40px; display: inline-block; background: #f9f9f9; padding: 24px; border-radius: 12px;">
                                <!-- List of candidates with keys for reference -->
                            </div>

                            <div id="secretFeedback" class="secret-feedback">
                                <span class="material-symbols-rounded"
                                    style="vertical-align: middle; margin-right: 8px; color: #000;">check_circle</span>
                                투표가 기록되었습니다!
                            </div>

                            <button class="btn" id="showResultsBtn">투표 종료 및 결과 확인</button>
                        </div>

                        <!-- 3. Result Phase -->
                        <div id="resultPhase" class="result-phase">
                            <div id="resultList"></div>

                            <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
                                <button class="btn btn-primary" id="resetAllBtn">새로운 투표</button>
                                <button class="btn" id="backToVotingBtn">투표 계속하기</button>
                                <button class="btn" id="removeWinnerBtn"
                                    style="color: #FF4B4B; border-color: #FF4B4B;">1등 제거</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('vote', {
            candidates: [],
            elements: {},

            init() {
                this.candidates = [
                    { id: 1, name: '짜장면', votes: 0 },
                    { id: 2, name: '짬뽕', votes: 0 }
                ];

                this.elements = {
                    setupPhase: document.getElementById('setupPhase'),
                    votingPhase: document.getElementById('votingPhase'),
                    resultPhase: document.getElementById('resultPhase'),
                    candidateInput: document.getElementById('candidateInput'),
                    setupList: document.getElementById('setupList'),
                    votingListPreview: document.getElementById('votingListPreview'),
                    resultList: document.getElementById('resultList'),
                    secretFeedback: document.getElementById('secretFeedback'),

                    addCandidateBtn: document.getElementById('addCandidateBtn'),
                    quickFillBtn: document.getElementById('quickFillBtn'),
                    startVotingBtn: document.getElementById('startVotingBtn'),
                    showResultsBtn: document.getElementById('showResultsBtn'),
                    resetAllBtn: document.getElementById('resetAllBtn'),
                    backToVotingBtn: document.getElementById('backToVotingBtn'),
                    removeWinnerBtn: document.getElementById('removeWinnerBtn')
                };

                this.handleAddCandidate = () => this.addCandidate();
                this.handleQuickFill = () => this.quickFill();
                this.handleStartVoting = () => this.startVoting();
                this.handleShowResults = () => this.showResults();
                this.handleResetAll = () => this.resetAll();
                this.handleBackToVoting = () => this.backToVoting();
                this.handleRemoveWinner = () => this.removeWinner();
                this.handleInputEnter = (e) => {
                    if (e.key === 'Enter') this.addCandidate();
                };

                // Remove existing click handler on setupList if any (using delegation)
                this.handleSetupListClick = (e) => {
                    const btn = e.target.closest('button');
                    if (btn && btn.dataset.id) {
                        this.removeCandidate(parseInt(btn.dataset.id));
                    }
                };

                // Add event listeners
                if (this.elements.addCandidateBtn) this.elements.addCandidateBtn.addEventListener('click', this.handleAddCandidate);
                if (this.elements.quickFillBtn) this.elements.quickFillBtn.addEventListener('click', this.handleQuickFill);
                if (this.elements.startVotingBtn) this.elements.startVotingBtn.addEventListener('click', this.handleStartVoting);
                if (this.elements.showResultsBtn) this.elements.showResultsBtn.addEventListener('click', this.handleShowResults);
                if (this.elements.resetAllBtn) this.elements.resetAllBtn.addEventListener('click', this.handleResetAll);
                if (this.elements.backToVotingBtn) this.elements.backToVotingBtn.addEventListener('click', this.handleBackToVoting);
                if (this.elements.removeWinnerBtn) this.elements.removeWinnerBtn.addEventListener('click', this.handleRemoveWinner);
                if (this.elements.candidateInput) this.elements.candidateInput.addEventListener('keypress', this.handleInputEnter);
                if (this.elements.setupList) this.elements.setupList.addEventListener('click', this.handleSetupListClick);

                // Initialize view
                this.renderSetupList();
                console.log('Vote tool initialized');
            },

            cleanup() {
                // IMPORTANT: Remove keyboard listener
                document.removeEventListener('keydown', this.handleVoteKey);

                if (this.elements.addCandidateBtn) this.elements.addCandidateBtn.removeEventListener('click', this.handleAddCandidate);
                if (this.elements.quickFillBtn) this.elements.quickFillBtn.removeEventListener('click', this.handleQuickFill);
                if (this.elements.startVotingBtn) this.elements.startVotingBtn.removeEventListener('click', this.handleStartVoting);
                if (this.elements.showResultsBtn) this.elements.showResultsBtn.removeEventListener('click', this.handleShowResults);
                if (this.elements.resetAllBtn) this.elements.resetAllBtn.removeEventListener('click', this.handleResetAll);
                if (this.elements.backToVotingBtn) this.elements.backToVotingBtn.removeEventListener('click', this.handleBackToVoting);
                if (this.elements.removeWinnerBtn) this.elements.removeWinnerBtn.removeEventListener('click', this.handleRemoveWinner);
                if (this.elements.candidateInput) this.elements.candidateInput.removeEventListener('keypress', this.handleInputEnter);
                if (this.elements.setupList) this.elements.setupList.removeEventListener('click', this.handleSetupListClick);

                this.candidates = [];
                this.elements = {};
                console.log('Vote tool cleanup done');
            },

            // Bound method for keydown to be removable
            handleVoteKey(e) {
                // We need to access 'this' properly. 
                // Since this is added via document.addEventListener in startVoting, we need to bind it or use arrow function wrapper
                // However, we need the exact reference to remove it.
                // Let's rely on the tool instance method being bound in startVoting or use 'this' via a closure if we can't easily bind.
                // But registerTool 'this' context in methods is the object itself? Yes.
            },

            // Actually, we can just define the function on the object and bind it in init?
            // Or better:
            // this.boundHandleVoteKey = this.onVoteKey.bind(this);
            // Then use this.boundHandleVoteKey

            onVoteKey(e) {
                // Check if voting phase is active just in case
                if (this.elements.votingPhase.style.display === 'none') return;

                const key = parseInt(e.key);
                if (!isNaN(key) && key >= 1 && key <= this.candidates.length) {
                    const candidate = this.candidates[key - 1];
                    if (candidate) {
                        candidate.votes++;
                        this.showFeedback();
                    }
                }
            },

            renderSetupList() {
                if (!this.elements.setupList) return;
                this.elements.setupList.innerHTML = this.candidates.map((c, i) => `
                    <div class="candidate-item-setup">
                        <span style="font-weight: 600;">${i + 1}. ${c.name}</span>
                        <button class="btn" data-id="${c.id}" style="padding: 4px 8px;">
                            <span class="material-symbols-rounded" style="font-size: 18px; pointer-events: none;">close</span>
                        </button>
                    </div>
                `).join('');
            },

            addCandidate() {
                const name = this.elements.candidateInput.value.trim();
                if (name) {
                    this.candidates.push({ id: Date.now(), name, votes: 0 });
                    this.elements.candidateInput.value = '';
                    this.renderSetupList();
                }
            },

            removeCandidate(id) {
                this.candidates = this.candidates.filter(c => c.id !== id);
                this.renderSetupList();
            },

            startVoting() {
                if (this.candidates.length < 2) {
                    Utilsly.showAlert('최소 2명 이상의 후보가 필요합니다.');
                    return;
                }
                this.elements.setupPhase.style.display = 'none';
                this.elements.votingPhase.style.display = 'block';
                this.elements.resultPhase.style.display = 'none';

                this.elements.votingListPreview.innerHTML = this.candidates.map((c, i) => `
                    <div style="margin-bottom: 8px; font-size: 18px;">
                        <span class="key-hint">${i + 1}</span> ${c.name}
                    </div>
                `).join('');

                // Bind and add listener
                this.boundHandleVoteKey = this.onVoteKey.bind(this);
                document.addEventListener('keydown', this.boundHandleVoteKey);
            },

            showFeedback() {
                this.elements.secretFeedback.classList.add('show');
                setTimeout(() => {
                    if (this.elements.secretFeedback) this.elements.secretFeedback.classList.remove('show');
                }, 1000);
            },

            showResults() {
                document.removeEventListener('keydown', this.boundHandleVoteKey);
                this.elements.votingPhase.style.display = 'none';
                this.elements.resultPhase.style.display = 'flex';

                const totalVotes = this.candidates.reduce((sum, c) => sum + c.votes, 0);

                const sorted = [...this.candidates].sort((a, b) => b.votes - a.votes);

                this.elements.resultList.innerHTML = sorted.map(c => {
                    const percent = totalVotes === 0 ? 0 : Math.round((c.votes / totalVotes) * 100);
                    return `
                        <div class="result-card">
                            <div class="result-bar" style="width: ${percent}%"></div>
                            <div class="result-content">
                                <span style="font-weight: 700; font-size: 18px;">${c.name}</span>
                                <span style="font-weight: 600;">${c.votes}표 (${percent}%)</span>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            backToVoting() {
                this.elements.resultPhase.style.display = 'none';
                this.elements.votingPhase.style.display = 'block';
                document.addEventListener('keydown', this.boundHandleVoteKey);
            },

            resetAll() {
                this.candidates = [];
                this.elements.resultPhase.style.display = 'none';
                this.elements.setupPhase.style.display = 'flex';
                this.renderSetupList();
            },

            quickFill() {
                this.candidates = [];
                for (let i = 1; i <= 20; i++) {
                    this.candidates.push({ id: Date.now() + i, name: `${i}번`, votes: 0 });
                }
                this.renderSetupList();
            },

            removeWinner() {
                if (this.candidates.length === 0) return;
                const sorted = [...this.candidates].sort((a, b) => b.votes - a.votes);
                const winner = sorted[0];
                this.candidates = this.candidates.filter(c => c.id !== winner.id);
                this.showResults();
            }
        });
    </script>
</body>

</html>
