<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>단위 변환기 - Utilsly</title>
    <meta name="description" content="길이, 무게, 넓이, 부피 등 다양한 단위를 간편하게 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">단위 변환기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">scale</span>
                    </div>
                    <h1>단위 변환기</h1>
                    <p class="description">길이, 무게, 넓이 등 다양한 단위를 실시간으로 변환합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="unit-converter">
                    <div
                        style="background: var(--bg-sidebar); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px;">
                        <label
                            style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: block;">변환할
                            단위를 선택하세요</label>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px;"
                            id="category-grid">
                            <!-- Categories generated by JS -->
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: center;">
                        <div class="input-card"
                            style="background: var(--bg-primary); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                            <label
                                style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; display: block;">입력</label>
                            <input type="number" id="from-value" value="1"
                                style="width: 100%; font-size: 24px; font-weight: 700; padding: 12px; border: 2px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; transition: border-color 0.2s;">
                            <select id="from-unit"
                                style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-sidebar); cursor: pointer;"></select>
                        </div>

                        <div style="display: flex; justify-content: center;">
                            <span class="material-symbols-rounded"
                                style="font-size: 32px; color: var(--text-tertiary);">arrow_forward</span>
                        </div>

                        <div class="input-card"
                            style="background: var(--bg-sidebar); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color);">
                            <label
                                style="font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; display: block;">결과</label>
                            <input type="text" id="to-value" readonly
                                style="width: 100%; font-size: 24px; font-weight: 700; padding: 12px; border: 2px solid transparent; background: transparent; color: var(--accent-blue); margin-bottom: 12px;">
                            <select id="to-unit"
                                style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); cursor: pointer;"></select>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('unit-converter', {
            elements: {},
            units: {
                length: {
                    meters: 1,
                    kilometers: 0.001,
                    centimeters: 100,
                    millimeters: 1000,
                    inches: 39.3701,
                    feet: 3.28084,
                    yards: 1.09361,
                    miles: 0.000621371
                },
                weight: {
                    kilograms: 1,
                    grams: 1000,
                    milligrams: 1000000,
                    pounds: 2.20462,
                    ounces: 35.274
                },
                area: {
                    square_meters: 1,
                    square_kilometers: 0.000001,
                    square_feet: 10.7639,
                    acres: 0.000247105,
                    hectares: 0.0001,
                    pyeong: 0.3025 // Korean Pyeong
                }
            },

            init() {
                this.elements = {
                    categoryGrid: document.getElementById('category-grid'),
                    fromUnitSelect: document.getElementById('from-unit'),
                    toUnitSelect: document.getElementById('to-unit'),
                    fromValue: document.getElementById('from-value'),
                    toValue: document.getElementById('to-value')
                };

                // Generate Category Buttons
                this.renderCategories();

                this.handleCalculate = () => this.calculate();
                this.elements.fromUnitSelect.addEventListener('change', this.handleCalculate);
                this.elements.toUnitSelect.addEventListener('change', this.handleCalculate);
                this.elements.fromValue.addEventListener('input', this.handleCalculate);

                this.setCategory('length'); // Default
                console.log('Unit Converter initialized');
            },

            renderCategories() {
                const categories = [
                    { id: 'length', name: '길이', icon: 'straighten' },
                    { id: 'weight', name: '무게', icon: 'monitor_weight' },
                    { id: 'area', name: '넓이', icon: 'crop_square' },
                    { id: 'volume', name: '부피', icon: 'view_in_ar' }, // Added
                    { id: 'speed', name: '속도', icon: 'speed' }, // Added
                    { id: 'time', name: '시간', icon: 'schedule' } // Added
                ];

                // Add units for new categories
                this.units.volume = { liters: 1, milliliters: 1000, gallons: 0.264172, cups: 4.22675 };
                this.units.speed = { kmh: 1, mph: 0.621371, ms: 0.277778, knots: 0.539957 };
                this.units.time = { seconds: 1, minutes: 1 / 60, hours: 1 / 3600, days: 1 / 86400 };

                this.elements.categoryGrid.innerHTML = categories.map(cat => `
                    <button class="category-btn" data-id="${cat.id}" onclick="Utilsly.tools['unit-converter'].setCategory('${cat.id}')"
                        style="padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s;">
                        <span class="material-symbols-rounded" style="font-size: 24px; color: var(--text-secondary);">${cat.icon}</span>
                        <span style="font-size: 12px; font-weight: 500;">${cat.name}</span>
                    </button>
                `).join('');
            },

            setCategory(category) {
                // Update active state
                document.querySelectorAll('.category-btn').forEach(btn => {
                    if (btn.dataset.id === category) {
                        btn.style.borderColor = 'var(--accent-blue)';
                        btn.style.background = 'var(--bg-hover)';
                        btn.querySelector('.material-symbols-rounded').style.color = 'var(--accent-blue)';
                    } else {
                        btn.style.borderColor = 'var(--border-color)';
                        btn.style.background = 'var(--bg-primary)';
                        btn.querySelector('.material-symbols-rounded').style.color = 'var(--text-secondary)';
                    }
                });

                this.currentCategory = category;
                this.populateUnits(category);
                this.calculate();
            },

            populateUnits(category) {
                const options = Object.keys(this.units[category]).map(unit =>
                    `<option value="${unit}">${unit.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</option>`
                ).join('');
                this.elements.fromUnitSelect.innerHTML = options;
                this.elements.toUnitSelect.innerHTML = options;

                // Smart defaults
                const defaults = {
                    length: ['meters', 'feet'],
                    weight: ['kilograms', 'pounds'],
                    area: ['square_meters', 'pyeong'],
                    volume: ['liters', 'gallons'],
                    speed: ['kmh', 'mph'],
                    time: ['minutes', 'seconds']
                };

                if (defaults[category]) {
                    this.elements.fromUnitSelect.value = defaults[category][0];
                    this.elements.toUnitSelect.value = defaults[category][1];
                }
            },

            calculate() {
                // Determine category (default length if not set)
                const category = this.currentCategory || 'length';

                const from = this.elements.fromUnitSelect.value;
                const to = this.elements.toUnitSelect.value;
                const value = parseFloat(this.elements.fromValue.value) || 0;

                const baseValue = value / this.units[category][from];
                const result = baseValue * this.units[category][to];

                this.elements.toValue.value = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, '');
            }
        });
    </script>
</body>

</html>
