<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>단위 변환기 - Utilsly</title>
    <meta name="description" content="길이, 무게, 넓이, 부피 등 다양한 단위를 간편하게 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">단위 변환기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">scale</span>
                    </div>
                    <h1>단위 변환기</h1>
                    <p class="description">길이, 무게, 넓이 등 다양한 단위를 실시간으로 변환합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="unit-converter">
                    <div style="margin-bottom: 24px;">
                        <label
                            style="font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">카테고리
                            선택</label>
                        <select id="unit-category"
                            style="width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">
                            <option value="length">길이 (Length)</option>
                            <option value="weight">무게 (Weight)</option>
                            <option value="area">넓이 (Area)</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center;">
                        <div class="input-group">
                            <label style="font-size: 14px; margin-bottom: 4px;">입력</label>
                            <input type="number" id="from-value" value="1"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 4px;">
                            <select id="from-unit"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;"></select>
                        </div>
                        <div style="font-size: 24px; color: var(--text-secondary);">=</div>
                        <div class="input-group">
                            <label style="font-size: 14px; margin-bottom: 4px;">결과</label>
                            <input type="number" id="to-value" readonly
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; margin-bottom: 4px; background: var(--bg-sidebar);">
                            <select id="to-unit"
                                style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;"></select>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('unit-converter', {
            elements: {},
            units: {
                length: {
                    meters: 1,
                    kilometers: 0.001,
                    centimeters: 100,
                    millimeters: 1000,
                    inches: 39.3701,
                    feet: 3.28084,
                    yards: 1.09361,
                    miles: 0.000621371
                },
                weight: {
                    kilograms: 1,
                    grams: 1000,
                    milligrams: 1000000,
                    pounds: 2.20462,
                    ounces: 35.274
                },
                area: {
                    square_meters: 1,
                    square_kilometers: 0.000001,
                    square_feet: 10.7639,
                    acres: 0.000247105,
                    hectares: 0.0001,
                    pyeong: 0.3025 // Korean Pyeong
                }
            },

            init() {
                this.elements = {
                    categorySelect: document.getElementById('unit-category'),
                    fromUnitSelect: document.getElementById('from-unit'),
                    toUnitSelect: document.getElementById('to-unit'),
                    fromValue: document.getElementById('from-value'),
                    toValue: document.getElementById('to-value')
                };

                this.handleCategoryChange = () => {
                    this.populateUnits(this.elements.categorySelect.value);
                    this.calculate();
                };
                this.handleCalculate = () => this.calculate();

                this.elements.categorySelect.addEventListener('change', this.handleCategoryChange);
                this.elements.fromUnitSelect.addEventListener('change', this.handleCalculate);
                this.elements.toUnitSelect.addEventListener('change', this.handleCalculate);
                this.elements.fromValue.addEventListener('input', this.handleCalculate);

                this.populateUnits('length');
                this.calculate();
                console.log('Unit Converter initialized');
            },

            cleanup() {
                if (this.elements.categorySelect) {
                    this.elements.categorySelect.removeEventListener('change', this.handleCategoryChange);
                    this.elements.fromUnitSelect.removeEventListener('change', this.handleCalculate);
                    this.elements.toUnitSelect.removeEventListener('change', this.handleCalculate);
                    this.elements.fromValue.removeEventListener('input', this.handleCalculate);
                }
                this.elements = {};
                console.log('Unit Converter cleanup done');
            },

            populateUnits(category) {
                const options = Object.keys(this.units[category]).map(unit =>
                    `<option value="${unit}">${unit.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase())}</option>`
                ).join('');
                this.elements.fromUnitSelect.innerHTML = options;
                this.elements.toUnitSelect.innerHTML = options;

                // Set defaults
                if (category === 'length') {
                    this.elements.toUnitSelect.value = 'feet';
                } else if (category === 'weight') {
                    this.elements.toUnitSelect.value = 'pounds';
                } else if (category === 'area') {
                    this.elements.toUnitSelect.value = 'pyeong';
                }
            },

            calculate() {
                const category = this.elements.categorySelect.value;
                const from = this.elements.fromUnitSelect.value;
                const to = this.elements.toUnitSelect.value;
                const value = parseFloat(this.elements.fromValue.value) || 0;

                const baseValue = value / this.units[category][from];
                const result = baseValue * this.units[category][to];

                this.elements.toValue.value = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, '');
            }
        });
    </script>
</body>

</html>
