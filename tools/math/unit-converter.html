<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>단위 변환기 - Utilsly</title>
    <meta name="description" content="길이, 무게, 부피 등 모든 단위를 한눈에 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .converter-layout {
            max-width: 600px;
            margin: 0 auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .cat-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-sidebar);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .cat-btn .material-symbols-rounded {
            font-size: 24px;
        }

        .cat-btn span {
            font-size: 13px;
            font-weight: 600;
        }

        .cat-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .conversion-box {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .unit-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .unit-row .input-wrapper {
            flex: 1;
        }

        .unit-row select {
            width: 140px;
        }

        .divider {
            display: flex;
            justify-content: center;
            color: var(--text-tertiary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Content generated by common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">단위 변환기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">scale</span>
                    </div>
                    <h1>단위 변환기</h1>
                    <p class="description">여러 단위를 즉시 교차 변환하고 정확한 수치를 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="unit-converter">
                    <div class="converter-layout">
                        <div class="category-grid">
                            <button class="cat-btn active" data-cat="length">
                                <span class="material-symbols-rounded">straighten</span>
                                <span>길이</span>
                            </button>
                            <button class="cat-btn" data-cat="weight">
                                <span class="material-symbols-rounded">monitor_weight</span>
                                <span>무게</span>
                            </button>
                            <button class="cat-btn" data-cat="volume">
                                <span class="material-symbols-rounded">opacity</span>
                                <span>부피</span>
                            </button>
                            <button class="cat-btn" data-cat="area">
                                <span class="material-symbols-rounded">square_foot</span>
                                <span>넓이</span>
                            </button>
                            <button class="cat-btn" data-cat="temp">
                                <span class="material-symbols-rounded">thermostat</span>
                                <span>온도</span>
                            </button>
                        </div>

                        <div class="conversion-box">
                            <div class="unit-row">
                                <div class="input-wrapper">
                                    <label class="input-label">원본 값</label>
                                    <input type="number" id="from-val" placeholder="0">
                                </div>
                                <select id="from-unit"></select>
                            </div>

                            <div class="divider">
                                <span class="material-symbols-rounded">sync_alt</span>
                            </div>

                            <div class="unit-row">
                                <div class="input-wrapper">
                                    <label class="input-label">변환된 결과</label>
                                    <input type="number" id="to-val" placeholder="0" readonly>
                                </div>
                                <select id="to-unit"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tool-help-section" style="margin-top: 64px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">상세 가이드</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="help-intro">
                            글로벌 환경에서 서로 다른 단위를 사용하는 경우(예: 한국의 '평' vs 글로벌 'm²')가 많습니다. **단위 변환기**는 이러한 수치들을 실시간으로 매칭하여
                            혼동을 줄여줍니다.
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('unit-converter', {
            definitions: {
                length: { units: { mm: { name: '밀리미터 (mm)', rate: 0.001 }, cm: { name: '센티미터 (cm)', rate: 0.01 }, m: { name: '미터 (m)', rate: 1 }, km: { name: '킬로미터 (km)', rate: 1000 }, in: { name: '인치 (in)', rate: 0.0254 }, ft: { name: '피트 (ft)', rate: 0.3048 }, yd: { name: '야드 (yd)', rate: 0.9144 }, mi: { name: '마일 (mi)', rate: 1609.344 }, py: { name: '평 (ja)', rate: 0.30303 } } },
                weight: { units: { mg: { name: '밀리그램 (mg)', rate: 0.000001 }, g: { name: '그램 (g)', rate: 0.001 }, kg: { name: '킬로그램 (kg)', rate: 1 }, t: { name: '톤 (t)', rate: 1000 }, lb: { name: '파운드 (lb)', rate: 0.45359 }, oz: { name: '온스 (oz)', rate: 0.02834 }, don: { name: '돈 (don)', rate: 0.00375 } } },
                volume: { units: { ml: { name: '밀리리터 (ml)', rate: 0.001 }, l: { name: '리터 (l)', rate: 1 }, gal: { name: '갤런 (gal)', rate: 3.78541 }, bbl: { name: '배럴 (bbl)', rate: 158.987 } } },
                area: { units: { m2: { name: '제곱미터 (m²)', rate: 1 }, ha: { name: '헥타르 (ha)', rate: 10000 }, km2: { name: '제곱킬로미터 (km²)', rate: 1000000 }, ac: { name: '에이커 (ac)', rate: 4046.86 }, py: { name: '평 (py)', rate: 3.30578 } } },
                temp: { units: { c: { name: '섭씨 (°C)' }, f: { name: '화씨 (°F)' }, k: { name: '켈빈 (K)' } } }
            },
            currentCat: 'length',

            init() {
                this.elements = {
                    catBtns: document.querySelectorAll('.cat-btn'),
                    fromVal: document.getElementById('from-val'),
                    fromUnit: document.getElementById('from-unit'),
                    toVal: document.getElementById('to-val'),
                    toUnit: document.getElementById('to-unit')
                };

                this.elements.catBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.elements.catBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.setCategory(btn.dataset.cat);
                    });
                });

                [this.elements.fromVal, this.elements.fromUnit, this.elements.toUnit].forEach(el => {
                    el.addEventListener('input', () => this.calculate());
                });

                this.setCategory('length');
            },

            setCategory(cat) {
                this.currentCat = cat;
                const def = this.definitions[cat];
                const options = Object.entries(def.units).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
                this.elements.fromUnit.innerHTML = options;
                this.elements.toUnit.innerHTML = options;
                if (Object.keys(def.units).length > 1) this.elements.toUnit.selectedIndex = 1;
                this.calculate();
            },

            calculate() {
                const val = parseFloat(this.elements.fromVal.value);
                if (isNaN(val)) { this.elements.toVal.value = ''; return; }
                const from = this.elements.fromUnit.value;
                const to = this.elements.toUnit.value;
                const def = this.definitions[this.currentCat];
                let res = 0;

                if (this.currentCat === 'temp') {
                    if (from === to) res = val;
                    else if (from === 'c' && to === 'f') res = (val * 9 / 5) + 32;
                    else if (from === 'c' && to === 'k') res = val + 273.15;
                    else if (from === 'f' && to === 'c') res = (val - 32) * 5 / 9;
                    else if (from === 'k' && to === 'c') res = val - 273.15;
                } else {
                    res = (val * def.units[from].rate) / def.units[to].rate;
                }
                this.elements.toVal.value = Number(res.toFixed(6));
            }
        });
    </script>
</body>

</html>
