<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단위 변환기 - Utilsly</title>
    <meta name="description" content="길이, 무게, 부피, 온도 등 다양한 단위를 쉽고 빠르게 변환하세요.">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar will be injected by common.js -->
        <nav class="sidebar"></nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">단위 변환기</span>
                </div>
            </header>

            <div class="tool-header">
                <div class="header-icon-wrapper">
                    <span class="material-symbols-rounded">scale</span>
                </div>
                <h1>단위 변환기</h1>
                <p class="description">길이, 무게, 부피, 온도 등 다양한 단위를 간편하게 변환합니다.</p>
            </div>

            <div class="tool-container" data-tool-id="unit-converter">
                <div class="calc-wrapper" style="max-width:600px; margin:0 auto;">

                    <!-- Category Selection -->
                    <div class="category-tabs"
                        style="display:flex; gap:8px; margin-bottom:24px; overflow-x:auto; padding-bottom:8px;">
                        <button class="btn btn-sm btn-primary active" data-cat="length">길이</button>
                        <button class="btn btn-sm btn-secondary" data-cat="weight">무게</button>
                        <button class="btn btn-sm btn-secondary" data-cat="volume">부피</button>
                        <button class="btn btn-sm btn-secondary" data-cat="area">넓이</button>
                        <button class="btn btn-sm btn-secondary" data-cat="temp">온도</button>
                    </div>

                    <!-- Converter UI -->
                    <div class="converter-box"
                        style="display:flex; align-items:center; gap:16px; flex-direction:column;">

                        <!-- From -->
                        <div class="input-group" style="width:100%;">
                            <label class="input-label">변환할 값</label>
                            <div style="display:flex; gap:12px;">
                                <input type="number" id="from-val" class="search-input" placeholder="0" style="flex:1;">
                                <select id="from-unit" class="search-input"
                                    style="width:120px; text-align:left; padding-right:32px;">
                                    <!-- Options injected via JS -->
                                </select>
                            </div>
                        </div>

                        <div class="divider-icon">
                            <span class="material-symbols-rounded"
                                style="color:var(--text-tertiary);">arrow_downward</span>
                        </div>

                        <!-- To -->
                        <div class="input-group" style="width:100%;">
                            <label class="input-label">변환된 값</label>
                            <div style="display:flex; gap:12px;">
                                <input type="number" id="to-val" class="search-input" placeholder="0" style="flex:1;"
                                    readonly>
                                <select id="to-unit" class="search-input"
                                    style="width:120px; text-align:left; padding-right:32px;">
                                    <!-- Options injected via JS -->
                                </select>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="tool-help-section">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li><strong>단위 선택:</strong> 상단 탭에서 길이, 무게, 넓이 등 변환할 종류를 선택하세요.</li>
                            <li><strong>입력:</strong> 변환하고 싶은 값을 입력하고 현재 단위를 선택하세요. (예: cm)</li>
                            <li><strong>확인:</strong> 입력 즉시 인치(inch), 피트(ft), 평 등 다른 단위로 자동 변환되어 표시됩니다.</li>
                        </ol>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('unit-converter', {
            definitions: {
                length: {
                    base: 'm',
                    units: {
                        mm: { name: '밀리미터 (mm)', rate: 0.001 },
                        cm: { name: '센티미터 (cm)', rate: 0.01 },
                        m: { name: '미터 (m)', rate: 1 },
                        km: { name: '킬로미터 (km)', rate: 1000 },
                        in: { name: '인치 (in)', rate: 0.0254 },
                        ft: { name: '피트 (ft)', rate: 0.3048 },
                        yd: { name: '야드 (yd)', rate: 0.9144 },
                        mi: { name: '마일 (mi)', rate: 1609.344 },
                        ja: { name: '자 (ja)', rate: 0.3030303 },
                        kan: { name: '간 (kan)', rate: 1.8181818 },
                        jeong: { name: '정 (jeong)', rate: 109.090909 },
                        ri: { name: '리 (ri)', rate: 392.7272727 }
                    }
                },
                weight: {
                    base: 'kg',
                    units: {
                        mg: { name: '밀리그램 (mg)', rate: 0.000001 },
                        g: { name: '그램 (g)', rate: 0.001 },
                        kg: { name: '킬로그램 (kg)', rate: 1 },
                        t: { name: '톤 (t)', rate: 1000 },
                        lb: { name: '파운드 (lb)', rate: 0.453592 },
                        oz: { name: '온스 (oz)', rate: 0.0283495 },
                        geun: { name: '근 (gogig)', rate: 0.6 }, // 고기 근
                        don: { name: '돈 (don)', rate: 0.00375 }
                    }
                },
                volume: {
                    base: 'l',
                    units: {
                        ml: { name: '밀리리터 (ml)', rate: 0.001 },
                        l: { name: '리터 (l)', rate: 1 },
                        cc: { name: '시시 (cc)', rate: 0.001 },
                        gal: { name: '갤런 (gal)', rate: 3.78541 },
                        bbl: { name: '배럴 (bbl)', rate: 158.987 },
                        hop: { name: '홉 (hop)', rate: 0.18039 },
                        doe: { name: '되 (doe)', rate: 1.8039 },
                        mal: { name: '말 (mal)', rate: 18.039 }
                    }
                },
                area: {
                    base: 'm2',
                    units: {
                        m2: { name: '제곱미터 (m²)', rate: 1 },
                        a: { name: '아르 (a)', rate: 100 },
                        ha: { name: '헥타르 (ha)', rate: 10000 },
                        km2: { name: '제곱킬로미터 (km²)', rate: 1000000 },
                        ft2: { name: '제곱피트 (ft²)', rate: 0.092903 },
                        yd2: { name: '제곱야드 (yd²)', rate: 0.836127 },
                        ac: { name: '에이커 (ac)', rate: 4046.86 },
                        py: { name: '평 (py)', rate: 3.305785 }
                    }
                },
                temp: {
                    type: 'formula',
                    units: {
                        c: { name: '섭씨 (°C)' },
                        f: { name: '화씨 (°F)' },
                        k: { name: '켈빈 (K)' }
                    }
                }
            },

            currentCat: 'length',

            init() {
                this.elements = {
                    catButtons: document.querySelectorAll('.category-tabs button'),
                    fromVal: document.getElementById('from-val'),
                    fromUnit: document.getElementById('from-unit'),
                    toVal: document.getElementById('to-val'),
                    toUnit: document.getElementById('to-unit')
                };

                // Bind Category Tabs
                this.elements.catButtons.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.setCategory(e.target.dataset.cat);
                        // Update active state
                        this.elements.catButtons.forEach(b => b.classList.remove('active', 'btn-primary'));
                        this.elements.catButtons.forEach(b => b.classList.add('btn-secondary'));

                        e.target.classList.remove('btn-secondary');
                        e.target.classList.add('active', 'btn-primary');
                    });
                });

                // Bind Calc Events
                const inputs = [this.elements.fromVal, this.elements.fromUnit, this.elements.toUnit];
                inputs.forEach(el => el.addEventListener('input', () => this.calculate()));

                // Keep values on unit change? Yes.

                // Initialize
                this.setCategory('length');
            },

            cleanup() { this.elements = {}; },

            setCategory(cat) {
                this.currentCat = cat;
                const def = this.definitions[cat];

                // Populate Selects
                const optionsHtml = Object.entries(def.units).map(([key, val]) =>
                    `<option value="${key}">${val.name}</option>`
                ).join('');

                this.elements.fromUnit.innerHTML = optionsHtml;
                this.elements.toUnit.innerHTML = optionsHtml;

                // Set defaults (first and second if possible)
                const keys = Object.keys(def.units);
                if (keys.length > 1) {
                    this.elements.toUnit.value = keys[1];
                }

                this.elements.fromVal.value = '';
                this.elements.toVal.value = '';
            },

            calculate() {
                const val = parseFloat(this.elements.fromVal.value);
                if (isNaN(val)) {
                    this.elements.toVal.value = '';
                    return;
                }

                const from = this.elements.fromUnit.value;
                const to = this.elements.toUnit.value;
                const cat = this.currentCat;
                const def = this.definitions[cat];

                let result = 0;

                if (cat === 'temp') {
                    // Temperature Special Logic
                    if (from === to) result = val;
                    else if (from === 'c' && to === 'f') result = (val * 9 / 5) + 32;
                    else if (from === 'c' && to === 'k') result = val + 273.15;
                    else if (from === 'f' && to === 'c') result = (val - 32) * 5 / 9;
                    else if (from === 'f' && to === 'k') result = (val - 32) * 5 / 9 + 273.15;
                    else if (from === 'k' && to === 'c') result = val - 273.15;
                    else if (from === 'k' && to === 'f') result = (val - 273.15) * 9 / 5 + 32;
                } else {
                    // Standard Rate Logic
                    // Convert to base, then to target
                    const fromRate = def.units[from].rate;
                    const toRate = def.units[to].rate;

                    const baseVal = val * fromRate;
                    result = baseVal / toRate;
                }

                // Format logic: up to 6 decimals, strip trailing zeros
                this.elements.toVal.value = parseFloat(result.toFixed(6));
            }
        });
    </script>
</body>

</html>
