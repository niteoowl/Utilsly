<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>퍼센트 계산기 - Utilsly</title>
    <meta name="description" content="전체값의 비율, 값의 변화율, 증감 계산 등 다양한 퍼센트 계산을 지원합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .calc-row {
            background: var(--bg-sidebar);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .calc-input {
            width: 100px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .calc-result {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">퍼센트 계산기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">percent</span>
                    </div>
                    <h1>퍼센트 계산기</h1>
                    <p class="description">비율, 증감, 변화율 등 다양한 퍼센트 계산을 쉽게 해결하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="percentage-calculator">
                    <!-- Case 1: What is X% of Y? -->
                    <div class="calc-row">
                        <span>전체값</span>
                        <input type="number" class="calc-input" id="c1-total" placeholder="100">
                        <span>의</span>
                        <input type="number" class="calc-input" id="c1-percent" placeholder="20">
                        <span>% 는?</span>
                        <span class="calc-result" id="c1-result">0</span>
                        <button class="btn" id="btn-calc1">계산</button>
                    </div>

                    <!-- Case 2: X is what % of Y? -->
                    <div class="calc-row">
                        <span>값</span>
                        <input type="number" class="calc-input" id="c2-part" placeholder="20">
                        <span>은 전체값</span>
                        <input type="number" class="calc-input" id="c2-total" placeholder="100">
                        <span>의 몇 % 인가?</span>
                        <span class="calc-result" id="c2-result">0%</span>
                        <button class="btn" id="btn-calc2">계산</button>
                    </div>

                    <!-- Case 3: Increase/Decrease -->
                    <div class="calc-row">
                        <span>값</span>
                        <input type="number" class="calc-input" id="c3-from" placeholder="1000">
                        <span>이</span>
                        <input type="number" class="calc-input" id="c3-to" placeholder="1500">
                        <span>으로 변하면?</span>
                        <span class="calc-result" id="c3-result">0% 증가</span>
                        <button class="btn" id="btn-calc3">계산</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('percentage-calculator', {
            elements: {},

            init() {
                this.elements = {
                    c1Total: document.getElementById('c1-total'),
                    c1Percent: document.getElementById('c1-percent'),
                    c1Result: document.getElementById('c1-result'),
                    btnCalc1: document.getElementById('btn-calc1'),

                    c2Part: document.getElementById('c2-part'),
                    c2Total: document.getElementById('c2-total'),
                    c2Result: document.getElementById('c2-result'),
                    btnCalc2: document.getElementById('btn-calc2'),

                    c3From: document.getElementById('c3-from'),
                    c3To: document.getElementById('c3-to'),
                    c3Result: document.getElementById('c3-result'),
                    btnCalc3: document.getElementById('btn-calc3')
                };

                this.handleCalc1 = () => this.calc1();
                this.handleCalc2 = () => this.calc2();
                this.handleCalc3 = () => this.calc3();

                this.elements.btnCalc1.addEventListener('click', this.handleCalc1);
                this.elements.btnCalc2.addEventListener('click', this.handleCalc2);
                this.elements.btnCalc3.addEventListener('click', this.handleCalc3);

                console.log('Percentage Calculator initialized');
            },

            cleanup() {
                if (this.elements.btnCalc1) {
                    this.elements.btnCalc1.removeEventListener('click', this.handleCalc1);
                    this.elements.btnCalc2.removeEventListener('click', this.handleCalc2);
                    this.elements.btnCalc3.removeEventListener('click', this.handleCalc3);
                }
                this.elements = {};
                console.log('Percentage Calculator cleanup done');
            },

            calc1() {
                const total = parseFloat(this.elements.c1Total.value) || 0;
                const percent = parseFloat(this.elements.c1Percent.value) || 0;
                this.elements.c1Result.textContent = (total * (percent / 100)).toLocaleString();
            },

            calc2() {
                const part = parseFloat(this.elements.c2Part.value) || 0;
                const total = parseFloat(this.elements.c2Total.value) || 0;
                if (total === 0) return;
                this.elements.c2Result.textContent = ((part / total) * 100).toFixed(2) + '%';
            },

            calc3() {
                const from = parseFloat(this.elements.c3From.value) || 0;
                const to = parseFloat(this.elements.c3To.value) || 0;
                if (from === 0) return;
                const diff = to - from;
                const percent = (diff / from) * 100;
                const type = percent > 0 ? "증가" : "감소";
                this.elements.c3Result.textContent = Math.abs(percent).toFixed(2) + '% ' + type;
            }
        });
    </script>
</body>

</html>
