<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>글자 깨짐 복구 - Utilsly</title>
    <meta name="description" content="깨진 텍스트의 인코딩을 분석하고 정상적으로 복구해 보세요 (EUC-KR, UTF-8 등).">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .tool-layout {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">글자 깨짐 복구</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">history_edu</span>
                    </div>
                    <h1>글자 깨짐 복구</h1>
                    <p class="description">인코딩 문제로 깨져 보이는 문자를 올바르게 복구합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="encoding-fixer">
                    <div class="tool-layout">
                        <div>
                            <label id="brokenTextLabel"
                                style="display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">깨진
                                문자열 입력</label>
                            <textarea id="brokenText" class="input-field" style="height: 160px; font-family: monospace;"
                                placeholder="깨진 글자를 여기에 붙여넣으세요..."></textarea>
                        </div>

                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button id="repairAutoBtn" class="btn btn-primary"
                                style="flex: 1; padding: 14px; font-size: 1.125rem; font-weight: 700;">
                                <span class="material-symbols-rounded">magic_button</span> 자동 복구 시도
                            </button>
                            <button id="clearBtn" class="btn" style="padding: 12px; min-width: 100px;">초기화</button>
                        </div>

                        <div style="margin-top: 8px;">
                            <label
                                style="display: block; font-size: 13px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 12px;">수동
                                변환 도구</label>
                            <div
                                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px;">
                                <button class="btn btn-outline manual-btn" data-from="UTF-8" data-to="EUC-KR">UTF-8 →
                                    EUC-KR</button>
                                <button class="btn btn-outline manual-btn" data-from="EUC-KR" data-to="UTF-8">EUC-KR →
                                    UTF-8</button>
                                <button class="btn btn-outline manual-btn" data-from="UTF-8" data-to="CP949">UTF-8 →
                                    CP949</button>
                                <button class="btn btn-outline manual-btn" data-from="ISO-8859-1" data-to="UTF-8">Latin1
                                    → UTF-8</button>
                            </div>
                        </div>

                        <div id="resultArea"
                            style="border-top: 1px solid var(--border-color); padding-top: 32px; display: none;">
                            <label
                                style="display: block; font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px;">복구된
                                결과</label>
                            <div id="encodingInfo"
                                style="font-size: 13px; color: var(--accent-blue); margin-bottom: 12px; font-weight: 600;">
                            </div>
                            <textarea id="fixedText" class="input-field" style="height: 160px; font-family: monospace;"
                                readonly placeholder="복구 결과가 여기에 표시됩니다."></textarea>
                            <button id="copyBtn" class="btn" style="width: 100%; margin-top: 16px; padding: 12px;">
                                <span class="material-symbols-rounded">content_copy</span> 결과 복사하기
                            </button>
                        </div>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">외계어처럼 깨진 글자가 정말 복구되나요?</div>
                            <div class="faq-answer">네, 보통 '뜐뜌' 같이 보이는 글자는 EUC-KR과 UTF-8 인코딩이 꼬였을 때 발생합니다. 이 도구는 그 패턴을
                                분석해 원본 한글로 되돌려줍니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">100% 복구되나요?</div>
                            <div class="faq-answer">인코딩 오류로 인한 깨짐은 대부분 복구되지만, 파일 전송 과정에서 데이터 자체가 유실(???)된 경우는 복구가
                                불가능합니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        var EncodingFixerTool = {
            init() {
                this.brokenTextArea = document.getElementById('brokenText');
                this.fixedTextArea = document.getElementById('fixedText');
                this.repairAutoBtn = document.getElementById('repairAutoBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.copyBtn = document.getElementById('copyBtn');
                this.resultArea = document.getElementById('resultArea');
                this.encodingInfo = document.getElementById('encodingInfo');

                if (!this.brokenTextArea) return;

                const newRepairBtn = this.repairAutoBtn.cloneNode(true);
                this.repairAutoBtn.parentNode.replaceChild(newRepairBtn, this.repairAutoBtn);
                this.repairAutoBtn = newRepairBtn;

                const newClearBtn = this.clearBtn.cloneNode(true);
                this.clearBtn.parentNode.replaceChild(newClearBtn, this.clearBtn);
                this.clearBtn = newClearBtn;

                const newCopyBtn = this.copyBtn.cloneNode(true);
                this.copyBtn.parentNode.replaceChild(newCopyBtn, this.copyBtn);
                this.copyBtn = newCopyBtn;

                this.repairAutoBtn.onclick = () => this.autoRepair();
                this.clearBtn.onclick = () => {
                    this.brokenTextArea.value = '';
                    this.fixedTextArea.value = '';
                    this.resultArea.style.display = 'none';
                };
                this.copyBtn.onclick = () => {
                    navigator.clipboard.writeText(this.fixedTextArea.value);
                    Utilsly.showAlert('클립보드에 복사되었습니다.');
                };

                document.querySelectorAll('.manual-btn').forEach(btn => {
                    btn.onclick = () => {
                        this.manualConvert(btn.dataset.from, btn.dataset.to);
                    };
                });
            },

            async autoRepair() {
                const text = this.brokenTextArea.value.trim();
                if (!text) {
                    Utilsly.showAlert('텍스트를 입력해주세요.');
                    return;
                }

                try {
                    const latin1ToUtf8 = this.decode(this.encode(text, 'iso-8859-1'), 'utf-8');
                    this.fixedTextArea.value = latin1ToUtf8;
                    this.encodingInfo.textContent = '수정 완료 (예상 원본: UTF-8, 현재 해석: Latin1)';
                    this.resultArea.style.display = 'block';
                } catch (e) {
                    Utilsly.showAlert('복구 중 오류가 발생했습니다: ' + e.message);
                }
            },

            manualConvert(from, to) {
                const text = this.brokenTextArea.value.trim();
                if (!text) return;

                try {
                    if (from === 'EUC-KR' && to === 'UTF-8') {
                        const bytes = new Uint8Array(text.length);
                        for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xFF;
                        const decoder = new TextDecoder('euc-kr');
                        this.fixedTextArea.value = decoder.decode(bytes);
                        this.encodingInfo.textContent = '수동 변환: EUC-KR → UTF-8';
                    } else if (from === 'UTF-8' && to === 'EUC-KR') {
                        const encoder = new TextEncoder();
                        const bytes = encoder.encode(text);
                        const decoder = new TextDecoder('euc-kr');
                        this.fixedTextArea.value = decoder.decode(bytes);
                        this.encodingInfo.textContent = '수동 변환: UTF-8 → EUC-KR';
                    } else {
                        const bytes = new Uint8Array(text.length);
                        for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 0xff;
                        const decoder = new TextDecoder(to.toLowerCase());
                        this.fixedTextArea.value = decoder.decode(bytes);
                        this.encodingInfo.textContent = `수동 변환: ${from} → ${to}`;
                    }
                    this.resultArea.style.display = 'block';
                } catch (e) {
                    Utilsly.showAlert('인코딩 변환 실패: ' + e.message);
                }
            },

            encode(str, charset) {
                const encoder = new TextEncoder();
                return encoder.encode(str);
            },

            decode(bytes, charset) {
                const decoder = new TextDecoder(charset);
                return decoder.decode(bytes);
            },

            cleanup() { }
        };

        Utilsly.registerTool('encoding-fixer', EncodingFixerTool);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            if (!window.EncodingFixerToolInitialized) {
                EncodingFixerTool.init();
                window.EncodingFixerToolInitialized = true;
            }
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                EncodingFixerTool.init();
                window.EncodingFixerToolInitialized = true;
            });
        }
    </script>
</body>

</html>
