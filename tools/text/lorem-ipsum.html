<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>로렘 입숨 생성기 - Utilsly</title>
    <meta name="description" content="디자인 및 퍼블리싱을 위한 더미 텍스트(Lorem Ipsum) 생성기입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">로렘 입숨 생성</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">text_snippet</span>
                    </div>
                    <h1>로렘 입숨 생성기</h1>
                    <p class="description">디자인 시안용 더미 텍스트를 생성합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="lorem-ipsum">
                    <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 16px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <label for="count">문단 수:</label>
                            <input type="number" id="count" value="3" min="1" max="20"
                                style="width: 60px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px;">
                        </div>
                        <button class="btn btn-primary" id="generateBtn">생성하기</button>
                    </div>
                    <textarea id="result-text" readonly style="min-height: 400px;"></textarea>
                    <div class="tool-help-section">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">이용 가이드 및 FAQ</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <div class="faq-item">
                                <div class="faq-question">로렘 입숨(Lorem Ipsum)이 무엇인가요?</div>
                                <div class="faq-answer">디자인이나 출판물의 레이아웃을 시각적으로 확인하기 위해 사용하는 표준 채움 글(더미 텍스트)입니다. 의미 없는
                                    라틴어 문장들로 구성되어 있습니다.</div>
                            </div>
                            <div class="faq-item">
                                <div class="faq-question">한글 더미 텍스트는 없나요?</div>
                                <div class="faq-answer">현재 버전은 표준 라틴어 로렘 입숨만 제공합니다. 추후 한글 더미 텍스트 생성 기능도 추가될 예정입니다.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('lorem-ipsum', {
            elements: {},
            loremText: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.",

            init() {
                this.elements = {
                    countInput: document.getElementById('count'),
                    textarea: document.getElementById('result-text'),
                    generateBtn: document.getElementById('generateBtn')
                };

                this.handleGenerate = this.generateLorem.bind(this);
                this.elements.generateBtn.addEventListener('click', this.handleGenerate);

                this.generateLorem();
                console.log('Lorem Ipsum Generator initialized');
            },

            cleanup() {
                if (this.elements.generateBtn) {
                    this.elements.generateBtn.removeEventListener('click', this.handleGenerate);
                }
                this.elements = {};
                console.log('Lorem Ipsum Generator cleanup done');
            },

            generateLorem() {
                const count = this.elements.countInput.value;
                let result = [];
                for (let i = 0; i < count; i++) {
                    result.push(this.loremText);
                }
                this.elements.textarea.value = result.join('\n\n');
            }
        });
    </script>
</body>

</html>
