<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>줄바꿈 제거 - Utilsly</title>
    <meta name="description" content="텍스트의 줄바꿈을 공백으로 바꾸거나 완전히 제거합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">줄바꿈 제거</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">format_align_left</span>
                    </div>
                    <h1>줄바꿈 제거</h1>
                    <p class="description">불필요한 줄바꿈을 제거하고 텍스트를 한 줄로 정리합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="remove-line-breaks">
                    <div style="margin-bottom: 16px; display: flex; gap: 8px;">
                        <button class="btn btn-primary" id="btnSpace">줄바꿈 → 공백</button>
                        <button class="btn" id="btnNone">줄바꿈 삭제</button>
                    </div>
                    <textarea id="input-text" placeholder="텍스트를 입력하세요..." style="min-height: 400px;"></textarea>
                    <div class="tool-help-section">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>입력:</strong> 줄바꿈을 제거하고 싶은 텍스트를 붙여넣으세요. (예: PDF에서 복사한 글)</li>
                                <li><strong>선택:</strong> '줄바꿈 공백으로'는 단어 사이를 띄워주고, '줄바꿈 삭제'는 완전히 붙여씁니다.</li>
                                <li><strong>복사:</strong> 정리된 텍스트가 자동으로 입력창에 반영됩니다.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('remove-line-breaks', {
            elements: {},

            init() {
                this.elements = {
                    textarea: document.getElementById('input-text'),
                    btnSpace: document.getElementById('btnSpace'),
                    btnNone: document.getElementById('btnNone')
                };

                this.handleSpace = () => this.removeBreaks('space');
                this.handleNone = () => this.removeBreaks('none');

                this.elements.btnSpace.addEventListener('click', this.handleSpace);
                this.elements.btnNone.addEventListener('click', this.handleNone);
                console.log('Remove Line Breaks initialized');
            },

            cleanup() {
                if (this.elements.btnSpace) {
                    this.elements.btnSpace.removeEventListener('click', this.handleSpace);
                    this.elements.btnNone.removeEventListener('click', this.handleNone);
                }
                this.elements = {};
                console.log('Remove Line Breaks cleanup done');
            },

            removeBreaks(type) {
                const text = this.elements.textarea.value;
                if (!text) return;

                if (type === 'space') {
                    this.elements.textarea.value = text.replace(/(\r\n|\n|\r)/gm, " ");
                } else {
                    this.elements.textarea.value = text.replace(/(\r\n|\n|\r)/gm, "");
                }
            }
        });
    </script>
</body>

</html>
