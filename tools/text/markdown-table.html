<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>마크다운 테이블 생성기 - Utilsly</title>
    <meta name="description" content="시각적으로 테이블을 만들고 마크다운 코드를 생성하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        td,
        th {
            border: 1px solid var(--border-color);
            padding: 8px;
        }

        td input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 4px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs"><span class="breadcrumb-item">마크다운 테이블</span></div>
            </header>
            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper"><span class="material-symbols-rounded">table</span></div>
                    <h1>마크다운 테이블 생성기</h1>
                    <p class="description">시각적으로 테이블을 만들고 마크다운 코드를 생성하세요.</p>
                </div>
                <div class="tool-container">
                    <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
                        <button class="btn" onclick="addRow()">행 추가</button>
                        <button class="btn" onclick="addColumn()">열 추가</button>
                        <button class="btn" onclick="removeRow()">행 제거</button>
                        <button class="btn" onclick="removeColumn()">열 제거</button>
                        <button class="btn btn-primary" onclick="generateMarkdown()">마크다운 생성</button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table id="table">
                            <thead>
                                <tr>
                                    <th><input type="text" value="Header 1"></th>
                                    <th><input type="text" value="Header 2"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" value="Cell 1"></td>
                                    <td><input type="text" value="Cell 2"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">마크다운 출력</label>
                        <textarea id="output" readonly
                            style="width: 100%; height: 200px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-mono); font-size: 14px;"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="copyMarkdown()"
                        style="width: 100%; margin-top: 12px;">복사</button>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        function addRow() {
            const table = document.getElementById('table');
            const tbody = table.querySelector('tbody');
            const cols = table.querySelector('thead tr').children.length;
            const row = tbody.insertRow();
            for (let i = 0; i < cols; i++) {
                const cell = row.insertCell();
                cell.innerHTML = '<input type="text" value="">';
            }
        }

        function addColumn() {
            const table = document.getElementById('table');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');

            const th = document.createElement('th');
            th.innerHTML = '<input type="text" value="Header">';
            thead.appendChild(th);

            tbody.querySelectorAll('tr').forEach(row => {
                const td = row.insertCell();
                td.innerHTML = '<input type="text" value="">';
            });
        }

        function removeRow() {
            const tbody = document.getElementById('table').querySelector('tbody');
            if (tbody.rows.length > 1) tbody.deleteRow(-1);
        }

        function removeColumn() {
            const table = document.getElementById('table');
            const thead = table.querySelector('thead tr');
            const tbody = table.querySelector('tbody');
            if (thead.children.length > 1) {
                thead.deleteCell(-1);
                tbody.querySelectorAll('tr').forEach(row => row.deleteCell(-1));
            }
        }

        function generateMarkdown() {
            const table = document.getElementById('table');
            const headers = Array.from(table.querySelectorAll('thead input')).map(i => i.value);
            const rows = Array.from(table.querySelectorAll('tbody tr')).map(row =>
                Array.from(row.querySelectorAll('input')).map(i => i.value)
            );

            let md = '| ' + headers.join(' | ') + ' |\n';
            md += '| ' + headers.map(() => '---').join(' | ') + ' |\n';
            rows.forEach(row => {
                md += '| ' + row.join(' | ') + ' |\n';
            });

            document.getElementById('output').value = md;
        }

        function copyMarkdown() {
            const output = document.getElementById('output');
            navigator.clipboard.writeText(output.value);
        }

        generateMarkdown();
    </script>
</body>

</html>
