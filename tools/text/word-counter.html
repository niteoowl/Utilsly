<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>글자수 세기 - Utilsly</title>
    <meta name="description" content="실시간 글자수, 단어수, 줄수 계산기. 자기소개서, 이력서 작성 시 유용한 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">글자수 세기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">notes</span>
                    </div>
                    <h1>글자수 세기</h1>
                    <p class="description">실시간 글자수, 단어수, 줄수를 계산합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="word-counter">
                    <textarea id="word-input" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요..."
                        style="min-height: 400px;"></textarea>
                    <div class="stats-bar">
                        <div class="stat-item"><strong id="char-count-total">0</strong> 공백포함</div>
                        <div class="stat-item"><strong id="char-count-no-space">0</strong> 공백제외</div>
                        <div class="stat-item"><strong id="word-count">0</strong> 단어</div>
                        <div class="stat-item"><strong id="line-count">0</strong> 줄</div>
                    </div>
                    <div class="tool-help-section">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>입력:</strong> 텍스트 상자에 글자수를 세고 싶은 내용을 입력하거나 붙여넣으세요.</li>
                                <li><strong>확인:</strong> 상단 바에서 공백 포함/제외 글자 수, 단어 수, 줄 수를 실시간으로 확인할 수 있습니다.</li>
                                <li><strong>활용:</strong> 자기소개서 작성, 블로그 포스팅 등 글자 수 제한이 있는 곳에 유용하게 사용하세요.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('word-counter', {
            elements: {},

            init() {
                this.elements = {
                    textarea: document.getElementById('word-input'),
                    charCountTotal: document.getElementById('char-count-total'),
                    charCountNoSpace: document.getElementById('char-count-no-space'),
                    wordCount: document.getElementById('word-count'),
                    lineCount: document.getElementById('line-count')
                };

                this.handleInput = this.updateCounts.bind(this);
                this.elements.textarea.addEventListener('input', this.handleInput);
                console.log('Word Counter initialized');
            },

            cleanup() {
                if (this.elements.textarea) {
                    this.elements.textarea.removeEventListener('input', this.handleInput);
                }
                this.elements = {};
                console.log('Word Counter cleanup done');
            },

            updateCounts() {
                const text = this.elements.textarea.value;

                // Characters (Total)
                this.elements.charCountTotal.textContent = text.length;

                // Characters (No Space)
                this.elements.charCountNoSpace.textContent = text.replace(/\s/g, '').length;

                // Words
                const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                this.elements.wordCount.textContent = words;

                // Lines
                const lines = text === '' ? 0 : text.split(/\n/).length;
                this.elements.lineCount.textContent = lines;
            }
        });
    </script>
</body>

</html>
