<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>텍스트 비교 - Utilsly</title>
    <meta name="description" content="두 텍스트의 차이점을 비교하여 시각적으로 확인하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .diff-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .text-area-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: monospace;
            font-size: 14px;
        }

        .result-container {
            padding: 24px 0;
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.6;
            min-height: 100px;
        }

        .diff-added {
            background-color: #e6ffec;
            color: #2da44e;
            text-decoration: none;
        }

        .diff-removed {
            background-color: #ffebe9;
            color: #cf222e;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">텍스트 비교</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">difference</span>
                    </div>
                    <h1>텍스트 비교</h1>
                    <p class="description">두 텍스트를 입력하여 변경된 부분(추가/삭제)을 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="text-diff">
                    <div class="diff-container">
                        <div class="text-area-wrapper">
                            <label style="font-weight: 600;">원본 텍스트 (Old)</label>
                            <textarea id="oldText" placeholder="원본 텍스트를 입력하세요..."></textarea>
                        </div>
                        <div class="text-area-wrapper">
                            <label style="font-weight: 600;">변경된 텍스트 (New)</label>
                            <textarea id="newText" placeholder="변경된 텍스트를 입력하세요..."></textarea>
                        </div>
                    </div>

                    <button class="btn btn-primary" id="compareBtn"
                        style="width: 100%; margin-bottom: 24px;">비교하기</button>

                    <label style="font-weight: 600; display: block; margin-bottom: 8px;">비교 결과</label>
                    <div class="result-container" id="result">
                        결과가 여기에 표시됩니다.
                    </div>
                </div>
                <div class="tool-help-section">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">코드 비교도 가능한가요?</div>
                            <div class="faq-answer">네, 일반 텍스트뿐만 아니라 소스 코드의 변경 사항을 찾는 데도 매우 유용합니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">결과의 색깔은 무슨 의미인가요?</div>
                            <div class="faq-answer"><span
                                    style="background-color: #ffebe9; color: #cf222e; padding: 2px 4px; border-radius: 4px;">빨간색
                                    배경</span>은 삭제된 텍스트, <span
                                    style="background-color: #e6ffec; color: #2da44e; padding: 2px 4px; border-radius: 4px;">초록색
                                    배경</span>은 새로 추가된 텍스트를 의미합니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
    <script>
        Utilsly.registerTool('text-diff', {
            elements: {},

            init() {
                this.elements = {
                    oldText: document.getElementById('oldText'),
                    newText: document.getElementById('newText'),
                    resultDiv: document.getElementById('result'),
                    compareBtn: document.getElementById('compareBtn')
                };

                this.handleCompare = this.compareText.bind(this);
                this.elements.compareBtn.addEventListener('click', this.handleCompare);
                console.log('Text Diff initialized');
            },

            cleanup() {
                if (this.elements.compareBtn) {
                    this.elements.compareBtn.removeEventListener('click', this.handleCompare);
                }
                this.elements = {};
                console.log('Text Diff cleanup done');
            },

            compareText() {
                const oldText = this.elements.oldText.value;
                const newText = this.elements.newText.value;

                if (typeof Diff === 'undefined') {
                    this.elements.resultDiv.innerHTML = 'Diff library needed.';
                    return;
                }

                const diff = Diff.diffWords(oldText, newText);
                const fragment = document.createDocumentFragment();

                diff.forEach((part) => {
                    const span = document.createElement('span');
                    span.style.fontWeight = part.added || part.removed ? 'bold' : 'normal';

                    if (part.added) {
                        span.className = 'diff-added';
                    } else if (part.removed) {
                        span.className = 'diff-removed';
                    }

                    span.appendChild(document.createTextNode(part.value));
                    fragment.appendChild(span);
                });

                this.elements.resultDiv.innerHTML = '';
                this.elements.resultDiv.appendChild(fragment);
            }
        });
    </script>
</body>

</html>
