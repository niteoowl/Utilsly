<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>마크다운 미리보기 - Utilsly</title>
    <meta name="description" content="마크다운 문법을 실시간으로 미리보기 할 수 있는 에디터입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            height: 600px;
        }

        .preview-pane {
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            background: var(--bg-primary);
            overflow-y: auto;
            line-height: 1.6;
        }

        .preview-pane h1,
        .preview-pane h2,
        .preview-pane h3 {
            margin-top: 0;
        }

        .preview-pane code {
            background: #f0f0f0;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        .preview-pane pre {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .preview-pane blockquote {
            border-left: 4px solid var(--accent-blue);
            margin: 0;
            padding-left: 16px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">마크다운 미리보기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">markdown</span>
                    </div>
                    <h1>마크다운 미리보기</h1>
                    <p class="description">마크다운 문법을 실시간으로 미리보고 HTML로 변환합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="markdown-preview">
                    <div class="editor-container">
                        <textarea id="editor" placeholder="# 제목을 입력하세요..."># 환영합니다!

이곳은 **마크다운 미리보기** 도구입니다.

- 리스트 아이템 1
- 리스트 아이템 2

```javascript
console.log('Hello Utilsly!');
```

> 인용구도 지원합니다.</textarea>
                        <div id="preview" class="preview-pane"></div>
                    </div>
                </div>
                <div class="tool-help-section" style="margin-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">마크다운(Markdown)이 뭔가요?</div>
                            <div class="faq-answer">텍스트 기반의 가벼운 마크업 언어로, '# 제목', '**강조**' 같은 기호로 서식을 표현합니다. 개발자 노트나 블로그
                                초안 작성에 많이 쓰입니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">변환된 HTML을 어떻게 복사하나요?</div>
                            <div class="faq-answer">오른쪽 미리보기 화면 내용을 드래그해서 복사하거나, 필요하다면 소스 보기 기능을 추후 업데이트할 예정입니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('markdown-preview', {
            elements: {},

            init() {
                this.elements = {
                    editor: document.getElementById('editor'),
                    preview: document.getElementById('preview')
                };

                this.handleInput = this.updatePreview.bind(this);
                this.elements.editor.addEventListener('input', this.handleInput);

                this.updatePreview();
                console.log('Markdown Preview initialized');
            },

            cleanup() {
                if (this.elements.editor) {
                    this.elements.editor.removeEventListener('input', this.handleInput);
                }
                this.elements = {};
                console.log('Markdown Preview cleanup done');
            },

            updatePreview() {
                const text = this.elements.editor.value;
                // marked library should be loaded by common.js from the head tag of this file or previously loaded
                if (typeof marked !== 'undefined') {
                    const html = marked.parse(text);
                    this.elements.preview.innerHTML = html;
                } else {
                    this.elements.preview.innerHTML = "Marked library not loaded.";
                }
            }
        });
    </script>
</body>

</html>
