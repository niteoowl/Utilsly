            init() {
                this.elements = {
                    input: document.getElementById('input'),
                    output: document.getElementById('output')
                };

                this.handleInput = this.generate.bind(this);
                this.elements.input.addEventListener('input', this.handleInput);

                // Expose copy function globally solely for the onclick attributes in innerHTML
                // A better approach would be event delegation but for now we'll bridge it.
                window.fancyTextCopy = this.copy.bind(this);

                this.generate();
                console.log('Fancy Text initialized');
            },

            cleanup() {
                if (this.elements.input) {
                    this.elements.input.removeEventListener('input', this.handleInput);
                }
                this.elements = {};
                delete window.fancyTextCopy;
                console.log('Fancy Text cleanup done');
            },

            generate() {
                const text = this.elements.input.value || 'Utilsly Fonts';
                this.elements.output.innerHTML = '';

                Object.entries(this.categories).forEach(([categoryName, fontList]) => {
                    const categoryHeader = document.createElement('div');
                    categoryHeader.innerHTML = `<h3 style="margin: 24px 0 12px 4px; font-size: 14px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px;">${categoryName}</h3>`;
                    this.elements.output.appendChild(categoryHeader);

                    Object.entries(fontList).forEach(([name, mapStr]) => {
                        const converted = this.convertText(text, mapStr);
                        const safeText = converted.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

                        const item = document.createElement('div');
                        item.style.cssText = 'background: var(--bg-sidebar); padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color);';

                        // Using window.fancyTextCopy for the inline onclick
                        item.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <span style="font-weight: 600; font-size: 13px; color: var(--text-secondary); background: var(--bg-main); padding: 2px 8px; border-radius: 4px;">${name}</span>
                                <button class="btn" onclick="window.fancyTextCopy('${safeText}', this)" 
                                    style="padding: 4px 12px; font-size: 12px; border-radius: 100px; font-weight: 600;">Copy</button>
                            </div>
                            <div style="font-size: 26px; line-height: 1.5; word-break: break-all; color: var(--text-primary); padding: 4px 0;">${converted}</div>
                        `;
                        this.elements.output.appendChild(item);
                    });
                });
            },

            convertText(text, mapStr) {
                const textArray = [...text];
                const mapArray = [...mapStr];

                if (mapArray.length === 62) {
                    return textArray.map(char => {
                        const index = this.normal.indexOf(char);
                        return index !== -1 ? mapArray[index] : char;
                    }).join('');
                }

                const isCombinerMode = mapStr.indexOf('A') === 0 && mapStr.length > 100;
                if (isCombinerMode) {
                    const combiner = [...mapStr][1];
                    return textArray.map(char => char + combiner).join('');
                }

                return textArray.map(char => {
                    const index = this.normal.indexOf(char);
                    return (index !== -1 && mapArray[index]) ? mapArray[index] : char;
                }).join('');
            },

            copy(text, btn) {
                navigator.clipboard.writeText(text);
                const original = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.background = 'var(--success-color, #28a745)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1500);
            }
        });
    </script>
</body>

</html>
