        const normal = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

        input.addEventListener('input', generate);

        function generate() {
            const text = input.value || 'Hello World';
            output.innerHTML = '';

            Object.entries(fonts).forEach(([name, font]) => {
                const converted = convertText(text, font.map);
                const item = document.createElement('div');
                item.style.cssText = 'background: var(--bg-sidebar); padding: 16px; border-radius: 8px; margin-bottom: 12px;';
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-weight: 600; font-size: 14px; color: var(--text-secondary);">${name}</span>
                        <button class="btn" onclick="copy('${converted.replace(/'/g, "\\'")}', this)" style="padding: 4px 12px; font-size: 12px;">복사</button>
                    </div>
                    <div style="font-size: 20px; word-break: break-all;">${converted}</div>
                `;
                output.appendChild(item);
            });
        }

        function convertText(text, fontMap) {
            return text.split('').map(char => {
                const index = normal.indexOf(char);
                return index !== -1 ? fontMap[index] : char;
            }).join('');
        }

        function copy(text, btn) {
            navigator.clipboard.writeText(text);
            const original = btn.textContent;
            btn.textContent = '복사됨!';
            setTimeout(() => btn.textContent = original, 1000);
        }

        generate();
    </script>
