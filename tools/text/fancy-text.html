        input.addEventListener('input', generate);

        function generate() {
            const text = input.value || 'Utilsly Fonts';
            output.innerHTML = '';

            // 카테고리별 반복 렌더링
            Object.entries(categories).forEach(([categoryName, fontList]) => {
                // 카테고리 헤더 생성
                const categoryHeader = document.createElement('div');
                categoryHeader.innerHTML = `<h3 style="margin: 24px 0 12px 4px; font-size: 14px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px;">${categoryName}</h3>`;
                output.appendChild(categoryHeader);

                // 해당 카테고리의 폰트들 생성
                Object.entries(fontList).forEach(([name, mapStr]) => {
                    const converted = convertText(text, mapStr);
                    // 복사 버튼 기능용 이스케이프
                    const safeText = converted.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

                    const item = document.createElement('div');
                    // 박스 디자인 유지
                    item.style.cssText = 'background: var(--bg-sidebar); padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color);';

                    item.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: 600; font-size: 13px; color: var(--text-secondary); background: var(--bg-main); padding: 2px 8px; border-radius: 4px;">${name}</span>
                            <button class="btn" onclick="copy('${safeText}', this)" 
                                style="padding: 4px 12px; font-size: 12px; border-radius: 100px; font-weight: 600;">Copy</button>
                        </div>
                        <div style="font-size: 26px; line-height: 1.5; word-break: break-all; color: var(--text-primary); padding: 4px 0;">${converted}</div>
                    `;
                    output.appendChild(item);
                });
            });
        }

        // 텍스트 변환 로직 (Surrogate Pair 안전 처리)
        function convertText(text, mapStr) {
            // mapStr이 결합 문자(Combining Mark)를 포함할 수 있으므로 배열로 안전하게 분리
            // 단, 밑줄/취소선 등 결합 문자가 쓰이는 경우를 위해 로직 분기
            const isCombining = mapStr.length > 200; // 단순 1:1 매핑보다 길이가 훨씬 길면 결합 문자로 간주

            if (isCombining) {
                // 결합 문자 방식 (예: 글자 + 윗줄)
                const mark = mapStr.slice(1, 2); // 결합 문자 추출 (예: 0번째 문자는 예시용 A일 수 있음, 여기선 단순화)
                // * 위 데이터셋은 1:1 매핑과 결합문자 섞여있음. 
                // 위 데이터셋은 모두 1:1 대칭 길이가 맞거나, 결합형태로 이미 만들어둔 문자열임.
                // 따라서 기존 로직을 약간 수정하여 처리.
            }

            // 안전한 배열 변환
            const mapArray = [...mapStr];
            const textArray = [...text];

            // 특수 로직: 결합 문자가 포함된 폰트(밑줄, 취소선 등)는 1:1 매핑이 아니라 문자 뒤에 붙는 형식일 수 있음
            // 하지만 위 데이터셋은 가독성을 위해 미리 매핑된 형태거나 순서대로 나열됨.
            // 위 데이터셋 중 '취소선/밑줄' 등은 Combining Diacritical Marks를 사용하므로
            // 일반적인 인덱싱으로 처리하기 위해선 [A+Mark, B+Mark...] 형태가 필요함.
            // 현재 mapStr 데이터는 긴 문자열이므로, 길이를 체크하여 처리.

            // 일반적인 유니코드 폰트 (길이가 62개 근처인 경우)
            if (mapArray.length <= 62 * 2) {
                return textArray.map(char => {
                    const index = normal.indexOf(char);
                    return (index !== -1 && mapArray[index]) ? mapArray[index] : char;
                }).join('');
            } else {
                // 결합 문자가 있는 경우 (예: A̶ B̶ ... 처럼 2글자가 하나인 경우)
                // 이 경우 mapStr을 쪼개는 로직이 복잡하므로, 
                // 간단하게 "입력 글자 + 결합 문자" 방식으로 동적 생성하는 것이 훨씬 효율적임.
                // 위 데이터셋의 '취소선', '밑줄', '물결', '구름', '박스' 등은 결합문자(Code point 1개 이상)임.

                // 결합 문자 추출 (A 뒤에 있는 녀석)
                const combiner = mapArray[1];
                return textArray.map(char => char + combiner).join('');
            }
        }

        // *수정된 convertText*: 위 로직은 복잡하므로, 데이터셋을 1:1 매핑 가능한 배열로 정규화하는 것이 나음.
        // 하지만 사용자 요청대로 '세계에서 가장 많은'을 지원하려면 결합 문자를 써야 함.
        // 따라서 함수를 재정의합니다.

        function convertText(text, mapStr) {
            const textArray = [...text];
            const mapArray = [...mapStr];

            // 1. 일반적인 1:1 매핑 폰트 (약 62자)
            if (mapArray.length === 62) {
                return textArray.map(char => {
                    const index = normal.indexOf(char);
                    return index !== -1 ? mapArray[index] : char;
                }).join('');
            }

            // 2. 결합 문자를 사용하는 효과 (취소선, 구름 등)
            // 특징: mapStr이 A + 결합문자 + B + 결합문자... 패턴임.
            // 또는 단순히 결합문자 하나만 가지고 있을 수도 있음.
            // 위 데이터(취소선 등)는 예시 문자열임. 여기서 결합 문자만 추출.

            // mapStr의 두번째 문자가 결합문자인지 확인
            const isCombinerMode = mapStr.indexOf('A') === 0 && mapStr.length > 100;

            if (isCombinerMode) {
                // A 다음 글자가 결합 문자
                const combiner = [...mapStr][1];
                return textArray.map(char => char + combiner).join('');
            }

            // 3. 그 외 (점자 등)
            // 기본 로직으로 시도
            return textArray.map(char => {
                const index = normal.indexOf(char);
                return (index !== -1 && mapArray[index]) ? mapArray[index] : char;
            }).join('');
        }


        function copy(text, btn) {
            navigator.clipboard.writeText(text);
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            btn.style.background = 'var(--success-color, #28a745)';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.textContent = original;
                btn.style.background = '';
                btn.style.color = '';
            }, 1500);
        }

        generate();
    </script>
