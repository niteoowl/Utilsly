<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>대소문자 변환 - Utilsly</title>
    <meta name="description" content="영어 텍스트를 대문자, 소문자, 첫 글자만 대문자 등으로 변환해주는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">대소문자 변환</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">text_fields</span>
                    </div>
                    <h1>대소문자 변환</h1>
                    <p class="description">영어 텍스트의 대소문자를 간편하게 변환합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="case-converter">
                    <div style="margin-bottom: 16px; display: flex; gap: 8px;">
                        <button class="btn" id="upperBtn">대문자로 (UPPER)</button>
                        <button class="btn" id="lowerBtn">소문자로 (lower)</button>
                        <button class="btn" id="capitalBtn">첫 글자 대문자 (Capitalize)</button>
                    </div>
                    <textarea id="input-text" placeholder="변환할 영어 텍스트를 입력하세요..." style="min-height: 400px;"></textarea>
                    <div class="tool-help-section">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>입력:</strong> 영어 텍스트를 입력창에 붙여넣으세요.</li>
                                <li><strong>변환:</strong> '대문자로', '소문자로', '첫 글자만 대문자' 등 원하는 버튼을 클릭하세요.</li>
                                <li><strong>결과:</strong> 즉시 변환된 텍스트를 복사하여 사용하세요.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('case-converter', {
            elements: {},

            init() {
                this.elements = {
                    textarea: document.getElementById('input-text'),
                    upperBtn: document.getElementById('upperBtn'),
                    lowerBtn: document.getElementById('lowerBtn'),
                    capitalBtn: document.getElementById('capitalBtn')
                };

                this.handleUpper = () => this.convert('upper');
                this.handleLower = () => this.convert('lower');
                this.handleCapital = () => this.convert('capitalize');

                this.elements.upperBtn.addEventListener('click', this.handleUpper);
                this.elements.lowerBtn.addEventListener('click', this.handleLower);
                this.elements.capitalBtn.addEventListener('click', this.handleCapital);
                console.log('Case Converter initialized');
            },

            cleanup() {
                if (this.elements.upperBtn) {
                    this.elements.upperBtn.removeEventListener('click', this.handleUpper);
                    this.elements.lowerBtn.removeEventListener('click', this.handleLower);
                    this.elements.capitalBtn.removeEventListener('click', this.handleCapital);
                }
                this.elements = {};
                console.log('Case Converter cleanup done');
            },

            convert(type) {
                const text = this.elements.textarea.value;
                if (!text) return;

                let result = '';
                if (type === 'upper') {
                    result = text.toUpperCase();
                } else if (type === 'lower') {
                    result = text.toLowerCase();
                } else if (type === 'capitalize') {
                    result = text.toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase());
                }

                this.elements.textarea.value = result;
            }
        });
    </script>
</body>

</html>
