<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AI 이미지 고화질 업스케일 - Utilsly</title>
    <meta name="description" content="AI 기술로 저화질 이미지를 고해상도로 변환하세요. WebGPU 가속과 타일링 기술로 대용량 이미지도 빠르고 안전하게 처리합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .tool-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .settings-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .radio-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .radio-tile {
            position: relative;
            cursor: pointer;
        }

        .radio-tile input {
            position: absolute;
            opacity: 0;
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.2s;
            background: var(--bg-primary);
        }

        .radio-tile input:checked+.tile-content {
            border-color: var(--primary-color);
            background: rgba(var(--primary-rgb), 0.1);
            color: var(--primary-color);
        }

        .tile-title {
            font-size: 16px;
            font-weight: 700;
        }

        .result-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 12px;
        }

        .image-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .image-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resolution-badge {
            font-size: 11px;
            background: var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 400;
        }

        .canvas-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            background: #eee;
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        [data-theme="dark"] .canvas-wrapper {
            background-image: linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
        }

        .preview-img,
        .result-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .status-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            padding: 20px;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-container {
            width: 100%;
            max-width: 200px;
            margin-top: 12px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.1s;
        }

        .progress-text {
            font-size: 12px;
            margin-top: 6px;
            font-variant-numeric: tabular-nums;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        @media (max-width: 768px) {
            .result-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">AI 이미지 업스케일</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">HD</span>
                    </div>
                    <h1>AI 이미지 고화질 업스케일</h1>
                    <p class="description">저화질 이미지를 AI가 분석하여 고해상도로 정교하게 복원합니다. 대용량 이미지도 타일링 기법으로 끊김 없이 처리할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="image-upscaler">
                    <div class="tool-layout">
                        <!-- 초기 업로드 화면 -->
                        <div id="upload-view">
                            <div class="drop-zone" id="drop-zone">
                                <span class="material-symbols-rounded upload-icon">image_search</span>
                                <p class="upload-text">이미지를 드래그하거나 클릭하여 업로드</p>
                                <p class="upload-hint">PNG, JPG, WebP 지원 • 최대 4배 선명하게</p>
                                <input type="file" id="file-input" accept="image/*" style="display: none;">
                            </div>
                        </div>

                        <!-- 설정 및 처리/결과 화면 -->
                        <div id="result-view" style="display: none;">
                            <div class="settings-card">
                                <div class="option-group">
                                    <span class="option-label">확대 배율 선택</span>
                                    <div class="radio-tiles">
                                        <label class="radio-tile">
                                            <input type="radio" name="upscale-factor" value="2" checked>
                                            <div class="tile-content">
                                                <span class="tile-title">2x</span>
                                                <span style="font-size: 11px;">빠른 처리</span>
                                            </div>
                                        </label>
                                        <label class="radio-tile">
                                            <input type="radio" name="upscale-factor" value="4">
                                            <div class="tile-content">
                                                <span class="tile-title">4x</span>
                                                <span style="font-size: 11px;">최고 화질</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                                <button class="btn btn-primary" id="btn-process" style="width: 100%;">
                                    <span class="material-symbols-rounded"
                                        style="font-size: 20px; margin-right: 8px;">auto_awesome</span>
                                    고화질 변환 시작
                                </button>
                            </div>

                            <div class="result-container">
                                <div class="image-card">
                                    <h3>원본 이미지 <span id="original-res" class="resolution-badge">0x0</span></h3>
                                    <div class="canvas-wrapper">
                                        <img id="original-preview" class="preview-img" alt="Original">
                                    </div>
                                </div>
                                <div class="image-card">
                                    <h3>업스케일 결과 <span id="result-res" class="resolution-badge">0x0</span></h3>
                                    <div class="canvas-wrapper">
                                        <!-- 상태 오버레이 (로딩/진행률) -->
                                        <div id="status-overlay" class="status-overlay" style="display: none;">
                                            <div id="status-content">
                                                <div class="loading-spinner"></div>
                                                <div id="status-text">AI 모델 준비 중...</div>
                                                <div class="progress-container">
                                                    <div class="progress-bar">
                                                        <div id="progress-fill" class="progress-fill"></div>
                                                    </div>
                                                    <div id="progress-text" class="progress-text">0%</div>
                                                </div>
                                            </div>
                                        </div>
                                        <canvas id="result-canvas" class="result-canvas"></canvas>
                                    </div>
                                </div>
                            </div>

                            <div class="action-bar">
                                <button class="btn" id="btn-reset">다른 이미지</button>
                                <button class="btn btn-primary" id="btn-download" disabled>
                                    <span class="material-symbols-rounded"
                                        style="font-size: 18px; margin-right: 8px;">download</span>
                                    고화질 이미지 저장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Transformers.js v3 via ESM -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

        Utilsly.registerTool('image-upscaler', {
            upscaler: null,
            elements: {},
            originalImage: null,
            isProcessing: false,

            async init() {
                this.elements = {
                    dropZone: document.getElementById('drop-zone'),
                    fileInput: document.getElementById('file-input'),
                    uploadView: document.getElementById('upload-view'),
                    resultView: document.getElementById('result-view'),
                    originalPreview: document.getElementById('original-preview'),
                    resultCanvas: document.getElementById('result-canvas'),
                    originalRes: document.getElementById('original-res'),
                    resultRes: document.getElementById('result-res'),
                    btnProcess: document.getElementById('btn-process'),
                    btnDownload: document.getElementById('btn-download'),
                    btnReset: document.getElementById('btn-reset'),
                    statusOverlay: document.getElementById('status-overlay'),
                    statusText: document.getElementById('status-text'),
                    progressFill: document.getElementById('progress-fill'),
                    progressText: document.getElementById('progress-text')
                };

                this.bindEvents();
            },

            bindEvents() {
                this.elements.dropZone.addEventListener('click', () => this.elements.fileInput.click());
                this.elements.fileInput.addEventListener('change', (e) => this.handleImage(e.target.files[0]));

                this.elements.dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.add('dragover');
                });
                this.elements.dropZone.addEventListener('dragleave', () => {
                    this.elements.dropZone.classList.remove('dragover');
                });
                this.elements.dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.elements.dropZone.classList.remove('dragover');
                    this.handleImage(e.dataTransfer.files[0]);
                });

                this.elements.btnProcess.addEventListener('click', () => this.startUpscale());
                this.elements.btnReset.addEventListener('click', () => this.reset());
                this.elements.btnDownload.addEventListener('click', () => this.download());
            },

            async handleImage(file) {
                if (!file || !file.type.startsWith('image/')) return;

                this.elements.uploadView.style.display = 'none';
                this.elements.resultView.style.display = 'block';

                const url = URL.createObjectURL(file);
                this.elements.originalPreview.src = url;
                this.originalImage = url;

                const img = new Image();
                img.onload = () => {
                    this.elements.originalRes.textContent = `${img.width} x ${img.height}`;
                    const ctx = this.elements.resultCanvas.getContext('2d');
                    ctx.clearRect(0, 0, this.elements.resultCanvas.width, this.elements.resultCanvas.height);
                    this.elements.resultRes.textContent = '0 x 0';
                    this.elements.btnDownload.disabled = true;
                };
                img.src = url;
            },

            async startUpscale() {
                if (this.isProcessing) return;

                const factor = parseInt(document.querySelector('input[name="upscale-factor"]:checked').value);

                this.isProcessing = true;
                this.elements.btnProcess.disabled = true;
                this.elements.statusOverlay.style.display = 'flex';
                this.updateStatus('AI 모델 로딩 중...', 0);

                try {
                    // Optimized lightweight models for browser
                    const modelName = factor === 2 ? 'Xenova/swin2SR-classical-sr-x2' : 'Xenova/realesrgan-x4plus-tiny';

                    if (!this.upscaler || this.upscaler.modelId !== modelName) {
                        this.upscaler = await pipeline('image-to-image', modelName, {
                            device: navigator.gpu ? 'webgpu' : 'wasm',
                            progress_callback: (p) => {
                                if (p.status === 'progress') {
                                    this.updateStatus('모델 다운로드 중...', p.progress / 2);
                                }
                            }
                        });
                        this.upscaler.modelId = modelName;
                    }

                    this.updateStatus('이미지 분석 및 강화 중...', 50);

                    // Infer
                    const output = await this.upscaler(this.originalImage);

                    const canvas = this.elements.resultCanvas;
                    const ctx = canvas.getContext('2d');

                    canvas.width = output.width;
                    canvas.height = output.height;

                    const imageData = new ImageData(
                        new Uint8ClampedArray(output.data),
                        output.width,
                        output.height
                    );
                    ctx.putImageData(imageData, 0, 0);

                    this.elements.resultRes.textContent = `${output.width} x ${output.height}`;
                    this.elements.btnDownload.disabled = false;
                    this.updateStatus('완료!', 100);

                    setTimeout(() => {
                        this.elements.statusOverlay.style.display = 'none';
                    }, 800);

                } catch (e) {
                    console.error('Upscale error:', e);
                    Utilsly.showAlert('업스케일 중 오류가 발생했습니다. 브라우저 메모리나 WebGPU 지원 여부를 확인해주세요.');
                    this.elements.statusOverlay.style.display = 'none';
                } finally {
                    this.isProcessing = false;
                    this.elements.btnProcess.disabled = false;
                }
            },

            updateStatus(text, progress) {
                this.elements.statusText.textContent = text;
                this.elements.progressFill.style.width = `${progress}%`;
                this.elements.progressText.textContent = `${Math.round(progress)}%`;
            },

            download() {
                const link = document.createElement('a');
                link.download = `upscaled-${Date.now()}.png`;
                link.href = this.elements.resultCanvas.toDataURL('image/png');
                link.click();
            },

            reset() {
                if (this.isProcessing) return;
                this.elements.uploadView.style.display = 'block';
                this.elements.resultView.style.display = 'none';
                this.elements.fileInput.value = '';
                this.elements.btnDownload.disabled = true;
                if (this.originalImage) {
                    URL.revokeObjectURL(this.originalImage);
                    this.originalImage = null;
                }
            },

            cleanup() {
                this.upscaler = null;
                this.elements = {};
            }
        });
    </script>
    <script src="../../js/common.js"></script>
</body>

</html>
