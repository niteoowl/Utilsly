<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AI 글쓰기 도우미 - Utilsly</title>
    <meta name="description" content="AI가 글을 교정하고, 다듬고, 작성해줍니다.">
    <script>
        // Prevent dark mode flash
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .split-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            height: calc(100vh - 250px);
        }

        .input-section,
        .output-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            flex: 1;
            resize: none;
            padding: 16px;
            font-size: 16px;
            line-height: 1.6;
            border-radius: 8px;
        }

        .output-box {
            flex: 1;
            padding: 16px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .split-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            textarea,
            .output-box {
                min-height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">AI 글쓰기 도우미</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">edit_note</span>
                    </div>
                    <h1>AI 글쓰기 도우미</h1>
                    <p class="description">원하는 작업을 선택하여 글을 개선하세요.</p>
                </div>

                <div class="split-container" data-tool-id="writing-assistant">
                    <div class="input-section">
                        <div class="controls" id="controls">
                            <button class="btn btn-primary" data-mode="fix">맞춤법/문법 교정</button>
                            <button class="btn" data-mode="polish">문장 다듬기</button>
                            <button class="btn" data-mode="expand">내용 늘리기</button>
                            <button class="btn" data-mode="summarize">요약하기</button>
                        </div>
                        <textarea id="inputText" placeholder="여기에 글을 입력하세요..."></textarea>
                    </div>
                    <div class="output-section">
                        <div style="font-weight: 600; color: var(--text-secondary);">AI 결과</div>
                        <div id="outputBox" class="output-box">결과가 여기에 표시됩니다.</div>
                    </div>
                </div>
            </div>
            <div class="tool-help-section"
                style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                <div class="tool-help-header"
                    onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                    <div class="tool-help-title">이용 가이드 및 FAQ</div>
                    <span class="material-symbols-rounded toggle-icon">expand_more</span>
                </div>
                <div class="tool-help-content">
                    <div class="faq-item">
                        <div class="faq-question">긴 글도 교정 가능한가요?</div>
                        <div class="faq-answer">네, 가능합니다. 다만 글이 너무 길 경우 처리 속도가 느려질 수 있으므로, 문단 단위로 나누어 입력하는 것을 추천합니다.
                        </div>
                    </div>
                    <div class="faq-item">
                        <div class="faq-question">표절 검사가 되나요?</div>
                        <div class="faq-answer">아니요, 이 도구는 문장의 맞춤법, 문법, 표현을 다듬는 용도이며 표절 검사 기능은 제공하지 않습니다.</div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('writing-assistant', {
            elements: {},

            init() {
                this.elements = {
                    inputText: document.getElementById('inputText'),
                    outputBox: document.getElementById('outputBox'),
                    controls: document.getElementById('controls')
                };

                this.handleControls = (e) => {
                    const btn = e.target.closest('.btn');
                    if (btn && btn.dataset.mode) {
                        this.processText(btn.dataset.mode);
                    }
                };

                this.elements.controls.addEventListener('click', this.handleControls);
                console.log('Writing Assistant initialized');
            },

            cleanup() {
                if (this.elements.controls) {
                    this.elements.controls.removeEventListener('click', this.handleControls);
                }
                this.elements = {};
                console.log('Writing Assistant cleanup done');
            },

            async processText(mode) {
                const text = this.elements.inputText.value.trim();
                if (!text) {
                    if (Utilsly.showAlert) Utilsly.showAlert('텍스트를 입력해주세요.');
                    else alert('텍스트를 입력해주세요.');
                    return;
                }

                this.elements.outputBox.innerHTML = '<span style="color: var(--text-tertiary);">AI가 작성 중입니다...</span>';

                let prompt = "";
                switch (mode) {
                    case 'fix':
                        prompt = `다음 텍스트의 맞춤법과 문법을 교정해줘:\n\n${text}`;
                        break;
                    case 'polish':
                        prompt = `다음 텍스트를 더 자연스럽고 세련되게 다듬어줘:\n\n${text}`;
                        break;
                    case 'expand':
                        prompt = `다음 내용을 바탕으로 더 자세하게 내용을 늘려서 작성해줘:\n\n${text}`;
                        break;
                    case 'summarize':
                        prompt = `다음 텍스트를 핵심만 요약해줘:\n\n${text}`;
                        break;
                }

                try {
                    const response = await fetch(`/api/proxy?endpoint=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();

                    if (data.candidates && data.candidates[0].content) {
                        const reply = data.candidates[0].content.parts[0].text;
                        this.elements.outputBox.innerHTML = (typeof marked !== 'undefined') ? marked.parse(reply) : reply;
                    } else {
                        this.elements.outputBox.innerText = '오류가 발생했습니다.';
                    }

                } catch (error) {
                    this.elements.outputBox.innerText = '네트워크 오류가 발생했습니다.';
                    console.error(error);
                }
            }
        });
    </script>
</body>

</html>
