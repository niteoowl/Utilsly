<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 포맷터 - Utilsly</title>
    <meta name="description" content="JSON 데이터를 보기 좋게 정렬하거나 압축하고 유효성을 검사합니다.">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            height: 600px;
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .code-area {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            resize: none;
            border-radius: 8px;
            line-height: 1.5;
        }

        .code-area:focus {
            outline: 2px solid var(--accent-blue);
            border-color: transparent;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="sidebar"></nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">JSON 포맷터</span>
                </div>
            </header>

            <div class="tool-header">
                <div class="header-icon-wrapper">
                    <span class="material-symbols-rounded">data_object</span>
                </div>
                <h1>JSON 포맷터</h1>
                <p class="description">복잡한 JSON 데이터를 정리하고 오류를 검사하세요.</p>
            </div>

            <div class="tool-container" data-tool-id="json-formatter">

                <div class="toolbar" style="margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn btn-primary" id="btn-format">
                        <span class="material-symbols-rounded">format_align_left</span> 정렬 (Pretty)
                    </button>
                    <button class="btn btn-secondary" id="btn-minify">
                        <span class="material-symbols-rounded">compress</span> 압축 (Minify)
                    </button>
                    <button class="btn btn-secondary" id="btn-validate">
                        <span class="material-symbols-rounded">check_circle</span> 유효성 검사
                    </button>
                    <div style="flex:1;"></div>
                    <button class="btn btn-secondary" id="btn-sample">예제 넣기</button>
                    <button class="btn btn-secondary" id="btn-clear">지우기</button>
                </div>

                <div class="editor-container"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 500px;">
                    <div class="panel" style="display: flex; flex-direction: column; gap: 8px;">
                        <label class="input-label">원본 데이터 (Input)</label>
                        <textarea id="json-input" class="code-area"
                            style="flex: 1; min-height: 400px; padding: 16px; font-family: monospace; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); resize: vertical;"
                            placeholder="여기에 JSON을 붙여넣으세요..."></textarea>
                    </div>
                    <div class="panel" style="display: flex; flex-direction: column; gap: 8px;">
                        <label class="input-label">결과 (Output)</label>
                        <textarea id="json-output" class="code-area" readonly
                            style="flex: 1; min-height: 400px; padding: 16px; font-family: monospace; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); resize: vertical;"
                            placeholder="결과가 여기에 표시됩니다."></textarea>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('json-formatter', {
            init() {
                this.elements = {
                    input: document.getElementById('json-input'),
                    output: document.getElementById('json-output'),
                    btnFormat: document.getElementById('btn-format'),
                    btnMinify: document.getElementById('btn-minify'),
                    btnValidate: document.getElementById('btn-validate'),
                    btnSample: document.getElementById('btn-sample'),
                    btnClear: document.getElementById('btn-clear')
                };

                this.elements.btnFormat.addEventListener('click', () => this.process('format'));
                this.elements.btnMinify.addEventListener('click', () => this.process('minify'));
                this.elements.btnValidate.addEventListener('click', () => this.process('validate'));
                this.elements.btnSample.addEventListener('click', () => {
                    this.elements.input.value = '{"name":"Utilsly","version":1.0,"features":["Tools","Community"],"active":true}';
                    this.process('format');
                });
                this.elements.btnClear.addEventListener('click', () => {
                    this.elements.input.value = '';
                    this.elements.output.value = '';
                });
            },

            cleanup() { this.elements = {}; },

            process(action) {
                const raw = this.elements.input.value.trim();
                if (!raw) {
                    Utilsly.showAlert('JSON 데이터를 입력해주세요.');
                    return;
                }

                try {
                    const obj = JSON.parse(raw);

                    if (action === 'format') {
                        this.elements.output.value = JSON.stringify(obj, null, 4);
                    } else if (action === 'minify') {
                        this.elements.output.value = JSON.stringify(obj);
                    } else if (action === 'validate') {
                        this.elements.output.value = "✅ 유효한 JSON 형식입니다.";
                        Utilsly.showAlert('유효한 JSON 형식입니다.', '성공');
                    }
                } catch (e) {
                    this.elements.output.value = "❌ 오류 발생:\n" + e.message;
                    // Highlight first few lines?
                }
            }
        });
    </script>
</body>

</html>
