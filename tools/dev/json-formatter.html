<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JSON 포맷터 - Utilsly</title>
    <meta name="description" content="못생긴 JSON을 예쁘게 정렬(Pretty Print)하고 유효성을 검사해주는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">JSON 포맷터</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">data_object</span>
                    </div>
                    <h1>JSON 포맷터</h1>
                    <p class="description">JSON 데이터를 예쁘게 정렬(Beautify)하거나 압축(Minify)하고 유효성을 검사합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="json-formatter">
                    <div style="margin-bottom: 16px; display: flex; gap: 8px;">
                        <button class="btn btn-primary" id="formatBtn">포맷팅 (Beautify)</button>
                        <button class="btn" id="minifyBtn">압축 (Minify)</button>
                        <button class="btn" id="clearBtn">지우기</button>
                    </div>
                    <div id="error-msg" style="color: #E03E3E; margin-bottom: 8px; font-size: 14px; display: none;">
                    </div>
                    <textarea id="json-input" placeholder="JSON을 여기에 붙여넣으세요..."
                        style="font-family: var(--font-mono); font-size: 14px;"></textarea>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('json-formatter', {
            elements: {},

            init() {
                this.elements = {
                    textarea: document.getElementById('json-input'),
                    errorMsg: document.getElementById('error-msg'),
                    formatBtn: document.getElementById('formatBtn'),
                    minifyBtn: document.getElementById('minifyBtn'),
                    clearBtn: document.getElementById('clearBtn')
                };

                this.handleFormat = this.formatJSON.bind(this);
                this.handleMinify = this.minifyJSON.bind(this);
                this.handleClear = this.clearAll.bind(this);

                this.elements.formatBtn.addEventListener('click', this.handleFormat);
                this.elements.minifyBtn.addEventListener('click', this.handleMinify);
                this.elements.clearBtn.addEventListener('click', this.handleClear);

                console.log('JSON Formatter initialized');
            },

            cleanup() {
                if (this.elements.formatBtn) {
                    this.elements.formatBtn.removeEventListener('click', this.handleFormat);
                    this.elements.minifyBtn.removeEventListener('click', this.handleMinify);
                    this.elements.clearBtn.removeEventListener('click', this.handleClear);
                }
                this.elements = {};
                console.log('JSON Formatter cleanup done');
            },

            formatJSON() {
                try {
                    const input = this.elements.textarea.value;
                    if (!input.trim()) return;
                    const parsed = JSON.parse(input);
                    this.elements.textarea.value = JSON.stringify(parsed, null, 4);
                    this.elements.errorMsg.style.display = 'none';
                    this.elements.textarea.style.borderColor = 'var(--border-color)';
                } catch (e) {
                    this.elements.errorMsg.textContent = "유효하지 않은 JSON입니다: " + e.message;
                    this.elements.errorMsg.style.display = 'block';
                    this.elements.textarea.style.borderColor = '#E03E3E';
                }
            },

            minifyJSON() {
                try {
                    const input = this.elements.textarea.value;
                    if (!input.trim()) return;
                    const parsed = JSON.parse(input);
                    this.elements.textarea.value = JSON.stringify(parsed);
                    this.elements.errorMsg.style.display = 'none';
                    this.elements.textarea.style.borderColor = 'var(--border-color)';
                } catch (e) {
                    this.elements.errorMsg.textContent = "유효하지 않은 JSON입니다: " + e.message;
                    this.elements.errorMsg.style.display = 'block';
                    this.elements.textarea.style.borderColor = '#E03E3E';
                }
            },

            clearAll() {
                this.elements.textarea.value = '';
                this.elements.errorMsg.style.display = 'none';
                this.elements.textarea.style.borderColor = 'var(--border-color)';
            }
        });
    </script>
</body>

</html>
