<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Base64 인코더/디코더 - Utilsly</title>
    <meta name="description" content="텍스트를 Base64로 인코딩하거나 디코딩하는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Base64 인코더</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">code</span>
                    </div>
                    <h1>Base64 인코더/디코더</h1>
                    <p class="description">텍스트를 Base64 포맷으로 인코딩하거나 다시 평문으로 디코딩합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="base64-encoder">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div>
                            <h3 style="margin-bottom: 8px; font-size: 16px;">평문 (Text)</h3>
                            <textarea id="text-input" placeholder="여기에 텍스트 입력..." style="min-height: 200px;"></textarea>
                        </div>
                        <div>
                            <h3 style="margin-bottom: 8px; font-size: 16px;">Base64</h3>
                            <textarea id="base64-input" placeholder="Base64 결과..."
                                style="min-height: 200px;"></textarea>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: center; gap: 16px; margin-top: 16px;">
                        <button class="btn btn-primary" id="encodeBtn">인코딩 (Encode) →</button>
                        <button class="btn btn-primary" id="decodeBtn">← 디코딩 (Decode)</button>
                    </div>
                    <div class="tool-help-section"
                        style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">이용 가이드 및 FAQ</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <div class="faq-item">
                                <div class="faq-question">Base64가 무엇인가요?</div>
                                <div class="faq-answer">이진 데이터(Binary)를 ASCII 텍스트로 인코딩하는 방식입니다. 이미지, 파일 등을 문자열 형태로 안전하게
                                    전송하거나 저장할 때 주로 쓰입니다.</div>
                            </div>
                            <div class="faq-item">
                                <div class="faq-question">한글도 잘 변환되나요?</div>
                                <div class="faq-answer">네, UTF-8 인코딩을 완벽하게 지원하므로 한글을 포함한 전 세계 다국어 텍스트가 깨지지 않고 정확하게
                                    변환됩니다.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('base64-encoder', {
            elements: {},

            init() {
                this.elements = {
                    textInput: document.getElementById('text-input'),
                    base64Input: document.getElementById('base64-input'),
                    encodeBtn: document.getElementById('encodeBtn'),
                    decodeBtn: document.getElementById('decodeBtn')
                };

                this.handleEncode = this.encode.bind(this);
                this.handleDecode = this.decode.bind(this);

                this.elements.encodeBtn.addEventListener('click', this.handleEncode);
                this.elements.decodeBtn.addEventListener('click', this.handleDecode);
                console.log('Base64 Encoder initialized');
            },

            cleanup() {
                if (this.elements.encodeBtn) {
                    this.elements.encodeBtn.removeEventListener('click', this.handleEncode);
                    this.elements.decodeBtn.removeEventListener('click', this.handleDecode);
                }
                this.elements = {};
                console.log('Base64 Encoder cleanup done');
            },

            encode() {
                try {
                    this.elements.base64Input.value = btoa(unescape(encodeURIComponent(this.elements.textInput.value)));
                } catch (e) {
                    alert("인코딩 실패: " + e.message);
                }
            },

            decode() {
                try {
                    this.elements.textInput.value = decodeURIComponent(escape(atob(this.elements.base64Input.value)));
                } catch (e) {
                    alert("디코딩 실패: 올바른 Base64 문자열이 아닙니다.");
                }
            }
        });
    </script>
</body>

</html>
