<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>QR 코드 생성기 - Utilsly</title>
    <meta name="description" content="URL이나 텍스트를 QR 코드로 변환하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <!-- QR Code Lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .qr-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        #qrcode {
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        #qrcode img {
            display: block;
        }

        .input-area {
            width: 100%;
            display: flex;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">QR 코드 생성</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">qr_code_2</span>
                    </div>
                    <h1>QR 코드 생성기</h1>
                    <p class="description">링크나 텍스트를 입력하면 즉시 QR 코드가 생성됩니다.</p>
                </div>

                <div class="tool-container" data-tool-id="qr-generator">
                    <div class="qr-container">
                        <div class="input-area">
                            <input type="text" id="textInput" placeholder="URL 또는 텍스트 입력" value="https://utilsly.com">
                        </div>

                        <div id="qrcode"></div>

                        <button class="btn btn-primary" id="downloadBtn">
                            <span class="material-symbols-rounded" style="margin-right: 8px;">download</span>
                            이미지 저장
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('qr-generator', {
            qrcode: null,
            elements: {},

            init() {
                this.elements = {
                    textInput: document.getElementById('textInput'),
                    container: document.getElementById('qrcode'),
                    downloadBtn: document.getElementById('downloadBtn')
                };

                this.handleGenerate = this.generateQR.bind(this);
                this.handleDownload = this.downloadQR.bind(this);

                this.elements.textInput.addEventListener('input', this.handleGenerate);
                this.elements.downloadBtn.addEventListener('click', this.handleDownload);

                // Initial generation with delay to ensure lib is ready
                setTimeout(this.handleGenerate, 100);
                console.log('QR Generator initialized');
            },

            cleanup() {
                if (this.elements.textInput) {
                    this.elements.textInput.removeEventListener('input', this.handleGenerate);
                    this.elements.downloadBtn.removeEventListener('click', this.handleDownload);
                }
                this.elements = {};
                this.qrcode = null;
                console.log('QR Generator cleanup done');
            },

            generateQR() {
                const text = this.elements.textInput.value;
                this.elements.container.innerHTML = ''; // Clear prev

                if (text && window.QRCode) {
                    this.qrcode = new QRCode(this.elements.container, {
                        text: text,
                        width: 256,
                        height: 256,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            },

            downloadQR() {
                const img = this.elements.container.querySelector('img');
                if (img) {
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = img.src;
                    link.click();
                }
            }
        });
    </script>
</body>

</html>
