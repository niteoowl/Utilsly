<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SQL 포맷터 - Utilsly</title>
    <meta name="description" content="복잡한 SQL 쿼리를 읽기 쉽게 정렬해주는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">SQL 포맷터</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">database</span>
                    </div>
                    <h1>SQL 포맷터</h1>
                    <p class="description">복잡한 SQL 쿼리문을 읽기 쉽게 정렬하고 포맷팅합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="sql-formatter">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; height: 500px;">
                        <div style="display: flex; flex-direction: column;">
                            <label style="margin-bottom: 8px; font-weight: 600;">입력 SQL</label>
                            <textarea id="input" style="flex: 1; font-family: var(--font-mono); font-size: 14px;"
                                placeholder="SELECT * FROM users WHERE id = 1"></textarea>
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <label style="margin-bottom: 8px; font-weight: 600;">포맷팅 결과</label>
                            <textarea id="output" readonly
                                style="flex: 1; font-family: var(--font-mono); font-size: 14px; background: #f8f9fa;"></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 24px; display: flex; gap: 12px;">
                        <button class="btn btn-primary" id="formatBtn">포맷팅</button>
                        <button class="btn" id="copyBtn">복사</button>
                        <button class="btn" id="clearBtn">지우기</button>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">어떤 SQL 방언(Dialect)을 지원하나요?</div>
                            <div class="faq-answer">표준 SQL을 기반으로 하며 MySQL, PostgreSQL, Oracle 등 대부분의 관계형 데이터베이스 쿼리를
                                지원합니다.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">정렬 시 대문자로 자동 변환되나요?</div>
                            <div class="faq-answer">네, `SELECT`, `FROM`, `WHERE` 등 주요 SQL 키워드는 자동으로 대문자로 변환되어 가독성을 높입니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('sql-formatter', {
            elements: {},

            init() {
                this.elements = {
                    input: document.getElementById('input'),
                    output: document.getElementById('output'),
                    formatBtn: document.getElementById('formatBtn'),
                    copyBtn: document.getElementById('copyBtn'),
                    clearBtn: document.getElementById('clearBtn')
                };

                this.handleFormat = this.formatSQL.bind(this);
                this.handleCopy = this.copyResult.bind(this);
                this.handleClear = () => { this.elements.input.value = ''; };

                this.elements.formatBtn.addEventListener('click', this.handleFormat);
                this.elements.copyBtn.addEventListener('click', this.handleCopy);
                this.elements.clearBtn.addEventListener('click', this.handleClear);
                console.log('SQL Formatter initialized');
            },

            cleanup() {
                if (this.elements.formatBtn) {
                    this.elements.formatBtn.removeEventListener('click', this.handleFormat);
                    this.elements.copyBtn.removeEventListener('click', this.handleCopy);
                    this.elements.clearBtn.removeEventListener('click', this.handleClear);
                }
                this.elements = {};
                console.log('SQL Formatter cleanup done');
            },

            formatSQL() {
                let sql = this.elements.input.value;

                // Very basic SQL formatting logic (Regex based)
                const keywords = ["SELECT", "FROM", "WHERE", "AND", "OR", "ORDER BY", "GROUP BY", "HAVING", "LIMIT", "INSERT INTO", "VALUES", "UPDATE", "SET", "DELETE", "JOIN", "LEFT JOIN", "RIGHT JOIN", "INNER JOIN", "OUTER JOIN", "ON", "AS", "CASE", "WHEN", "THEN", "ELSE", "END"];

                // Normalize spaces
                sql = sql.replace(/\s+/g, ' ');

                // Add newlines before keywords
                keywords.forEach(kw => {
                    const regex = new RegExp(`\\b${kw}\\b`, 'gi');
                    sql = sql.replace(regex, (match) => `\n${match.toUpperCase()}`);
                });

                // Indentation (Simple)
                sql = sql.replace(/\n/g, '\n  ').trim();

                // Fix first line indentation
                this.elements.output.value = sql;
            },

            copyResult() {
                const output = this.elements.output;
                output.select();
                document.execCommand('copy');
                alert('복사되었습니다!');
            }
        });
    </script>
</body>

</html>
