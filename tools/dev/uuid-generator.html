<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>UUID 생성기 - Utilsly</title>
    <meta name="description" content="랜덤 UUID (v4)를 생성하는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">UUID 생성기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">fingerprint</span>
                    </div>
                    <h1>UUID 생성기</h1>
                    <p class="description">고유 식별자(UUID v4)를 생성하고 복사할 수 있습니다.</p>
                </div>

                <div class="tool-container" data-tool-id="uuid-generator">
                    <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                        <button class="btn btn-primary btn-large" id="genBtn">새로운 UUID 생성</button>
                        <button class="btn btn-large" id="copyBtn">복사</button>
                    </div>

                    <div
                        style="padding: 24px; background: var(--bg-secondary); border-radius: 8px; border: 1px solid var(--border-color); text-align: center;">
                        <code id="uuid-display"
                            style="font-size: 24px; font-family: var(--font-mono); color: var(--text-primary);">Click generate...</code>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">이용 가이드 및 FAQ</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <div class="faq-item">
                            <div class="faq-question">UUID가 중복될 확률은 없나요?</div>
                            <div class="faq-answer">UUID v4의 중복 확률은 로또에 1등 당첨될 확률보다 훨씬 낮아 사실상 0에 가깝습니다. 안심하고 고유 키로
                                사용하세요.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question">어디에 저장되나요?</div>
                            <div class="faq-answer">서버에 저장되지 않고 브라우저에서 즉석으로 생성되므로, 생성된 키는 별도로 복사하여 보관하셔야 합니다.</div>
                        </div>
                    </div>
                </div>
            </div>
    </div>
    </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('uuid-generator', {
            elements: {},

            init() {
                this.elements = {
                    display: document.getElementById('uuid-display'),
                    genBtn: document.getElementById('genBtn'),
                    copyBtn: document.getElementById('copyBtn')
                };

                this.handleGenerate = this.generateUUID.bind(this);
                this.handleCopy = this.copyUUID.bind(this);

                this.elements.genBtn.addEventListener('click', this.handleGenerate);
                this.elements.copyBtn.addEventListener('click', this.handleCopy);

                // Initial generation
                this.generateUUID();
                console.log('UUID Generator initialized');
            },

            cleanup() {
                if (this.elements.genBtn) {
                    this.elements.genBtn.removeEventListener('click', this.handleGenerate);
                    this.elements.copyBtn.removeEventListener('click', this.handleCopy);
                }
                this.elements = {};
                console.log('UUID Generator cleanup done');
            },

            generateUUID() {
                const uuid = crypto.randomUUID();
                if (this.elements.display) this.elements.display.textContent = uuid;
            },

            copyUUID() {
                if (!this.elements.display) return;
                const uuid = this.elements.display.textContent;
                if (uuid === 'Click generate...') return;
                navigator.clipboard.writeText(uuid);
                alert('복사되었습니다!');
            }
        });
    </script>
</body>

</html>
