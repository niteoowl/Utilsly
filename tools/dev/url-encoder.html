<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>URL 인코더/디코더 - Utilsly</title>
    <meta name="description" content="URL을 인코딩하거나 디코딩하는 도구입니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">URL 인코더</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">link</span>
                    </div>
                    <h1>URL 인코더/디코더</h1>
                    <p class="description">URL 특수문자를 안전하게 인코딩하거나 원래대로 디코딩합니다.</p>
                </div>

                <div class="tool-container" data-tool-id="url-encoder">
                    <textarea id="input-text" placeholder="URL을 입력하세요..."
                        style="min-height: 150px; margin-bottom: 16px;"></textarea>

                    <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                        <button class="btn btn-primary" id="encodeBtn">인코딩 (Encode)</button>
                        <button class="btn" id="decodeBtn">디코딩 (Decode)</button>
                    </div>

                    <textarea id="output-text" placeholder="결과가 여기에 표시됩니다..." style="min-height: 150px;"
                        readonly></textarea>
                    <div class="tool-help-section"
                        style="margin-top: 32px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                        <div class="tool-help-header"
                            onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                            <div class="tool-help-title">사용 방법</div>
                            <span class="material-symbols-rounded toggle-icon">expand_more</span>
                        </div>
                        <div class="tool-help-content">
                            <ol class="usage-list">
                                <li><strong>입력:</strong> 변환할 URL 주소나 텍스트를 입력창에 넣으세요.</li>
                                <li><strong>변환:</strong> 인코딩(특수문자 변환) 또는 디코딩(원문 복구) 버튼을 선택하세요.</li>
                                <li><strong>확인:</strong> 반대편 창에서 변환된 결과를 확인하고 복사하여 사용하세요.</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('url-encoder', {
            elements: {},

            init() {
                this.elements = {
                    input: document.getElementById('input-text'),
                    output: document.getElementById('output-text'),
                    encodeBtn: document.getElementById('encodeBtn'),
                    decodeBtn: document.getElementById('decodeBtn')
                };

                this.handleEncode = this.encode.bind(this);
                this.handleDecode = this.decode.bind(this);

                this.elements.encodeBtn.addEventListener('click', this.handleEncode);
                this.elements.decodeBtn.addEventListener('click', this.handleDecode);
                console.log('URL Encoder initialized');
            },

            cleanup() {
                if (this.elements.encodeBtn) {
                    this.elements.encodeBtn.removeEventListener('click', this.handleEncode);
                    this.elements.decodeBtn.removeEventListener('click', this.handleDecode);
                }
                this.elements = {};
                console.log('URL Encoder cleanup done');
            },

            encode() {
                try {
                    this.elements.output.value = encodeURIComponent(this.elements.input.value);
                } catch (e) {
                    this.elements.output.value = "Error: " + e.message;
                }
            },

            decode() {
                try {
                    this.elements.output.value = decodeURIComponent(this.elements.input.value);
                } catch (e) {
                    this.elements.output.value = "Error: " + e.message;
                }
            }
        });
    </script>
</body>

</html>
