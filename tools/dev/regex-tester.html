<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>정규표현식 테스터 - Utilsly</title>
    <meta name="description" content="정규표현식을 실시간으로 테스트하고 매칭 결과를 확인하세요.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>

    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .regex-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }

        .regex-pattern {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 16px;
        }

        .regex-flags {
            width: 100px;
            font-family: var(--font-mono);
            font-size: 16px;
        }

        .test-area {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
        }

        .result-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            font-family: 'Fira Code', var(--font-mono);
            white-space: pre-wrap;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .match {
            background-color: #fff3cd;
            border-bottom: 2px solid #ffc107;
            border-radius: 2px;
        }

        .match-group {
            background-color: #d1e7dd;
            border-bottom: 2px solid #198754;
        }

        [data-theme="dark"] .match {
            background-color: #4a4a00;
            border-bottom-color: #ffd700;
            color: white;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">U</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">정규표현식 테스터</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">code</span>
                    </div>
                    <h1>정규표현식 테스터</h1>
                    <p class="description">정규표현식(Regex)을 작성하고 실시간으로 매칭 결과를 확인하세요.</p>
                </div>

                <div class="tool-container" data-tool-id="regex-tester">
                    <div class="regex-input-group">
                        <span style="font-size: 20px; color: var(--text-secondary);">/</span>
                        <input type="text" class="regex-pattern" id="regexPattern" placeholder="패턴 입력 (예: \d+)"
                            value="\w+">
                        <span style="font-size: 20px; color: var(--text-secondary);">/</span>
                        <input type="text" class="regex-flags" id="regexFlags" placeholder="플래그" value="g">
                    </div>

                    <div class="test-area">
                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">테스트 문자열</label>
                            <textarea id="testString"
                                placeholder="테스트할 문자열을 입력하세요...">Hello World! 12345 Utilsly Test.</textarea>
                        </div>

                        <div>
                            <label style="font-weight: 600; display: block; margin-bottom: 8px;">매칭 결과</label>
                            <div class="result-box" id="resultBox"></div>
                        </div>
                    </div>
                </div>
                <div class="tool-help-section"
                    style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                    <div class="tool-help-header"
                        onclick="this.classList.toggle('active'); this.nextElementSibling.classList.toggle('open')">
                        <div class="tool-help-title">사용 방법</div>
                        <span class="material-symbols-rounded toggle-icon">expand_more</span>
                    </div>
                    <div class="tool-help-content">
                        <ol class="usage-list">
                            <li><strong>패턴 입력:</strong> 상단 입력창에 정규표현식 패턴을 입력하세요. (예: <code>\w+</code>)</li>
                            <li><strong>플래그 설정:</strong> 필요한 경우 플래그(g, i, m 등)를 설정하세요.</li>
                            <li><strong>테스트:</strong> '테스트 문자열' 창에 검사할 텍스트를 입력하면 실시간으로 결과를 확인할 수 있습니다.</li>
                            <li><strong>확인:</strong> 매칭된 결과가 아래 '매칭 결과' 상자에 하이라이트되어 표시됩니다.</li>
                        </ol>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('regex-tester', {
            elements: {},

            init() {
                this.elements = {
                    patternInput: document.getElementById('regexPattern'),
                    flagsInput: document.getElementById('regexFlags'),
                    testStringInput: document.getElementById('testString'),
                    resultBox: document.getElementById('resultBox')
                };

                this.handleUpdate = this.updateResult.bind(this);

                this.elements.patternInput.addEventListener('input', this.handleUpdate);
                this.elements.flagsInput.addEventListener('input', this.handleUpdate);
                this.elements.testStringInput.addEventListener('input', this.handleUpdate);

                // Initial run
                this.updateResult();
                console.log('Regex Tester initialized');
            },

            cleanup() {
                if (this.elements.patternInput) {
                    this.elements.patternInput.removeEventListener('input', this.handleUpdate);
                    this.elements.flagsInput.removeEventListener('input', this.handleUpdate);
                    this.elements.testStringInput.removeEventListener('input', this.handleUpdate);
                }
                this.elements = {};
                console.log('Regex Tester cleanup done');
            },

            updateResult() {
                const pattern = this.elements.patternInput.value;
                const flags = this.elements.flagsInput.value;
                const text = this.elements.testStringInput.value;

                if (!pattern) {
                    this.elements.resultBox.textContent = text;
                    return;
                }

                try {
                    const regex = new RegExp(pattern, flags);

                    // Escape HTML to prevent XSS in display
                    const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                    // Highlight matches
                    let highlighted = safeText.replace(regex, (match) => {
                        return `<span class="match">${match}</span>`;
                    });

                    this.elements.resultBox.innerHTML = highlighted;
                } catch (e) {
                    this.elements.resultBox.innerHTML = `<span style="color: #FF4B4B;">Invalid Regex: ${e.message}</span>`;
                }
            }
        });
    </script>
</body>

</html>
