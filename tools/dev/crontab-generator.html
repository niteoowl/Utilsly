<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crontab 생성기 - Utilsly</title>
    <meta name="description" content="리눅스 서버 스케줄러(Cron) 문법을 GUI로 쉽게 생성하고 확인합니다.">
    <script>
        !function () { const e = localStorage.getItem("theme"), t = window.matchMedia("(prefers-color-scheme: dark)").matches; "dark" !== e && (e || !t) || document.documentElement.setAttribute("data-theme", "dark") }();
    </script>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .cron-builder {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 32px;
        }

        .cron-field-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .cron-field {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .cron-field label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .cron-field input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Consolas', monospace;
        }

        .result-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .cron-output {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-blue);
            font-family: 'Consolas', monospace;
            margin-bottom: 12px;
            word-break: break-all;
        }

        .cron-desc {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item current-page">Crontab 생성기</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">schedule</span>
                    </div>
                    <h1>Crontab 생성기</h1>
                    <p class="description">복잡한 리눅스 크론탭 예약 설정을 클릭 몇 번으로 만드세요.</p>
                </div>

                <div class="tool-container" data-tool-id="crontab-generator">

                    <h3 style="margin-bottom:16px;">자주 사용하는 설정</h3>
                    <div class="preset-grid">
                        <button class="btn btn-secondary"
                            onclick="Utilsly.tools['crontab-generator'].setPreset('* * * * *')">매분 (*)</button>
                        <button class="btn btn-secondary"
                            onclick="Utilsly.tools['crontab-generator'].setPreset('0 * * * *')">매시간 정각</button>
                        <button class="btn btn-secondary"
                            onclick="Utilsly.tools['crontab-generator'].setPreset('0 0 * * *')">매일 자정</button>
                        <button class="btn btn-secondary"
                            onclick="Utilsly.tools['crontab-generator'].setPreset('0 0 * * 0')">매주 일요일 자정</button>
                        <button class="btn btn-secondary"
                            onclick="Utilsly.tools['crontab-generator'].setPreset('0 0 1 * *')">매월 1일 자정</button>
                    </div>

                    <div class="cron-builder">
                        <div class="cron-field-group">
                            <div class="cron-field">
                                <label>Minute (분)</label>
                                <input type="text" id="cron-min" value="*" placeholder="0-59">
                            </div>
                            <div class="cron-field">
                                <label>Hour (시)</label>
                                <input type="text" id="cron-hour" value="*" placeholder="0-23">
                            </div>
                            <div class="cron-field">
                                <label>Day (일)</label>
                                <input type="text" id="cron-day" value="*" placeholder="1-31">
                            </div>
                            <div class="cron-field">
                                <label>Month (월)</label>
                                <input type="text" id="cron-month" value="*" placeholder="1-12">
                            </div>
                            <div class="cron-field">
                                <label>Week (요일)</label>
                                <input type="text" id="cron-week" value="*" placeholder="0-6">
                            </div>
                        </div>

                        <div class="result-panel">
                            <div class="cron-output" id="cron-output">* * * * *</div>
                            <div class="cron-desc" id="cron-desc">매분 마다 실행됩니다.</div>
                            <button class="btn btn-primary" style="margin-top:20px;"
                                onclick="Utilsly.tools['crontab-generator'].copy()">
                                <span class="material-symbols-rounded">content_copy</span> 복사하기
                            </button>
                        </div>
                    </div>

                    <div class="section-card" style="margin-top:32px;">
                        <h3 style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
                            <span class="material-symbols-rounded">info</span> 도움말
                        </h3>
                        <ul style="color:var(--text-secondary); line-height:1.8; padding-left:20px;">
                            <li><code>*</code> : 모든 값을 의미합니다.</li>
                            <li><code>,</code> : 여러 값을 지정할 때 사용합니다. (예: 1,3,5)</li>
                            <li><code>-</code> : 범위를 지정할 때 사용합니다. (예: 1-5)</li>
                            <li><code>/</code> : 주기를 지정할 때 사용합니다. (예: */5 - 5분마다)</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/common.js"></script>
    <script>
        Utilsly.registerTool('crontab-generator', {
            init() {
                this.elements = {
                    min: document.getElementById('cron-min'),
                    hour: document.getElementById('cron-hour'),
                    day: document.getElementById('cron-day'),
                    month: document.getElementById('cron-month'),
                    week: document.getElementById('cron-week'),
                    output: document.getElementById('cron-output'),
                    desc: document.getElementById('cron-desc')
                };

                const fields = ['min', 'hour', 'day', 'month', 'week'];
                fields.forEach(f => {
                    this.elements[f].addEventListener('input', () => this.update());
                });

                this.update();
            },

            cleanup() { this.elements = {}; },

            update() {
                const cron = `${this.elements.min.value} ${this.elements.hour.value} ${this.elements.day.value} ${this.elements.month.value} ${this.elements.week.value}`;
                this.elements.output.textContent = cron;

                // Simple desc logic (refined)
                let d = "준비 중...";
                try {
                    d = this.explain(this.elements.min.value, this.elements.hour.value, this.elements.day.value, this.elements.month.value, this.elements.week.value);
                } catch (e) { }
                this.elements.desc.textContent = d;
            },

            explain(m, h, d, mo, w) {
                if (m === '*' && h === '*' && d === '*' && mo === '*' && w === '*') return "매분 마다 실행됩니다.";

                let text = "";

                if (mo !== '*') text += `${mo}월 `;
                if (d !== '*') text += `${d}일 `;
                if (w !== '*') {
                    const days = ["일", "월", "화", "수", "목", "금", "토"];
                    text += `${days[w] || w}요일 `;
                }

                if (h !== '*' && m !== '*') text += `${h}시 ${m}분`;
                else if (h !== '*') text += `${h}시 매분`;
                else if (m !== '*') text += `매시 ${m}분`;
                else text += "매시간";

                return text + "에 실행됩니다.";
            },

            setPreset(cron) {
                const parts = cron.split(' ');
                this.elements.min.value = parts[0];
                this.elements.hour.value = parts[1];
                this.elements.day.value = parts[2];
                this.elements.month.value = parts[3];
                this.elements.week.value = parts[4];
                this.update();
            },

            copy() {
                Utilsly.copyToClipboard(this.elements.output.textContent);
                Utilsly.showAlert('클립보드에 복사되었습니다.');
            }
        });
    </script>
</body>

</html>
