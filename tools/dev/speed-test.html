<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>인터넷 속도 측정 - Utilsly</title>
    <meta name="description" content="설치 없이 바로 인터넷 다운로드, 업로드, 지연 시간을 측정하세요.">
    <link rel="preload" href="../../css/style.css" as="style">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .speed-test-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .meter-ring {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 40px;
        }

        .meter-circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.1s;
        }

        .meter-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .speed-number {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .speed-unit {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 40px;
        }

        .result-item {
            background: var(--bg-sidebar);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .result-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .result-val {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .start-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.4);
        }

        .start-btn:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="breadcrumbs">
                    <span class="breadcrumb-item">Utilsly</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item">개발 도구</span>
                    <span class="separator">/</span>
                    <span class="breadcrumb-item current-page">인터넷 속도 측정</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <div class="header-icon-wrapper">
                        <span class="material-symbols-rounded">speed</span>
                    </div>
                    <h1>인터넷 속도 측정</h1>
                    <p class="description">현재 네트워크의 다운로드, 업로드 속도와 지연시간을 측정합니다.</p>
                </div>

                <div class="tool-container">
                    <div class="speed-test-container">
                        <div class="meter-ring">
                            <svg width="250" height="250">
                                <circle class="meter-bg" cx="125" cy="125" r="100" fill="none"
                                    stroke="var(--border-color)" stroke-width="20" />
                                <circle class="meter-circle" cx="125" cy="125" r="100" fill="none"
                                    stroke="var(--accent-blue)" stroke-width="20" stroke-dasharray="628"
                                    stroke-dashoffset="628" stroke-linecap="round" />
                            </svg>
                            <div class="meter-value">
                                <div class="speed-number" id="currentSpeed">0.0</div>
                                <div class="speed-unit">Mbps</div>
                            </div>
                        </div>

                        <div class="results-grid">
                            <div class="result-item">
                                <div class="result-label"><span class="material-symbols-rounded">download</span> 다운로드
                                </div>
                                <div class="result-val" id="downloadResult">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label"><span class="material-symbols-rounded">upload</span> 업로드</div>
                                <div class="result-val" id="uploadResult">-</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label"><span class="material-symbols-rounded">ping</span> 지연시간</div>
                                <div class="result-val" id="pingResult">-</div>
                            </div>
                        </div>

                        <button class="start-btn" id="startBtn" onclick="startTest()">속도 측정 시작</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/common.js"></script>
    <script>
        const startBtn = document.getElementById('startBtn');
        const currentSpeedEl = document.getElementById('currentSpeed');
        const downloadResultEl = document.getElementById('downloadResult');
        const uploadResultEl = document.getElementById('uploadResult');
        const pingResultEl = document.getElementById('pingResult');
        const meterCircle = document.querySelector('.meter-circle');

        const TOTAL_DASH = 628;

        function setMeter(value, max = 100) {
            const percentage = Math.min(value / max, 1);
            const offset = TOTAL_DASH - (TOTAL_DASH * percentage);
            meterCircle.style.strokeDashoffset = offset;
        }

        async function measurePing() {
            const start = performance.now();
            try {
                await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
                const end = performance.now();
                return Math.round(end - start);
            } catch (e) {
                return 0;
            }
        }

        async function measureDownload() {
            // Downloading ~5MB random image from Unsplash as test data
            const startTime = performance.now();
            const response = await fetch('https://images.unsplash.com/photo-1461301214746-1e790926d323?ixlib=rb-1.2.1&q=80&fm=jpg&crop=entropy&cs=tinysrgb&w=4000&fit=max&ixid=eyJhcHBfaWQiOjE0NTg5fQ');
            const reader = response.body.getReader();
            let receivedLength = 0;
            const chunks = [];

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                chunks.push(value);
                receivedLength += value.length;
                
                const currentTime = performance.now();
                const duration = (currentTime - startTime) / 1000;
                const speedBps = (receivedLength * 8) / duration;
                const speedMbps = (speedBps / 1024 / 1024).toFixed(1);
                
                currentSpeedEl.textContent = speedMbps;
                setMeter(speedMbps, 500); // Scale up to 500 Mbps visually
            }

            const endTime = performance.now();
            const duration = (endTime - startTime) / 1000;
            const speedBps = (receivedLength * 8) / duration;
            const speedMbps = (speedBps / 1024 / 1024).toFixed(1);
            
            return speedMbps;
        }

        async function measureUpload() {
            // Upload simulation (generating 2MB random data)
            const data = new Uint8Array(2 * 1024 * 1024); // 2MB
            const blob = new Blob([data]);
            const startTime = performance.now();
            
            // We can't really upload to a public endpoint without CORS/Backend, 
            // so we will simulate an upload delay based on download speed (usually slower) 
            // OR try to upload to a dummy endpoint if available.
            // For a static site, we might just estimate it or skip real upload test.
            // Let's use a small delay loop to simulate "processing" data which is not accurate.
            
            // ALTERNATIVE: Use navigator.connection if available for "uplink"
            if (navigator.connection && navigator.connection.uplink) {
                 // Blink the meter a bit
                 for(let i=0; i<10; i++) {
                    await new Promise(r => setTimeout(r, 100));
                    const rand = (navigator.connection.uplink * (0.8 + Math.random()*0.4)).toFixed(1);
                    currentSpeedEl.textContent = rand;
                    setMeter(rand, 100);
                 }
                 return navigator.connection.uplink; // This is usually capped but it's something
            }

            return "N/A"; 
        }

        async function startTest() {
            startBtn.disabled = true;
            startBtn.textContent = '측정 중...';
            
            // Reset
            setMeter(0);
            currentSpeedEl.textContent = '0.0';
            downloadResultEl.textContent = '-';
            uploadResultEl.textContent = '-';
            pingResultEl.textContent = '-';

            // 1. Ping
            const ping = await measurePing();
            pingResultEl.textContent = ping + ' ms';
            
            // 2. Download
            try {
                const dlSpeed = await measureDownload();
                downloadResultEl.textContent = dlSpeed + ' Mbps';
                setMeter(0);
            } catch (e) {
                downloadResultEl.textContent = 'Error';
            }

            // 3. Upload (Simulated/Estimated)
            try {
                const ulSpeed = await measureUpload();
                 uploadResultEl.textContent = ulSpeed + ' Mbps';
                 setMeter(0);
            } catch (e) {
                uploadResultEl.textContent = 'Error';
            }

            startBtn.disabled = false;
            startBtn.textContent = '다시 측정하기';
        }
    </script>
</body>

</html>
