<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Utilsly</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --auth-bg: var(--bg-primary);
            --input-bg: #f2f4f6;
            --input-focus-bg: #e8ebed;
            --primary-color: #3182f6;
            --primary-hover: #1b64da;
        }

        body {
            background-color: var(--auth-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: var(--font-sans);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            margin-bottom: 32px;
            text-align: left;
        }

        .page-title {
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            letter-spacing: -0.5px;
        }

        .page-desc {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .input-group {
            position: relative;
        }

        .input-field {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: none;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 2px rgba(49, 130, 246, 0.1);
        }

        .input-field::placeholder {
            color: #b0b8c1;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn:disabled {
            background: #cbd0d6;
            cursor: not-allowed;
        }

        .sub-links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .sub-links a {
            color: var(--text-secondary);
            text-decoration: underline;
            text-underline-offset: 4px;
            margin-left: 8px;
        }

        .error-msg {
            background: #fff0f0;
            color: #e92c2c;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            margin-top: 10px;
            align-items: center;
            gap: 8px;
        }

        .back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--text-primary);
            text-decoration: none;
            padding: 8px;
            margin: -8px;
        }

        .back-link span {
            font-size: 24px;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
                justify-content: flex-start;
                padding-top: 80px;
            }

            .page-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <a href="/login.html" class="back-link">
        <span class="material-symbols-rounded">arrow_back</span>
    </a>

    <div class="auth-wrapper">
        <div class="header-section">
            <div class="page-title">반가워요!<br>계정을 만들어주세요.</div>
            <div class="page-desc">Utilsly의 모든 기능을 무료로 이용할 수 있습니다.</div>
        </div>

        <form class="auth-form" id="signupForm">
            <div class="input-group">
                <label class="form-label">닉네임</label>
                <input type="text" id="nickname" class="input-field" placeholder="별명 입력" required minlength="2"
                    maxlength="10">
            </div>

            <div class="input-group">
                <label class="form-label">이메일</label>
                <input type="email" id="email" class="input-field" placeholder="이메일 주소" required autocomplete="email">
            </div>

            <div class="input-group">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="input-field" placeholder="6자 이상 입력" required minlength="6"
                    autocomplete="new-password">
            </div>

            <div class="error-msg" id="errorMsg">
                <span class="material-symbols-rounded" style="font-size: 18px;">error_outline</span>
                <span class="msg-text">회원가입에 실패했습니다.</span>
            </div>

            <button type="submit" class="submit-btn" id="signupBtn">동의하고 가입하기</button>
        </form>

        <div class="sub-links">
            이미 계정이 있으신가요? <a href="/login.html">로그인</a>
        </div>
    </div>

    <!-- Scripts preserved -->
    <script src="js/common.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbSmDuJNCSrIB7Fx9IzbePERD_2ka3rQE",
            authDomain: "utilsly.firebaseapp.com",
            projectId: "utilsly",
            storageBucket: "utilsly.firebasestorage.app",
            messagingSenderId: "713000931988",
            appId: "1:713000931988:web:8891efe6d0ab2d61b61a81",
            measurementId: "G-WSRTSNGT8G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const msgText = errorMsg.querySelector('.msg-text');
        const btn = document.getElementById('signupBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const originalBtnContent = btn.innerHTML;

            try {
                btn.disabled = true;
                btn.innerHTML = '가입 처리 중...';
                errorMsg.style.display = 'none';

                // 1. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Update Profile
                await updateProfile(user, { displayName: nickname });

                // 3. Save User Data
                await setDoc(doc(db, "users", user.uid), {
                    nickname: nickname,
                    email: email,
                    createdAt: new Date()
                });

                // Success
                if (window.Utilsly && window.Utilsly.showAlert) {
                    await window.Utilsly.showAlert('회원가입이 완료되었습니다!', '환영합니다');
                } else {
                    alert('회원가입이 완료되었습니다!');
                }
                window.location.href = '/';

            } catch (error) {
                console.error(error);
                let msg = '회원가입에 실패했습니다.';
                if (error.code === 'auth/email-already-in-use') msg = '이미 사용 중인 이메일입니다.';
                else if (error.code === 'auth/weak-password') msg = '비밀번호가 너무 약합니다.';
                else if (error.code === 'auth/invalid-email') msg = '유효하지 않은 이메일 주소입니다.';

                msgText.textContent = msg;
                errorMsg.style.display = 'flex';
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;

                const wrapper = document.querySelector('.auth-wrapper');
                wrapper.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-4px)' },
                    { transform: 'translateX(4px)' },
                    { transform: 'translateX(-4px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        });
    </script>
</body>

</html>
