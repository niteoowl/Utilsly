<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Utilsly - Online Web Tools Collection</title>
    <meta name="description" content="Useful web tools for everyone! Utilsly offers image editing, file conversion, calculators and more for free.">
    
    <!-- Open Graph / SNS -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://utilsly.com/en/">
    <meta property="og:title" content="Utilsly - Online Web Tools Collection">
    <meta property="og:description" content="Useful web tools for everyone! Utilsly offers image editing, file conversion, calculators and more for free.">
    <meta property="og:image" content="https://utilsly.com/images/og-image.png">

    <script src="../js/i18n.js"></script>
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            // Set language to English
            localStorage.setItem('language', 'en');
        })();
    </script>
    <link rel="preload" href="../css/style.css" as="style">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Inline styles copied from root index.html for zero-FOUC -->
    <style>
        .hero-section {
            text-align: center;
            padding: 80px 40px;
            background: linear-gradient(180deg, var(--bg-sidebar) 0%, var(--bg-primary) 100%);
            border-radius: 24px;
            margin-bottom: 48px;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(0, 0, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0, 0, 0, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        [data-theme="dark"] .hero-section::before {
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.01) 0%, transparent 50%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .hero-badge .material-symbols-rounded {
            font-size: 16px;
            color: var(--accent-blue);
        }

        .hero-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 32px auto;
            line-height: 1.6;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px 16px 52px;
            font-size: 16px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 22px;
            pointer-events: none;
        }

        .category-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 8px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .category-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .material-symbols-rounded {
            font-size: 22px;
        }

        .tools-section {
            margin-bottom: 48px;
        }

        .stats-row {
            display: flex;
            gap: 24px;
            margin-top: 32px;
            justify-content: center;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Search Results View */
        #searchResultsView {
            display: none;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .no-results .material-symbols-rounded {
            font-size: 48px;
            color: var(--text-tertiary);
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .hero-section {
                padding: 40px 20px;
                margin: -24px -16px 24px -16px;
                border-radius: 0;
            }

            .hero-badge {
                font-size: 11px;
                padding: 6px 12px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 14px;
                margin-bottom: 24px;
            }

            .search-input {
                padding: 14px 20px 14px 48px;
                font-size: 15px;
            }

            .search-icon {
                left: 16px;
                font-size: 20px;
            }

            .stats-row {
                gap: 12px;
                margin-top: 24px;
            }

            .stat-number {
                font-size: 22px;
            }

            .stat-label {
                font-size: 11px;
            }

            .category-nav {
                margin-bottom: 20px;
                gap: 6px;
            }

            .category-btn {
                padding: 8px 14px;
                font-size: 13px;
            }

            .section-title {
                font-size: 16px;
            }

            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }

            .tool-card {
                padding: 16px !important;
            }

            .card-icon {
                width: 40px !important;
                height: 40px !important;
            }

            .card-icon .material-symbols-rounded {
                font-size: 20px !important;
            }

            .card-title {
                font-size: 13px !important;
            }

            .card-desc {
                font-size: 11px !important;
                display: none;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 28px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr 1fr !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div style="font-size: 24px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">
                        Utilsly.</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Sidebar content generated by js/common.js -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="menu-toggle-btn" onclick="Utilsly.toggleSidebar(true)">
                    <span class="material-symbols-rounded">menu</span>
                </button>
                <div class="breadcrumbs">
                    <span class="breadcrumb-item" data-i18n="home">Home</span>
                </div>
            </header>

            <div class="content-area">
                <div class="hero-section">
                    <div class="hero-content">
                        <div class="hero-badge">
                            <span class="material-symbols-rounded">bolt</span>
                            <span data-i18n="hero_badge">Use directly in browser without installation</span>
                        </div>
                        <h1 class="hero-title" data-i18n="hero_title">All Tools<br>In One Place.</h1>
                        <p class="hero-subtitle" data-i18n="hero_subtitle">Image editing, file conversion, calculators and more.<br>Use all essential tools for free.</p>

                        <div class="search-container">
                            <span class="material-symbols-rounded search-icon">search</span>
                            <input type="text" id="mainSearch" class="search-input" placeholder="Search for tools..." data-i18n-placeholder="search_placeholder">
                        </div>

                        <div class="stats-row">
                            <div class="stat-box">
                                <div class="stat-number" id="toolCount">70+</div>
                                <div class="stat-label" data-i18n="stat_tools">Tools</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-number">100%</div>
                                <div class="stat-label" data-i18n="stat_free">Free</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-number">0</div>
                                <div class="stat-label" data-i18n="stat_install">No Install</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Default Home View -->
                <div id="homeDefaultView">
                    <div class="category-nav" id="categoryNav">
                        <button class="category-btn active" data-category="random" data-i18n="cat_random">🎲 Random</button>
                        <button class="category-btn" data-category="image" data-i18n="cat_image">🖼️ Image</button>
                        <button class="category-btn" data-category="video" data-i18n="cat_video">🎬 Video</button>
                        <button class="category-btn" data-category="pdf" data-i18n="cat_pdf">📄 PDF</button>
                        <button class="category-btn" data-category="text" data-i18n="cat_text">✏️ Text</button>
                        <button class="category-btn" data-category="dev" data-i18n="cat_dev">💻 Dev</button>
                        <button class="category-btn" data-category="math" data-i18n="cat_math">🔢 Math</button>
                        <button class="category-btn" data-category="date" data-i18n="cat_date">⏰ Time</button>
                        <button class="category-btn" data-category="health" data-i18n="cat_health">💪 Health</button>
                        <button class="category-btn" data-category="color" data-i18n="cat_color">🎨 Color</button>
                        <button class="category-btn" data-category="finance" data-i18n="cat_finance">💰 Finance</button>
                        <button class="category-btn" data-category="security" data-i18n="cat_security">🛡️ Security</button>
                        <button class="category-btn" data-category="file" data-i18n="cat_file">📁 File</button>
                        <button class="category-btn" data-category="ai" data-i18n="cat_ai">🤖 AI</button>
                    </div>

                    <div class="tools-section" id="toolsSection">
                        <div class="section-header">
                            <h2 class="section-title">
                                <span class="material-symbols-rounded">apps</span>
                                <span id="currentCategoryTitle" data-i18n="all_tools">All Tools</span>
                            </h2>
                        </div>
                        <div class="dashboard-grid" id="toolsGrid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Search Results View -->
                <div id="searchResultsView">
                    <div class="section-header">
                        <h2 class="section-title">
                            <span class="material-symbols-rounded">search</span>
                            <span data-i18n="search_results">Search Results</span>
                        </h2>
                    </div>
                    <div class="dashboard-grid" id="searchResults">
                        <!-- Populated by JS -->
                    </div>
                    <div id="noResults" class="no-results" style="display: none;">
                        <span class="material-symbols-rounded">search_off</span>
                        <div data-i18n="no_results">No results found.</div>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script>
        // Use allTools from the common global scope if possible, 
        // but for now, we'll keep the English version of the list 
        // to ensure immediate translation of the home page.
        // In the final version, common.js will handle this.
        
        // Initial render logic will be handled by common.js which will see '/en/' path
    </script>
</body>

</html>
